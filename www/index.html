const EXPR = [[{"x":"打工人","py":"dǎgōngrén","ko":"직장인, 일하는 사람(자조)","why":"2020년 ‘打工人早安’ 밈에서 유행. 동료·친구 사이 자조적으로 OK, 사장님 앞에선 자제.","ex":{"zh":"打工人又要上班了，早安！","py":"Dǎgōngrén yòu yào shàngbān le, zǎo'ān!","ko":"직장인 또 출근이다, 굿모닝!"}},{"x":"吃醋","py":"chī cù","ko":"질투하다","why":"식초를 먹으면 속이 시큼하지? 연인 사이 질투를 말해. 장난스럽게 놀릴 때도 많이 써.","ex":{"zh":"{H}，我只是跟同事吃饭，你别吃醋啦。","py":"{H}, wǒ zhǐshì gēn tóngshì chī fàn, nǐ bié chī cù la.","ko":"{H}, 그냥 동료랑 밥 먹은 거야, 질투하지 마."}}],[{"x":"摸鱼","py":"mōyú","ko":"근무 중 땡땡이","why":"‘浑水摸鱼’에서 유래. 동료끼리 농담 OK, 사장님 앞에서 ‘我在摸鱼’는 X.","ex":{"zh":"今天老板不在，我们摸会儿鱼吧。","py":"Jīntiān lǎobǎn bú zài, wǒmen mō huìr yú ba.","ko":"오늘 사장님 없으니 좀 땡땡이치자."}},{"x":"放鸽子","py":"fàng gēzi","ko":"약속을 바람맞히다","why":"비둘기를 날려 보내듯 약속한 사람을 홀로 두고 사라지는 거야. 약속 펑크 낼 때 딱 맞는 말이야.","ex":{"zh":"供应商又放我们鸽子了，货今天还是没到。","py":"Gōngyìngshāng yòu fàng wǒmen gēzi le, huò jīntiān háishi méi dào.","ko":"공급업체가 또 우리를 바람맞혔어, 물건이 오늘도 안 왔어."}}],[{"x":"内卷","py":"nèijuǎn","ko":"과열 경쟁, 소모적 경쟁","why":"원래 학술용어(involution), 2020년 이후 대유행. 어디서나 OK, 남을 탓하는 뉘앙스는 주의.","ex":{"zh":"现在找工作太内卷了。","py":"Xiànzài zhǎo gōngzuò tài nèijuǎn le.","ko":"요즘 취업 경쟁 너무 치열해."}},{"x":"撒娇","py":"sā jiāo","ko":"애교 부리다","why":"'교태(娇)를 흩뿌리다'라는 뜻이야. 연인이나 아이가 응석 부릴 때 쓰고, 귀엽다는 뉘앙스가 강해.","ex":{"zh":"{H}一撒娇，我就什么都答应了。","py":"{H} yì sā jiāo, wǒ jiù shénme dōu dāying le.","ko":"{H}가 애교 한 번 부리면 난 뭐든 다 들어줘."}}],[{"x":"躺平","py":"tǎngpíng","ko":"노력 포기하고 드러눕기","why":"2021년 유행, 무리한 경쟁을 거부하는 태도. 친구 OK, 상사 앞에서 ‘我想躺平’은 X.","ex":{"zh":"周末我只想在家躺平。","py":"Zhōumò wǒ zhǐ xiǎng zài jiā tǎngpíng.","ko":"주말엔 그냥 집에서 퍼져 있고 싶어."}},{"x":"闹别扭","py":"nào bièniu","ko":"삐지다, 티격태격하다","why":"'어긋남(别扭)을 일으키다'라는 그림이야. 사소한 일로 서로 꽁해 있는 상태를 말해.","ex":{"zh":"我跟{H}昨天闹别扭了，今天还没说话。","py":"Wǒ gēn {H} zuótiān nào bièniu le, jīntiān hái méi shuō huà.","ko":"어제 {H}랑 좀 틀어져서 오늘 아직 말도 안 했어."}}],[{"x":"YYDS","py":"yǒngyuǎn de shén","ko":"영원한 신, 최고","why":"‘永远的神’ 병음 이니셜. 채팅 위주, 친구·연인 OK, 공식 자리 X. 요즘은 살짝 한물간 느낌.","ex":{"zh":"{H}做的饭YYDS！","py":"{H} zuò de fàn yǒngyuǎn de shén!","ko":"{H}가 한 밥 최고야!"}},{"x":"不见不散","py":"bú jiàn bú sàn","ko":"만날 때까지 기다릴게","why":"'못 만나면 흩어지지 않는다'는 뜻이야. 약속 잡고 마지막에 '꼭 보자'로 붙이는 단골 멘트야.","ex":{"zh":"{H}，周六晚上七点乌节路，不见不散！","py":"{H}, zhōuliù wǎnshang qī diǎn Wūjié Lù, bú jiàn bú sàn!","ko":"{H}, 토요일 저녁 7시 오차드로드, 꼭 보자!"}}],[{"x":"666","py":"liù liù liù","ko":"대박, 잘한다","why":"‘溜(능숙하다)’와 발음이 같아 칭찬으로 씀. 게임에서 시작, 채팅 OK, 어른에게는 X.","ex":{"zh":"你一个人修好了机器？666！","py":"Nǐ yí gè rén xiūhǎo le jīqì? Liù liù liù!","ko":"혼자 기계 고쳤어? 대박!"}},{"x":"马马虎虎","py":"mǎmahūhū","ko":"그럭저럭, 대충","why":"말인지 호랑이인지 대충 본다는 데서 왔어. '그저 그래'와 '일을 대충 한다' 두 뜻으로 다 써.","ex":{"zh":"我的中文马马虎虎，还在努力学。","py":"Wǒ de Zhōngwén mǎmahūhū, hái zài nǔlì xué.","ko":"내 중국어는 그럭저럭이야, 아직 열심히 배우는 중이야."}}],[{"x":"破防","py":"pòfáng","ko":"멘탈 무너짐, 울컥함","why":"게임의 ‘방어 뚫림’에서 유래. 감동·속상함 모두에 쓰며 친구·동료 OK.","ex":{"zh":"看到妈妈的消息，我直接破防了。","py":"Kàndào māma de xiāoxi, wǒ zhíjiē pòfáng le.","ko":"엄마 메시지 보고 바로 울컥했어."}},{"x":"小菜一碟","py":"xiǎocài yì dié","ko":"식은 죽 먹기","why":"'반찬 한 접시'처럼 별것 아니라는 뜻이야. 자신 있게 '그 정도야 쉽지'라고 할 때 써.","ex":{"zh":"老板，换个打印机墨盒？小菜一碟！","py":"Lǎobǎn, huàn ge dǎyìnjī mòhé? Xiǎocài yì dié!","ko":"사장님, 프린터 잉크 교체요? 식은 죽 먹기죠!"}}],[{"x":"吃瓜","py":"chīguā","ko":"가십 구경하기","why":"‘吃瓜群众(구경꾼)’에서 유래. 가벼운 가십에 OK, 남의 불행엔 X.","ex":{"zh":"公司又有新八卦，大家都在吃瓜。","py":"Gōngsī yòu yǒu xīn bāguà, dàjiā dōu zài chīguā.","ko":"회사에 또 새 가십 있어서 다들 구경 중이야."}},{"x":"一言为定","py":"yì yán wéi dìng","ko":"약속한 거야, 그렇게 하자","why":"'한 마디로 정해졌다'는 뜻이야. 합의나 약속을 확정할 때 악수하듯 하는 말이야.","ex":{"zh":"好，下个月交货，价格不变，一言为定。","py":"Hǎo, xià ge yuè jiāo huò, jiàgé bú biàn, yì yán wéi dìng.","ko":"좋습니다, 다음 달 납품에 가격 동결, 그걸로 확정입니다."}}],[{"x":"绝了","py":"jué le","ko":"끝내준다(좋든 나쁘든)","why":"칭찬과 어이없음 둘 다 가능한 감탄사. 친구·동료 OK.","ex":{"zh":"这家店的榴莲绝了！","py":"Zhè jiā diàn de liúlián jué le!","ko":"이 집 두리안 끝내줘!"}},{"x":"心里没底","py":"xīnli méi dǐ","ko":"자신이 없다, 불안하다","why":"마음속에 '바닥(底)'이 없으니 딛고 설 데가 없는 느낌이야. 결과를 예측 못 해 불안할 때 써.","ex":{"zh":"明天审核，我心里还是没底。","py":"Míngtiān shěnhé, wǒ xīnli háishi méi dǐ.","ko":"내일 감사인데 아직도 자신이 없어."}}],[{"x":"离谱","py":"lípǔ","ko":"말도 안 돼, 어이없음","why":"‘谱(기준)’에서 벗어났다는 뜻. 어디서나 OK, 단 고객의 요구에 대고 쓰면 X.","ex":{"zh":"这个运费也太离谱了吧。","py":"Zhège yùnfèi yě tài lípǔ le ba.","ko":"이 운송비 너무 어이없는데."}},{"x":"开夜车","py":"kāi yèchē","ko":"밤샘하다","why":"'밤에 차를 몬다'는 그림이야. 공부나 일 때문에 밤을 새울 때 써.","ex":{"zh":"为了准备报告，我昨晚开夜车到三点。","py":"Wèile zhǔnbèi bàogào, wǒ zuówǎn kāi yèchē dào sān diǎn.","ko":"보고서 준비하느라 어젯밤 3시까지 밤샘했어."}}],[{"x":"真香","py":"zhēnxiāng","ko":"결국 좋아함(말 바꾸기)","why":"예능에서 ‘절대 안 먹어’ 하다가 ‘真香’ 한 장면에서 유래. 친구·연인 OK.","ex":{"zh":"说不吃榴莲，结果一口下去：真香！","py":"Shuō bù chī liúlián, jiéguǒ yì kǒu xiàqu: zhēnxiāng!","ko":"두리안 안 먹는다더니 한입 먹고: 맛있네!"}},{"x":"看不惯","py":"kàn bu guàn","ko":"눈꼴사납다, 못마땅하다","why":"'보는 게 익숙해지지 않는다'는 뜻이야. 남의 행동이나 태도가 계속 거슬릴 때 써.","ex":{"zh":"我妈看不惯我天天吃外卖。","py":"Wǒ mā kàn bu guàn wǒ tiāntiān chī wàimài.","ko":"엄마는 내가 맨날 배달 먹는 걸 못마땅해하셔."}}],[{"x":"上头","py":"shàngtóu","ko":"푹 빠지다, 중독됨","why":"술기운이 오르는 데서 유래. 사람·드라마·음식 등에 씀, 친구·연인 OK.","ex":{"zh":"这部剧太上头了，我一晚上看完了。","py":"Zhè bù jù tài shàngtóu le, wǒ yì wǎnshang kànwán le.","ko":"이 드라마 너무 빠져서 하룻밤에 다 봤어."}},{"x":"没门儿","py":"méi ménr","ko":"어림없어, 꿈도 꾸지 마","why":"'들어갈 문이 없다'는 거야. 단칼에 거절할 때 쓰는 꽤 센 구어 표현이라 손님한텐 조심해.","ex":{"zh":"{H}说让我戒咖啡？没门儿！","py":"{H} shuō ràng wǒ jiè kāfēi? Méi ménr!","ko":"{H}가 나보고 커피 끊으래? 어림없지!"}}],[{"x":"下头","py":"xiàtóu","ko":"정떨어지다, 깨다","why":"上头의 반대. 사람 행동을 평가하는 말이라 당사자 앞에선 X, 친구끼리 OK.","ex":{"zh":"他吃饭插队，有点下头。","py":"Tā chīfàn chāduì, yǒudiǎn xiàtóu.","ko":"그 사람 밥 먹을 때 새치기해서 좀 깨더라."}},{"x":"拍马屁","py":"pāi mǎpì","ko":"아부하다","why":"말 엉덩이를 두드려 주인 비위를 맞추던 데서 왔어. 상사에게 아첨하는 걸 비꼬는 말이야.","ex":{"zh":"他天天拍老板马屁，活儿却不干。","py":"Tā tiāntiān pāi lǎobǎn mǎpì, huór què bú gàn.","ko":"걔는 맨날 사장한테 아부하면서 일은 안 해."}}],[{"x":"种草","py":"zhòngcǎo","ko":"(추천받아) 사고 싶어짐, 영업당함","why":"샤오홍슈 쇼핑 문화에서 유래. 친구·연인 OK.","ex":{"zh":"{H}给我种草了一款咖啡机。","py":"{H} gěi wǒ zhòngcǎo le yì kuǎn kāfēijī.","ko":"{H}가 커피머신 하나 영업했어."}},{"x":"吹牛","py":"chuī niú","ko":"허풍 떨다","why":"소가죽에 바람을 불어 넣어 부풀리는 그림이야. 친한 사이 농담으로 '뻥치지 마'에도 써.","ex":{"zh":"别吹牛了，你上次也说一天就能修好。","py":"Bié chuī niú le, nǐ shàng cì yě shuō yì tiān jiù néng xiūhǎo.","ko":"허풍 그만 떨어, 너 저번에도 하루면 고친다고 했잖아."}}],[{"x":"拔草","py":"bácǎo","ko":"사고 싶던 걸 사봄 / 마음 접음","why":"种草의 반대, 문맥상 ‘직접 해봄’ 또는 ‘포기’. 친구 OK.","ex":{"zh":"那家火锅店终于拔草了，一般般。","py":"Nà jiā huǒguōdiàn zhōngyú bácǎo le, yìbānbān.","ko":"그 훠궈집 드디어 가봤는데 그냥 그래."}},{"x":"背黑锅","py":"bēi hēiguō","ko":"누명을 쓰다, 독박 쓰다","why":"까만 솥을 등에 지면 온몸에 검댕이 묻지. 남의 잘못 책임을 대신 뒤집어쓰는 거야.","ex":{"zh":"机器坏了不是我的错，我可不想背黑锅。","py":"Jīqì huài le bú shì wǒ de cuò, wǒ kě bù xiǎng bēi hēiguō.","ko":"기계 고장은 내 잘못이 아니야, 독박 쓰긴 싫어."}}],[{"x":"安利","py":"ānlì","ko":"강력 추천하다","why":"암웨이(Amway) 판촉에서 유래. 동료·친구 OK.","ex":{"zh":"我给你安利一个好用的App。","py":"Wǒ gěi nǐ ānlì yí gè hǎoyòng de App.","ko":"좋은 앱 하나 추천해줄게."}},{"x":"掉链子","py":"diào liànzi","ko":"결정적일 때 실수하다","why":"자전거 체인이 빠지면 바로 멈추지? 중요한 순간에 일을 그르치는 거야.","ex":{"zh":"关键时候千万别掉链子，客户下午就来验收。","py":"Guānjiàn shíhou qiānwàn bié diào liànzi, kèhù xiàwǔ jiù lái yànshōu.","ko":"중요한 순간에 절대 삐끗하지 마, 고객이 오후에 검수하러 와."}}],[{"x":"打卡","py":"dǎkǎ","ko":"인증하다, 가보다","why":"원래 출근 체크, 지금은 명소·맛집 방문 인증. 누구에게나 OK.","ex":{"zh":"周末我们去滨海湾打卡吧。","py":"Zhōumò wǒmen qù Bīnhǎiwān dǎkǎ ba.","ko":"주말에 마리나베이 인증하러 가자."}},{"x":"打包票","py":"dǎ bāopiào","ko":"장담하다, 보증하다","why":"'보증서(包票)를 끊어 준다'는 뜻이야. 결과를 책임지고 확신할 때 써.","ex":{"zh":"我敢打包票，这批货质量没问题。","py":"Wǒ gǎn dǎ bāopiào, zhè pī huò zhìliàng méi wèntí.","ko":"이번 물량 품질은 문제없다고 장담할 수 있어요."}}],[{"x":"佛系","py":"fóxì","ko":"욕심 없음, 될 대로","why":"2017년 일본발 ‘불교계 남자’에서 유래. 어디서나 OK, 업무 태도로 말하면 사장님은 싫어함.","ex":{"zh":"我对考试比较佛系，过了就行。","py":"Wǒ duì kǎoshì bǐjiào fóxì, guò le jiù xíng.","ko":"시험은 좀 내려놨어, 붙기만 하면 돼."}},{"x":"泼冷水","py":"pō lěngshuǐ","ko":"찬물을 끼얹다","why":"의욕에 찬물을 확 끼얹는 그림 그대로야. 남의 열정이나 계획을 꺾을 때 써.","ex":{"zh":"我刚说想买摩托车，我爸就泼冷水。","py":"Wǒ gāng shuō xiǎng mǎi mótuōchē, wǒ bà jiù pō lěngshuǐ.","ko":"오토바이 사고 싶다고 하자마자 아빠가 찬물을 끼얹으셨어."}}],[{"x":"社恐","py":"shèkǒng","ko":"낯가림, 사회불안","why":"‘社交恐惧症’ 줄임말. 자기 자신 얘기로 쓰면 OK.","ex":{"zh":"我有点社恐，公司聚餐不太想去。","py":"Wǒ yǒudiǎn shèkǒng, gōngsī jùcān bú tài xiǎng qù.","ko":"나 좀 낯가려서 회식 가기 싫어."}},{"x":"碰钉子","py":"pèng dīngzi","ko":"퇴짜 맞다, 벽에 부딪히다","why":"튀어나온 못에 부딪히는 그림이야. 부탁이나 제안이 거절당했을 때 써.","ex":{"zh":"我去财务部申请预算，又碰了个钉子。","py":"Wǒ qù cáiwùbù shēnqǐng yùsuàn, yòu pèngle ge dīngzi.","ko":"재무팀에 예산 신청하러 갔다가 또 퇴짜 맞았어."}}],[{"x":"社牛","py":"shèniú","ko":"인싸, 넉살 좋은 사람","why":"社恐의 반대말로 유행. 칭찬으로 써도 OK.","ex":{"zh":"我们的销售经理是个社牛，跟谁都能聊。","py":"Wǒmen de xiāoshòu jīnglǐ shì gè shèniú, gēn shéi dōu néng liáo.","ko":"우리 영업팀장은 인싸라 누구랑도 얘기 잘해."}},{"x":"炒鱿鱼","py":"chǎo yóuyú","ko":"해고하다, 잘리다","why":"오징어를 볶으면 돌돌 말리지? 짐(이불)을 말아 나간다는 데서 해고를 뜻해.","ex":{"zh":"再这样迟到，小心被老板炒鱿鱼。","py":"Zài zhèyàng chídào, xiǎoxīn bèi lǎobǎn chǎo yóuyú.","ko":"계속 이렇게 지각하면 사장님한테 잘릴 수도 있어."}}],[{"x":"社死","py":"shèsǐ","ko":"창피해 죽을 상황","why":"‘社会性死亡’ 줄임말. 자기 창피한 일에 OK, 남의 실수에 쓰면 놀림.","ex":{"zh":"开会时麦克风没关，我当场社死。","py":"Kāihuì shí màikèfēng méi guān, wǒ dāngchǎng shèsǐ.","ko":"회의 때 마이크 안 꺼서 그 자리에서 창피해 죽는 줄."}},{"x":"走后门","py":"zǒu hòumén","ko":"뒷구멍으로 하다, 연줄 쓰다","why":"정문 말고 뒷문으로 들어가는 거야. 인맥·청탁으로 일을 처리하는 걸 부정적으로 말해.","ex":{"zh":"我们公司招人不走后门，都看能力。","py":"Wǒmen gōngsī zhāo rén bù zǒu hòumén, dōu kàn nénglì.","ko":"우리 회사는 채용에 연줄 안 통해, 다 실력 봐."}}],[{"x":"emo","py":"yīmò","ko":"우울해지다, 감성 터짐","why":"음악 장르 emo에서 유래, 2021년 유행하며 동사로도 씀. 친구·연인 OK.","ex":{"zh":"下雨天一个人在宿舍，有点emo。","py":"Xiàyǔ tiān yí gè rén zài sùshè, yǒudiǎn yīmò.","ko":"비 오는 날 혼자 숙소에 있으니 좀 우울해."}},{"x":"开绿灯","py":"kāi lǜdēng","ko":"허락하다, 승인하다","why":"신호등에 초록불을 켜 주는 거야. 윗사람이 진행을 허가할 때 써.","ex":{"zh":"老板终于给新生产线开绿灯了！","py":"Lǎobǎn zhōngyú gěi xīn shēngchǎnxiàn kāi lǜdēng le!","ko":"사장님이 드디어 새 생산라인에 승인해 주셨어!"}}],[{"x":"摆烂","py":"bǎilàn","ko":"될 대로 되라, 손 놓음","why":"스포츠 tanking에서 유래. 자조 OK, 업무 보고에선 X.","ex":{"zh":"今天太累了，作业先摆烂吧。","py":"Jīntiān tài lèi le, zuòyè xiān bǎilàn ba.","ko":"오늘 너무 피곤해서 과제는 일단 손 놓을래."}},{"x":"半斤八两","py":"bàn jīn bā liǎng","ko":"도토리 키 재기","why":"옛 저울에선 한 근이 16냥이라 반 근이 8냥이야. 둘이 수준이 똑같다는 뜻(주로 부정적)이야.","ex":{"zh":"这两家供应商的报价半斤八两，差不多。","py":"Zhè liǎng jiā gōngyìngshāng de bàojià bàn jīn bā liǎng, chàbuduō.","ko":"두 공급업체 견적이 도토리 키 재기야, 거기서 거기야."}}],[{"x":"搞钱","py":"gǎoqián","ko":"돈 벌기에 올인","why":"직설적이지만 긍정적인 의지 표현. 친구·동료·가족 OK.","ex":{"zh":"爸，新的一年我要努力搞钱！","py":"Bà, xīn de yì nián wǒ yào nǔlì gǎoqián!","ko":"아빠, 새해엔 열심히 돈 벌 거야!"}},{"x":"有两下子","py":"yǒu liǎng xiàzi","ko":"실력이 꽤 있다","why":"'두 수(两下)'는 쓸 줄 안다는 뜻이야. 상대 솜씨를 인정하며 칭찬할 때 써.","ex":{"zh":"你修PLC这么快，真有两下子！","py":"Nǐ xiū PLC zhème kuài, zhēn yǒu liǎng xiàzi!","ko":"PLC를 이렇게 빨리 고치다니, 실력 좀 있는데!"}}],[{"x":"干饭人","py":"gànfànrén","ko":"밥에 진심인 사람","why":"2020년 유행, ‘干饭(밥 먹다)’. 점심시간 동료끼리 OK.","ex":{"zh":"十二点了，干饭人出发！","py":"Shí'èr diǎn le, gànfànrén chūfā!","ko":"12시다, 밥 먹으러 출발!"}},{"x":"二话不说","py":"èr huà bù shuō","ko":"두말없이","why":"'두 번째 말을 하지 않는다'는 거야. 군말 없이 바로 행동할 때 써, 칭찬 뉘앙스가 있어.","ex":{"zh":"我搬家那天，同事二话不说就来帮忙。","py":"Wǒ bān jiā nà tiān, tóngshì èr huà bù shuō jiù lái bāngmáng.","ko":"나 이사하던 날 동료가 두말없이 도와주러 왔어."}}],[{"x":"画饼","py":"huàbǐng","ko":"공수표, 헛된 약속","why":"‘画饼充饥’에서 유래. 사장님 뒷담 뉘앙스라 사장님 앞에선 절대 X.","ex":{"zh":"老板又在画饼了，说明年加薪。","py":"Lǎobǎn yòu zài huàbǐng le, shuō míngnián jiāxīn.","ko":"사장님 또 공수표 날린다, 내년에 월급 올려준대."}},{"x":"好事多磨","py":"hǎoshì duō mó","ko":"좋은 일엔 마가 많다","why":"좋은 일은 많이 '갈려야(磨)' 이뤄진다는 성어야. 일이 꼬일 때 위로하는 말로 딱이야.","ex":{"zh":"签证又延期了？别急，好事多磨嘛。","py":"Qiānzhèng yòu yánqī le? Bié jí, hǎoshì duō mó ma.","ko":"비자 또 늦어졌어? 조급해하지 마, 좋은 일엔 원래 굴곡이 있잖아."}}],[{"x":"背锅","py":"bēiguō","ko":"독박 쓰다, 대신 책임짐","why":"‘背黑锅’ 줄임말. 동료 사이 OK.","ex":{"zh":"供应商迟到，结果我来背锅。","py":"Gōngyìngshāng chídào, jiéguǒ wǒ lái bēiguō.","ko":"공급업체가 늦었는데 결국 내가 독박 썼어."}},{"x":"说曹操曹操到","py":"shuō Cáo Cāo Cáo Cāo dào","ko":"호랑이도 제 말 하면 온다","why":"조조 얘기를 하면 조조가 나타난다는 거야. 마침 얘기하던 사람이 등장할 때 써.","ex":{"zh":"说曹操曹操到，老板刚好进来了。","py":"Shuō Cáo Cāo Cáo Cāo dào, lǎobǎn gānghǎo jìnlái le.","ko":"호랑이도 제 말 하면 온다더니, 사장님이 딱 들어오셨네."}}],[{"x":"甩锅","py":"shuǎiguō","ko":"책임 떠넘기기","why":"背锅의 반대. 남을 지적하는 말이라 당사자 앞에선 조심.","ex":{"zh":"出了问题别甩锅，先解决再说。","py":"Chū le wèntí bié shuǎiguō, xiān jiějué zài shuō.","ko":"문제 생기면 떠넘기지 말고 먼저 해결하자."}},{"x":"八字还没一撇","py":"bā zì hái méi yì piě","ko":"아직 시작도 안 했다, 김칫국","why":"'八'자의 첫 획도 안 그었다는 거야. 일이 아직 전혀 정해지지 않았을 때 써.","ex":{"zh":"结婚？八字还没一撇呢，妈你别急。","py":"Jié hūn? Bā zì hái méi yì piě ne, mā nǐ bié jí.","ko":"결혼이요? 아직 아무것도 정해진 게 없어요, 엄마 서두르지 마세요."}}],[{"x":"工具人","py":"gōngjùrén","ko":"이용만 당하는 사람","why":"연애·직장에서 도구 취급당하는 사람. 자조 OK, 남에게 쓰면 실례.","ex":{"zh":"我就是个工具人，什么杂事都找我。","py":"Wǒ jiù shì gè gōngjùrén, shénme záshì dōu zhǎo wǒ.","ko":"난 그냥 도구야, 잡일은 다 나한테 와."}},{"x":"打退堂鼓","py":"dǎ tuìtánggǔ","ko":"발을 빼다, 꽁무니 빼다","why":"옛 관청에서 업무 종료 때 치던 북이야. 하다가 겁먹고 포기하는 걸 말해.","ex":{"zh":"项目才开始，你可别打退堂鼓。","py":"Xiàngmù cái kāishǐ, nǐ kě bié dǎ tuìtánggǔ.","ko":"프로젝트 이제 막 시작했는데 발 빼면 안 돼."}}],[{"x":"社畜","py":"shèchù","ko":"회사의 가축, 직장인","why":"일본어 ‘社畜’에서 유래. 자조 OK, 사장님 앞 X.","ex":{"zh":"社畜的周一，靠咖啡续命。","py":"Shèchù de zhōuyī, kào kāfēi xùmìng.","ko":"직장인의 월요일, 커피로 연명."}},{"x":"唱反调","py":"chàng fǎndiào","ko":"반대만 하다, 딴지 걸다","why":"남과 반대 곡조로 노래하는 그림이야. 일부러 반대 의견만 내는 걸 말해.","ex":{"zh":"开会时他总是跟我唱反调。","py":"Kāi huì shí tā zǒngshì gēn wǒ chàng fǎndiào.","ko":"회의 때 걔는 항상 나랑 반대로만 가."}}],[{"x":"卷王","py":"juǎnwáng","ko":"경쟁 끝판왕, 일벌레","why":"内卷+王. 반농담 칭찬으로 동료 사이 OK.","ex":{"zh":"他每天加班到十点，真是卷王。","py":"Tā měitiān jiābān dào shí diǎn, zhēn shì juǎnwáng.","ko":"그 사람 매일 10시까지 야근해, 진짜 일벌레야."}},{"x":"入乡随俗","py":"rù xiāng suí sú","ko":"로마에 가면 로마법","why":"시골에 들어가면 그곳 풍속을 따른다는 성어야. 해외 생활 얘기할 때 자주 써.","ex":{"zh":"在马来西亚用手吃饭？入乡随俗嘛！","py":"Zài Mǎláixīyà yòng shǒu chī fàn? Rù xiāng suí sú ma!","ko":"말레이시아에서 손으로 밥 먹냐고? 로마에 가면 로마법이지!"}}],[{"x":"凡尔赛","py":"fán'ěrsài","ko":"은근한 자랑","why":"『베르사유의 장미』에서 따온 ‘凡尔赛文学’. 친구 놀릴 때 OK.","ex":{"zh":"你说‘工资太多花不完’？别凡尔赛了。","py":"Nǐ shuō ‘gōngzī tài duō huā bù wán’? Bié fán'ěrsài le.","ko":"월급이 너무 많아 다 못 쓴다고? 은근 자랑 그만해."}},{"x":"不是省油的灯","py":"bú shì shěng yóu de dēng","ko":"만만한 상대가 아니다","why":"기름을 아끼는 등잔이 아니라는 거야. 까다롭거나 보통내기가 아닌 사람을 말해.","ex":{"zh":"这个客户可不是省油的灯，合同要看仔细。","py":"Zhège kèhù kě bú shì shěng yóu de dēng, hétong yào kàn zǐxì.","ko":"이 고객 보통내기 아니야, 계약서 꼼꼼히 봐야 해."}}],[{"x":"柠檬精","py":"níngméngjīng","ko":"질투쟁이","why":"‘酸(시다=질투 나다)’에서 유래. 자기 얘기로 쓰면 귀여움.","ex":{"zh":"看到同事升职，我成柠檬精了。","py":"Kàndào tóngshì shēngzhí, wǒ chéng níngméngjīng le.","ko":"동료 승진한 거 보고 질투 나 죽겠어."}},{"x":"穿小鞋","py":"chuān xiǎoxié","ko":"뒤에서 괴롭히다","why":"작은 신발을 억지로 신기는 그림이야. 윗사람이 권력으로 은근히 불이익 주는 걸 말해.","ex":{"zh":"我跟主管吵了一架，怕他以后给我穿小鞋。","py":"Wǒ gēn zhǔguǎn chǎole yí jià, pà tā yǐhòu gěi wǒ chuān xiǎoxié.","ko":"팀장이랑 한판 했더니 앞으로 나 골탕 먹일까 봐 걱정이야."}}],[{"x":"硬核","py":"yìnghé","ko":"하드코어, 제대로 된","why":"음악 hardcore에서 유래. 칭찬으로 어디서나 OK.","ex":{"zh":"这台新整流器的参数很硬核。","py":"Zhè tái xīn zhěngliúqì de cānshù hěn yìnghé.","ko":"이 새 정류기 스펙 진짜 제대로야."}},{"x":"戴高帽","py":"dài gāomào","ko":"치켜세우다, 띄워 주다","why":"높은 모자를 씌워 주는 거야. 과하게 칭찬해 띄우는 걸 말하고, '그만 띄워'에도 써.","ex":{"zh":"别给我戴高帽了，有什么事直说吧。","py":"Bié gěi wǒ dài gāomào le, yǒu shénme shì zhí shuō ba.","ko":"나 그만 띄우고, 무슨 일인지 그냥 말해."}}],[{"x":"内耗","py":"nèihào","ko":"혼자 속 끓이며 소모됨","why":"주로 ‘精神内耗’로 씀. 진지한 대화에도 OK.","ex":{"zh":"别想太多了，精神内耗最累。","py":"Bié xiǎng tài duō le, jīngshén nèihào zuì lèi.","ko":"너무 생각하지 마, 혼자 속 끓이는 게 제일 피곤해."}},{"x":"吃不了兜着走","py":"chī bu liǎo dōuzhe zǒu","ko":"혼쭐날 줄 알아","why":"다 못 먹은 걸 싸 들고 가야 한다는 거야. 일 터지면 책임이 크다는 경고로 써.","ex":{"zh":"这次要是再出质量问题，我们就吃不了兜着走。","py":"Zhè cì yàoshi zài chū zhìliàng wèntí, wǒmen jiù chī bu liǎo dōuzhe zǒu.","ko":"이번에 또 품질 문제 터지면 우리 감당 못 할 거야."}}],[{"x":"搭子","py":"dāzi","ko":"~메이트, 활동 파트너","why":"饭搭子·健身搭子처럼 특정 활동만 같이 하는 친구. 누구에게나 OK.","ex":{"zh":"他是我的午饭搭子。","py":"Tā shì wǒ de wǔfàn dāzi.","ko":"그 사람은 내 점심 메이트야."}},{"x":"哪儿跟哪儿","py":"nǎr gēn nǎr","ko":"무슨 엉뚱한 소리야","why":"'어디랑 어디를 엮냐'는 거야. 전혀 관계없는 걸 갖다 붙일 때 어이없어하며 써.","ex":{"zh":"我加班跟不爱你？{H}，这都哪儿跟哪儿啊！","py":"Wǒ jiā bān gēn bú ài nǐ? {H}, zhè dōu nǎr gēn nǎr a!","ko":"내가 야근하는 게 널 안 사랑하는 거라고? {H}, 그게 무슨 소리야!"}}],[{"x":"情绪价值","py":"qíngxù jiàzhí","ko":"정서적 만족감, 기분 챙겨주기","why":"연애 맥락에서 2023년 대유행. 연인·친구 OK.","ex":{"zh":"{H}说我很会提供情绪价值。","py":"{H} shuō wǒ hěn huì tígōng qíngxù jiàzhí.","ko":"{H}가 나보고 기분 잘 챙겨준대."}},{"x":"一个巴掌拍不响","py":"yí ge bāzhang pāi bu xiǎng","ko":"손바닥도 마주쳐야 소리 난다","why":"한 손바닥으론 소리가 안 나지. 싸움엔 양쪽 다 책임이 있다는 뜻이야.","ex":{"zh":"你们俩吵架，一个巴掌拍不响，都冷静一下。","py":"Nǐmen liǎ chǎo jià, yí ge bāzhang pāi bu xiǎng, dōu lěngjìng yíxià.","ko":"둘이 싸운 건 손바닥도 마주쳐야 소리 나는 거니까, 둘 다 진정해."}}],[{"x":"情绪稳定","py":"qíngxù wěndìng","ko":"감정 기복 없음","why":"이상형·좋은 상사의 조건으로 자주 언급. 칭찬으로 어디서나 OK.","ex":{"zh":"我们老板情绪很稳定，从不发火。","py":"Wǒmen lǎobǎn qíngxù hěn wěndìng, cóng bù fāhuǒ.","ko":"우리 사장님은 감정 기복이 없어서 화를 안 내."}},{"x":"爱面子","py":"ài miànzi","ko":"체면을 중시하다","why":"'얼굴(面子)'을 아낀다는 거야. 중국어권 비즈니스에서 핵심 개념이라 꼭 알아 둬.","ex":{"zh":"老板很爱面子，有意见最好私下说。","py":"Lǎobǎn hěn ài miànzi, yǒu yìjiàn zuìhǎo sīxià shuō.","ko":"사장님은 체면을 중시하셔서 의견 있으면 따로 말씀드리는 게 좋아."}}],[{"x":"i人","py":"ài rén","ko":"내향인(MBTI I)","why":"2023년 MBTI 유행으로 퍼짐. 자기소개·친구 사이 OK.","ex":{"zh":"我是i人，周末只想宅着。","py":"Wǒ shì ài rén, zhōumò zhǐ xiǎng zhái zhe.","ko":"나 I라서 주말엔 집에만 있고 싶어."}},{"x":"给面子","py":"gěi miànzi","ko":"체면을 세워 주다","why":"상대에게 얼굴을 '준다'는 거야. 초대나 부탁을 받아들여 줄 때 감사 표현으로도 써.","ex":{"zh":"谢谢您给面子，今晚这顿我请！","py":"Xièxie nín gěi miànzi, jīnwǎn zhè dùn wǒ qǐng!","ko":"와 주셔서 감사합니다, 오늘 저녁은 제가 살게요!"}}],[{"x":"e人","py":"yī rén","ko":"외향인(MBTI E)","why":"i人의 반대. 친구·동료 OK.","ex":{"zh":"{H}是e人，每个周末都要出去玩。","py":"{H} shì yī rén, měi gè zhōumò dōu yào chūqu wán.","ko":"{H}는 E라서 주말마다 나가 놀아야 해."}},{"x":"丢脸","py":"diū liǎn","ko":"창피하다, 체면 구기다","why":"얼굴을 잃어버린다는 거야. 망신스러운 상황에 바로 쓰는 말이야.","ex":{"zh":"我在客户面前把名字叫错了，太丢脸了。","py":"Wǒ zài kèhù miànqián bǎ míngzi jiàocuò le, tài diū liǎn le.","ko":"고객 앞에서 이름을 잘못 불렀어, 너무 창피했어."}}],[{"x":"天花板","py":"tiānhuābǎn","ko":"최고 수준, 끝판왕","why":"‘더 위가 없는 천장’이라는 뜻. 칭찬이라 고객에게도 가능.","ex":{"zh":"这家的海南鸡饭是新加坡天花板。","py":"Zhè jiā de Hǎinán jīfàn shì Xīnjiāpō tiānhuābǎn.","ko":"이 집 치킨라이스는 싱가포르 끝판왕이야."}},{"x":"打交道","py":"dǎ jiāodao","ko":"상대하다, 교류하다","why":"서로 '왕래(交道)'를 튼다는 뜻이야. 사람·기관과 일로 엮일 때 아주 자주 써.","ex":{"zh":"我每天都要跟供应商和政府部门打交道。","py":"Wǒ měi tiān dōu yào gēn gōngyìngshāng hé zhèngfǔ bùmén dǎ jiāodao.","ko":"나는 매일 공급업체랑 관공서를 상대해야 해."}}],[{"x":"宝藏","py":"bǎozàng","ko":"숨은 보석","why":"‘宝藏男孩/宝藏餐厅’처럼 씀. 칭찬이라 어디서나 OK.","ex":{"zh":"这是我在新山发现的宝藏咖啡店。","py":"Zhè shì wǒ zài Xīnshān fāxiàn de bǎozàng kāfēidiàn.","ko":"이건 내가 조호바루에서 찾은 숨은 카페야."}},{"x":"拖后腿","py":"tuō hòutuǐ","ko":"발목 잡다","why":"뒷다리를 잡아끄는 그림이야. 남의 일이나 팀 진행을 방해할 때 써.","ex":{"zh":"我不想拖团队后腿，周末也会把资料补齐。","py":"Wǒ bù xiǎng tuō tuánduì hòutuǐ, zhōumò yě huì bǎ zīliào bǔqí.","ko":"팀 발목 잡기 싫어서 주말에라도 자료 다 채워 놓을게."}}],[{"x":"绝绝子","py":"juéjuézǐ","ko":"완전 최고","why":"2021년 유행, 남발하면 유치하다는 평. 연인·친구 채팅용.","ex":{"zh":"这条裙子穿在你身上绝绝子！","py":"Zhè tiáo qúnzi chuān zài nǐ shēnshang juéjuézǐ!","ko":"이 원피스 너한테 완전 찰떡이야!"}},{"x":"露一手","py":"lòu yì shǒu","ko":"솜씨를 보여 주다","why":"'손재주 한 수를 드러낸다'는 거야. 요리나 기술을 뽐낼 때 가볍게 써.","ex":{"zh":"这周末我给{H}露一手，做韩式炸鸡。","py":"Zhè zhōumò wǒ gěi {H} lòu yì shǒu, zuò Hánshì zhájī.","ko":"이번 주말에 {H}한테 솜씨 좀 보여 줄게, 한국식 치킨 만들어서."}}],[{"x":"打call","py":"dǎ kāo","ko":"응원하다","why":"일본 아이돌 콘서트 응원 문화에서 유래. 누구에게나 OK.","ex":{"zh":"明天你面试，我为你打call！","py":"Míngtiān nǐ miànshì, wǒ wèi nǐ dǎ kāo!","ko":"내일 면접이지, 응원할게!"}},{"x":"七上八下","py":"qī shàng bā xià","ko":"마음이 조마조마하다","why":"물통 열다섯 개가 오르락내리락하듯 마음이 들썩이는 거야. 결과 기다리며 불안할 때 써.","ex":{"zh":"等面试结果的时候，我心里七上八下的。","py":"Děng miànshì jiéguǒ de shíhou, wǒ xīnli qī shàng bā xià de.","ko":"면접 결과 기다릴 때 마음이 조마조마했어."}}],[{"x":"躺赢","py":"tǎngyíng","ko":"가만히 있어도 이김","why":"게임에서 팀원 덕에 이기는 것. 친구·동료 OK.","ex":{"zh":"这个项目有你在，我们躺赢了。","py":"Zhège xiàngmù yǒu nǐ zài, wǒmen tǎngyíng le.","ko":"이 프로젝트는 너 있으니까 우린 날로 먹는다."}},{"x":"乱七八糟","py":"luànqībāzāo","ko":"엉망진창","why":"'七'과 '八'로 어지러움을 강조한 표현이야. 방, 서류, 일 상태가 뒤죽박죽일 때 써.","ex":{"zh":"仓库乱七八糟的，审核前必须整理好。","py":"Cāngkù luànqībāzāo de, shěnhé qián bìxū zhěnglǐ hǎo.","ko":"창고가 엉망이라 감사 전에 꼭 정리해야 해."}}],[{"x":"拿捏","py":"nániē","ko":"완벽히 장악하다","why":"‘拿捏得死死的’처럼 씀. 친구·연인 OK, 고객을 두고 쓰면 X.","ex":{"zh":"这个报告，我拿捏了！","py":"Zhège bàogào, wǒ nániē le!","ko":"이 보고서, 내가 완벽히 잡았어!"}},{"x":"一塌糊涂","py":"yìtāhútú","ko":"엉망이다, (정도가) 장난 아니다","why":"무너져 범벅이 된 모습이야. '엉망'뿐 아니라 '好得一塌糊涂'처럼 정도 강조에도 써.","ex":{"zh":"今天堵车堵得一塌糊涂，回家花了两个小时。","py":"Jīntiān dǔ chē dǔ de yìtāhútú, huí jiā huāle liǎng ge xiǎoshí.","ko":"오늘 차가 엄청 막혀서 집에 가는 데 두 시간 걸렸어."}}],[{"x":"整活","py":"zhěnghuó","ko":"웃긴 짓·이벤트 벌이기","why":"방송·숏폼에서 유래. 친구·동료 OK.","ex":{"zh":"年会上你打算整什么活？","py":"Niánhuì shang nǐ dǎsuàn zhěng shénme huó?","ko":"송년회 때 뭐 웃긴 거 준비해?"}},{"x":"刀子嘴豆腐心","py":"dāozi zuǐ dòufu xīn","ko":"말은 독해도 속은 여리다","why":"입은 칼, 마음은 두부라는 거야. 잔소리 많지만 정 많은 사람을 말해.","ex":{"zh":"我妈是刀子嘴豆腐心，骂完我又给我寄泡菜。","py":"Wǒ mā shì dāozi zuǐ dòufu xīn, màwán wǒ yòu gěi wǒ jì pàocài.","ko":"우리 엄마는 말만 독하지 속은 여려서, 혼내 놓고 김치 또 보내 주셔."}}],[{"x":"安排","py":"ānpai","ko":"콜, 내가 처리할게","why":"‘安排上了’ 형태로 ‘바로 처리’. 동료·친구 OK, 사장님께도 가볍게 가능.","ex":{"zh":"周五聚餐？安排！","py":"Zhōuwǔ jùcān? Ānpai!","ko":"금요일 회식? 콜!"}},{"x":"嘴硬","py":"zuǐ yìng","ko":"말로는 안 지다, 고집 부리다","why":"입이 딱딱하다는 거야. 틀린 거 알면서도 인정 안 할 때 놀리듯 써.","ex":{"zh":"你就嘴硬吧，明明想她了。","py":"Nǐ jiù zuǐ yìng ba, míngmíng xiǎng tā le.","ko":"말로만 안 그런 척하지, 분명 보고 싶으면서."}}],[{"x":"冲","py":"chōng","ko":"가자, 고고","why":"결심·응원의 한 글자. 누구에게나 OK.","ex":{"zh":"双十一打折了，冲！","py":"Shuāng shíyī dǎzhé le, chōng!","ko":"광군제 할인한다, 가자!"}},{"x":"马后炮","py":"mǎhòupào","ko":"뒷북","why":"장기에서 말 뒤에 포를 놓는 거야. 일 다 끝나고 나서야 하는 쓸데없는 조언을 말해.","ex":{"zh":"现在才说要检查，这不是马后炮吗？","py":"Xiànzài cái shuō yào jiǎnchá, zhè bú shì mǎhòupào ma?","ko":"이제 와서 점검하자고? 이거 완전 뒷북 아냐?"}}],[{"x":"薅羊毛","py":"hāo yángmáo","ko":"혜택·쿠폰 알뜰하게 챙기기","why":"앱 쿠폰·프로모션 이용하기. 친구·가족 OK.","ex":{"zh":"妈，我用新用户优惠薅了一波羊毛。","py":"Mā, wǒ yòng xīn yònghù yōuhuì hāo le yì bō yángmáo.","ko":"엄마, 나 신규 회원 할인으로 혜택 쏠쏠히 챙겼어."}},{"x":"耳边风","py":"ěrbiānfēng","ko":"한 귀로 듣고 흘리기","why":"귓가를 스쳐 가는 바람이라는 거야. '把…当耳边风' 형태로 말을 무시할 때 써.","ex":{"zh":"我说了好几次要戴手套，他都当耳边风。","py":"Wǒ shuōle hǎo jǐ cì yào dài shǒutào, tā dōu dàng ěrbiānfēng.","ko":"장갑 끼라고 몇 번을 말했는데 걔는 귓등으로도 안 들어."}}],[{"x":"割韭菜","py":"gē jiǔcài","ko":"개미 털기, 호구 잡기","why":"주식·코인에서 개인 투자자 털어먹는 데서 유래. 친구 OK, 고객 앞 X.","ex":{"zh":"这种网课就是割韭菜，别买。","py":"Zhè zhǒng wǎngkè jiù shì gē jiǔcài, bié mǎi.","ko":"이런 인강은 그냥 호구 잡는 거야, 사지 마."}},{"x":"磨洋工","py":"mó yánggōng","ko":"일하는 척 시간 때우다","why":"옛날 외국인 공장에서 일부러 느리게 일하던 데서 왔어. 꾀부리며 늘어지는 걸 말해.","ex":{"zh":"下班前别磨洋工，把报表做完再走。","py":"Xià bān qián bié mó yánggōng, bǎ bàobiǎo zuòwán zài zǒu.","ko":"퇴근 전에 시간 때우지 말고 보고서 끝내고 가."}}],[{"x":"我太难了","py":"wǒ tài nán le","ko":"나 너무 힘들어","why":"2019년 유행어. 가벼운 투정, 친구·연인 OK.","ex":{"zh":"三个报告一起交，我太难了。","py":"Sān gè bàogào yìqǐ jiāo, wǒ tài nán le.","ko":"보고서 세 개를 같이 내야 해, 너무 힘들다."}},{"x":"走过场","py":"zǒu guòchǎng","ko":"형식적으로 때우다","why":"무대를 그냥 한번 지나가는 거야. 실속 없이 형식만 갖추는 점검·회의를 비판할 때 써.","ex":{"zh":"安全检查不能走过场，每个点都要看。","py":"Ānquán jiǎnchá bù néng zǒu guòchǎng, měi ge diǎn dōu yào kàn.","ko":"안전 점검은 형식적으로 하면 안 돼, 포인트 하나하나 다 봐야 해."}}],[{"x":"我真的会谢","py":"wǒ zhēn de huì xiè","ko":"아주 고맙다(반어, 어이없음)","why":"2022년 유행, ‘谢谢你哦’ 비꼬기. 친구 OK, 사장님·고객 X.","ex":{"zh":"刚洗完车就下雨，我真的会谢。","py":"Gāng xǐwán chē jiù xiàyǔ, wǒ zhēn de huì xiè.","ko":"세차하자마자 비 오네, 아주 고맙다."}},{"x":"一刀切","py":"yì dāo qiē","ko":"일률적으로 처리하다","why":"칼 한 번에 다 잘라 버리는 거야. 사정 안 보고 똑같은 규칙을 적용하는 걸 말해.","ex":{"zh":"每条生产线情况不同，不能一刀切。","py":"Měi tiáo shēngchǎnxiàn qíngkuàng bù tóng, bù néng yì dāo qiē.","ko":"라인마다 상황이 달라서 일괄 적용하면 안 돼."}}],[{"x":"大冤种","py":"dà yuānzhǒng","ko":"호구, 손해 본 사람","why":"억울하게 손해 보는 사람. 자조 OK, 남에게는 실례.","ex":{"zh":"原价买的，第二天就打折，我是大冤种。","py":"Yuánjià mǎi de, dì-èr tiān jiù dǎzhé, wǒ shì dà yuānzhǒng.","ko":"정가에 샀는데 다음날 할인, 나 완전 호구야."}},{"x":"临时抱佛脚","py":"lín shí bào fó jiǎo","ko":"벼락치기","why":"급해서야 부처님 발을 붙잡는다는 거야. 시험 직전 몰아서 공부할 때 딱이야.","ex":{"zh":"HSK下个月就考了，我可不想临时抱佛脚。","py":"HSK xià ge yuè jiù kǎo le, wǒ kě bù xiǎng lín shí bào fó jiǎo.","ko":"HSK가 다음 달인데 벼락치기는 하기 싫어."}}],[{"x":"恋爱脑","py":"liàn'àinǎo","ko":"연애에 올인하는 사람","why":"연애하면 다른 건 다 뒷전인 사람. 친구 놀릴 때 OK.","ex":{"zh":"他一提到女朋友就笑，典型恋爱脑。","py":"Tā yì tídào nǚpéngyou jiù xiào, diǎnxíng liàn'àinǎo.","ko":"걔 여자친구 얘기만 나오면 웃어, 전형적인 연애 바보야."}},{"x":"三天打鱼两天晒网","py":"sān tiān dǎ yú liǎng tiān shài wǎng","ko":"작심삼일","why":"사흘 고기 잡고 이틀 그물 말린다는 거야. 꾸준하지 못하고 하다 말다 하는 걸 말해.","ex":{"zh":"健身不能三天打鱼两天晒网。","py":"Jiàn shēn bù néng sān tiān dǎ yú liǎng tiān shài wǎng.","ko":"운동은 하다 말다 하면 안 돼."}}],[{"x":"双向奔赴","py":"shuāngxiàng bēnfù","ko":"서로를 향해 달려감, 쌍방 노력","why":"관계에서 양쪽 모두 노력하는 것. 연인 사이 로맨틱하게 OK.","ex":{"zh":"我去新加坡，{H}来新山，这就是双向奔赴。","py":"Wǒ qù Xīnjiāpō, {H} lái Xīnshān, zhè jiù shì shuāngxiàng bēnfù.","ko":"내가 싱가포르 가고 {H}가 조호바루 오고, 이게 쌍방 노력이지."}},{"x":"半途而废","py":"bàn tú ér fèi","ko":"중도에 포기하다","why":"길 반쯤 가다 그만둔다는 성어야. 격려하거나 후회할 때 다 써.","ex":{"zh":"MBA已经读了一半，绝对不能半途而废。","py":"MBA yǐjīng dúle yí bàn, juéduì bù néng bàn tú ér fèi.","ko":"MBA 벌써 반이나 했는데 절대 중간에 포기 못 해."}}],[{"x":"小确幸","py":"xiǎoquèxìng","ko":"소확행","why":"무라카미 하루키의 ‘小确幸’에서 유래. 누구에게나 OK.","ex":{"zh":"下班路上喝杯奶茶，就是我的小确幸。","py":"Xiàbān lùshang hē bēi nǎichá, jiù shì wǒ de xiǎoquèxìng.","ko":"퇴근길 밀크티 한 잔이 내 소확행이야."}},{"x":"熟能生巧","py":"shú néng shēng qiǎo","ko":"익숙해지면 요령이 생긴다","why":"손에 익으면 기교가 생긴다는 성어야. 신입이나 배우는 사람을 격려할 때 써.","ex":{"zh":"刚开始操作慢没关系，熟能生巧。","py":"Gāng kāishǐ cāozuò màn méi guānxi, shú néng shēng qiǎo.","ko":"처음엔 조작이 느려도 괜찮아, 하다 보면 손에 익어."}}],[{"x":"氛围感","py":"fēnwéigǎn","ko":"분위기 있음, 감성","why":"샤오홍슈 사진 감성에서 퍼짐. 친구·연인 OK.","ex":{"zh":"这家餐厅很有氛围感，适合约会。","py":"Zhè jiā cāntīng hěn yǒu fēnwéigǎn, shìhé yuēhuì.","ko":"이 식당 분위기 좋아서 데이트하기 딱이야."}},{"x":"一举两得","py":"yì jǔ liǎng dé","ko":"일석이조","why":"한 번 들어서 두 개를 얻는다는 성어야. 효율 좋은 방법을 제안할 때 써.","ex":{"zh":"周末去新加坡看{H}，顺便买零件，一举两得。","py":"Zhōumò qù Xīnjiāpō kàn {H}, shùnbiàn mǎi língjiàn, yì jǔ liǎng dé.","ko":"주말에 싱가포르 가서 {H}도 보고 부품도 사고, 일석이조야."}}],[{"x":"松弛感","py":"sōngchígǎn","ko":"여유로움, 느긋한 태도","why":"2022년 유행, 조급하지 않은 태도를 칭찬. 어디서나 OK.","ex":{"zh":"我很羡慕你身上的松弛感。","py":"Wǒ hěn xiànmù nǐ shēnshang de sōngchígǎn.","ko":"너의 그 여유로운 분위기가 부러워."}},{"x":"鸡毛蒜皮","py":"jī máo suàn pí","ko":"시시콜콜한 일","why":"닭털과 마늘 껍질처럼 하찮은 거야. 사소한 일로 다툴 때 '별것도 아닌 일'로 써.","ex":{"zh":"别为这种鸡毛蒜皮的小事吵了。","py":"Bié wèi zhè zhǒng jī máo suàn pí de xiǎoshì chǎo le.","ko":"이런 시시콜콜한 일로 싸우지 말자."}}],[{"x":"班味","py":"bānwèir","ko":"직장인 찌든 티","why":"2024년 유행, 출근에 찌든 기운. 동료·친구 OK.","ex":{"zh":"周末去海边，把班味洗掉。","py":"Zhōumò qù hǎibiān, bǎ bānwèir xǐdiào.","ko":"주말에 바다 가서 직장인 찌든 때 씻어내자."}},{"x":"一五一十","py":"yī wǔ yī shí","ko":"하나도 빠짐없이","why":"하나, 다섯, 열 하고 숫자 세듯 차근차근이라는 거야. 사실대로 전부 털어놓을 때 써.","ex":{"zh":"我把事故经过一五一十地告诉了老板。","py":"Wǒ bǎ shìgù jīngguò yī wǔ yī shí de gàosule lǎobǎn.","ko":"사고 경위를 사장님께 하나도 빠짐없이 말씀드렸어."}}],[{"x":"显眼包","py":"xiǎnyǎnbāo","ko":"관종, 튀는 사람(귀엽게)","why":"2023년 유행, 장난스럽게 눈에 띄는 사람. 친한 사이만 OK.","ex":{"zh":"你穿这件衣服去公司，真是显眼包。","py":"Nǐ chuān zhè jiàn yīfu qù gōngsī, zhēn shì xiǎnyǎnbāo.","ko":"그 옷 입고 회사 가면 완전 튀겠다."}},{"x":"不管三七二十一","py":"bù guǎn sān qī èrshíyī","ko":"앞뒤 안 가리고","why":"3×7=21 같은 계산도 안 따진다는 거야. 따지지 않고 일단 저지를 때 써.","ex":{"zh":"他不管三七二十一，直接把机器拆了。","py":"Tā bù guǎn sān qī èrshíyī, zhíjiē bǎ jīqì chāi le.","ko":"걔는 앞뒤 안 가리고 기계를 바로 뜯어 버렸어."}}],[{"x":"嘴替","py":"zuǐtì","ko":"내 말 대신해주는 사람","why":"‘嘴巴替身’ 줄임말. 친구·동료 OK.","ex":{"zh":"你说得太对了，你就是我的嘴替！","py":"Nǐ shuō de tài duì le, nǐ jiù shì wǒ de zuǐtì!","ko":"완전 맞는 말이야, 내 말 대신 해줬네!"}},{"x":"热锅上的蚂蚁","py":"rè guō shang de mǎyǐ","ko":"발을 동동 구르다","why":"달군 솥 위의 개미처럼 안절부절이야. 보통 '急得像…' 형태로 써.","ex":{"zh":"护照找不到，我急得像热锅上的蚂蚁。","py":"Hùzhào zhǎo bu dào, wǒ jí de xiàng rè guō shang de mǎyǐ.","ko":"여권을 못 찾아서 발을 동동 굴렀어."}}],[{"x":"电子榨菜","py":"diànzǐ zhàcài","ko":"밥 먹으며 보는 영상","why":"밥반찬(榨菜)처럼 식사 때 보는 콘텐츠. 친구 OK.","ex":{"zh":"吃饭的时候没有电子榨菜，我吃不下。","py":"Chīfàn de shíhou méiyǒu diànzǐ zhàcài, wǒ chī bú xià.","ko":"밥 먹을 때 볼 영상 없으면 밥이 안 넘어가."}},{"x":"捏一把汗","py":"niē yì bǎ hàn","ko":"손에 땀을 쥐다","why":"땀을 한 움큼 쥘 정도로 긴장한다는 거야. 남 걱정하며 조마조마할 때 '替…捏一把汗'으로 써.","ex":{"zh":"新线第一次试车，大家都捏了一把汗。","py":"Xīn xiàn dì yī cì shì chē, dàjiā dōu niēle yì bǎ hàn.","ko":"새 라인 첫 시운전 때 다들 손에 땀을 쥐었어."}}],[{"x":"下饭","py":"xiàfàn","ko":"밥도둑 / 밥 먹으며 보기 좋은","why":"음식뿐 아니라 영상·예능에도 씀. 누구에게나 OK.","ex":{"zh":"这个综艺特别下饭。","py":"Zhège zōngyì tèbié xiàfàn.","ko":"이 예능 밥 먹으면서 보기 딱 좋아."}},{"x":"赶鸭子上架","py":"gǎn yāzi shàng jià","ko":"억지로 떠맡다","why":"오리를 횃대 위에 억지로 올리는 그림이야. 능력 밖 일을 떠밀려 할 때 써.","ex":{"zh":"让我用中文做报告，真是赶鸭子上架。","py":"Ràng wǒ yòng Zhōngwén zuò bàogào, zhēn shì gǎn yāzi shàng jià.","ko":"나더러 중국어로 발표하라니, 완전 억지로 떠밀린 거야."}}],[{"x":"人间清醒","py":"rénjiān qīngxǐng","ko":"현실 감각 뛰어난 사람","why":"연애·돈에 휘둘리지 않는 사람을 칭찬. 어디서나 OK.","ex":{"zh":"我妈说‘先存钱再买车’，真是人间清醒。","py":"Wǒ mā shuō ‘xiān cúnqián zài mǎi chē’, zhēn shì rénjiān qīngxǐng.","ko":"엄마가 ‘돈 먼저 모으고 차 사라’고 했어, 진짜 현실적이야."}},{"x":"换汤不换药","py":"huàn tāng bú huàn yào","ko":"이름만 바꾼 똑같은 것","why":"탕만 바꾸고 약재는 그대로라는 거야. 겉만 바뀌고 본질은 같을 때 비꼬며 써.","ex":{"zh":"新流程只是换汤不换药，问题还在。","py":"Xīn liúchéng zhǐshì huàn tāng bú huàn yào, wèntí hái zài.","ko":"새 프로세스는 이름만 바꾼 거라 문제는 그대로야."}}],[{"x":"高情商","py":"gāo qíngshāng","ko":"센스 있는 말, 눈치 빠름","why":"‘高情商回复’ 밈으로 유행. 칭찬으로 OK, 동료와 고객 대응 연습할 때 유용.","ex":{"zh":"高情商的说法：这个价格很有诚意。","py":"Gāo qíngshāng de shuōfǎ: zhège jiàgé hěn yǒu chéngyì.","ko":"센스 있게 말하면: 이 가격은 성의가 담겼네요."}},{"x":"睁一只眼闭一只眼","py":"zhēng yì zhī yǎn bì yì zhī yǎn","ko":"눈감아 주다","why":"한쪽 눈은 뜨고 한쪽은 감는 거야. 알면서도 모른 척 넘어갈 때 써.","ex":{"zh":"这点小错误，老板睁一只眼闭一只眼就过去了。","py":"Zhè diǎn xiǎo cuòwù, lǎobǎn zhēng yì zhī yǎn bì yì zhī yǎn jiù guòqù le.","ko":"이 정도 작은 실수는 사장님이 눈감아 주고 넘어가셨어."}}],[{"x":"主打一个","py":"zhǔdǎ yí gè","ko":"핵심은 바로 ~","why":"‘主打一个陪伴’ 식으로 2023년 유행. 친구 OK.","ex":{"zh":"我的周末主打一个睡觉。","py":"Wǒ de zhōumò zhǔdǎ yí gè shuìjiào.","ko":"내 주말 핵심은 잠이야."}},{"x":"打马虎眼","py":"dǎ mǎhuyǎn","ko":"얼렁뚱땅 넘기다","why":"대충대충(马虎)으로 눈을 속인다는 거야. 모르는 척 대충 둘러댈 때 써.","ex":{"zh":"别跟我打马虎眼，交期到底是哪天？","py":"Bié gēn wǒ dǎ mǎhuyǎn, jiāoqī dàodǐ shì nǎ tiān?","ko":"얼렁뚱땅 넘어가지 말고, 납기가 정확히 언제예요?"}}],[{"x":"精神状态","py":"jīngshén zhuàngtài","ko":"멘탈 상태(농담)","why":"‘精神状态堪忧’처럼 정신줄 상태를 농담으로 표현. 친구·동료 OK.","ex":{"zh":"连续加班一周，我的精神状态很美丽。","py":"Liánxù jiābān yì zhōu, wǒ de jīngshén zhuàngtài hěn měilì.","ko":"일주일 연속 야근했더니 멘탈 상태가 아주 아름다워."}},{"x":"敲竹杠","py":"qiāo zhúgàng","ko":"바가지 씌우다","why":"대나무 막대를 두드려 돈을 뜯어내던 데서 왔어. 약점 잡아 비싸게 받는 걸 말해.","ex":{"zh":"这家修车行敲竹杠，换个轮胎要五百块。","py":"Zhè jiā xiū chē háng qiāo zhúgàng, huàn ge lúntāi yào wǔbǎi kuài.","ko":"이 정비소 바가지야, 타이어 하나 가는 데 500링깃이래."}}],[{"x":"发疯文学","py":"fāfēng wénxué","ko":"미친 척 과장 화법","why":"일부러 과장되게 분노·하소연하는 글. 친한 친구·연인 채팅에서만 OK.","ex":{"zh":"你再不回我消息，我就要开始发疯文学了！","py":"Nǐ zài bù huí wǒ xiāoxi, wǒ jiù yào kāishǐ fāfēng wénxué le!","ko":"계속 답장 안 하면 나 미친 척 장문 보낸다!"}},{"x":"抬杠","py":"tái gàng","ko":"말꼬리 잡다, 괜히 반박하다","why":"막대를 맞들고 서로 버티는 그림이야. 쓸데없이 말싸움 거는 걸 말해.","ex":{"zh":"{H}，我不是跟你抬杠，只是说说我的想法。","py":"{H}, wǒ bú shì gēn nǐ tái gàng, zhǐshì shuōshuo wǒ de xiǎngfǎ.","ko":"{H}, 너한테 말꼬리 잡는 게 아니라 내 생각 말하는 거야."}}],[{"x":"特种兵旅游","py":"tèzhǒngbīng lǚyóu","ko":"강행군 여행","why":"짧은 시간에 최대한 많이 찍는 여행, 2023년 유행. 누구에게나 OK.","ex":{"zh":"两天去了八个景点，这是特种兵旅游吧。","py":"Liǎng tiān qù le bā gè jǐngdiǎn, zhè shì tèzhǒngbīng lǚyóu ba.","ko":"이틀에 명소 여덟 곳, 이건 완전 강행군 여행이지."}},{"x":"钻牛角尖","py":"zuān niújiǎojiān","ko":"사소한 데 집착하다","why":"소뿔 끝 좁은 데로 파고드는 그림이야. 쓸데없는 문제에 매달려 헤어나지 못할 때 써.","ex":{"zh":"别钻牛角尖了，客户只是随口一说。","py":"Bié zuān niújiǎojiān le, kèhù zhǐshì suíkǒu yì shuō.","ko":"너무 파고들지 마, 고객이 그냥 지나가듯 한 말이야."}}],[{"x":"citywalk","py":"sì tí wò kè","ko":"도시 산책","why":"2023년 유행, 도시를 천천히 걸으며 둘러보는 여행. 보통 영어 그대로 발음. 친구·연인 OK.","ex":{"zh":"{H}，这周末我们在牛车水citywalk吧。","py":"{H}, zhè zhōumò wǒmen zài Niúchēshuǐ citywalk ba.","ko":"{H}, 이번 주말 차이나타운 걸으며 둘러보자."}},{"x":"翻旧账","py":"fān jiùzhàng","ko":"옛날 일 들추다","why":"묵은 장부를 다시 넘기는 거야. 싸울 때 지난 잘못 꺼내는 걸 말해.","ex":{"zh":"吵架就吵现在的事，别翻旧账。","py":"Chǎo jià jiù chǎo xiànzài de shì, bié fān jiùzhàng.","ko":"싸울 땐 지금 일만 얘기하자, 옛날 일 꺼내지 말고."}}],[{"x":"出圈","py":"chūquān","ko":"대중적으로 유명해짐","why":"팬덤 ‘圈子’ 밖까지 퍼짐. 업무 맥락에도 OK.","ex":{"zh":"这首歌火到出圈了。","py":"Zhè shǒu gē huǒ dào chūquān le.","ko":"이 노래 대박 나서 이제 다 알아."}},{"x":"哪壶不开提哪壶","py":"nǎ hú bù kāi tí nǎ hú","ko":"아픈 데를 건드리다","why":"안 끓은 주전자만 골라 든다는 거야. 하필 남이 피하고 싶은 얘기를 꺼낼 때 써.","ex":{"zh":"过年亲戚又问我工资，真是哪壶不开提哪壶。","py":"Guò nián qīnqi yòu wèn wǒ gōngzī, zhēn shì nǎ hú bù kāi tí nǎ hú.","ko":"명절에 친척이 또 월급 물어봐, 꼭 아픈 데만 건드려."}}],[{"x":"破圈","py":"pòquān","ko":"타깃 밖으로 확장","why":"마케팅에서도 쓰며 出圈보다 ‘장벽 깨기’ 뉘앙스. 회의에서도 OK.","ex":{"zh":"我们的产品要破圈，就得做短视频。","py":"Wǒmen de chǎnpǐn yào pòquān, jiù děi zuò duǎn shìpín.","ko":"우리 제품이 확장하려면 숏폼을 해야 해."}},{"x":"丢三落四","py":"diū sān là sì","ko":"깜빡깜빡 잘 잊다","why":"셋 잃고 넷 빠뜨린다는 거야. 물건을 자주 흘리고 다니는 사람을 말해(落는 là로 읽어).","ex":{"zh":"我出门老丢三落四，今天又忘带门卡。","py":"Wǒ chū mén lǎo diū sān là sì, jīntiān yòu wàng dài ménkǎ.","ko":"나 나갈 때마다 깜빡해, 오늘 또 출입카드 두고 왔어."}}],[{"x":"遥遥领先","py":"yáoyáo lǐngxiān","ko":"압도적 1등","why":"화웨이 발표회 밈으로 2023년 유행. 농담 섞인 칭찬 OK.","ex":{"zh":"你的Excel技能遥遥领先！","py":"Nǐ de Excel jìnéng yáoyáo lǐngxiān!","ko":"너 엑셀 실력 압도적이다!"}},{"x":"心直口快","py":"xīn zhí kǒu kuài","ko":"솔직하고 직설적이다","why":"마음이 곧아 말이 바로 나온다는 성어야. 악의 없이 직설적인 사람을 좋게 말할 때 써.","ex":{"zh":"她心直口快，说话不太好听，但人很好。","py":"Tā xīn zhí kǒu kuài, shuō huà bú tài hǎotīng, dàn rén hěn hǎo.","ko":"그 사람은 직설적이라 말은 좀 세도 사람은 좋아."}}],[{"x":"栓Q","py":"shuān kiù","ko":"땡큐(어이없음)","why":"광시 영어 선생님 영상의 ‘Thank you’ 발음. 반어적이라 친구 OK, 사장님·고객 X.","ex":{"zh":"又要周末加班，栓Q了。","py":"Yòu yào zhōumò jiābān, shuān kiù le.","ko":"또 주말 출근이래, 땡큐다 아주."}},{"x":"眼红","py":"yǎnhóng","ko":"배 아파하다, 샘내다","why":"질투로 눈이 빨개진다는 거야. 남이 잘되는 걸 부러워하거나 시기할 때 써.","ex":{"zh":"同事升职了，有人眼红得不得了。","py":"Tóngshì shēng zhí le, yǒu rén yǎnhóng de bùdéliǎo.","ko":"동료가 승진하니까 엄청 배 아파하는 사람이 있어."}}],[{"x":"芭比Q了","py":"bābǐ kiù le","ko":"망했다","why":"BBQ(다 타버렸다)에서 유래, 2022년 유행. 친구 OK.","ex":{"zh":"文件没保存，电脑死机，芭比Q了。","py":"Wénjiàn méi bǎocún, diànnǎo sǐjī, bābǐ kiù le.","ko":"파일 저장 안 했는데 컴퓨터 멈춤, 망했다."}},{"x":"铁饭碗","py":"tiě fànwǎn","ko":"철밥통, 평생직장","why":"깨지지 않는 쇠 밥그릇이야. 공무원처럼 안정적인 직장을 말해.","ex":{"zh":"我爸一直希望我找个铁饭碗。","py":"Wǒ bà yìzhí xīwàng wǒ zhǎo ge tiě fànwǎn.","ko":"아빠는 늘 내가 철밥통 직장 구하길 바라셔."}}],[{"x":"爷青回","py":"yé qīng huí","ko":"내 청춘이 돌아왔다","why":"‘爷的青春回来了’ 줄임. 추억의 것이 다시 나올 때. 친구 OK.","ex":{"zh":"周杰伦要开演唱会了？爷青回！","py":"Zhōu Jiélún yào kāi yǎnchànghuì le? Yé qīng huí!","ko":"주걸륜 콘서트 한다고? 내 청춘 돌아왔다!"}},{"x":"夜猫子","py":"yèmāozi","ko":"올빼미족","why":"밤에 활동하는 올빼미를 뜻해. 늦게 자는 사람을 귀엽게 놀릴 때 써.","ex":{"zh":"{H}是个夜猫子，每天凌晨一点才睡。","py":"{H} shì ge yèmāozi, měi tiān língchén yī diǎn cái shuì.","ko":"{H}는 올빼미라 매일 새벽 1시에야 자."}}],[{"x":"夺笋","py":"duó sǔn","ko":"너무하다, 짓궂다","why":"‘多损啊’ 발음 장난. 친구끼리 농담 OK.","ex":{"zh":"你笑我中文口音？你夺笋啊！","py":"Nǐ xiào wǒ Zhōngwén kǒuyīn? Nǐ duó sǔn a!","ko":"내 중국어 발음 비웃어? 너무하네!"}},{"x":"落汤鸡","py":"luòtāngjī","ko":"물에 빠진 생쥐","why":"끓는 물에 빠진 닭 꼴이야. 비 쫄딱 맞았을 때 쓰는 말이야.","ex":{"zh":"下午突然下大雨，我淋成了落汤鸡。","py":"Xiàwǔ tūrán xià dà yǔ, wǒ línchéngle luòtāngjī.","ko":"오후에 갑자기 폭우가 와서 물에 빠진 생쥐 꼴이 됐어."}}],[{"x":"一键三连","py":"yí jiàn sān lián","ko":"좋아요·코인·즐겨찾기 한 번에","why":"빌리빌리에서 유래. 영상 칭찬·농담으로 OK.","ex":{"zh":"这个视频做得好，一键三连！","py":"Zhège shìpín zuò de hǎo, yí jiàn sān lián!","ko":"이 영상 잘 만들었다, 좋아요 구독 다 눌러!"}},{"x":"老掉牙","py":"lǎo diào yá","ko":"구닥다리","why":"너무 늙어서 이가 빠졌다는 거야. 낡은 물건이나 진부한 얘기를 말해.","ex":{"zh":"这台电脑老掉牙了，该换了。","py":"Zhè tái diànnǎo lǎo diào yá le, gāi huàn le.","ko":"이 컴퓨터 너무 구닥다리야, 바꿀 때 됐어."}}],[{"x":"气氛组","py":"qìfēnzǔ","ko":"분위기 메이커","why":"원래 가게 분위기 띄우는 바람잡이에서 유래. 회식·모임에서 OK.","ex":{"zh":"年会你就负责当气氛组。","py":"Niánhuì nǐ jiù fùzé dāng qìfēnzǔ.","ko":"송년회에서 넌 분위기 메이커 담당해."}},{"x":"有眼不识泰山","py":"yǒu yǎn bù shí Tài Shān","ko":"몰라봬서 죄송합니다","why":"눈이 있어도 태산을 못 알아본다는 거야. 상대가 대단한 사람인 걸 뒤늦게 알았을 때 정중히 써.","ex":{"zh":"原来您是工厂创始人，我真是有眼不识泰山。","py":"Yuánlái nín shì gōngchǎng chuàngshǐrén, wǒ zhēn shì yǒu yǎn bù shí Tài Shān.","ko":"공장 창업자셨군요, 제가 몰라뵀습니다."}}],[{"x":"City不City","py":"sì tí bù sì tí","ko":"세련됐어? 도시적이야?","why":"2024년 외국인 유튜버 밈에서 유행. 가벼운 농담, 친구·연인 OK.","ex":{"zh":"新山的新商场，City不City？","py":"Xīnshān de xīn shāngchǎng, sì tí bù sì tí?","ko":"조호바루 새 쇼핑몰, 시티하지 않아?"}},{"x":"开门见山","py":"kāi mén jiàn shān","ko":"단도직입적으로","why":"문을 열자마자 산이 보인다는 성어야. 본론부터 바로 말할 때 써.","ex":{"zh":"我就开门见山了，这次报价能不能降百分之五？","py":"Wǒ jiù kāi mén jiàn shān le, zhè cì bàojià néng bu néng jiàng bǎi fēn zhī wǔ?","ko":"단도직입적으로 말씀드릴게요, 이번 견적 5% 낮춰 주실 수 있나요?"}}],[{"x":"尊嘟假嘟","py":"zūn dū jiǎ dū","ko":"진짜야 가짜야?(애교)","why":"‘真的假的’를 귀엽게 발음. 연인·친한 친구 사이만 OK.","ex":{"zh":"{H}，你说你想我，尊嘟假嘟？","py":"{H}, nǐ shuō nǐ xiǎng wǒ, zūn dū jiǎ dū?","ko":"{H}, 나 보고 싶다고? 진짜야 가짜야?"}},{"x":"对牛弹琴","py":"duì niú tán qín","ko":"소귀에 경 읽기","why":"소 앞에서 거문고를 탄다는 성어야. 말해도 못 알아듣는 상대에게 써, 대놓고 쓰면 실례야.","ex":{"zh":"跟他讲安全规定简直是对牛弹琴。","py":"Gēn tā jiǎng ānquán guīdìng jiǎnzhí shì duì niú tán qín.","ko":"걔한테 안전 규정 얘기하는 건 완전 소귀에 경 읽기야."}}],[{"x":"泰酷辣","py":"tài kù là","ko":"너무 멋지다","why":"‘太酷啦’ 발음 장난, 2023년 유행. 친구·연인 OK, 어른 앞 X.","ex":{"zh":"你开新车来接我？泰酷辣！","py":"Nǐ kāi xīn chē lái jiē wǒ? Tài kù là!","ko":"새 차 끌고 데리러 왔어? 완전 멋져!"}},{"x":"画蛇添足","py":"huà shé tiān zú","ko":"사족, 괜한 짓","why":"뱀을 그리고 다리까지 붙인다는 성어야. 쓸데없이 덧붙여 오히려 망칠 때 써.","ex":{"zh":"报告已经很清楚了，再加图表就画蛇添足了。","py":"Bàogào yǐjīng hěn qīngchu le, zài jiā túbiǎo jiù huà shé tiān zú le.","ko":"보고서 이미 깔끔해, 차트 더 넣으면 사족이야."}}],[{"x":"退退退","py":"tuì tuì tuì","ko":"물러가라!(액운 쫓기)","why":"2022년 영상에서 유행. 불운·싫은 걸 장난스럽게 쫓을 때 OK.","ex":{"zh":"感冒退退退！明天还要上班。","py":"Gǎnmào tuì tuì tuì! Míngtiān hái yào shàngbān.","ko":"감기야 물러가라! 내일 출근해야 돼."}},{"x":"井底之蛙","py":"jǐng dǐ zhī wā","ko":"우물 안 개구리","why":"우물 바닥 개구리는 하늘이 동그란 줄만 알지. 견문이 좁은 걸 말하고, 자기 반성할 때도 써.","ex":{"zh":"出国工作以后，才发现以前的自己是井底之蛙。","py":"Chū guó gōngzuò yǐhòu, cái fāxiàn yǐqián de zìjǐ shì jǐng dǐ zhī wā.","ko":"해외에서 일하고 나서야 예전의 내가 우물 안 개구리였다는 걸 알았어."}}]];
const PER = 20, KEY = 'hsk4-day-v1';
const NDAY = Math.ceil(WORDS.length / PER);
const byId = Object.fromEntries(WORDS.map(w=>[w.id,w]));
const DEF_NAME = ['小美','Xiǎoměi','샤오메이'];
let S = {days:{}, wrong:[], saved:[], name:DEF_NAME[0], namePy:DEF_NAME[1], nameKo:DEF_NAME[2]};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)||'{}')); } catch(e){}
if (!Array.isArray(S.saved)) S.saved = [];
S.saved = S.saved.map(k=> typeof k==='number' ? k+':0' : String(k));
const exList = w => Array.isArray(w.ex) ? w.ex : (w.ex ? [w.ex] : []);
const isSaved = k => S.saved.includes(k);
function toggleSave(k){ if (isSaved(k)) S.saved = S.saved.filter(x=>x!==k); else S.saved.unshift(k); save(); toast(isSaved(k)?'예문 저장했어':'저장 취소했어'); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const dayWords = d => WORDS.slice((d-1)*PER, d*PER);
const app = document.getElementById('app');
const lock = on => document.documentElement.classList.toggle('locked', !!on);
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600);}

/* 음성 */
let zhVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(t){
  const cap = window.Capacitor, tts = cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.TextToSpeech;
  if (tts) { tts.stop().catch(()=>{}).finally(()=>tts.speak({text:t, lang:'zh-CN', rate:0.9}).catch(()=>toast('중국어 음성을 못 찾았어. 설정 > 텍스트 음성 변환에서 중국어를 설치해줘'))); return; }
  try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;if(zhVoice)u.voice=zhVoice;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){toast('이 브라우저는 음성 재생이 안 돼');}}

const fillZh = s => String(s||'').split('{H}').join(S.name);
const fillPy = s => String(s||'').split('{H}').join(S.namePy);
const hasBatchim = t => { const c=(t||'').charCodeAt((t||'').length-1); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28!==0; };
const fillKo = s => { const n=S.nameKo||'', b=hasBatchim(n);
  const P = b ? {'가':'이','는':'은','를':'을','와':'과','랑':'이랑','야':'아'} : {};
  return String(s||'').replace(/\{H\}(가|는|를|와|랑|야)(?![가-힣])/g,(m,p)=> n + (b ? (P[p]||p) : p)).split('{H}').join(n); };

/* ---------- 홈 ---------- */
function home(){
  lock(false);
  const doneN = Object.values(S.days).filter(d=>d.best!=null).length;
  let next = 1; while(next<=NDAY && S.days[next] && S.days[next].best!=null) next++;
  const tiles = d => { const st=S.days[d]||{}; const cls = st.best!=null?'done':(d===next?'next':'');
    const label = st.best!=null ? `시험 ${st.best}/${PER}` : st.learned ? '암기 완료 · 시험 전' : (d===next?'오늘 할 차례':'시작 전');
    return `<button class="day ${cls}" data-d="${d}"><b>Day ${d}</b><small>${label}</small></button>`; };
  const sect = (a,b,t) => b>=a ? `<div class="sect">${t}</div><div class="days">${Array.from({length:b-a+1},(_,i)=>tiles(a+i)).join('')}</div>` : '';
  const n4end = Math.ceil(WORDS.filter(w=>w.g!=='o').length/PER);
  const learnedDays = Object.keys(S.days).map(Number).filter(d=>S.days[d].learned).sort((a,b)=>a-b);
  const pool = learnedDays.flatMap(dayWords);
  const lastDay = learnedDays.length ? learnedDays[learnedDays.length-1] : 0;
  const nextSt = S.days[next]||{};
  app.innerHTML = `
    <div class="hrow"><h1>HSK4 단어장</h1><button class="gear" id="gear" aria-label="설정 · 백업">⚙</button></div>
    ${next<=NDAY ? `<div class="hero">
      <div><div class="sect" style="margin:0">오늘 할 차례</div><div class="hd">Day ${next}</div>
      <div class="sub" style="margin:0">${nextSt.learned?'암기 끝 · 시험만 남았어':'새 단어 '+dayWords(next).length+'개'}</div></div>
      <button class="btn primary" id="todayGo">${nextSt.learned?'이어서 하기':'시작'}</button></div>` : `<div class="hero"><div class="hd">84 Day 완주!</div></div>`}
    <div class="rev">
      <div class="revt"><b>누적 시험</b><span>${pool.length ? `지금까지 배운 ${pool.length}단어 (Day ${learnedDays.length===lastDay?'1~'+lastDay:learnedDays.join(', ')})에서 출제` : 'Day 하나 끝내면 열려'}</span></div>
      <div class="cnt" role="group" aria-label="문제 수">${[10,20,30,50].map(n=>`<button data-n="${n}" ${pool.length?'':'disabled'} aria-pressed="${n===20}">${n}</button>`).join('')}
        <input id="cntIn" type="number" min="1" max="${pool.length||1}" placeholder="직접" aria-label="문제 수 직접 입력" ${pool.length?'':'disabled'}></div>
      <button class="btn primary wide" id="revGo" ${pool.length?'':'disabled'}>누적 시험 보기</button>
    </div>
    <div class="wrongbox"><div>오답노트 <b>${S.wrong.length}</b><div class="sub" style="margin:0">틀린 단어만 다시 외우고 다시 시험</div></div>
      <button class="btn ${S.wrong.length?'soft':''}" id="wrongGo" ${S.wrong.length?'':'disabled'}>복습</button></div>
    <div class="wrongbox"><div>저장한 예문 <b style="color:var(--jade)">${S.saved.length}</b><div class="sub" style="margin:0">카드에서 ☆ 누른 예문 모음</div></div>
      <button class="btn" id="savedGo" ${S.saved.length?'':'disabled'}>보기</button></div>
    <details class="alldays"><summary>Day 전체 보기 · 지난 Day 다시 하기</summary>
      ${sect(1, Math.min(n4end,NDAY), '신 4급 · 시험 잘 나오는 순서')}
      ${sect(n4end+1, NDAY, '1~3급 기초 다지기')}
    </details>
    <div class="set" id="setBox" hidden><b>설정 · 백업</b>
      <label for="nm">예문 속 여자친구 이름 (한자 / 병음 / 한글)</label>
      <div class="row"><input id="nm" value="${esc(S.name)}"><input id="nmp" value="${esc(S.namePy)}"><input id="nmk" value="${esc(S.nameKo)}"></div>
      <button class="btn" id="nmSave">이름 저장</button>
      <label for="bk">진도는 이 브라우저에만 저장돼. 다른 기기로 옮기려면 이 코드를 복사해서 거기 붙여넣고 불러오기.</label>
      <textarea id="bk">${esc(JSON.stringify(S))}</textarea>
      <div class="row"><button class="btn" id="bc">코드 복사</button><button class="btn" id="bl">불러오기</button></div>
    </div>`;
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>learn({kind:'day',d:+b.dataset.d}));
  gear.onclick=()=>{setBox.hidden=!setBox.hidden; if(!setBox.hidden) setBox.scrollIntoView({behavior:'smooth'});};
  const tg=document.getElementById('todayGo'); if(tg) tg.onclick=()=>learn({kind:'day',d:next});
  let cnt = Math.min(20, pool.length);
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{cnt=Math.min(+b.dataset.n,pool.length);cntIn.value='';app.querySelectorAll('[data-n]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  cntIn.oninput=()=>{const v=parseInt(cntIn.value,10); if(v>0){cnt=Math.min(v,pool.length);app.querySelectorAll('[data-n]').forEach(x=>x.setAttribute('aria-pressed','false'));}};
  revGo.onclick=()=>{ if(!pool.length) return; test({kind:'review'}, shuffle(pool.slice()).slice(0,Math.max(1,cnt))); };
  document.getElementById('wrongGo').onclick=()=>learn({kind:'wrong'});
  document.getElementById('savedGo').onclick=savedView;
  document.getElementById('nmSave').onclick=()=>{S.name=nm.value.trim()||DEF_NAME[0];S.namePy=nmp.value.trim();S.nameKo=nmk.value.trim();save();toast('저장했어');};
  document.getElementById('bc').onclick=async()=>{try{await navigator.clipboard.writeText(bk.value);toast('복사했어');}catch(e){bk.select();toast('선택해놨어, 직접 복사해');}};
  document.getElementById('bl').onclick=()=>{try{const o=JSON.parse(bk.value);if(!o||typeof o!=='object'||!o.days)throw 0;S=Object.assign({days:{},wrong:[],saved:[],name:S.name,namePy:S.namePy,nameKo:S.nameKo},o);S.saved=(S.saved||[]).map(k=>typeof k==='number'?k+':0':String(k));save();home();toast('불러왔어');}catch(e){toast('코드 형식이 안 맞아');}};
  window.scrollTo(0,0);
}

/* ---------- 카드 암기 ---------- */
function exprCard(x, tag){
  const zh=fillZh(x.ex.zh);
  return `<div class="ex memo"><div class="tagx">${tag}</div>
    <div class="xh">${esc(x.x)} <span>${esc(x.py)}</span></div>
    <div class="mean" style="font-size:1.05rem">${esc(x.ko)}</div>
    <div class="why">${esc(x.why)}</div>
    <div class="zh" style="margin-top:6px">${esc(zh)}</div><div class="epy">${esc(fillPy(x.ex.py))}</div><div class="eko">${esc(fillKo(x.ex.ko))}</div>
    <button data-sayx="${esc(zh)}" aria-label="예문 듣기">🔊</button></div>`;
}
function intro(d){
  const xs = EXPR[d-1] || [];
  if (!xs.length) return learn({kind:'day', d, noIntro:true});
  app.innerHTML = `
    <div class="top"><button class="back" id="back" aria-label="홈으로">←</button><b>Day ${d} · 오늘의 표현</b></div>
    <div style="display:grid;gap:12px">${xs.map((x,i)=>exprCard(x, i===0?'신조어':'재밌는 표현')).join('')}</div>
    <button class="btn primary wide" id="startW" style="margin-top:14px">단어 ${dayWords(d).length}개 외우러 가기</button>`;
  back.onclick=home;
  app.querySelectorAll('[data-sayx]').forEach(b=>b.onclick=()=>speak(b.dataset.sayx));
  startW.onclick=()=>learn({kind:'day', d, noIntro:true});
  window.scrollTo(0,0);
}
function learn(set){
  const words = set.kind==='day' ? dayWords(set.d) : S.wrong.map(id=>byId[id]).filter(Boolean);
  const title = set.kind==='day' ? `Day ${set.d}` : '오답노트';
  let queue = words.slice(), known = 0, shown = false, exi = 0, hist = [];
  const goPrev = () => { if(!hist.length) return; const h=hist.pop();
    if (h.known) known--; else { const i=queue.lastIndexOf(h.w); if(i>0) queue.splice(i,1); }
    queue.unshift(h.w); shown=false; exi=0; render(); };
  const goNext = () => { if(queue.length<2) return; hist.push({w:queue[0],known:false}); queue.push(queue.shift()); shown=false; exi=0; render(); };
  function render(){
    if (!queue.length){ lock(false); return ready(); }
    lock(true);
    const w = queue[0];
    const exs = exList(w); const ex = exs[exi % (exs.length||1)] || {}; const skey = `${w.id}:${exi % (exs.length||1)}`;
    const zh = fillZh(ex.zh);
    const zhMarked = esc(zh).split(esc(w.w)).join(`<mark>${esc(w.w)}</mark>`);
    app.innerHTML = `
      <div class="top"><button class="back" id="back" aria-label="홈으로">←</button><b>${title} 외우기</b><span>${known} / ${words.length}</span></div>
      <div class="bar"><i style="width:${known/words.length*100}%"></i></div>
      <div class="card study">
        <button class="nav l" id="prevW" aria-label="이전 단어" ${hist.length?'':'disabled'}>‹</button>
        <button class="nav r" id="nextW" aria-label="다음 단어" ${queue.length>1?'':'disabled'}>›</button>
        <div class="sbody ${shown?'open':''}">
        <div class="tian" id="flip" tabindex="0" aria-label="${shown?"한자 풀이 보기":"뜻 보기"}"><div class="han">${esc(w.w)}</div></div>
        ${shown ? `<div class="reveal">
          <div><div class="py">${esc(w.p)}</div><div class="mean">${esc(w.ko)}<span class="pos">${esc(w.k||'')}</span></div></div>
          ${ex.zh?`<div class="ex"><div class="extag">${["내 상황","자주 쓰는 구문","다른 예문"][exi%exs.length]||"예문"}</div><div class="zh">${zhMarked}</div><div class="epy">${esc(fillPy(ex.py))}</div><div class="eko">${esc(fillKo(ex.ko))}</div>
            ${ex.pat?`<div class="pat">${esc(ex.pat)}</div>`:""}
            <button id="sayEx" aria-label="예문 듣기">🔊</button></div>
            <div class="extools">${exs.length>1?`<button id="nextEx" class="star">↻ ${["자주 쓰는 구문 보기","다른 예문 보기","내 상황으로"][exi%exs.length]} ${exi%exs.length+1}/${exs.length}</button>`:''}
            <button id="saveEx" class="star" aria-pressed="${isSaved(skey)}" aria-label="예문 저장">${isSaved(skey)?'★ 저장됨':'☆ 저장'}</button></div>`:''}
        </div>` : ``}
        </div>
        <div class="row">
          <button class="btn say" id="say" aria-label="단어 발음">🔊</button>
          ${shown ? `<button class="btn soft" id="again">헷갈려</button><button class="btn primary" id="got">알아</button>`
                  : `<button class="btn primary" id="show">뜻 보기</button>`}
        </div>
      </div>`;
    back.onclick = home;
    prevW.onclick = goPrev; nextW.onclick = goNext;
    flip.onclick = ()=>{ if (shown) hanjaPop(w); else { shown=true; render(); } };
    const mk = app.querySelector('.ex mark'); if (mk) { mk.tabIndex=0; mk.setAttribute('role','button'); mk.onclick=()=>hanjaPop(w); }
    say.onclick = ()=>speak(w.w);
    if (shown){
      const se=document.getElementById('sayEx'); if(se) se.onclick=()=>speak(zh);
      const sv=document.getElementById('saveEx'); if(sv) sv.onclick=()=>{toggleSave(skey);render();};
      const nx=document.getElementById('nextEx'); if(nx) nx.onclick=()=>{exi++;render();};
      again.onclick=()=>{hist.push({w,known:false});queue.push(queue.shift());shown=false;exi=0;render();};
      got.onclick=()=>{hist.push({w,known:true});queue.shift();known++;shown=false;exi=0;render();};
    } else show.onclick=()=>{shown=true;render();};
  }
  function ready(){
    if (set.kind==='day'){ S.days[set.d]=Object.assign(S.days[set.d]||{}, {learned:true}); save(); }
    app.innerHTML = `
      <div class="top"><button class="back" id="back" aria-label="홈으로">←</button><b>${title}</b><span>${words.length} / ${words.length}</span></div>
      <div class="card" style="text-align:center">
        <div style="font-size:1.1rem;font-weight:700">${words.length}개 다 외웠어</div>
        <div class="hint">이제 시험 봐. 한자 보고 뜻 고르는 ${words.length}문제야.</div>
        <button class="btn primary wide" id="go">시험 보기</button>
        <button class="btn wide" id="re">한 번 더 외우기</button>
      </div>`;
    back.onclick=home; go.onclick=()=>test(set, words); re.onclick=()=>learn(set);
  }
  window.scrollTo(0,0); render();
}

/* ---------- 한자 풀이 팝업 ---------- */
function hanjaPop(w){
  closePop();
  const el = document.createElement('div'); el.className='pop'; el.id='pop';
  el.innerHTML = `<div class="sheet wsheet" role="dialog" aria-label="${esc(w.w)} 한자 풀이">
    <button class="x" aria-label="닫기">×</button>
    <div class="pw">${esc(w.w)} <span>${esc(w.p)}</span></div>
    <div class="hj">${(w.c||[]).map(c=>`<span><em>${esc(c[1]||c[0])}</em><i>${esc(c[2])}</i></span>`).join('')}</div>
    ${w.why?`<div class="pwhy">${esc(w.why)}</div>`:''}
    <div class="pm">${esc(w.ko)}</div>
    <button class="writebtn" id="wOpen">✍ 획순 · 써보기</button>
    <div id="wslot" class="wslot" hidden></div></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target===el || e.target.classList.contains('x')) closePop(); };
  el.querySelector('#wOpen').onclick = e => { e.target.hidden=true; const sl=el.querySelector('#wslot'); sl.hidden=false; writePop(w, sl); sl.scrollIntoView({behavior:'smooth',block:'start'}); };
}
function closePop(){ const p=document.getElementById('pop'); if(p) p.remove(); }

/* ---------- 획순 · 써보기 ---------- */
const HW_CACHE = {};
function hwDay(w){ return Math.ceil(w.id / PER); }
function loadHW(day){
  if (!HW_CACHE[day]) HW_CACHE[day] = fetch(`hw/d${day}.json`).then(r=>{ if(!r.ok) throw 0; return r.json(); });
  return HW_CACHE[day];
}
function writePop(w, el){
  const chars = [...w.w].filter(c=>/[\u4e00-\u9fff]/.test(c));
  if (typeof HanziWriter==='undefined' || !chars.length){ toast('획순 데이터를 못 불러왔어'); return; }
  let ci = 0, anim = null, quiz = null;
  el.innerHTML = `
    ${chars.length>1?`<div class="wtabs">${chars.map((c,i)=>`<button data-ci="${i}" aria-pressed="${i===0}">${c}</button>`).join('')}</div>`:''}
    <div class="wlabel">획순</div>
    <div class="wrow"><div class="wbox small" id="hwAnim"></div><button class="star" id="hwPlay">▶ 다시 보기</button></div>
    <div class="wlabel">따라 써보기 <span id="hwMsg"></span></div>
    <div class="wbox big" id="hwQuiz"></div>
    <div class="wtools"><button class="star" id="hwHint" aria-pressed="true">흐린 글자 보기</button><button class="star" id="hwRe">다시 쓰기</button></div>`;
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const loader = (c, done, fail) => loadHW(hwDay(w)).then(d=> d[c] ? done(d[c]) : fail()).catch(fail);
  let hint = true;
  function setup(){
    const c = chars[ci];
    el.querySelector('#hwAnim').innerHTML=''; el.querySelector('#hwQuiz').innerHTML=''; el.querySelector('#hwMsg').textContent='';
    anim = HanziWriter.create('hwAnim', c, {width:120,height:120,padding:6,showOutline:true,strokeColor:col('--ink'),outlineColor:col('--line'),
      strokeAnimationSpeed:1.2,delayBetweenStrokes:250,charDataLoader:loader});
    anim.animateCharacter();
    quiz = HanziWriter.create('hwQuiz', c, {width:240,height:240,padding:10,showCharacter:false,showOutline:hint,
      strokeColor:col('--jade'),outlineColor:col('--line'),drawingColor:col('--ink'),highlightColor:col('--mark'),drawingWidth:22,charDataLoader:loader});
    startQuiz();
  }
  function startQuiz(){
    const msg = el.querySelector('#hwMsg'); msg.textContent='';
    quiz.quiz({ showHintAfterMisses:2,
      onMistake: d => { msg.textContent = `${d.strokeNum+1}획 다시`; msg.className='bad'; },
      onCorrectStroke: d => { msg.textContent = `${d.strokeNum+1}/${d.strokeNum+1+d.strokesRemaining}획`; msg.className=''; },
      onComplete: d => { msg.textContent = d.totalMistakes ? `완성! 실수 ${d.totalMistakes}번` : '완벽해!'; msg.className='ok'; } });
  }
  el.querySelector('#hwPlay').onclick = ()=> anim && anim.animateCharacter();
  el.querySelector('#hwRe').onclick = ()=> { quiz.cancelQuiz(); startQuiz(); };
  el.querySelector('#hwHint').onclick = e => { hint=!hint; e.target.setAttribute('aria-pressed',hint); hint?quiz.showOutline():quiz.hideOutline(); };
  el.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{ ci=+b.dataset.ci; el.querySelectorAll('[data-ci]').forEach(x=>x.setAttribute('aria-pressed',x===b)); setup(); });
  setup();
}

/* ---------- 저장한 예문 ---------- */
function savedView(){
  lock(false);
  const items = S.saved.map(k=>{const [id,i]=String(k).split(':').map(Number);const w=byId[id];const x=w&&exList(w)[i||0];return x?{w,x,k}:null;}).filter(Boolean);
  app.innerHTML = `
    <div class="top"><button class="back" id="back" aria-label="홈으로">←</button><b>저장한 예문</b><span>${items.length}개</span></div>
    ${items.length ? `<div style="display:grid;gap:10px">${items.map(({w,x,k})=>{const zh=fillZh(x.zh);return `
      <div class="ex" style="background:var(--surface);border:1px solid var(--line)">
        <div class="zh">${esc(zh).split(esc(w.w)).join(`<mark>${esc(w.w)}</mark>`)}</div>
        <div class="epy">${esc(fillPy(x.py))}</div><div class="eko">${esc(fillKo(x.ko))}</div>
        <div class="why" style="margin-top:4px"><b style="font-family:var(--f-han)">${esc(w.w)}</b> ${esc(w.p)} · ${esc(w.ko)}</div>
        <button data-say="${esc(zh)}" aria-label="예문 듣기">🔊</button>
        <button class="star" data-del="${k}" aria-pressed="true" aria-label="저장 취소">★ 저장됨</button>
      </div>`}).join('')}</div>
      <button class="btn wide" id="copyAll" style="margin-top:14px">전체 복사 (중국어 · 병음 · 한국어)</button>`
    : `<div class="card"><div class="hint">아직 저장한 예문이 없어. 카드에서 ☆ 저장을 눌러봐.</div></div>`}`;
  back.onclick=home;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{toggleSave(b.dataset.del);savedView();});
  const ca=document.getElementById('copyAll');
  if (ca) ca.onclick=async()=>{ const t=items.map(({x})=>`${fillZh(x.zh)}\n${fillPy(x.py)}\n${fillKo(x.ko)}`).join('\n\n');
    try{await navigator.clipboard.writeText(t);toast('전부 복사했어');}catch(e){toast('복사가 막혀 있어, 길게 눌러서 복사해');} };
  window.scrollTo(0,0);
}

/* ---------- 시험 ---------- */
function test(set, words){
  lock(false);
  const title = set.kind==='day' ? `Day ${set.d}` : set.kind==='review' ? '누적' : '오답노트';
  const qs = shuffle(words.slice()).map(w=>{
    const pool = shuffle(WORDS.filter(x=>x.id!==w.id && x.ko!==w.ko && x.w!==w.w));
    const near = pool.filter(x=>x.k && w.k && x.k.split('·')[0]===w.k.split('·')[0]);
    const d = (near.length>=3?near:pool).slice(0,3);
    return {w, opts: shuffle([w,...d]), pick:null};
  });
  let i = 0;
  function render(){
    const q = qs[i];
    app.innerHTML = `
      <div class="top"><button class="back" id="back" aria-label="홈으로">←</button><b>${title} 시험</b><span>${i+1} / ${qs.length}</span></div>
      <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="card">
        <div class="tian" style="cursor:default;min-height:150px"><div class="han">${esc(q.w.w)}</div></div>
        <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${q.pick===k}">${esc(o.ko)}</button>`).join('')}</div>
        <div class="row">
          <button class="btn" id="prev" ${i===0?'disabled':''}>이전</button>
          <button class="btn primary" id="next" ${q.pick==null?'disabled':''}>${i===qs.length-1?'채점하기':'다음'}</button>
        </div>
      </div>`;
    back.onclick=home;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{q.pick=+b.dataset.k;render();});
    prev.onclick=()=>{i--;render();};
    next.onclick=()=>{ if(i<qs.length-1){i++;render();} else grade(); };
  }
  function grade(){
    const wrong = qs.filter(q=>q.opts[q.pick].id!==q.w.id);
    const right = qs.length - wrong.length;
    const wrongIds = new Set(S.wrong);
    wrong.forEach(q=>wrongIds.add(q.w.id));
    if (set.kind==='wrong') qs.filter(q=>q.opts[q.pick].id===q.w.id).forEach(q=>wrongIds.delete(q.w.id));
    S.wrong = [...wrongIds];
    if (set.kind==='day'){ const st=S.days[set.d]||{}; st.learned=true; st.best=Math.max(st.best??0,right); st.last=right; S.days[set.d]=st; }
    save();
    app.innerHTML = `
      <div class="top"><button class="back" id="back" aria-label="홈으로">←</button><b>${title} 채점</b></div>
      <div class="card">
        <div class="score"><b>${right} / ${qs.length}</b>${wrong.length?`틀린 ${wrong.length}개는 오답노트에 들어갔어.`:'전부 맞췄어.'}${set.kind==='wrong'&&right?` 맞춘 ${right}개는 오답노트에서 뺐어.`:''}</div>
        ${wrong.length?`<div class="list">${wrong.map(q=>`<div class="li"><span class="w">${esc(q.w.w)}</span>
          <div class="d"><div>${esc(q.w.p)}</div><div>${esc(q.w.ko)}</div><div><s>${esc(q.opts[q.pick].ko)}</s></div></div></div>`).join('')}</div>`:''}
      </div>
      ${set.kind==='day' && (EXPR[set.d-1]||[]).length ? `
        <div class="reward"><b>🎁 Day ${set.d} 끝낸 보상</b><span>오늘의 표현</span></div>
        <div style="display:grid;gap:12px">${EXPR[set.d-1].map((x,i)=>exprCard(x, i===0?'신조어':'재밌는 표현')).join('')}</div>` : ''}
      <div class="row" style="margin-top:14px">
        ${wrong.length?`<button class="btn soft" id="rw">틀린 것만 다시 외우기</button>`:''}
        <button class="btn primary" id="hm">${set.kind==='day'&&set.d<NDAY?`Day ${set.d+1}로`:'홈으로'}</button>
      </div>`;
    app.querySelectorAll('[data-sayx]').forEach(b=>b.onclick=()=>speak(b.dataset.sayx));
    back.onclick=home;
    const rw=document.getElementById('rw'); if(rw) rw.onclick=()=>learn({kind:'wrong'});
    hm.onclick=()=> (set.kind==='day'&&set.d<NDAY) ? learn({kind:'day',d:set.d+1}) : home();
    window.scrollTo(0,0);
  }
  window.scrollTo(0,0); render();
}

document.addEventListener('keydown',e=>{
  if (e.target.matches('input,textarea')) return;
  if (document.getElementById('pop')) { if (e.key==='Escape' || e.code==='Space') { e.preventDefault(); closePop(); } return; }
  const b = id => { const el=document.getElementById(id); if(el && !el.disabled){ e.preventDefault(); el.click(); return true; } };
  if (e.code==='Space') { b('show') || b('flip'); }
  else if (e.key==='1') { b('again') || (document.querySelectorAll('.opt')[0]||{}).click?.(); }
  else if (e.key==='2') { b('got') || (document.querySelectorAll('.opt')[1]||{}).click?.(); }
  else if (/^[34]$/.test(e.key)) { (document.querySelectorAll('.opt')[+e.key-1]||{}).click?.(); }
  else if (e.key==='Enter') { b('next') || b('go'); }
  else if (e.key==='ArrowLeft') { b('prevW'); }
  else if (e.key==='ArrowRight') { b('nextW'); }
});

home();
</script>
