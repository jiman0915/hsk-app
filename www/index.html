,"許","허락할 허"]],"why":"또(也) 그럴 수 있음(许) → 아마도"},{"id":458,"w":"叶子","p":"yèzi","k":"명","ko":"잎, 나뭇잎","g":"n4o","ex":[{"zh":"你看，这棵树的叶子都黄了。","py":"Nǐ kàn, zhè kē shù de yèzi dōu huáng le.","ko":"봐 봐, 이 나무 잎이 다 노래졌어."},{"zh":"秋天到了，叶子都掉下来了。","py":"Qiūtiān dào le, yèzi dōu diào xiàlai le.","ko":"가을이 와서 나뭇잎이 다 떨어졌어.","pat":"叶子 + 黄了/掉了 = 잎이 노래지다·떨어지다"},{"zh":"这种茶是用新鲜的叶子做的。","py":"Zhè zhǒng chá shì yòng xīnxiān de yèzi zuò de.","ko":"이 차는 신선한 잎으로 만든 거야."}],"c":[["叶","葉","잎 엽"],["子","子","아들 자"]],"why":"잎(叶)+子(접미사) → 나뭇잎"},{"id":459,"w":"一切","p":"yíqiè","k":"대","ko":"모든 것, 일체, 모든","g":"n4o","ex":[{"zh":"别担心，一切都准备好了。","py":"Bié dānxīn, yíqiè dōu zhǔnbèi hǎo le.","ko":"걱정 마세요, 모든 게 다 준비됐어요."},{"zh":"一切都会好起来的。","py":"Yīqiè dōu huì hǎo qǐlai de.","ko":"다 잘될 거야.","pat":"一切都 + 술어 = 모든 게 ~해 (一切都好)"},{"zh":"爸妈为我做的一切，我都记在心里。","py":"Bà mā wèi wǒ zuò de yīqiè, wǒ dōu jì zài xīn lǐ.","ko":"부모님이 날 위해 해 주신 모든 거 다 마음에 새기고 있어."}],"c":[["一","一","한 일"],["切","切","온통 체"]],"why":"한(一)데 온통(切) → 모든 것"},{"id":460,"w":"意见","p":"yìjiàn","k":"명","ko":"의견, 견해, 불만","g":"n4o","ex":[{"zh":"关于这个计划，大家有什么意见？","py":"Guānyú zhège jìhuà, dàjiā yǒu shénme yìjiàn?","ko":"이 계획에 대해서 다들 의견 있어?"},{"zh":"有意见就提出来，别不好意思。","py":"Yǒu yìjiàn jiù tí chūlai, bié bù hǎoyìsi.","ko":"불만 있으면 말해, 눈치 보지 말고.","pat":"有意见 / 提意见 = 불만이 있다·의견을 내다"},{"zh":"我同意你的意见，就这么做吧。","py":"Wǒ tóngyì nǐ de yìjiàn, jiù zhème zuò ba.","ko":"네 의견에 동의해, 그렇게 하자."}],"c":[["意","意","뜻 의"],["见","見","볼 견"]],"why":"뜻(意)과 보는 바(见) → 의견"},{"id":461,"w":"艺术","p":"yìshù","k":"명","ko":"예술","g":"n4o","ex":[{"zh":"周末我们去艺术馆看看吧。","py":"Zhōumò wǒmen qù yìshùguǎn kànkan ba.","ko":"주말에 미술관 구경 가자."},{"zh":"她从小就对艺术很感兴趣。","py":"Tā cóngxiǎo jiù duì yìshù hěn gǎn xìngqù.","ko":"걔는 어릴 때부터 예술에 관심이 많았어.","pat":"对 + 艺术 + 感兴趣 = 예술에 관심이 있다"},{"zh":"{H}说化妆也是一种艺术。","py":"{H} shuō huàzhuāng yě shì yī zhǒng yìshù.","ko":"{H}가 화장도 일종의 예술이래."}],"c":[["艺","藝","재주 예"],["术","術","재주 술"]],"why":"재주(艺)와 기술(术) → 예술"},{"id":462,"w":"因此","p":"yīncǐ","k":"연","ko":"이 때문에, 그러므로, 따라서","g":"n4o","ex":[{"zh":"机器坏了，因此今天不能交货。","py":"Jīqì huài le, yīncǐ jīntiān bù néng jiāo huò.","ko":"기계가 고장 나서 오늘은 납품을 못 해요."},{"zh":"他每天练习，因此进步很快。","py":"Tā měitiān liànxí, yīncǐ jìnbù hěn kuài.","ko":"걔는 매일 연습해서 실력이 빨리 늘었어.","pat":"원인，因此 + 결과 = 그래서 ~하다"},{"zh":"我的中文不太好，因此常常请{H}帮忙。","py":"Wǒ de Zhōngwén bú tài hǎo, yīncǐ chángcháng qǐng {H} bāngmáng.","ko":"내 중국어가 별로라서 자주 {H}한테 도와 달라고 해."}],"c":[["因","因","인할 인"],["此","此","이 차"]],"why":"이것(此)으로 인해(因) → 그러므로"},{"id":463,"w":"引起","p":"yǐnqǐ","k":"동","ko":"일으키다, 야기하다, 불러일으키다","g":"n4o","ex":[{"zh":"这个问题是温度太高引起的。","py":"Zhège wèntí shì wēndù tài gāo yǐnqǐ de.","ko":"이 문제는 온도가 너무 높아서 생긴 거야."},{"zh":"这件事引起了大家的注意。","py":"Zhè jiàn shì yǐnqǐ le dàjiā de zhùyì.","ko":"이 일이 모두의 주목을 끌었어.","pat":"引起 + 注意/重视 = 주의·관심을 끌다"},{"zh":"说话要小心，别引起误会。","py":"Shuōhuà yào xiǎoxīn, bié yǐnqǐ wùhuì.","ko":"말 조심해, 오해 생기지 않게."}],"c":[["引","引","끌 인"],["起","起","일어날 기"]],"why":"끌어(引) 일으킴(起) → 야기하다"},{"id":464,"w":"印象","p":"yìnxiàng","k":"명","ko":"인상","g":"n4o","ex":[{"zh":"你爸妈对我的印象怎么样？","py":"Nǐ bà mā duì wǒ de yìnxiàng zěnmeyàng?","ko":"너희 부모님은 나에 대한 인상이 어떠셔?"},{"zh":"他给我留下了很深的印象。","py":"Tā gěi wǒ liúxià le hěn shēn de yìnxiàng.","ko":"걔가 나한테 깊은 인상을 남겼어.","pat":"给 + 사람 + 留下 + …印象 = ~에게 인상을 남기다"},{"zh":"我对小时候的家已经没什么印象了。","py":"Wǒ duì xiǎoshíhou de jiā yǐjīng méi shénme yìnxiàng le.","ko":"어릴 때 살던 집은 이제 기억이 거의 안 나."}],"c":[["印","印","도장 인"],["象","象","모양 상"]],"why":"도장 찍힌(印) 모양(象) → 인상"},{"id":465,"w":"赢","p":"yíng","k":"동","ko":"이기다, 얻다, 이익을 보다","g":"n4o","ex":[{"zh":"爸爸，昨天的比赛韩国队赢了！","py":"Bàba, zuótiān de bǐsài Hánguó duì yíng le!","ko":"아빠, 어제 경기 한국이 이겼어!"},{"zh":"打羽毛球我从来没赢过{H}。","py":"Dǎ yǔmáoqiú wǒ cónglái méi yíng guo {H}.","ko":"배드민턴은 {H}한테 한 번도 못 이겨 봤어.","pat":"赢 + 상대 = ~를 이기다 (赢过他)"},{"zh":"别生气，这次输了，下次再赢回来。","py":"Bié shēngqì, zhè cì shū le, xià cì zài yíng huílai.","ko":"화내지 마, 이번엔 졌지만 다음에 이기면 돼."}],"c":[["赢","贏","남을 영"]],"why":"貝(재물)가 남음 → 이기다·벌다"},{"id":466,"w":"应聘","p":"yìngpìn","k":"동","ko":"지원하다, 응모하다, 초빙에 응하다","g":"n4o","ex":[{"zh":"今天有三个人来应聘。","py":"Jīntiān yǒu sān gè rén lái yìngpìn.","ko":"오늘 세 명이 지원하러 왔어."},{"zh":"我想应聘你们公司的经理。","py":"Wǒ xiǎng yìngpìn nǐmen gōngsī de jīnglǐ.","ko":"귀사 매니저 자리에 지원하고 싶습니다.","pat":"应聘 + 직위/회사 = ~에 지원하다"},{"zh":"他去那家公司应聘，没想到成功了。","py":"Tā qù nà jiā gōngsī yìngpìn, méi xiǎngdào chénggōng le.","ko":"걔 그 회사에 지원했는데 생각지도 못하게 붙었어."}],"c":[["应","應","응할 응"],["聘","聘","부를 빙"]],"why":"부름(聘)에 응함(应) → 지원하다"},{"id":467,"w":"勇敢","p":"yǒnggǎn","k":"형","ko":"용감하다","g":"n4o","ex":[{"zh":"妈妈说我一个人出国工作很勇敢。","py":"Māma shuō wǒ yī gè rén chū guó gōngzuò hěn yǒnggǎn.","ko":"엄마가 나 혼자 외국 나가서 일하는 게 용감하대."},{"zh":"喜欢她就勇敢地告诉她吧。","py":"Xǐhuan tā jiù yǒnggǎn de gàosu tā ba.","ko":"좋아하면 용기 내서 말해 봐.","pat":"勇敢地 + 동사 = 용감하게 ~하다"},{"zh":"那个小孩子打针的时候哭都没哭，真勇敢。","py":"Nàge xiǎo háizi dǎzhēn de shíhou kū dōu méi kū, zhēn yǒnggǎn.","ko":"그 꼬마 주사 맞을 때 울지도 않았어, 진짜 용감해."}],"c":[["勇","勇","날랠 용"],["敢","敢","감히 감"]],"why":"날래고(勇) 감히 나섬(敢) → 용감"},{"id":468,"w":"永远","p":"yǒngyuǎn","k":"부·명","ko":"영원히, 언제나, 영원","g":"n4o","ex":[{"zh":"{H}，我会永远支持你的。","py":"{H}, wǒ huì yǒngyuǎn zhīchí nǐ de.","ko":"{H}, 난 언제나 네 편이야."},{"zh":"我永远不会忘记那一天。","py":"Wǒ yǒngyuǎn bú huì wàngjì nà yī tiān.","ko":"그날은 영원히 못 잊을 거야.","pat":"永远 + 不会/不 + 동사 = 영원히 ~하지 않을 거야"},{"zh":"在爸妈眼里，我永远是个孩子。","py":"Zài bà mā yǎn lǐ, wǒ yǒngyuǎn shì gè háizi.","ko":"부모님 눈엔 난 언제나 애야."}],"c":[["永","永","길 영"],["远","遠","멀 원"]],"why":"길고(永) 멂(远) → 영원히"},{"id":469,"w":"优点","p":"yōudiǎn","k":"명","ko":"장점, 우수한 점","g":"n4o","ex":[{"zh":"这种材料的优点是不容易坏。","py":"Zhè zhǒng cáiliào de yōudiǎn shì bù róngyì huài.","ko":"이 재료의 장점은 잘 안 망가진다는 거예요."},{"zh":"每个人都有优点和缺点。","py":"Měi gè rén dōu yǒu yōudiǎn hé quēdiǎn.","ko":"사람마다 장점이랑 단점이 있어.","pat":"优点和缺点 = 장점과 단점"},{"zh":"{H}最大的优点是很有耐心。","py":"{H} zuì dà de yōudiǎn shì hěn yǒu nàixīn.","ko":"{H}의 제일 큰 장점은 인내심이 많은 거야."}],"c":[["优","優","뛰어날 우"],["点","點","점 점"]],"why":"뛰어난(优) 점(点) → 장점"},{"id":470,"w":"幽默","p":"yōumò","k":"형","ko":"유머러스하다, 유머","g":"n4o","ex":[{"zh":"我们老板说话很幽默。","py":"Wǒmen lǎobǎn shuōhuà hěn yōumò.","ko":"우리 사장님 말하는 게 되게 유머러스해."},{"zh":"我喜欢有幽默感 른 가자.","pat":"赶紧 + 동사 = 얼른 ~하다 (赶紧走·赶紧去)"},{"zh":"爸爸，我先挂了，老板找我，得赶紧过去。","py":"Bàba, wǒ xiān guà le, lǎobǎn zhǎo wǒ, děi gǎnjǐn guòqù.","ko":"아빠, 먼저 끊을게, 사장님이 찾아서 빨리 가봐야 해."}],"c":[["赶","趕","쫓을 간"],["紧","緊","긴할 긴"]],"why":"쫓기듯(赶) 급하게(紧) → 서둘러"},{"id":661,"w":"赶快","p":"gǎnkuài","k":"부","ko":"빨리, 얼른","g":"n4","ex":[{"zh":"妈妈，你感冒了就赶快去看医生。","py":"Māma, nǐ gǎnmào le jiù gǎnkuài qù kàn yīshēng.","ko":"엄마, 감기 걸렸으면 얼른 병원 가."},{"zh":"{H}，车来了，赶快上车！","py":"{H}, chē lái le, gǎnkuài shàng chē!","ko":"{H}, 차 왔다, 얼른 타!","pat":"赶快 + 동사 = 빨리 ~해 (赶快上车·赶快去)"},{"zh":"客户到了，你赶快去门口接一下。","py":"Kèhù dào le, nǐ gǎnkuài qù ménkǒu jiē yíxià.","ko":"고객 도착했어, 얼른 입구에 마중 나가 봐."}],"c":[["赶","趕","쫓을 간"],["快","快","빠를 쾌"]],"why":"쫓듯(赶) 빠르게(快) → 빨리, 얼른"},{"id":662,"w":"感人","p":"gǎnrén","k":"형","ko":"감동적이다","g":"n4","ex":[{"zh":"昨天和{H}看的电影特别感人。","py":"Zuótiān hé {H} kàn de diànyǐng tèbié gǎnrén.","ko":"어제 {H}랑 본 영화 엄청 감동적이었어."},{"zh":"老板在会上讲了一个很感人的故事。","py":"Lǎobǎn zài huì shang jiǎng le yí ge hěn gǎnrén de gùshi.","ko":"사장님이 회의에서 감동적인 이야기를 하나 해주셨어.","pat":"感人 + 的 + 故事/电影 = 감동적인 이야기·영화"},{"zh":"妈妈，你写给我的信真感人。","py":"Māma, nǐ xiě gěi wǒ de xìn zhēn gǎnrén.","ko":"엄마, 엄마가 써준 편지 진짜 감동이야."}],"c":[["感","感","느낄 감"],["人","人","사람 인"]],"why":"사람(人)을 느끼게(感) 함 → 감동적이다"},{"id":663,"w":"赶上","p":"gǎnshàng","k":"동","ko":"따라잡다, (시간에) 대다","g":"n4","ex":[{"zh":"还好我赶上了去新加坡的巴士。","py":"Hái hǎo wǒ gǎnshàng le qù Xīnjiāpō de bāshì.","ko":"다행히 싱가포르 가는 버스 시간에 맞췄어."},{"zh":"我加了三天班，终于赶上了交货时间。","py":"Wǒ jiā le sān tiān bān, zhōngyú gǎnshàng le jiāohuò shíjiān.","ko":"사흘 야근해서 겨우 납기 맞췄어.","pat":"赶上 + 车/时间 = 차·시간에 대다 (늦지 않다)"},{"zh":"妈妈，我回韩国正好赶上你的生日。","py":"Māma, wǒ huí Hánguó zhènghǎo gǎnshàng nǐ de shēngrì.","ko":"엄마, 나 한국 가는 게 딱 엄마 생일이랑 맞아."}],"c":[["赶","趕","쫓을 간"],["上","上","오를 상"]],"why":"쫓아(赶) 올라섬(上) → 따라잡다"},{"id":664,"w":"感受","p":"gǎnshòu","k":"동·명","ko":"느끼다, 느낌","g":"n4","ex":[{"zh":"爸爸，我在国外才感受到家的温暖。","py":"Bàba, wǒ zài guówài cái gǎnshòu dào jiā de wēnnuǎn.","ko":"아빠, 외국에 와서야 집의 따뜻함을 느꼈어."},{"zh":"第一次来工厂的时候，我就感受到了大家的热情。","py": ǐmen diàn de xīn huò dào le ma?","ko":"{H}, 너희 가게 신상 들어왔어?","pat":"新货 + 到了 = 새 물건이 들어오다 (到货)"},{"zh":"妈妈，这家超市的货很全，什么都有。","py":"Māma, zhè jiā chāoshì de huò hěn quán, shénme dōu yǒu.","ko":"엄마, 이 마트는 물건이 다 갖춰져 있어서 없는 게 없어."}],"c":[["货","貨","재물 화"]],"why":"貨 재물 화 → 화물·상품"},{"id":704,"w":"获奖","p":"huòjiǎng","k":"동","ko":"상을 받다, 수상하다","g":"n4","ex":[{"zh":"老板说我们工厂去年获奖了。","py":"Lǎobǎn shuō wǒmen gōngchǎng qùnián huòjiǎng le.","ko":"사장님이 우리 공장이 작년에 상 받았대."},{"zh":"{H}，你的照片获奖了，太厉害了！","py":"{H}, nǐ de zhàopiàn huòjiǎng le, tài lìhai le!","ko":"{H}, 네 사진이 상 받았네, 대박이다!","pat":"…获奖了 = ~가 상을 받았다 (获奖作品)"},{"zh":"妈妈，你还记得我小学获奖的那张画吗？","py":"Māma, nǐ hái jìde wǒ xiǎoxué huòjiǎng de nà zhāng huà ma?","ko":"엄마, 나 초등학교 때 상 받은 그 그림 기억나?"}],"c":[["获","獲","얻을 획"],["奖","獎","상줄 장"]],"why":"상(奖)을 얻음(获) → 수상하다"},{"id":705,"w":"获取","p":"huòqǔ","k":"동","ko":"얻다, 획득하다, 취득하다","g":"n4","ex":[{"zh":"我们可以从系统里获取每天的数据。","py":"Wǒmen kěyǐ cóng xìtǒng lǐ huòqǔ měi tiān de shùjù.","ko":"시스템에서 매일 데이터를 가져올 수 있어."},{"zh":"读书是获取知识最好的方法。","py":"Dúshū shì huòqǔ zhīshi zuì hǎo de fāngfǎ.","ko":"책 읽는 게 지식을 얻는 가장 좋은 방법이야.","pat":"获取 + 知识/信息 = 지식·정보를 얻다"},{"zh":"爸爸，你要注意，别让别人获取你的银行密码。","py":"Bàba, nǐ yào zhùyì, bié ràng biérén huòqǔ nǐ de yínháng mìmǎ.","ko":"아빠, 다른 사람이 은행 비밀번호 알아내지 못하게 조심해."}],"c":[["获","獲","얻을 획"],["取","取","가질 취"]],"why":"얻어(获) 가짐(取) → 획득하다"},{"id":706,"w":"基本","p":"jīběn","k":"형·부","ko":"기본적인, 대체로","g":"n4","ex":[{"zh":"这些是做这份工作的基本要求。","py":"Zhèxiē shì zuò zhè fèn gōngzuò de jīběn yāoqiú.","ko":"이게 이 일을 하는 기본 요건이야."},{"zh":"{H}，你说的中文我基本能听懂了。","py":"{H}, nǐ shuō de Zhōngwén wǒ jīběn néng tīng dǒng le.","ko":"{H}, 네가 하는 중국어 이제 거의 다 알아들어.","pat":"基本 + 동사 = 거의 ~하다 (基本能听懂)"},{"zh":"妈妈，做饭的基本方法我都会了。","py":"Māma, zuò fàn de jīběn fāngfǎ wǒ dōu huì le.","ko":"엄마, 요리 기본은 이제 다 할 줄 알아."}],"c":[["基","基","터 기"],["本","本","근본 본"]],"why":"터(基)와 근본(本) → 기본"},{"id":707,"w":"基本上","p":"jīběnshàng","k":"부","ko":"기본적으로, 대체로","g":"n4","ex":[{"zh":"新生产线基本上准备好了。","py":"Xīn shēngchǎnxiàn jīběnshàng zhǔnbèi hǎo le.","ko":"새 생산라인은 대체로 준비됐어."},{"zh":"妈妈，我在这里基本上每天都吃米饭。","py":"Māma, wǒ zài zhèlǐ jīběnshàng měi tiān dōu chī mǐfàn.","ko":"엄마, 나 여기서 거의 매일 밥 먹어.","pat":"基本上 + 每天/都 = 거의 매일·대체로 다"},{"zh":"{H}，这周末的安排基本上定了。","py":"{H}, zhè zhōumò de ānpái jīběnshàng dìng le.","ko":"{H}, 이번 주말 일정은 거의 정해졌어."}],"c":[["基","基","터 기"],["本","本","근본 본"],["上","上","윗 상"]],"why":"기본(基本) 위(上)에서 → 대체로"},{"id":708,"w":"既","p":"jì","k":"부·연","ko":"이미, ~한 이상, ~할 뿐만 아니라","g":"n4","ex":[{"zh":"{H}既漂亮又聪明，我真幸运。","py":"{H} jì piàoliang yòu cōngming, wǒ zhēn xìngyùn.","ko":"{H}는 예쁘고 똑똑하기까지 해, 난 진짜 운 좋아."},{"zh":"这台新机器既省电又好用。","py":"Zhè tái xīn jīqì jì shěng diàn yòu hǎo yòng.","ko":"이 새 기계는 전기도 아끼고 쓰기도 편해.","pat":"既 + A + 又 + B = A하기도 하고 B하기도 하다"},{"zh":"我既要上班，也要读MBA，真的很忙。","py":"Wǒ jì yào shàngbān, yě yào dú MBA, zhēn de hěn máng.","ko":"회사도 다녀야 하고 MBA도 해야 해서 진짜 바빠."}],"c":[["既","旣","이미 기"]],"why":"旣 이미 기 → 이미·~한 이상"},{"id":709,"w":"加快","p":"jiākuài","k":"동","ko":"가속하다, 빠르게 하다","g":"n4","ex":[{"zh":"老板让我们加快速度，月底前交货。","py":"Lǎobǎn ràng wǒmen jiākuài sùdù, yuèdǐ qián jiāohuò.","ko":"사장님이 속도 올려서 월말 전에 납품하래."},{"zh":"爸爸，你开车别老加快速度，安全第一。","py":"Bàba, nǐ kāichē bié lǎo jiākuài sùdù, ānquán dì yī.","ko":"아빠, 운전할 때 자꾸 속도 올리지 마, 안전이 제일이야.","pat":"加快 + 速度 = 속도를 내다"},{"zh":"听了{H}的话，我的心跳都加快了。","py":"Tīng le {H} de huà, wǒ de xīn tiào dōu jiākuài le.","ko":"{H} 말 듣고 심장이 막 빨리 뛰었어."}],"c":[["加","加","더할 가"],["快","快","빠를 쾌"]],"why":"빠름(快)을 더함(加) → 가속하다"},{"id":710,"w":"加强","p":"jiāqiáng","k":"동","ko":"강화하다","g":"n4","ex":[{"zh":"我们要加强工厂的安全管理。","py":"Wǒmen yào jiāqiáng gōngchǎng de ānquán guǎnlǐ.","ko":"공장 안전 관리를 강화해야 해."},{"zh":"爸爸，你要多运动，加强身体锻炼。","py":"Bàba, nǐ yào duō yùndòng, jiāqiáng shēntǐ duànliàn.","ko":"아빠, 운동 많이 해서 몸 좀 더 단련해.","pat":"加强 + 锻炼/管理 = 운동·관리를 강화하다"},{"zh":"{H}，我的中文还得加强，你多教教我。","py":"{H}, wǒ de Zhōngwén hái děi jiāqiáng, nǐ duō jiāojiao wǒ.","ko":"{H}, 내 중국어 아직 더 늘려야 해, 많이 가르쳐 줘."}],"c":[["加","加","더할 가"],["强","強","강할 강"]],"why":"강함(强)을 더함(加) → 강화하다"},{"id":711,"w":"加入","p":"jiārù","k":"동","ko":"가입하다, 참가하다, 넣다","g":"n4","ex":[{"zh":"欢迎你加入我们公司！","py":"Huānyíng nǐ jiārù wǒmen gōngsī!","ko":"우리 회사에 온 걸 환영해!"},{"zh":"{H}，我们的跑步队你要不要加入？","py":"{H}, wǒmen de pǎobù duì nǐ yào bu yào jiārù?","ko":"{H}, 우리 러닝 모임에 너도 들어올래?","pat":"加入 + 팀/모임 = ~에 들어가다"},{"zh":"妈妈，汤里加入一点儿糖会更好喝。","py":"Māma, tāng li jiārù yìdiǎnr táng huì gèng hǎohē.","ko":"엄마, 국에 설탕 조금 넣으면 더 맛있어."}],"c":[["加","加","더할 가"],["入","入","들 입"]],"why":"더하여(加) 들어감(入) → 가입하다"},{"id":712,"w":"加上","p":"jiāshàng","k":"연","ko":"게다가, 더하여","g":"n4","ex":[{"zh":"天气很热，加上没有空调，工人们很累。","py":"Tiānqì hěn rè, jiāshàng méiyǒu kōngtiáo, gōngrénmen hěn lèi.","ko":"날씨가 더운데다 에어컨도 없어서 작업자들이 힘들어."},{"zh":"妈妈，我的工资加上奖金，够花了。","py":"Māma, wǒ de gōngzī jiāshàng jiǎngjīn, gòu huā le.","ko":"엄마, 월급에 보너스까지 합치면 쓰기 충분해.","pat":"A + 加上 + B = A에 B를 더하면"},{"zh":"{H}，你今天忙了一天，加上没吃饭，肯定很累。","py":"{H}, nǐ jīntiān máng le yì tiān, jiāshàng méi chīfàn, kěndìng hěn lèi.","ko":"{H}, 오늘 하루 종일 바빴는데 밥도 못 먹었으니 엄청 피곤하겠다."}],"c":[["加","加","더할 가"],["上","上","윗 상"]],"why":"더하여(加) 얹음(上) → 게다가"},{"id":713,"w":"家庭","p":"jiātíng","k":"명","ko":"가정, 가족","g":"n4","ex":[{"zh":"{H}的家庭很温暖，她爸妈对我很好。","py":"{H} de jiātíng hěn wēnnuǎn, tā bà mā duì wǒ hěn hǎo.","ko":"{H}네 가정은 따뜻해, 부모님이 나한테 잘해 주셔."},{"zh":"妈妈，谢谢你给了我一个幸福的家庭。","py":"Māma, xièxie nǐ gěi le wǒ yí ge xìngfú de jiātíng.","ko":"엄마, 행복한 가정을 만들어 줘서 고마워.","pat":"幸福的 + 家庭 = 행복한 가정"},{"zh":"老板很重视家庭，周末从来不加班。","py":"Lǎobǎn hěn zhòngshì jiātíng, zhōumò cónglái bù jiābān.","ko":"사장님은 가정을 중요하게 생각해서 주말엔 절대 야근 안 해."}],"c":[["家","家","집 가"],["庭","庭","뜰 정"]],"why":"집(家)과 뜰(庭) → 가정"},{"id":714,"w":"家乡","p":"jiāxiāng","k":"명","ko":"고향","g":"n4","ex":[{"zh":"我的家乡在韩国水原。","py":"Wǒ de jiāxiāng zài Hánguó Shuǐyuán.","ko":"내 고향은 한국 수원이야."},{"zh":"同事说他很久没回家乡了。","py":"Tóngshì shuō tā hěn jiǔ méi huí jiāxiāng le.","ko":"동료가 고향에 못 간 지 오래됐대.","pat":"回 + 家乡 = 고향에 돌아가다"},{"zh":"{H}，你的家乡有什么好吃的？","py":"{H}, nǐ de jiāxiāng yǒu shénme hǎochī de?","ko":"{H}, 네 고향엔 뭐가 맛있어?"}],"c":[["家","家","집 가"],["乡","鄕","시골 향"]],"why":"집(家)이 있는 시골(乡) → 고향"},{"id":715,"w":"加油","p":"jiāyóu","k":"동","ko":"힘내다, 주유하다","g":"n4","ex":[{"zh":"{H}说：明天面试加油！","py":"{H} shuō: míngtiān miànshì jiāyóu!","ko":"{H}가 \"내일 면접 화이팅!\" 이래."},{"zh":"妈妈，你学开车要加油啊！","py":"Māma, nǐ xué kāichē yào jiāyóu a!","ko":"엄마, 운전 배우는 거 힘내!","pat":"加油(啊)! = 힘내! (응원)"},{"zh":"老板，我先去加油，半个小时后到。","py":"Lǎobǎn, wǒ xiān qù jiāyóu, bàn ge xiǎoshí hòu dào.","ko":"사장님, 먼저 주유하고 30분 뒤에 도착할게요."}],"c":[["加","加","더할 가"],["油","油","기름 유"]],"why":"기름(油)을 더함(加) → 주유, 힘내다"},{"id":716,"w":"家长","p":"jiāzhǎng","k":"명","ko":"학부모, 가장","g":"n4","ex":[{"zh":"同事说今晚要去开家长会。","py":"Tóngshì shuō jīn wǎn yào qù kāi jiāzhǎnghuì.","ko":"동료가 오늘 저녁에 학부모 회의 간대."},{"zh":"{H}，你小时候家长管你管得严吗？","py":"{H}, nǐ xiǎoshíhou jiāzhǎng guǎn nǐ guǎn de yán ma?","ko":"{H}, 어릴 때 부모님이 엄하게 키우셨어?","pat":"家长 + 管 = 부모(보호자)가 ~를 단속하다"},{"zh":"爸爸是我们家的家长，大事都听他的。","py":"Bàba shì wǒmen jiā de jiāzhǎng, dà shì dōu tīng tā de.","ko":"아빠가 우리 집 가장이라 큰일은 다 아빠 말대로 해."}],"c":[["家","家","집 가"],["长","長","어른 장"]],"why":"집(家)의 어른(长) → 가장·학부모"},{"id":717,"w":"价钱","p":"jiàqián","k":"명","ko":"가격, 값","g":"n4","ex":[{"zh":"这个价钱我们可以再商量。","py":"Zhège jiàqián wǒmen kěyǐ zài shāngliang.","ko":"이 가격은 다시 협의할 수 있어요."},{"zh":"{H}，这个价钱太贵了，我们去别家看看。","py":"{H}, zhège jiàqián tài guì le, wǒmen qù bié jiā kànkan.","ko":"{H}, 이 가격 너무 비싸다, 다른 데 가보자.","pat":"价钱 + 太贵/便宜 = 값이 비싸다·싸다"},{"zh":"妈妈，你买菜别只看价钱，也要看新鲜不新鲜。","py":"Māma, nǐ mǎi cài bié zhǐ kàn jiàqián, yě yào kàn xīnxiān bu xīnxiān.","ko":"엄마, 장 볼 때 가격만 보지 말고 신선한지도 봐."}],"c":[["价","價","값 가"],["钱","錢","돈 전"]],"why":"값(价)과 돈(钱) → 가격"},{"id":718,"w":"假日","p":"jiàrì","k":"명","ko":"휴일, 쉬는 날","g":"n4","ex":[{"zh":"假日的时候，我一般去新加坡。","py":"Jiàrì de shíhou, wǒ yībān qù Xīnjiāpō.","ko":"쉬는 날엔 보통 싱가포르 가."},{"zh":"妈妈，假日你和爸爸多出去走走。","py":"Māma, jiàrì nǐ hé bàba duō chūqù zǒuzou.","ko":"엄마, 쉬는 날엔 아빠랑 자주 바람 쐬러 나가.","pat":"假日(的时候) + 동사 = 쉬는 날에 ~하다"},{"zh":"老板说假日加班的工资是平时的两倍。","py":"Lǎobǎn shuō jiàrì jiābān de gōngzī shì píngshí de liǎng bèi.","ko":"사장님이 휴일 근무 수당은 평소의 두 배래."}],"c":[["假","假","겨를 가"],["日","日","날 일"]],"why":"쉬는(假) 날(日) → 휴일"},{"id":719,"w":"减","p":"jiǎn","k":"동","ko":"줄이다, 빼다, 감소하다","g":"n4","ex":[{"zh":"{H}说我得减肥了。","py":"{H} shuō wǒ děi jiǎnféi le.","ko":"{H}가 나 살 빼야 한대."},{"zh":"老板说明年的广告费要减一半。","py":"Lǎobǎn shuō míngnián de guǎnggào fèi yào jiǎn yíbàn.","ko":"사장님이 내년 광고비를 절반으로 줄이래.","pat":"减 + 一半/一点儿 = 절반·조금 줄이다"},{"zh":"妈妈，你做菜的时候盐要减一点儿。","py":"Māma, nǐ zuò cài de shíhou yán yào jiǎn yìdiǎnr.","ko":"엄마, 요리할 때 소금 좀 줄여."}],"c":[["减","減","덜 감"]],"why":"減 덜 감 → 감소·빼다"},{"id":720,"w":"减轻","p":"jiǎnqīng","k":"동","ko":"경감하다, 덜다, 줄이다","g":"n4","ex":[{"zh":"新系统能减轻大家的工作压力。","py":"Xīn xìtǒng néng jiǎnqīng dàjiā de gōngzuò yālì.","ko":"새 시스템이 다들 업무 부담을 덜어 줄 거야."},{"zh":"{H}，跟你聊天能减轻我的压力。","py":"{H}, gēn nǐ liáotiān néng jiǎnqīng wǒ de yālì.","ko":"{H}, 너랑 얘기하면 스트레스가 풀려.","pat":"减轻 + 压力 = 스트레스를 줄이다"},{"zh":"爸爸，多休息能减轻你的头疼。","py":"Bàba, duō xiūxi néng jiǎnqīng nǐ de tóu téng.","ko":"아빠, 푹 쉬면 두통이 좀 덜할 거야."}],"c":[["减","減","덜 감"],["轻","輕","가벼울 경"]],"why":"덜어(减) 가볍게(轻) → 경감하다"},{"id":721,"w":"健身","p":"jiànshēn","k":"동","ko":"몸을 단련하다, 헬스하다","g":"n4","ex":[{"zh":"妈妈，我每天下班以后去健身。","py":"Māma, wǒ měi tiān xiàbān yǐhòu qù jiànshēn.","ko":"엄마, 나 매일 퇴근하고 운동하러 가."},{"zh":"{H}，周末我们一起去健身吧。","py":"{H}, zhōumò wǒmen yìqǐ qù jiànshēn ba.","ko":"{H}, 주말에 같이 운동하러 가자.","pat":"去 + 健身 = 운동하러 가다"},{"zh":"同事说健身以后，他睡得更好了。","py":"Tóngshì shuō jiànshēn yǐhòu, tā shuì de gèng hǎo le.","ko":"동료가 운동 시작하고 나서 잠을 더 잘 잔대."}],"c":[["健","健","굳셀 건"],["身","身","몸 신"]],"why":"몸(身)을 굳세게(健) → 몸을 단련하다"},{"id":722,"w":"健身房","p":"jiànshēnfáng","k":"명","ko":"헬스장, 피트니스 센터","g":"n4","ex":[{"zh":"{H}家楼下有一个健身房。","py":"{H} jiā lóuxià yǒu yī gè jiànshēnfáng.","ko":"{H}네 집 아래층에 헬스장 있어."},{"zh":"妈妈，我每周去三次健身房。","py":"Māma, wǒ měi zhōu qù sān cì jiànshēnfáng.","ko":"엄마, 나 일주일에 세 번 헬스장 가.","pat":"去 + 健身房 = 헬스장에 가다"},{"zh":"我们工厂旁边新开了一家健身房。","py":"Wǒmen gōngchǎng pángbiān xīn kāi le yì jiā jiànshēnfáng.","ko":"우리 공장 옆에 헬스장이 새로 생겼어."}],"c":[["健","健","굳셀 건"],["身","身","몸 신"],["房","房","방 방"]],"why":"몸 단련(健身)하는 방(房) → 헬스장"},{"id":723,"w":"江","p":"jiāng","k":"명","ko":"강","g":"n4","ex":[{"zh":"小时候爸爸常带我去江边钓鱼。","py":"Xiǎoshíhou bàba cháng dài wǒ qù jiāngbiān diàoyú.","ko":"어릴 때 아빠가 자주 강가에 낚시 데려갔어."},{"zh":"{H}，我们晚上去江边散散步吧。","py":"{H}, wǒmen wǎnshang qù jiāng biān sànsan bù ba.","ko":"{H}, 저녁에 강가에서 산책하자.","pat":"江 + 边 = 강가 (去江边)"},{"zh":"客户的工厂就在江的对面。","py":"Kèhù de gōngchǎng jiù zài jiāng de duìmiàn.","ko":"고객 공장은 바로 강 건너편에 있어."}],"c":[["江","江","강 강"]],"why":"江 강 강 → 큰 강(长江)"},{"id":724,"w":"将","p":"jiāng","k":"개·부","ko":"장차 ~할 것이다, ~을(를)","g":"n4","ex":[{"zh":"我们将在下周把样品寄给您。","py":"Wǒmen jiāng zài xià zhōu bǎ yàngpǐn jì gěi nín.","ko":"다음 주에 샘플 보내드리겠습니다."},{"zh":"飞机将在十分钟后起飞。","py":"Fēijī jiāng zài shí fēnzhōng hòu qǐfēi.","ko":"비행기가 10분 뒤에 이륙할 예정이야.","pat":"将 + 在 + 시간 + 동사 = ~에 ~할 예정이다 (공식 안내)"},{"zh":"爸爸，下个月我将去中国出差。","py":"Bàba, xià ge yuè wǒ jiāng qù Zhōngguó chūchāi.","ko":"아빠, 다음 달에 중국으로 출장 가게 될 거야."}],"c":[["将","將","장차 장"]],"why":"將 장차 장 → 장차 ~할 것이다"},{"id":725,"w":"将要","p":"jiāngyào","k":"부","ko":"장차 ~하려 하다, 곧 ~할 것이다","g":"n4","ex":[{"zh":"{H}将要换一家新公司。","py":"{H} jiāngyào huàn yī jiā xīn gōngsī.","ko":"{H}가 곧 새 회사로 옮길 거야."},{"zh":"妈妈，春节将要到了，我给你们买了礼物。","py":"Māma, Chūnjié jiāngyào dào le, wǒ gěi nǐmen mǎi le lǐwù.","ko":"엄마, 곧 설이라서 선물 사뒀어.","pat":"将要 + 동사 + 了 = 곧 ~하려 한다"},{"zh":"工厂将要来一位新经理。","py":"Gōngchǎng jiāngyào lái yí wèi xīn jīnglǐ.","ko":"공장에 곧 새 매니저가 한 명 올 거야."}],"c":[["将","將","장차 장"],["要","要","구할 요"]],"why":"장차(将) ~하려(要) 함 → 곧 ~할 것이다"},{"id":726,"w":"奖","p":"jiǎng","k":"명","ko":"상, 상품, 상금","g":"n4","ex":[{"zh":"老板说做得好的人有奖。","py":"Lǎobǎn shuō zuò de hǎo de rén yǒu jiǎng.","ko":"사장님이 잘하는 사람은 상 준대."},{"zh":"爸爸，我们公司的比赛我得了二等奖。","py":"Bàba, wǒmen gōngsī de bǐsài wǒ dé le èr děng jiǎng.","ko":"아빠, 회사 대회에서 나 2등상 받았어.","pat":"得 + 숫자 + 等奖 = ~등상을 받다"},{"zh":"{H}，你这么聪明，应该给你发个奖。","py":"{H}, nǐ zhème cōngming, yīnggāi gěi nǐ fā ge jiǎng.","ko":"{H}, 이렇게 똑똑하니까 상 하나 줘야겠다."}],"c":[["奖","獎","상줄 장"]],"why":"獎 상줄 장 → 상·상금(장학 獎學)"},{"id":727,"w":"奖学金","p":"jiǎngxuéjīn","k":"명","ko":"장학금","g":"n4","ex":[{"zh":"妈妈，我拿到MBA奖学金了！","py":"Māma, wǒ ná dào :735,"w":"叫作","p":"jiàozuò","k":"동","ko":"~라고 부르다, ~라고 불리다","g":"n4","ex":[{"zh":"这种工艺叫作电镀。","py":"Zhè zhǒng gōngyì jiàozuò diàndù.","ko":"이런 공정을 전기도금이라고 해요."},{"zh":"妈妈，这种水果叫作榴莲，味道很特别。","py":"Māma, zhè zhǒng shuǐguǒ jiàozuò liúlián, wèidào hěn tèbié.","ko":"엄마, 이 과일은 두리안이라고 하는데 맛이 엄청 독특해.","pat":"这种 + 명사 + 叫作 + 이름 = 이것을 ~라고 부르다"},{"zh":"{H}，我们第一次见面的那家店叫作什么来着？","py":"{H}, wǒmen dì yī cì jiànmiàn de nà jiā diàn jiàozuò shénme láizhe?","ko":"{H}, 우리 처음 만난 그 가게 이름이 뭐였더라?"}],"c":[["叫","叫","부르짖을 규"],["作","作","지을 작"]],"why":"불러(叫) 지음(作) → ~라고 부르다"},{"id":736,"w":"节假日","p":"jiéjiàrì","k":"명","ko":"명절과 휴일, 공휴일","g":"n4","ex":[{"zh":"节假日去新加坡的人特别多。","py":"Jiéjiàrì qù Xīnjiāpō de rén tèbié duō.","ko":"공휴일엔 싱가포르 가는 사람이 엄청 많아."},{"zh":"妈妈，节假日机票太贵，我平时回去吧。","py":"Māma, jiéjiàrì jīpiào tài guì, wǒ píngshí huíqù ba.","ko":"엄마, 연휴엔 비행기표가 너무 비싸서 평일에 갈게.","pat":"节假日 + 的时候/机票 = 연휴·공휴일에 / 연휴 항공권"},{"zh":"节假日工厂也有人上班，机器不能停。","py":"Jiéjiàrì gōngchǎng yě yǒu rén shàngbān, jīqì bù néng tíng.","ko":"공휴일에도 공장엔 출근하는 사람이 있어, 기계를 멈출 수 없거든."}],"c":[["节","節","명절 절"],["假","假","겨를 가"],["日","日","날 일"]],"why":"명절(节)+휴가(假) 날(日) → 공휴일"},{"id":737,"w":"结账","p":"jiézhàng","k":"동","ko":"계산하다, 결제하다","g":"n4","ex":[{"zh":"{H}，你等一下，我去结账。","py":"{H}, nǐ děng yīxià, wǒ qù jiézhàng.","ko":"{H}, 잠깐만, 나 계산하고 올게."},{"zh":"聚餐完老板自己去结账了。","py":"Jùcān wán lǎobǎn zìjǐ qù jiézhàng le.","ko":"회식 끝나고 사장님이 직접 계산하러 가셨어.","pat":"去 + 结账 = 계산하러 가다"},{"zh":"妈妈，你在网上买东西可以用手机结账。","py":"Māma, nǐ zài wǎng shang mǎi dōngxi kěyǐ yòng shǒujī jiézhàng.","ko":"엄마, 인터넷으로 살 때 휴대폰으로 결제하면 돼."}],"c":[["结","結","맺을 결"],["账","賬","장부 장"]],"why":"장부(账)를 맺음(结) → 계산하다"},{"id":738,"w":"今后","p":"jīnhòu","k":"명","ko":"앞으로, 이후, 금후","g":"n4","ex":[{"zh":"今后有任何问题，您可以直接联系我。","py":"Jīnhòu yǒu rènhé wèntí, nín kěyǐ zhíjiē liánxì wǒ.","ko":"앞으로 무슨 문제든 저한테 바로 연락 주세요."},{"zh":"爸爸，今后你少喝点儿酒吧。","py":"Bàba, jīnhòu nǐ shǎo hē diǎnr jiǔ ba.","ko":"아빠, 앞으로는 술 좀 줄여.","pat":"今后 + 동사 = 앞으로 ~하다"},{"zh":"{H}，今后不管有什么事，我们一起面对。","py":"{H}, jīnhòu bùguǎn yǒu shénme shì, wǒmen yìq = ~로서"},{"zh":"爸爸把这块手表作为礼物送给了我。","py":"Bàba bǎ zhè kuài shǒubiǎo zuòwéi lǐwù sòng gěi le wǒ.","ko":"아빠가 이 시계를 선물로 나한테 주셨어."}],"c":[["作","作","지을 작"],["为","爲","할 위"]],"why":"~으로 삼아(作) 함(为) → ~로서"},{"id":1015,"w":"作文","p":"zuòwén","k":"동·명","ko":"작문하다, 작문, 글짓기","g":"n4","ex":[{"zh":"我用中文写了一篇作文给{H}看。","py":"wǒ yòng Zhōngwén xiě le yī piān zuòwén gěi {H} kàn。","ko":"중국어로 작문 한 편 써서 {H}한테 보여줬어."},{"zh":"老师让我们写一篇关于家乡的作文。","py":"Lǎoshī ràng wǒmen xiě yì piān guānyú jiāxiāng de zuòwén.","ko":"선생님이 고향에 관한 작문을 한 편 쓰래.","pat":"写一篇作文 = 작문 한 편을 쓰다"},{"zh":"同事的女儿让我帮她改中文作文。","py":"Tóngshì de nǚ'ér ràng wǒ bāng tā gǎi Zhōngwén zuòwén.","ko":"동료 딸이 중국어 작문 좀 고쳐 달래."}],"c":[["作","作","지을 작"],["文","文","글월 문"]],"why":"글(文)을 지음(作) → 작문"},{"id":1016,"w":"爱","p":"ài","k":"동","ko":"사랑하다, 좋아하다, 자주 ~하다","g":"o","ex":[{"zh":"妈妈，我爱你，你要照顾好自己。","py":"māma，wǒ ài nǐ，nǐ yào zhàogù hǎo zìjǐ。","ko":"엄마 사랑해, 몸 잘 챙겨."},{"zh":"他特别爱吃辣的。","py":"Tā tèbié ài chī là de.","ko":"걔는 매운 걸 엄청 좋아해.","pat":"爱 + 동사 = ~하기를 좋아하다 (爱吃·爱看)"},{"zh":"{H}，不管多远，我都爱你。","py":"{H}, bùguǎn duō yuǎn, wǒ dōu ài nǐ.","ko":"{H}, 아무리 멀어도 난 너 사랑해."}],"c":[["爱","愛","사랑 애"]],"why":"'사랑 애' — 愛情(애정) → 사랑하다"},{"id":1017,"w":"矮","p":"ǎi","k":"형","ko":"(키가) 작다, 낮다","g":"o","ex":[{"zh":"{H}说她比我矮一个头。","py":"{H} shuō tā bǐ wǒ ǎi yī gè tóu。","ko":"{H}가 자기가 나보다 머리 하나만큼 작대."},{"zh":"他个子很矮，但是篮球打得很好。","py":"Tā gèzi hěn ǎi, dànshì lánqiú dǎ de hěn hǎo.","ko":"걔는 키가 작은데 농구를 엄청 잘해.","pat":"个子矮 = 키가 작다"},{"zh":"新来的同事个子不矮，有一米八。","py":"Xīn lái de tóngshì gèzi bù ǎi, yǒu yì mǐ bā.","ko":"새로 온 동료 키 안 작아, 180이야."}],"c":[["矮","矮","난쟁이 왜"]],"why":"'난쟁이 왜' — 키가 작다"},{"id":1018,"w":"爱好","p":"àihào","k":"명·동","ko":"취미, 즐겨 하다","g":"o","ex":[{"zh":"您平时有什么爱好？","py":"nín píngshí yǒu shénme àihào？","ko":"평소에 취미가 뭐예요?"},{"zh":"我的爱好是看书和旅游。","py":"Wǒ de àihào shì kàn shū hé lǚyóu.","ko":"내 취미는 독서랑 여행이야.","pat":"我的爱好是… = 내 취미는 ~이다"},{"zh":"老板爱好爬山，周末常去。","py":"Lǎobǎn àihào pá shān, zhōumò cháng qù.","ko":"사장님은 등산을 좋아하셔서 주말마다 자주 가셔."}],"c":[["爱","愛","사랑 애"],["好","好","좋을 호"]],"why":"사랑하고(爱) 좋아함(好) → 애호"},{"id":1019,"w":"安静","p":"ānjìng","k":"형","ko":"조용하다, 고요하다","g":"o","ex":[{"zh":"大家安静一点，老板在打电话。","py":"dàjiā ānjìng yīdiǎn，lǎobǎn zài dǎ diànhuà。","ko":"다들 좀 조용히 해, 사장님 통화 중이야."},{"zh":"请大家安静下来，会议开始了。","py":"Qǐng dàjiā ānjìng xiàlái, huìyì kāishǐ le.","ko":"다들 조용히 해 주세요, 회의 시작합니다.","pat":"安静下来 = 조용해지다"},{"zh":"爸爸看书的时候喜欢安静。","py":"Bàba kàn shū de shíhou xǐhuan ānjìng.","ko":"아빠는 책 볼 때 조용한 걸 좋아해."}],"c":[["安","安","편안 안"],["静","靜","고요할 정"]],"why":"편안하고(安) 고요함(静) → 조용하다"},{"id":1020,"w":"阿姨","p":"āyí","k":"명","ko":"아주머니, 이모","g":"o","ex":[{"zh":"打扫卫生的阿姨今天请假了。","py":"dǎsǎo wèishēng de āyí jīntiān qǐngjià le。","ko":"청소 아주머니 오늘 휴가 내셨어."},{"zh":"叔叔阿姨好，我是小李。","py":"Shūshu āyí hǎo, wǒ shì Xiǎo Lǐ.","ko":"아저씨 아주머니 안녕하세요, 저 샤오리예요.","pat":"叔叔阿姨好 = (친구 부모님께) 안녕하세요"},{"zh":"妈妈，你帮我谢谢李阿姨，她送的东西我收到了。","py":"Māma, nǐ bāng wǒ xièxie Lǐ āyí, tā sòng de dōngxi wǒ shōudào le.","ko":"엄마, 이 아주머니한테 고맙다고 전해 줘, 보내 주신 거 잘 받았어."}],"c":[["阿","阿","언덕 아"],["姨","姨","이모 이"]],"why":"친근 접두(阿)+이모(姨) → 아주머니"},{"id":1021,"w":"吧","p":"ba","k":"조","ko":"~하자, ~이지?(제안·추측)","g":"o","ex":[{"zh":"我们周六去吃辣椒螃蟹吧！","py":"wǒmen zhōuliù qù chī làjiāo pángxiè ba！","ko":"토요일에 칠리크랩 먹으러 가자!"},{"zh":"好吧，那我们明天见。","py":"Hǎo ba, nà wǒmen míngtiān jiàn.","ko":"알았어, 그럼 내일 보자.","pat":"好吧 = 그래, 알았어 (마지못한 동의)"},{"zh":"妈妈，你今天累了吧？早点休息。","py":"Māma, nǐ jīntiān lèi le ba? Zǎo diǎn xiūxi.","ko":"엄마, 오늘 피곤하지? 일찍 쉬어."}],"c":[["吧","吧","(어조사) 파"]],"why":"입(口)+巴(파) 소리 → 제안·추측 어기"},{"id":1022,"w":"把","p":"bǎ","k":"개·양","ko":"~을(를)(목적어를 앞으로), 손잡이 있는 물건을 세는 단위","g":"o","ex":[{"zh":"请把这些样品寄给客户。","py":"qǐng bǎ zhèxiē yàngpǐn jì gěi kèhù。","ko":"이 샘플들 고객한테 보내줘."},{"zh":"出去的时候请把门关上。","py":"Chūqù de shíhou qǐng bǎ mén guān shàng.","ko":"나갈 때 문 좀 닫아 주세요.","pat":"把 + 목적어 + 동사 + 결과 = ~을 ~해 놓다 (把门关上)"},{"zh":"妈妈，别把药放在太热的地方。","py":"Māma, bié bǎ yào fàng zài tài rè de dìfang.","ko":"엄마, 약은 너무 더운 데 두지 마."}],"c":[["把","把","잡을 파"]],"why":"'잡을 파' — 잡아서(把) → ~을"},{"id":1023,"w":"八","p":"bā","k":"수","ko":"여덟, 8","g":"o","ex":[{"zh":"妈，我每天早上八点到工厂。","py":"mā，wǒ měi tiān zǎoshang bā diǎn dào gōngchǎng。","ko":"엄마, 나 매일 아침 8시에 공장 도착해."},{"zh":"这件衣服今天打八折。","py":"Zhè jiàn yīfu jīntiān dǎ bā zhé.","ko":"이 옷 오늘 20% 할인이야.","pat":"打八折 = 20% 할인하다 (정가의 80%)"},{"zh":"这个车间一共有八台机器。","py":"Zhège chējiān yígòng yǒu bā tái jīqì.","ko":"이 작업장에는 기계가 모두 여덟 대 있어."}],"c":[["八","八","여덟 팔"]],"why":"'여덟 팔' — 두 획이 갈라진 모양"},{"id":1024,"w":"爸爸","p":"bàba","k":"명","ko":"아빠, 아버지","g":"o","ex":[{"zh":"爸爸最近身体好吗？","py":"bàba zuìjìn shēntǐ hǎo ma？","ko":"아빠 요즘 건강 괜찮으셔?"},{"zh":"我爸爸是医生，每天都很忙。","py":"Wǒ bàba shì yīshēng, měitiān dōu hěn máng.","ko":"우리 아빠는 의사라 매일 바빠.","pat":"我爸爸 (的 생략) = 우리 아빠"},{"zh":"同事的爸爸也是做电镀的。","py":"Tóngshì de bàba yě shì zuò diàndù de.","ko":"동료 아버지도 도금 일을 하셔."}],"c":[["爸","爸","아비 파"],["爸","爸","아비 파"]],"why":"아비(爸)를 겹쳐 → 아빠"},{"id":1025,"w":"百","p":"bǎi","k":"수","ko":"백, 100","g":"o","ex":[{"zh":"这批货一共五百个零件。","py":"zhè pī huò yīgòng wǔ bǎi gè língjiàn。","ko":"이번 물량은 부품 총 500개야."},{"zh":"这次考试他考了一百分。","py":"Zhè cì kǎoshì tā kǎo le yìbǎi fēn.","ko":"걔 이번 시험에서 100점 맞았어.","pat":"一百分 / 几百 = 100점(만점) / 몇백"},{"zh":"妈妈，我们工厂有一百多个工人。","py":"Māma, wǒmen gōngchǎng yǒu yìbǎi duō ge gōngrén.","ko":"엄마, 우리 공장에 직원이 100명 넘게 있어."}],"c":[["百","百","일백 백"]],"why":"'일백 백' — 百姓(백성) → 100"},{"id":1026,"w":"班","p":"bān","k":"명","ko":"반, 학급, 근무조","g":"o","ex":[{"zh":"我们工厂分白班和夜班。","py":"wǒmen gōngchǎng fēn bái bān hé yè bān。","ko":"우리 공장은 주간조랑 야간조로 나뉘어."},{"zh":"我每天早上九点上班。","py":"Wǒ měitiān zǎoshang jiǔ diǎn shàngbān.","ko":"나는 매일 아침 9시에 출근해.","pat":"上班/下班 = 출근하다 / 퇴근하다"},{"zh":"妈妈，我们MBA班上有很多国家的同学。","py":"Māma, wǒmen MBA bān shàng yǒu hěn duō guójiā de tóngxué.","ko":"엄마, 우리 MBA 반에는 여러 나라 학생들이 있어."}],"c":[["班","班","나눌 반"]],"why":"'나눌 반' — 班長(반장) → 반, 조"},{"id":1027,"w":"搬","p":"bān","k":"동","ko":"옮기다, 이사하다","g":"o","ex":[{"zh":"这台机器太重了，我们几个一起搬。","py":"zhè tái jīqì tài zhòng le，wǒmen jǐ gè yīqǐ bān。","ko":"이 기계 너무 무거워, 우리 몇 명이서 같이 옮기자."},{"zh":"我下个月要搬家了。","py":"Wǒ xià ge yuè yào bānjiā le.","ko":"나 다음 달에 이사 가.","pat":"搬家 = 이사하다"},{"zh":"爸爸，这箱子太重了，我来搬。","py":"Bàba, zhè xiāngzi tài zhòng le, wǒ lái bān.","ko":"아빠, 이 상자 너무 무거워, 내가 옮길게."}],"c":[["搬","搬","옮길 반"]],"why":"'옮길 반' — 搬入(반입) → 옮기다"},{"id":1028,"w":"办法","p":"bànfǎ","k":"명","ko":"방법, 수단","g":"o","ex":[{"zh":"别担心，我们一起想办法。","py":"bié dānxīn，wǒmen yīqǐ xiǎng bànfǎ。","ko":"걱정 마, 같이 방법 생각해 보자."},{"zh":"没办法，我们只能等了。","py":"Méi bànfǎ, wǒmen zhǐ néng děng le.","ko":"어쩔 수 없지, 기다리는 수밖에 없어.","pat":"没办法 = 어쩔 수 없다"},{"zh":"老板，这个问题我有办法解决。","py":"Lǎobǎn, zhège wèntí wǒ yǒu bànfǎ jiějué.","ko":"사장님, 이 문제는 제가 해결할 방법이 있어요."}],"c":[["办","辦","힘쓸 판"],["法","法","법 법"]],"why":"일을 처리하는(办) 방법(法) → 방법"},{"id":1029,"w":"帮忙","p":"bāngmáng","k":"동","ko":"돕다, 거들다","g":"o","ex":[{"zh":"你店里忙的话，我周末去帮忙。","py":"nǐ diàn lǐ máng de huà，wǒ zhōumò qù bāngmáng。","ko":"가게 바쁘면 주말에 내가 가서 도와줄게."},{"zh":"周末搬家，我叫了几个朋友来帮忙。","py":"Zhōumò bānjiā, wǒ jiào le jǐ ge péngyou lái bāngmáng.","ko":"주말에 이사해서 친구 몇 명 불러서 도와 달라고 했어.","pat":"叫/请 + 사람 + 来帮忙 = ~를 불러 도와 달라고 하다 (이합사: 帮个忙·帮我一个忙)"},{"zh":"老板，下周的检查需要我帮忙吗？","py":"Lǎobǎn, xià zhōu de jiǎnchá xūyào wǒ bāngmáng ma?","ko":"사장님, 다음 주 점검 제가 좀 도와드릴까요?"}],"c":[["帮","幫","도울 방"],["忙","忙","바쁠 망"]],"why":"바쁜(忙) 일을 도움(帮) → 돕다"},{"id":1030,"w":"办公室","p":"bàngōngshì","k":"명","ko":"사무실","g":"o","ex":[{"zh":"老板让你去他办公室一下。","py":"lǎobǎn ràng nǐ qù tā bàngōngshì yīxià。","ko":"사장님이 너 사무실로 잠깐 오래."},{"zh":"他现在不在办公室，你等一下吧。","py":"Tā xiànzài bú zài bàngōngshì, nǐ děng yíxià ba.","ko":"그분 지금 사무실에 안 계셔, 좀 기다려.","pat":"在/不在 + 办公室 = 사무실에 있다/없다"},{"zh":"妈妈，我的办公室能看到整个车间。","py":"Māma, wǒ de bàngōngshì néng kàndào zhěnggè chējiān.","ko":"엄마, 내 사무실에서 작업장 전체가 다 보여."}],"c":[["办","辦","힘쓸 판"],["公","公","공평할 공"],["室","室","집 실"]],"why":"공무(公)를 처리하는(办) 방(室) → 사무실"},{"id":1031,"w":"帮助","p":"bāngzhù","k":"동·명","ko":"돕다, 도움","g":"o","ex":[{"zh":"谢谢您一直以来的帮助。","py":"xièxie nín yīzhí yǐlái de bāngzhù。","ko":"그동안 도와주셔서 감사합니다."},{"zh":"谢谢你帮助我找到了钱包。","py":"Xièxie nǐ bāngzhù wǒ zhǎodào le qiánbāo.","ko":"지갑 찾는 거 도와줘서 고마워.","pat":"帮助 + 사람 + 동사 = ~가 ~하는 걸 돕다"},{"zh":"爸爸常说，别人有困难要帮助他们。","py":"Bàba cháng shuō, biérén yǒu kùnnan yào bāngzhù tāmen.","ko":"아빠는 남이 어려울 땐 도와줘야 한다고 자주 말씀하셔."}],"c":[["帮","幫","도울 방"],["助","助","도울 조"]],"why":"돕고(帮) 도움(助) → 돕다"},{"id":1032,"w":"饱","p":"bǎo","k":"형","ko":"배부르다","g":"o","ex":[{"zh":"妈，我吃饱了，真的吃不下了。","py":"mā，wǒ chī bǎo le，zhēn de chī bù xià le。","ko":"엄마, 나 배불러, 진짜 더는 못 먹어."},{"zh":"这么少的饭，我肯定吃不饱。","py":"Zhème shǎo de fàn, wǒ kěndìng chī bu bǎo.","ko":"밥이 이렇게 적으면 나 분명 배 안 차.","pat":"吃饱 / 吃不饱 = 배부르게 먹다 / 배가 안 차다"},{"zh":"{H}，你吃饱了吗？要不要再点一个菜？","py":"{H}, nǐ chī bǎo le ma? Yào bu yào zài diǎn yí ge cài?","ko":"{H}, 배불러? 하나 더 시킬까?"}],"c":[["饱","飽","배부를 포"]],"why":"'배부를 포' — 飽和(포화) → 배부르다"},{"id":1033,"w":"包","p":"bāo","k":"동·명","ko":"싸다, 포장하다, 가방","g":"o","ex":[{"zh":"剩下的菜帮我们包起来吧。","py":"shèngxià de cài bāng wǒmen bāo qǐlai ba。","ko":"남은 음식 포장해 주세요."},{"zh":"我把礼物包好了，你看看怎么样。","py":"Wǒ bǎ lǐwù bāo hǎo le, nǐ kànkan zěnmeyàng.","ko":"선물 포장 다 했어, 어때 봐 봐.","pat":"包 + 好/起来 = 잘 싸다·포장하다 / 包饺子 = 만두를 빚다"},{"zh":"妈妈，过年我们一起包饺子吧。","py":"Māma, guònián wǒmen yìqǐ bāo jiǎozi ba.","ko":"엄마, 설날에 우리 같이 만두 빚자."}],"c":[["包","包","쌀 포"]],"why":"'쌀 포' — 包裝(포장) → 싸다"},{"id":1034,"w":"报纸","p":"bàozhǐ","k":"명","ko":"신문","g":"o","ex":[{"zh":"老板每天早上一边喝咖啡一边看报纸。","py":"lǎobǎn měi tiān zǎoshang yībiān hē kāfēi yībiān kàn bàozhǐ。","ko":"사장님은 매일 아침 커피 마시면서 신문 보셔."},{"zh":"报纸上说明天会下大雨。","py":"Bàozhǐ shàng shuō míngtiān huì xià dà yǔ.","ko":"신문에 내일 비가 많이 온대.","pat":"报纸上说… = 신문에 ~라고 나왔다"},{"zh":"爸爸现在不看报纸了，都在手机上看新闻。","py":"Bàba xiànzài bú kàn bàozhǐ le, dōu zài shǒujī shàng kàn xīnwén.","ko":"아빠는 이제 신문 안 보시고 휴대폰으로 뉴스 보셔."}],"c":[["报","報","알릴 보"],["纸","紙","종이 지"]],"why":"소식을 알리는(报) 종이(纸) → 신문"},{"id":1035,"w":"被","p":"bèi","k":"개","ko":"~에게 ~당하다(피동)","g":"o","ex":[{"zh":"空调太冷了，你盖好被子再睡。","py":"kōngtiáo tài lěng le，nǐ gài hǎo bèizi zài shuì。","ko":"에어컨 너무 추워, 이불 잘 덮고 자."},{"zh":"这床被子是新的，又软又暖和。","py":"Zhè chuáng bèizi shì xīn de, yòu ruǎn yòu nuǎnhuo.","ko":"이 이불 새 거라 푹신하고 따뜻해.","pat":"一床/一条被子 / 盖被子 = 이불 한 채 / 이불을 덮다"},{"zh":"妈妈，你给我寄的那条被子很暖和。","py":"Māma, nǐ gěi wǒ jì de nà tiáo bèizi hěn nuǎnhuo.","ko":"엄마, 보내 준 이불 엄청 따뜻해."}],"c":[["被","被","입을 피"]],"why":"'입을 피' — 被害(피해), 이불로 덮다"},{"id":1036,"w":"北方","p":"běifāng","k":"명","ko":"북쪽, 북방 지역","g":"o","ex":[{"zh":"中国北方的冬天比韩国还冷吗？","py":"Zhōngguó běifāng de dōngtiān bǐ Hánguó hái lěng ma？","ko":"중국 북방 겨울은 한국보다 더 추워?"},{"zh":"北方人比较喜欢吃面条。","py":"Běifāng rén bǐjiào xǐhuan chī miàntiáo.","ko":"북방 사람들은 면을 비교적 좋아해.","pat":"北方人 = 북쪽(북방) 사람"},{"zh":"我们有个客户是从中国北方来的。","py":"Wǒmen yǒu ge kèhù shì cóng Zhōngguó běifāng lái de.","ko":"우리 고객 중에 중국 북방에서 온 사람이 있어."}],"c":[["北","北","북녘 북"],["方","方","모 방"]],"why":"북(北)쪽 방향(方) → 북방"},{"id":1037,"w":"杯子","p":"bēizi","k":"명","ko":"컵, 잔","g":"o","ex":[{"zh":"这个杯子是{H}送我的。","py":"zhège bēizi shì {H} sòng wǒ de。","ko":"이 컵 {H}가 준 거야."},{"zh":"杯子里还有水，别倒了。","py":"Bēizi lǐ hái yǒu shuǐ, bié dào le.","ko":"컵에 아직 물 있어, 버리지 마.","pat":"杯子里 = 컵 안에"},{"zh":"妈妈，我把杯子打破了，对不起。","py":"Māma, wǒ bǎ bēizi dǎ pò le, duìbuqǐ.","ko":"엄마, 나 컵 깼어, 미안해."}],"c":[["杯","杯","잔 배"],["子","子","아들 자"]],"why":"잔(杯)+접미사(子) → 컵"},{"id":1038,"w":"本","p":"běn","k":"양·명","ko":"권(책을 세는 단위), 공책, 본래의","g":"o","ex":[{"zh":"开会时我习惯带个本子记一下。","py":"kāihuì shí wǒ xíguàn dài gè běnzi jì yīxià。","ko":"회의할 때 나는 노트 챙겨서 적는 습관이 있어."},{"zh":"我买了几个新本子。","py":"Wǒ mǎi le jǐ ge xīn běnzi.","ko":"새 공책 몇 권 샀어.","pat":"本子 = 공책 (本 + 子)"},{"zh":"{H}送了我一个可爱的本子，我用来学中文。","py":"{H} sòng le wǒ yí ge kě'ài de běnzi, wǒ yònglái xué Zhōngwén.","ko":"{H}가 귀여운 공책을 줘서 중국어 공부할 때 써."}],"c":[["本","本","근본 본"]],"why":"'근본 본' — 책을 세는 本 → 책"},{"id":1039,"w":"比","p":"bǐ","k":"개·동","ko":"~보다(비교), 비교하다, 겨루다","g":"o","ex":[{"zh":"我们比一比，看谁先做完。","py":"wǒmen bǐ yī bǐ，kàn shéi xiān zuò wán。","ko":"우리 겨뤄 보자, 누가 먼저 끝내나."},{"zh":"我哥哥比我高一点。","py":"Wǒ gēge bǐ wǒ gāo yìdiǎn.","ko":"우리 형이 나보다 조금 커.","pat":"A + 比 + B + 형용사 = A가 B보다 ~하다"},{"zh":"爸爸年纪大了，还想跟我比力气。","py":"Bàba niánjì dà le, hái xiǎng gēn wǒ bǐ lìqi.","ko":"아빠는 연세가 있으신데도 아직 나랑 힘겨루기를 하고 싶어 하셔."}],"c":[["比","比","견줄 비"]],"why":"'견줄 비' — 比較(비교) → 비교하다"},{"id":1040,"w":"变化","p":"biànhuà","k":"명·동","ko":"변화, 변하다, 바뀌다","g":"o","ex":[{"zh":"妈妈，新山这几年变化特别大。","py":"māma，Xīnshān zhè jǐ nián biànhuà tèbié dà。","ko":"엄마, 조호바루가 요 몇 년 사이 엄청 많이 변했어."},{"zh":"这几年，我的家乡发生了很大的变化。","py":"Zhè jǐ nián, wǒ de jiāxiāng fāshēng le hěn dà de biànhuà.","ko":"요 몇 년 사이 내 고향이 많이 변했어.","pat":"发生变化 = 변화가 생기다"},{"zh":"老板说，市场变化很快，我们也要变。","py":"Lǎobǎn shuō, shìchǎng biànhuà hěn kuài, wǒmen yě yào biàn.","ko":"사장님이 시장이 빨리 변하니까 우리도 변해야 한대."}],"c":[["变","變","변할 변"],["化","化","될 화"]],"why":"변해서(变) 됨(化) → 변화"},{"id":1041,"w":"别","p":"bié","k":"부·대","ko":"~하지 마라, 다른","g":"o","ex":[{"zh":"{H}，别生气了，是我不对。","py":"{H}，bié shēngqì le，shì wǒ bù duì。","ko":"{H}, 화내지 마, 내가 잘못했어."},{"zh":"别担心，一切都会好的。","py":"Bié dānxīn, yíqiè dōu huì hǎo de.","ko":"걱정 마, 다 잘될 거야.","pat":"别 + 동사 = ~하지 마 / 别的 = 다른 것"},{"zh":"老板，这台机器坏了，我们用别的吧。","py":"Lǎobǎn, zhè tái jīqì huài le, wǒmen yòng bié de ba.","ko":"사장님, 이 기계 고장 났으니까 다른 걸로 쓰죠."}],"c":[["别","別","다를 별"]],"why":"'다를 별' — 別個(별개) → 다른, ~마라"},{"id":1042,"w":"别人","p":"biéren","k":"대","ko":"다른 사람, 남","g":"o","ex":[{"zh":"这件事你先别告诉别人。","py":"zhè jiàn shì nǐ xiān bié gàosu biéren。","ko":"이 일은 일단 다른 사람한테 말하지 마."},{"zh":"多帮助别人，自己也会快乐。","py":"Duō bāngzhù biérén, zìjǐ yě huì kuàilè.","ko":"남을 많이 도우면 나도 행복해져.","pat":"帮助别人 = 남을 돕다"},{"zh":"{H}，别人怎么说不重要，我相信你。","py":"{H}, biérén zěnme shuō bú zhòngyào, wǒ xiāngxìn nǐ.","ko":"{H}, 남들이 뭐라든 상관없어, 난 너 믿어."}],"c":[["别","別","다를 별"],["人","人","사람 인"]],"why":"다른(别) 사람(人) → 남"},{"id":1043,"w":"比较","p":"bǐjiào","k":"부·동","ko":"비교적, 꽤, 비교하다","g":"o","ex":[{"zh":"我比较了三家公司的价格，这家最便宜。","py":"wǒ bǐjiào le sān jiā gōngsī de jiàgé，zhè jiā zuì piányi。","ko":"세 회사 가격 비교해 봤는데 여기가 제일 싸."},{"zh":"买东西前，最好多比较几家。","py":"Mǎi dōngxi qián, zuìhǎo duō bǐjiào jǐ jiā.","ko":"물건 사기 전엔 여러 군데 비교해 보는 게 좋아.","pat":"多比较几家 = 여러 곳을 비교해 보다"},{"zh":"妈妈总喜欢把我跟邻居家的孩子比较。","py":"Māma zǒng xǐhuan bǎ wǒ gēn línjū jiā de háizi bǐjiào.","ko":"엄마는 맨날 나를 옆집 애랑 비교해."}],"c":[["比","比","견줄 비"],["较","較","견줄 교"]],"why":"견주고(比) 견줌(较) → 비교"},{"id":1044,"w":"笔记本","p":"bǐjìběn","k":"명","ko":"공책, 노트, 노트북 컴퓨터","g":"o","ex":[{"zh":"我的笔记本上写满了生词。","py":"wǒ de bǐjìběn shàng xiě mǎn le shēngcí。","ko":"내 노트에 새 단어가 가득 적혀 있어."},{"zh":"老师说的重要内容，我都记在笔记本上。","py":"Lǎoshī shuō de zhòngyào nèiróng, wǒ dōu jì zài bǐjìběn shàng.","ko":"선생님이 말한 중요한 내용은 다 노트에 적어.","pat":"记在笔记本上 = 노트에 적다"},{"zh":"爸爸的旧笔记本里还有我小时候的照片。","py":"Bàba de jiù bǐjìběn lǐ hái yǒu wǒ xiǎo shíhou de zhàopiàn.","ko":"아빠 옛날 수첩 속에 아직 내 어릴 때 사진이 있어."}],"c":[["笔","筆","붓 필"],["记","記","기록할 기"],["本","本","근본 본"]],"why":"붓(笔)으로 기록하는(记) 책(本) → 노트"},{"id":1045,"w":"宾馆","p":"bīnguǎn","k":"명","ko":"호텔","g":"o","ex":[{"zh":"客户来的时候，我们帮他订宾馆。","py":"kèhù lái de shíhou，wǒmen bāng tā dìng bīnguǎn。","ko":"고객 오시면 우리가 호텔 잡아 드리자."},{"zh":"我们今晚住在哪家宾馆？","py":"Wǒmen jīnwǎn zhù zài nǎ jiā bīnguǎn?","ko":"우리 오늘 밤 어느 호텔에서 묵어?","pat":"住宾馆 = 호텔에 묵다"},{"zh":"妈妈，你们来新山别住宾馆了，住我家吧。","py":"Māma, nǐmen lái Xīnshān bié zhù bīnguǎn le, zhù wǒ jiā ba.","ko":"엄마, 조호바루 오면 호텔 말고 우리 집에서 지내."}],"c":[["宾","賓","손 빈"],["馆","館","집 관"]],"why":"손님(宾)의 집(馆) → 호텔"},{"id":1046,"w":"冰箱","p":"bīngxiāng","k":"명","ko":"냉장고","g":"o","ex":[{"zh":"冰箱里还有昨天的水果，快吃吧。","py":"bīngxiāng lǐ hái yǒu zuótiān de shuǐguǒ，kuài chī ba。","ko":"냉장고에 어제 과일 남았어, 얼른 먹어."},{"zh":"把牛奶放进冰箱里，别坏了。","py":"Bǎ niúnǎi fàng jìn bīngxiāng lǐ, bié huài le.","ko":"우유 냉장고에 넣어, 상하면 안 되니까.","pat":"放进冰箱(里) = 냉장고에 넣다"},{"zh":"妈妈，家里的冰箱太旧了，我给你们买个新的吧。","py":"Māma, jiā lǐ de bīngxiāng tài jiù le, wǒ gěi nǐmen mǎi ge xīn de ba.","ko":"엄마, 집 냉장고 너무 낡았어, 내가 새 걸로 사 줄게."}],"c":[["冰","氷","얼음 빙"],["箱","箱","상자 상"]],"why":"얼음(冰) 상자(箱) → 냉장고"},{"id":1047,"w":"比赛","p":"bǐsài","k":"명·동","ko":"경기, 시합, 시합하다","g":"o","ex":[{"zh":"昨晚的足球比赛你看了吗？","py":"zuówǎn de zúqiú bǐsài nǐ kàn le ma？","ko":"어젯밤 축구 경기 봤어?"},{"zh":"他参加了学校的跑步比赛。","py":"Tā cānjiā le xuéxiào de pǎobù bǐsài.","ko":"걔 학교 달리기 대회에 나갔어.","pat":"参加比赛 / 看比赛 = 경기에 참가하다 / 경기를 보다"},{"zh":"{H}，下周有韩国队的比赛，一起看吧。","py":"{H}, xià zhōu yǒu Hánguó duì de bǐsài, yìqǐ kàn ba.","ko":"{H}, 다음 주에 한국 팀 경기 있어, 같이 보자."}],"c":[["比","比","견줄 비"],["赛","賽","겨룰 새"]],"why":"견주어(比) 겨룸(赛) → 시합"},{"id":1048,"w":"必须","p":"bìxū","k":"부","ko":"반드시 ~해야 한다, 꼭","g":"o","ex":[{"zh":"进车间必须戴安全帽。","py":"jìn chējiān bìxū dài ānquánmào。","ko":"작업장 들어갈 땐 반드시 안전모 써야 해."},{"zh":"明天的会很重要，你必须来。","py":"Míngtiān de huì hěn zhòngyào, nǐ bìxū lái.","ko":"내일 회의 중요하니까 너 꼭 와야 해.","pat":"必须 + 동사 = 반드시 ~해야 한다"},{"zh":"妈妈，你必须按时吃药，别忘了。","py":"Māma, nǐ bìxū ànshí chī yào, bié wàng le.","ko":"엄마, 약은 꼭 제때 먹어야 해, 잊지 마."}],"c":[["必","必","반드시 필"],["须","須","모름지기 수"]],"why":"반드시(必) 모름지기(须) → 꼭 해야"},{"id":1049,"w":"不","p":"bù","k":"부","ko":"아니다, ~하지 않다","g":"o","ex":[{"zh":"{H}，我今天不加班，早点去找你。","py":"{H}，wǒ jīntiān bù jiābān，zǎo diǎn qù zhǎo nǐ。","ko":"{H}, 나 오늘 야근 안 하고 일찍 너 보러 갈게."},{"zh":"我不太喜欢吃甜的。","py":"Wǒ bú tài xǐhuan chī tián de.","ko":"나 단 거 별로 안 좋아해.","pat":"不太 + 동사/형용사 = 별로 ~하지 않다"},{"zh":"妈妈，我不冷，这边每天都三十多度。","py":"Māma, wǒ bù lěng, zhèbiān měitiān dōu sānshí duō dù.","ko":"엄마, 나 안 추워, 여긴 매일 30도 넘어."}],"c":[["不","不","아닐 불"]],"why":"'아닐 불' — 不可(불가) → 부정"},{"id":1050,"w":"不但","p":"búdàn","k":"연","ko":"~뿐만 아니라","g":"o","ex":[{"zh":"{H}不但漂亮，而且对我特别好。","py":"{H} bùdàn piàoliang，érqiě duì wǒ tèbié hǎo。","ko":"{H}는 예쁠 뿐만 아니라 나한테 엄청 잘해줘."},{"zh":"他不但会说中文，而且会说英语。","py":"Tā búdàn huì shuō Zhōngwén, érqiě huì shuō Yīngyǔ.","ko":"걔는 중국어뿐만 아니라 영어도 할 줄 알아.","pat":"不但…而且… = ~할 뿐만 아니라 ~하기도 하다"},{"zh":"妈妈做的菜不但好吃，而且很健康。","py":"Māma zuò de cài búdàn hǎochī, érqiě hěn jiànkāng.","ko":"엄마가 한 음식은 맛있을 뿐만 아니라 건강에도 좋아."}],"c":[["不","不","아닐 부"],["但","但","다만 단"]],"why":"다만(但) ~만이 아님(不) → ~뿐 아니라"},{"id":1051,"w":"不客气","p":"búkèqi","k":"동","ko":"천만에요, 별말씀을요","g":"o","ex":[{"zh":"{H}吃东西从来不客气。","py":"{H} chī dōngxi cónglái bùkèqi.","ko":"{H}는 먹을 때 절대 사양 안 해."},{"zh":"老板说话很不客气，大家都有点儿怕他。","py":"Lǎobǎn shuōhuà hěn búkèqi, dàjiā dōu yǒudiǎnr pà tā.","ko":"사장님은 말을 너무 거침없이 해서 다들 좀 무서워해.","pat":"说话(很)不客气 = 말을 거침없이/무례하게 하다"},{"zh":"同事来我家吃饭，一点儿也不客气。","py":"Tóngshì lái wǒ jiā chīfàn, yìdiǎnr yě búkèqi.","ko":"동료가 우리 집에 밥 먹으러 와서 하나도 사양을 안 하더라."}],"c":[["不","不","아닐 불"],["客","客","손 객"],["气","氣","기운 기"]],"why":"손님(客)처럼 기운(气) 차리지 않음(不) → 천만에요"},{"id":1052,"w":"才","p":"cái","k":"부","ko":"겨우, 비로소, 막","g":"o","ex":[{"zh":"我昨天晚上十一点才下班。","py":"wǒ zuótiān wǎnshang shíyī diǎn cái xiàbān.","ko":"나 어제 밤 11시에야 겨우 퇴근했어."},{"zh":"客户等了两个星期，才收到我们的货。","py":"Kèhù děngle liǎng ge xīngqī, cái shōudào wǒmen de huò.","ko":"고객이 2주나 기다려서야 우리 물건을 받았어.","pat":"시간·조건 + 才 + 동사 = 그제야 비로소 ~하다"},{"zh":"{H}说了三遍，我才听懂。","py":"{H} shuōle sān biàn, wǒ cái tīngdǒng.","ko":"{H}가 세 번이나 말해 줘서야 겨우 알아들었어."}],"c":[["才","才","재주 재"]],"why":"재주 재 → '겨우·비로소'로 쓰임"},{"id":1053,"w":"菜","p":"cài","k":"명","ko":"요리, 반찬, 채소","g":"o","ex":[{"zh":"妈妈做的菜还是最好吃。","py":"māma zuò de cài háishi zuì hǎochī.","ko":"엄마가 한 음식이 역시 제일 맛있어."},{"zh":"{H}，今天晚上我来做菜，你休息吧。","py":"{H}, jīntiān wǎnshang wǒ lái zuò cài, nǐ xiūxi ba.","ko":"{H}, 오늘 저녁은 내가 요리할게, 넌 쉬어.","pat":"做菜·点菜·买菜 = 요리하다·주문하다·장 보다"},{"zh":"公司旁边那家店的菜又便宜又好吃。","py":"Gōngsī pángbiān nà jiā diàn de cài yòu piányi yòu hǎochī.","ko":"회사 옆 그 가게 음식은 싸고 맛있어."}],"c":[["菜","菜","나물 채"]],"why":"나물(菜) → 채소·요리"},{"id":1054,"w":"菜单","p":"càidān","k":"명","ko":"메뉴, 차림표","g":"o","ex":[{"zh":"{H}，你先看菜单，想吃什么就点。","py":"{H}, nǐ xiān kàn càidān, xiǎng chī shénme jiù diǎn.","ko":"{H}, 메뉴 먼저 보고 먹고 싶은 거 시켜."},{"zh":"服务员，请给我们拿一下菜单。","py":"Fúwùyuán, qǐng gěi wǒmen ná yíxià càidān.","ko":"저기요, 메뉴판 좀 갖다 주세요.","pat":"(请)给我拿一下菜单 = 메뉴판 좀 갖다 주세요"},{"zh":"妈，这家饭馆的菜单是韩语的。","py":"Mā, zhè jiā fànguǎn de càidān shì Hányǔ de.","ko":"엄마, 이 식당 메뉴판이 한국어로 돼 있어."}],"c":[["菜","菜","나물 채"],["单","單","홑 단"]],"why":"요리(菜)를 적은 쪽지(单) → 메뉴"},{"id":1055,"w":"参加","p":"cānjiā","k":"동","ko":"참가하다, 참석하다","g":"o","ex":[{"zh":"妈，下个月我要参加HSK四级考试。","py":"mā, xià ge yuè wǒ yào cānjiā HSK sì jí kǎoshì.","ko":"엄마, 나 다음 달에 HSK 4급 시험 봐."},{"zh":"下周我要参加一个很重要的会议。","py":"Xià zhōu wǒ yào cānjiā yí ge hěn zhòngyào de huìyì.","ko":"다음 주에 아주 중요한 회의에 참석해야 해.","pat":"参加 + 会议/考试/比赛 = 회의·시험·대회에 참가하다"},{"zh":"{H}，你朋友的生日聚会我也参加吗？","py":"{H}, nǐ péngyou de shēngrì jùhuì wǒ yě cānjiā ma?","ko":"{H}, 네 친구 생일 파티에 나도 가는 거야?"}],"c":[["参","參","참여할 참"],["加","加","더할 가"]],"why":"참여해(参) 더해짐(加) → 참가하다"},{"i ,"ko":"이번 달에 고객이 벌써 세 번 왔어."},{"zh":"{H}，下次我们去吃韩国菜吧。","py":"{H}, xià cì wǒmen qù chī Hánguócài ba.","ko":"{H}, 다음번엔 한국 음식 먹으러 가자.","pat":"下次 / 第一次 = 다음번 / 처음"},{"zh":"爸，你一年要去医院检查一次身体。","py":"Bà, nǐ yì nián yào qù yīyuàn jiǎnchá yí cì shēntǐ.","ko":"아빠, 1년에 한 번은 병원 가서 건강검진 받아야 해."}],"c":[["次","次","차례 차"]],"why":"차례(次例)의 차 → 번·회"},{"id":1073,"w":"词典","p":"cídiǎn","k":"명","ko":"사전","g":"o","ex":[{"zh":"我在手机上用词典查这个词。","py":"wǒ zài shǒujī shang yòng cídiǎn chá zhège cí.","ko":"휴대폰으로 사전에서 이 단어 찾아볼게."},{"zh":"这个字我不认识，我查一下词典。","py":"Zhège zì wǒ bú rènshi, wǒ chá yíxià cídiǎn.","ko":"이 글자 모르겠어, 사전 좀 찾아볼게.","pat":"查词典 = 사전을 찾다"},{"zh":"{H}送了我一本汉韩词典。","py":"{H} sòngle wǒ yì běn Hàn-Hán cídiǎn.","ko":"{H}가 중한사전을 한 권 선물해 줬어."}],"c":[["词","詞","말씀 사"],["典","典","법 전"]],"why":"낱말(词)을 모은 책(典) → 사전"},{"id":1074,"w":"聪明","p":"cōngming","k":"형","ko":"똑똑하다, 총명하다","g":"o","ex":[{"zh":"这个新同事很聪明，学得很快。","py":"zhège xīn tóngshì hěn cōngming, xué de hěn kuài.","ko":"이번 신입 동료 엄청 똑똑해, 배우는 게 빨라."},{"zh":"老板的女儿又聪明又可爱。","py":"Lǎobǎn de nǚ'ér yòu cōngming yòu kě'ài.","ko":"사장님 딸은 똑똑하고 귀여워.","pat":"又聪明又 + 형용사 = 똑똑하고 ~하다"},{"zh":"{H}很聪明，什么东西一学就会。","py":"{H} hěn cōngming, shénme dōngxi yì xué jiù huì.","ko":"{H}는 똑똑해서 뭐든 한 번 배우면 바로 해."}],"c":[["聪","聰","귀밝을 총"],["明","明","밝을 명"]],"why":"귀 밝고(聪) 눈 밝음(明) → 총명하다"},{"id":1075,"w":"错","p":"cuò","k":"형·명","ko":"틀리다, 잘못, 실수","g":"o","ex":[{"zh":"老板，这个数字我写错了。","py":"lǎobǎn, zhège shùzì wǒ xiě cuò le.","ko":"사장님, 이 숫자 제가 잘못 썼어요."},{"zh":"妈，你记错了，我下个月十号才回去。","py":"Mā, nǐ jìcuò le, wǒ xià ge yuè shí hào cái huíqu.","ko":"엄마, 잘못 기억했어, 나 다음 달 10일에야 들어가.","pat":"동사 + 错 (写错·记错·打错) = 잘못 ~하다"},{"zh":"{H}，对不起，是我错了，别生气了。","py":"{H}, duìbuqǐ, shì wǒ cuò le, bié shēngqì le.","ko":"{H}, 미안해, 내가 잘못했어, 화 풀어."}],"c":[["错","錯","어긋날 착"]],"why":"착오(錯誤)의 착 → 틀리다"},{"id":1076,"w":"大","p":"dà","k":"형","ko":"크다, 많다, 나이가 많다","g":"o","ex":[{"zh":"我们的新工厂比以前大多了。","py":"wǒmen de xīn gōngchǎng bǐ yǐqián dà duō le.","ko":"우리 새 공장은 예전보다 훨씬 커."},{"zh":"妈，外面雨很大，你今天别出门了。","py":"Mā, wàimiàn yǔ hěn dà, nǐ jīntiān bié chūmén le.","ko":"엄마, 밖에 비 많이 오니까 오늘은 나가지 마.","pat":"雨/风 + 很大 = 비·바람이 세다"},{"zh":"{H}，这件衣服你穿有点儿大。","py":"{H}, zhè jiàn yīfu nǐ chuān yǒudiǎnr dà.","ko":"{H}, 이 옷은 너한테 좀 커."}],"c":[["大","大","큰 대"]],"why":"대소(大小)의 대 → 크다"},{"id":1077,"w":"打电话","p":"dǎdiànhuà","k":"동","ko":"전화를 걸다","g":"o","ex":[{"zh":"我每个星期给爸妈打电话。","py":"wǒ měi ge xīngqī gěi bà mā dǎ diànhuà.","ko":"나는 매주 부모님한테 전화해."},{"zh":"有什么问题，您可以给我打电话。","py":"Yǒu shénme wèntí, nín kěyǐ gěi wǒ dǎ diànhuà.","ko":"무슨 문제 있으시면 저한테 전화 주셔도 돼요.","pat":"给 + 사람 + 打电话 = ~에게 전화하다"},{"zh":"{H}昨天晚上给我打电话，说她想我了。","py":"{H} zuótiān wǎnshang gěi wǒ dǎ diànhuà, shuō tā xiǎng wǒ le.","ko":"{H}가 어젯밤에 전화해서 나 보고 싶대."}],"c":[["打","打","칠 타"],["电","電","번개 전"],["话","話","말씀 화"]],"why":"전화(电话)를 침(打) → 전화하다"},{"id":1078,"w":"带","p":"dài","k":"동·명","ko":"가지고 가다, 데리고 가다, 띠","g":"o","ex":[{"zh":"{H}提醒我别忘了带护照。","py":"{H} tíxǐng wǒ bié wàng le dài hùzhào.","ko":"{H}가 여권 챙기는 거 잊지 말라고 일러줬어."},{"zh":"明天去见客户，你带上电脑吧。","py":"Míngtiān qù jiàn kèhù, nǐ dàishang diànnǎo ba.","ko":"내일 고객 만나러 가니까 컴퓨터 챙겨 가.","pat":"带上 + 물건 = ~을 챙겨 가다"},{"zh":"妈，你想要什么？我回去给你带。","py":"Mā, nǐ xiǎng yào shénme? Wǒ huíqu gěi nǐ dài.","ko":"엄마, 뭐 갖고 싶어? 들어갈 때 챙겨 갈게."}],"c":[["带","帶","띠 대"]],"why":"띠(带)를 두르듯 몸에 지님 → 챙기다"},{"id":1079,"w":"大家","p":"dàjiā","k":"대","ko":"모두, 여러분","g":"o","ex":[{"zh":"大家辛苦了，今天早点儿下班吧。","py":"dàjiā xīnkǔ le, jīntiān zǎo diǎnr xiàbān ba.","ko":"다들 수고했어요, 오늘은 일찍 퇴근해요."},{"zh":"{H}，你做的菜大家都说好吃。","py":"{H}, nǐ zuò de cài dàjiā dōu shuō hǎochī.","ko":"{H}, 네가 만든 음식 다들 맛있대.","pat":"大家都 + 동사 = 다들 ~하다"},{"zh":"过年的时候大家都回家了，我一个人在新山。","py":"Guònián de shíhou dàjiā dōu huí jiā le, wǒ yí ge rén zài Xīnshān.","ko":"설 때 다들 집에 갔는데 나 혼자 조호르바루에 있었어."}],"c":[["大","大","큰 대"],["家","家","집 가"]],"why":"큰(大) 집안(家) 사람 모두 → 모두"},{"id":1080,"w":"蛋糕","p":"dàngāo","k":"명","ko":"케이크","g":"o","ex":[{"zh":"我给{H}买了一个生日蛋糕。","py":"wǒ gěi {H} mǎi le yī ge shēngrì dàngāo.","ko":"{H}한테 생일 케이크 하나 사 줬어."},{"zh":"今天是同事的生日，老板买了蛋糕。","py":"Jīntiān shì tóngshì de shēngrì, lǎobǎn mǎile dàngāo.","ko":"오늘 동료 생일이라 사장님이 케이크를 사 오셨어.","pat":"买/做/切蛋糕 = 케이크를 사다/만들다/자르다"},{"zh":"妈，爸爸生日那天你们买蛋糕了吗？","py":"Mā, bàba shēngrì nà tiān nǐmen mǎi dàngāo le ma?","ko":"엄마, 아빠 생일날 케이크 샀어?"}],"c":[["蛋","蛋","새알 단"],["糕","糕","떡 고"]],"why":"달걀(蛋)로 만든 떡(糕) → 케이크"},{"id":1081,"w":"当然","p":"dāngrán","k":"형·부","ko":"당연하다, 물론","g":"o","ex":[{"zh":"当然可以，我明天就把报价发给您。","py":"dāngrán kěyǐ, wǒ míngtiān jiù bǎ bàojià fā gěi nín.","ko":"물론이죠, 내일 바로 견적 보내 드릴게요."},{"zh":"{H}问我想不想她，我说当然想。","py":"{H} wèn wǒ xiǎng bu xiǎng tā, wǒ shuō dāngrán xiǎng.","ko":"{H}가 자기 보고 싶냐고 물어서 당연히 보고 싶다고 했어.","pat":"当然 + 동사/형용사 = 당연히 ~하다"},{"zh":"爸，我当然记得你的生日。","py":"Bà, wǒ dāngrán jìde nǐ de shēngrì.","ko":"아빠, 당연히 아빠 생일 기억하지."}],"c":[["当","當","마땅 당"],["然","然","그럴 연"]],"why":"마땅히(当) 그러함(然) → 당연하다"},{"id":1082,"w":"但是","p":"dànshì","k":"연","ko":"그러나, 하지만","g":"o","ex":[{"zh":"我很想回家，但是工作太忙了。","py":"wǒ hěn xiǎng huí jiā, dànshì gōngzuò tài máng le.","ko":"집에 너무 가고 싶은데, 일이 너무 바빠."},{"zh":"虽然工作很累，但是我很喜欢。","py":"Suīrán gōngzuò hěn lèi, dànshì wǒ hěn xǐhuan.","ko":"일은 힘들지만 나는 좋아.","pat":"虽然 A，但是 B = 비록 A지만 B"},{"zh":"{H}平时很忙，但是每天都给我打电话。","py":"{H} píngshí hěn máng, dànshì měi tiān dōu gěi wǒ dǎ diànhuà.","ko":"{H}는 평소에 바쁘지만 매일 나한테 전화해 줘."}],"c":[["但","但","다만 단"],["是","是","옳을 시"]],"why":"다만(但) 이것은(是) → 그러나"},{"id":1083,"w":"担心","p":"dānxīn","k":"동","ko":"걱정하다, 염려하다","g":"o","ex":[{"zh":"妈，别担心，我在这儿很好。","py":"mā, bié dānxīn, wǒ zài zhèr hěn hǎo.","ko":"엄마, 걱정 마, 나 여기서 잘 지내."},{"zh":"老板担心这批货不能按时到。","py":"Lǎobǎn dānxīn zhè pī huò bù néng ànshí dào.","ko":"사장님이 이번 물건이 제때 도착 못 할까 봐 걱정해.","pat":"担心 + 내용 = ~할까 봐 걱정하다"},{"zh":"{H}，你一个人回家，我有点儿担心。","py":"{H}, nǐ yí ge rén huí jiā, wǒ yǒudiǎnr dānxīn.","ko":"{H}, 너 혼자 집에 가는 거 좀 걱정돼."}],"c":[["担","擔","멜 담"],["心","心","마음 심"]],"why":"마음(心)을 짊어짐(担) → 걱정하다"},{"id":1084,"w":"到","p":"dào","k":"동·개","ko":"도착하다, 이르다, ~까지","g":"o","ex":[{"zh":"我已经到新加坡了，你在哪儿？","py":"wǒ yǐjīng dào Xīnjiāpō le, nǐ zài nǎr?","ko":"나 벌써 싱가포르 도착했어, 너 어디야?"},{"zh":"妈，飞机晚上八点到首尔。","py":"Mā, fēijī wǎnshang bā diǎn dào Shǒu'ěr.","ko":"엄마, 비행기 저녁 8시에 서울 도착해.","pat":"到 + 장소 = ~에 도착하다"},{"zh":"客户的货今天下午能到吗？","py":"Kèhù de huò jīntiān xiàwǔ néng dào ma?","ko":"고객 물건 오늘 오후에 도착할 수 있어?"}],"c":[["到","到","이를 도"]],"why":"도착(到着)의 도 → 이르다"},{"id":1085,"w":"打扫","p":"dǎsǎo","k":"동","ko":"청소하다","g":"o","ex":[{"zh":"这个星期{H}来新山，我得打扫一下房间。","py":"zhège xīngqī {H} lái Xīnshān, wǒ děi dǎsǎo yīxià fángjiān.","ko":"이번 주에 {H}가 조호바루 오니까 방 청소 좀 해야겠어."},{"zh":"下班前，大家把车间打扫一下。","py":"Xiàbān qián, dàjiā bǎ chējiān dǎsǎo yíxià.","ko":"퇴근 전에 다들 작업장 청소 좀 하자.","pat":"把 + 장소 + 打扫一下/干净 = ~을 청소하다"},{"zh":"妈，过年的时候我回去帮你打扫房子。","py":"Mā, guònián de shíhou wǒ huíqu bāng nǐ dǎsǎo fángzi.","ko":"엄마, 설에 들어가면 집 청소 도와줄게."}],"c":[["打","打","칠 타"],["扫","掃","쓸 소"]],"why":"털고(打) 쓸어냄(扫) → 청소하다"},{"id":1086,"w":"打算","p":"dǎsuan","k":"동·명","ko":"~할 계획이다, 계획, 생각","g":"o","ex":[{"zh":"你过年打算回韩国吗？","py":"nǐ guònián dǎsuan huí Hánguó ma?","ko":"설에 한국 돌아갈 생각이야?"},{"zh":"这个周末我打算在家好好休息。","py":"Zhège zhōumò wǒ dǎsuan zài jiā hǎohǎo xiūxi.","ko":"이번 주말엔 집에서 푹 쉴 생각이야.","pat":"打算 + 동사 = ~할 생각이다"},{"zh":"{H}，我打算明年带你去见我爸妈。","py":"{H}, wǒ dǎsuan míngnián dài nǐ qù jiàn wǒ bà mā.","ko":"{H}, 내년에 너 데리고 우리 부모님 뵈러 갈 생각이야."}],"c":[["打","打","칠 타"],["算","算","셈 산"]],"why":"셈(算)을 쳐봄(打) → 계획하다"},{"id":1087,"w":"地","p":"de","k":"조","ko":"~하게(동사·형용사를 꾸미는 조사)","g":"o","ex":[{"zh":"{H}高兴地说：“谢谢你！”","py":"{H} gāoxìng de shuō: \"xièxie nǐ!\"","ko":"{H}가 신나서 \"고마워!\"라고 했어."},{"zh":"妈妈在电话里开心地笑了。","py":"Māma zài diànhuà li kāixīn de xiào le.","ko":"엄마가 전화로 즐겁게 웃으셨어.","pat":"형용사 + 地 + 동사 = ~하게 ~하다 (高兴地说·认真地做)"},{"zh":"老板生气地说：“这个问题怎么还没解决？”","py":"Lǎobǎn shēngqì de shuō: “Zhège wèntí zěnme hái méi jiějué?”","ko":"사장님이 화난 듯이 \"이 문제 왜 아직도 해결 안 됐어?\"라고 했어."}],"c":[["地","地","땅 지"]],"why":"땅 지 → 부사어 뒤 조사 de로 쓰임"},{"id":1088,"w":"的","p":"de","k":"조","ko":"~의, ~한(수식·소유)","g":"o","ex":[{"zh":"这是我女朋友送的手表。","py":"zhè shì wǒ nǚpéngyou sòng de shǒubiǎo.","ko":"이건 여자친구가 선물해 준 시계야."},{"zh":"妈，你寄的东西我昨天收到了。","py":"Mā, nǐ jì de dōngxi wǒ zuótiān shōudào le.","ko":"엄마, 엄마가 보낸 물건 어제 받았어 "pat":"对不起，+ 이유 = 미안해, ~해서"},{"zh":"妈，对不起，今年过年我回不去了。","py":"Mā, duìbuqǐ, jīnnián guònián wǒ huí bu qù le.","ko":"엄마, 미안해, 올해 설에는 못 들어가겠어."}],"c":[["对","對","대할 대"],["不","不","아닐 불"],["起","起","일어날 기"]],"why":"마주할(对) 낯이 서지(起) 않음(不) → 미안하다"},{"id":1109,"w":"多","p":"duō","k":"형·부","ko":"많다, 얼마나, ~남짓","g":"o","ex":[{"zh":"这个月的订单比上个月多。","py":"zhège yuè de dìngdān bǐ shàng ge yuè duō.","ko":"이번 달 주문이 지난달보다 많아."},{"zh":"周末去新加坡的人太多了，过关要两个小时。","py":"Zhōumò qù Xīnjiāpō de rén tài duō le, guòguān yào liǎng ge xiǎoshí.","ko":"주말에 싱가포르 가는 사람이 너무 많아서 국경 넘는 데 두 시간 걸려.","pat":"人太多了 = 사람이 너무 많다"},{"zh":"妈，你别做那么多菜，我们吃不完。","py":"Mā, nǐ bié zuò nàme duō cài, wǒmen chī bu wán.","ko":"엄마, 음식 그렇게 많이 하지 마, 다 못 먹어."}],"c":[["多","多","많을 다"]],"why":"다수(多數)의 다 → 많다"},{"id":1110,"w":"多少","p":"duōshǎo","k":"대","ko":"얼마, 몇","g":"o","ex":[{"zh":"我多少会说一点儿马来语。","py":"wǒ duōshǎo huì shuō yīdiǎnr Mǎláiyǔ.","ko":"나 말레이어 조금은 할 줄 알아."},{"zh":"{H}多少有点儿不高兴，因为我又加班了。","py":"{H} duōshǎo yǒudiǎnr bù gāoxìng, yīnwèi wǒ yòu jiābān le.","ko":"내가 또 야근해서 {H}가 좀 서운해했어.","pat":"多少有点儿 + 형용사 = 다소 ~한 편이다"},{"zh":"这个问题老板多少也知道一点儿。","py":"Zhège wèntí lǎobǎn duōshǎo yě zhīdao yìdiǎnr.","ko":"이 문제는 사장님도 어느 정도는 알고 계셔."}],"c":[["多","多","많을 다"],["少","少","적을 소"]],"why":"많고(多) 적음(少) → 얼마·다소"},{"id":1111,"w":"饿","p":"è","k":"형","ko":"배고프다","g":"o","ex":[{"zh":"我饿死了，我们先去吃饭吧。","py":"wǒ è sǐ le, wǒmen xiān qù chī fàn ba.","ko":"배고파 죽겠어, 우리 먼저 밥 먹으러 가자."},{"zh":"{H}，你饿不饿？我给你做点儿吃的。","py":"{H}, nǐ è bu è? Wǒ gěi nǐ zuò diǎnr chī de.","ko":"{H}, 배고파? 내가 먹을 거 좀 해 줄게.","pat":"饿不饿? / 饿了 = 배고파? / 배고파졌다"},{"zh":"开了一上午的会，大家都饿了。","py":"Kāile yí shàngwǔ de huì, dàjiā dōu è le.","ko":"오전 내내 회의해서 다들 배고파졌어."}],"c":[["饿","餓","주릴 아"]],"why":"아사(餓死)의 아 → 배고프다"},{"id":1112,"w":"二","p":"èr","k":"수","ko":"둘, 2","g":"o","ex":[{"zh":"我们二月一起回韩国过年吧。","py":"wǒmen èr yuè yīqǐ huí Hánguó guònián ba.","ko":"우리 2월에 같이 한국 가서 설 쇠자."},{"zh":"妈，我二号晚上到首尔。","py":"Mā, wǒ èr hào wǎnshang dào Shǒu'ěr.","ko":"엄마, 나 2일 저녁에 서울 도착해.","pat":"二号·二楼·二月 = 2일·2층·2월 (양사 앞은 两)"},{"zh":"我的办公室在二楼最里面。","py":"Wǒ de bàngōngshì zài èr lóu zuì lǐmiàn.","ko":"내 사무실은 2층 맨 안쪽이야."}],"c":[["二","二","두 이"]],"why":"이(二) → 둘"},{"id":1113,"w":"耳朵","p":"ěrduo","k":"명","ko":"귀","g":"o","ex":[{"zh":"车间太吵了，耳朵很不舒服。","py":"chējiān tài chǎo le, ěrduo hěn bù shūfu.","ko":"작업장이 너무 시끄러워서 귀가 불편해."},{"zh":"爸爸的耳朵最近不太好，打电话要大声说。","py":"Bàba de ěrduo zuìjìn bú tài hǎo, dǎ diànhuà yào dàshēng shuō.","ko":"아빠가 요즘 귀가 잘 안 들려서 전화할 때 크게 말해야 해.","pat":"耳朵不好 = 귀가 잘 안 들리다"},{"zh":"{H}，你的耳朵怎么这么红？","py":"{H}, nǐ de ěrduo zěnme zhème hóng?","ko":"{H}, 너 귀가 왜 이렇게 빨개?"}],"c":[["耳","耳","귀 이"],["朵","朵","꽃송이 타"]],"why":"귀(耳) 송이(朵) → 귀"},{"id":1114,"w":"而且","p":"érqiě","k":"연","ko":"게다가, 또한","g":"o","ex":[{"zh":"这家店的菜很好吃，而且不贵。","py":"zhè jiā diàn de cài hěn hǎochī, érqiě bù guì.","ko":"이 집 음식 맛있는데 게다가 비싸지도 않아."},{"zh":"这家工厂不但大，而且很干净。","py":"Zhè jiā gōngchǎng búdàn dà, érqiě hěn gānjìng.","ko":"이 공장은 클 뿐만 아니라 깨끗하기도 해.","pat":"不但 A，而且 B = A일 뿐만 아니라 B"},{"zh":"新同事很聪明，而且工作很认真。","py":"Xīn tóngshì hěn cōngming, érqiě gōngzuò hěn rènzhēn.","ko":"새 동료는 똑똑하고 게다가 일도 성실하게 해."}],"c":[["而","而","말이을 이"],["且","且","또 차"]],"why":"그리고(而) 또(且) → 게다가"},{"id":1115,"w":"儿子","p":"érzi","k":"명","ko":"아들","g":"o","ex":[{"zh":"妈妈总说：“儿子，早点儿结婚吧。”","py":"māma zǒng shuō: \"érzi, zǎo diǎnr jiéhūn ba.\"","ko":"엄마는 맨날 \"아들, 빨리 결혼해\"라고 해."},{"zh":"老板的儿子明年要来公司工作。","py":"Lǎobǎn de érzi míngnián yào lái gōngsī gōngzuò.","ko":"사장님 아들이 내년에 회사에 와서 일한대.","pat":"사람 + 的儿子 / 一个儿子 = ~의 아들 / 아들 하나"},{"zh":"{H}说，以后想要一个儿子一个女儿。","py":"{H} shuō, yǐhòu xiǎng yào yí ge érzi yí ge nǚ'ér.","ko":"{H}가 나중에 아들 하나 딸 하나 갖고 싶대."}],"c":[["儿","兒","아이 아"],["子","子","아들 자"]],"why":"아이(儿) 아들(子) → 아들"},{"id":1116,"w":"发","p":"fā","k":"동","ko":"보내다, 발송하다, 생기다","g":"o","ex":[{"zh":"我把报价单发给客户了。","py":"wǒ bǎ bàojiàdān fā gěi kèhù le.","ko":"견적서 고객한테 보냈어."},{"zh":"{H}，到了家给我发个消息。","py":"{H}, dàole jiā gěi wǒ fā ge xiāoxi.","ko":"{H}, 집에 도착하면 메시지 보내 줘.","pat":"给 + 사람 + 发消息/邮件 = ~에게 메시지·메일을 보내다"},{"zh":"妈，你把照片发到我手机上吧。","py":"Mā, nǐ bǎ zhàopiàn fā dào wǒ shǒujī shang ba.
