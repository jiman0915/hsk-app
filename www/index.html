<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>HSK 4 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: study-planner notebook — graph-paper page, one column; home = Day grid, study = one card with a highlighter-marked word */
:root{
  --paper:#f4eee2; --surface:#ffffff; --ink:#2a2620; --muted:#7b7365; --line:#e4dac7; --gridline:#ebe2d0; color-scheme:light;
  --jade:#3563e9; --jade-soft:#eaf0ff; --grid:#cdbfa3; --bad:#e5484d; --bad-soft:#fde8e8; --mark:#fff27a; --memo:#ffffff; --memo-line:#ffe066; --on-acc:#ffffff;
  --f-han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-disp:"Gaegu","Noto Sans KR",cursive;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.set .row input{min-width:0;width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
h1{font-family:var(--f-han);font-size:1.5rem;margin:0}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .back{border:0;background:none;font-size:1.1rem;padding:6px 8px;margin-left:-8px}
.top b{font-size:1.05rem}
.top span{margin-left:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:-6px 0 14px}
.bar i{display:block;height:100%;background:var(--jade)}
.btn{font-weight:700;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.btn.soft{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled,.cnt button:disabled,.cnt input:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}
/* home */
.wrongbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.wrongbox b{color:var(--bad);font-family:var(--f-mono);font-size:1.2rem}
.wrongbox .btn{padding:9px 14px;flex:0 0 auto}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.day{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;display:grid;gap:2px}
.day b{font-size:.95rem}
.day small{font-size:.75rem;color:var(--muted)}
.day.done{background:var(--jade-soft);border-color:transparent}
.day.done small{color:var(--jade)}
.day.next{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade)}
.sect{font-size:.8rem;color:var(--muted);margin:18px 0 8px;letter-spacing:.02em}
/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.tian{display:flex;justify-content:center;align-items:center;min-height:170px;border:1.5px solid var(--grid);border-radius:4px;cursor:pointer;
  background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat}
.han{font-family:var(--f-han);font-weight:700;font-size:clamp(3rem,15vw,5rem);line-height:1.1;background:var(--surface);padding:0 .12em;text-align:center}
.reveal{display:grid;gap:22px;text-align:center}
.reveal .mean{margin-top:4px}
.py{font-size:1.3rem;color:var(--jade);font-weight:500}
.mean{font-size:1.15rem;font-weight:700;text-wrap:balance}
.pos{font-size:.75rem;color:var(--muted);font-weight:500;margin-left:4px}
.hj{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.hj span{display:inline-flex;align-items:baseline;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.hj span em{font-style:normal;font-family:var(--f-han);font-size:1.15rem;font-weight:700}
.hj span i{font-style:normal;font-size:.85rem}
.why{font-size:.88rem;color:var(--muted)}
.ex .zh mark{cursor:pointer}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--jade);border-radius:14px;padding:16px;margin-bottom:12px}
.hero .hd{font-family:var(--f-disp);font-size:2.1rem;color:var(--jade);line-height:1.1}
.hero .btn{flex:0 0 auto;padding:13px 22px}
.rev{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.revt{display:grid}.revt span{font-size:.82rem;color:var(--muted)}
.cnt{display:flex;gap:6px;flex-wrap:wrap}
.cnt button{flex:1;min-width:52px;padding:9px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.cnt button[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.cnt input{flex:1;min-width:64px;font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-align:center}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.gear{border:0;background:none;font-size:1.3rem;color:var(--muted);padding:6px 4px}
#setBox{margin-top:20px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.alldays{margin-top:6px}.alldays summary{padding:10px 0}
.card.study{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
html.locked,html.locked body{height:100%;overflow:hidden;overscroll-behavior:none}
html.locked .wrap{height:100%;display:flex;flex-direction:column;padding-block:12px 14px}
html.locked .top{flex:0 0 auto}html.locked .bar{flex:0 0 auto}
.nav{position:absolute;top:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;color:var(--muted);display:grid;place-items:center;padding:0 0 3px}
.nav.l{left:10px}.nav.r{right:10px}
.nav:disabled{opacity:.3;cursor:default}
.sbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.sbody .tian,.sbody.open .tian{flex:0 0 auto;min-height:0;padding:28px 0 4px}
.card.study .row{flex:0 0 auto}
.ex.memo{background:var(--memo);border:2px solid var(--memo-line)}
.reward{display:flex;align-items:baseline;gap:8px;margin:20px 0 10px}.reward b{font-size:1.1rem;color:var(--jade)}.reward span{font-size:.85rem;color:var(--muted)}
.tagx{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.xh{font-family:var(--f-han);font-size:1.7rem;font-weight:700}.xh span{font-family:var(--f-body);font-size:.95rem;color:var(--jade);font-weight:500;margin-left:6px}
.pop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;display:grid;gap:12px;text-align:center;
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .x{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px));border:0;background:none;font-size:1.6rem;color:var(--muted);padding:4px 10px}
.pw{font-family:var(--f-han);font-size:2.2rem;font-weight:700}
.pw span{font-family:var(--f-body);font-size:1rem;color:var(--jade);font-weight:500;margin-left:6px}
.sheet .hj span{padding:8px 14px}.sheet .hj em{font-size:1.6rem}.sheet .hj i{font-size:1rem}
.pwhy{font-size:1rem;font-weight:500}
.pm{font-size:.88rem;color:var(--muted)}
.ex{text-align:left;background:var(--paper);border-radius:10px;padding:12px 14px;display:grid;gap:3px;position:relative}
.ex .zh{font-family:var(--f-han);font-size:1.12rem;padding-right:40px}
.ex .zh mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.ex .epy{font-size:.82rem;color:var(--jade)}
.ex .eko{font-size:.88rem}
.ex button{position:absolute;top:8px;right:8px;border:0;background:none;font-size:1.1rem;padding:4px}
.extag{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.pat{font-size:.85rem;font-weight:700;color:var(--jade);background:var(--jade-soft);border-radius:6px;padding:4px 8px;justify-self:start;margin:2px 0 4px}
.extools{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:-10px}
.extools .star{font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.extools .star[aria-pressed="true"]{background:var(--jade-soft);border-color:transparent;color:var(--jade)}
.ex .pat{margin:6px 0 0}
.ex .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ex .star{position:static;justify-self:start;font-size:.82rem;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.ex .star[aria-pressed="true"]{background:var(--jade-soft);border-color:transparent;color:var(--jade)}
.hint{color:var(--muted);font-size:.9rem;text-align:center;padding:8px 0}
.say{flex:0 0 auto !important;padding:14px 14px}
/* test */
.q{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.score{text-align:center;padding:10px 0}
.score b{font-family:var(--f-mono);font-size:2.6rem;display:block}
.list{display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .w{font-family:var(--f-han);font-size:1.3rem;font-weight:700;min-width:3em}
.li .d{min-width:0;font-size:.9rem}
.li .d s{color:var(--bad);text-decoration-thickness:1px}
.li .d div:first-child{color:var(--jade);font-size:.82rem}
/* settings */
details{margin-top:28px;font-size:.88rem}
summary{cursor:pointer;color:var(--muted)}
.set{display:grid;gap:10px;margin-top:10px}
.set label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.set input,.set textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.set textarea{font-family:var(--f-mono);font-size:.72rem;min-height:64px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* 문구 노트 테마 */
body{background-color:var(--paper);background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:22px 22px}
h1{font-family:var(--f-disp);font-size:2rem;color:var(--jade);font-weight:700}
.btn,.wrongbox,.card,.day,.list,.opt{border-width:1.5px}
.card{box-shadow:0 2px 0 var(--line)}
.tian{border:0;background:none}
.tian .han{background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 90%,transparent 90%);font-weight:700}
.day.done{background:var(--jade-soft);border-color:var(--grid)}
.day.next{border-style:dashed;border-color:var(--jade);box-shadow:none}
.hj span{border-radius:99px}
.btn.primary{color:var(--on-acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.writebtn{align-self:center;flex:0 0 auto;font-size:.82rem;font-weight:700;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.wsheet{max-height:92vh;overflow-y:auto}
.wslot{display:grid;gap:12px;border-top:1.5px dashed var(--line);padding-top:14px}
.wtabs{display:flex;gap:6px;justify-content:center}
.wtabs button{font-family:var(--f-han);font-size:1.3rem;font-weight:700;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.wtabs button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.wlabel{font-size:.78rem;font-weight:700;color:var(--muted);text-align:left;letter-spacing:.04em}
.wlabel span{margin-left:6px;color:var(--jade)}.wlabel span.bad{color:var(--bad)}.wlabel span.ok{color:var(--jade)}
.wrow{display:flex;align-items:center;gap:12px}
.wbox{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);
  background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.wbox.small{width:122px;height:122px}
.wbox.big{width:242px;height:242px;align-self:center;margin:0 auto;touch-action:none}
.wtools{display:flex;gap:6px;justify-content:center}
.wsheet .star{font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.wsheet .star[aria-pressed="true"]{background:var(--jade-soft);border-color:transparent;color:var(--jade)}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script src="hanzi-writer.min.js"></script>
<script>
const WORDS = [{"id":1,"w":"半","p":"bàn","k":"부","ko":"절반, 반쯤","g":"n4o","ex":[{"zh":"{H}，我在楼下等了你半个小时了。","py":"{H}, wǒ zài lóu xià děng le nǐ bàn ge xiǎoshí le.","ko":"{H}, 나 아래층에서 너 30분이나 기다렸어."},{"zh":"从新山到新加坡要一个半小时。","py":"Cóng Xīnshān dào Xīnjiāpō yào yī gè bàn xiǎoshí.","ko":"조호바루에서 싱가포르까지 한 시간 반 걸려.","pat":"수량 + 个半 + 단위 = ~반 (一个半小时·两个半月)"},{"zh":"我们的会议开了半天，还没有结果。","py":"Wǒmen de huìyì kāi le bàntiān, hái méiyǒu jiéguǒ.","ko":"회의를 한나절이나 했는데 아직 결론이 안 났어."}],"c":[["半","半","반 반"]],"why":"둘로 똑같이 나눈 반쪽 → 절반"},{"id":2,"w":"对","p":"duì","k":"동·양","ko":"맞다, ~에 대하여(향하여), 쌍(짝)","g":"n4o","ex":[{"zh":"老板对这次的结果很满意。","py":"Lǎobǎn duì zhè cì de jiéguǒ hěn mǎnyì.","ko":"사장님이 이번 결과에 아주 만족하셔."},{"zh":"我对中国文化很感兴趣。","py":"Wǒ duì Zhōngguó wénhuà hěn gǎn xìngqù.","ko":"나 중국 문화에 관심 많아.","pat":"对 + 대상 + 感兴趣 = ~에 관심이 있다"},{"zh":"这对杯子是{H}送给我的。","py":"Zhè duì bēizi shì {H} sòng gěi wǒ de.","ko":"이 컵 한 쌍은 {H}가 나한테 준 거야."}],"c":[["对","對","대할 대"]],"why":"마주 대함(對) → 맞다·~에 대해·짝"},{"id":3,"w":"好","p":"hǎo","k":"동","ko":"잘 ~하다(완료), 좋아지다","g":"n4o","ex":[{"zh":"妈，机票我已经买好了。","py":"Mā, jīpiào wǒ yǐjīng mǎi hǎo le.","ko":"엄마, 비행기표 벌써 다 샀어."},{"zh":"饭做好了，快来吃吧。","py":"Fàn zuò hǎo le, kuài lái chī ba.","ko":"밥 다 됐어, 빨리 와서 먹어.","pat":"동사 + 好 + 了 = 다 ~했다 (做好·准备好·买好)"},{"zh":"这台机器已经修好了，可以用了。","py":"Zhè tái jīqì yǐjīng xiū hǎo le, kěyǐ yòng le.","ko":"이 기계 다 고쳤어, 이제 써도 돼."}],"c":[["好","好","좋을 호"]],"why":"女+子 함께 있어 좋음 → 좋다·잘 ~하다"},{"id":4,"w":"叫","p":"jiào","k":"개","ko":"~에게 (~당하다, 피동)","g":"n4o","ex":[{"zh":"我的雨伞叫同事拿走了。","py":"Wǒ de yǔsǎn jiào tóngshì ná zǒu le.","ko":"내 우산을 동료가 가져가 버렸어."},{"zh":"我的自行车叫人偷了。","py":"Wǒ de zìxíngchē jiào rén tōu le.","ko":"내 자전거 누가 훔쳐 갔어.","pat":"A + 叫 + B + 동사 + 了 = A가 B에게 ~당했다"},{"zh":"昨天我叫老板批评了。","py":"Zuótiān wǒ jiào lǎobǎn pīpíng le.","ko":"어제 사장님한테 혼났어."}],"c":[["叫","叫","부르짖을 규"]],"why":"소리쳐 부름(叫) → 부르다·~에게 당하다"},{"id":5,"w":"日","p":"rì","k":"명","ko":"날, 일","g":"n4o","ex":[{"zh":"{H}，这个星期日你有空吗？","py":"{H}, zhège xīngqīrì nǐ yǒu kòng ma?","ko":"{H}, 이번 주 일요일에 시간 있어?"},{"zh":"我的生日是九月十五日。","py":"Wǒ de shēngrì shì jiǔ yuè shíwǔ rì.","ko":"내 생일은 9월 15일이야.","pat":"X月 + X日 = X월 X일 (날짜 표기)"},{"zh":"这些货请在十二月十日以前送到。","py":"Zhèxiē huò qǐng zài shí'èr yuè shí rì yǐqián sòng dào.","ko":"이 물건들은 12월 10일 전까지 보내 주세요."}],"c":[["日","日","날 일"]],"why":"해의 모양 → 해·날"},{"id":6,"w":"一下","p":"yíxià","k":"부","ko":"좀 ~하다, 한번 ~해 보다","g":"n4o","ex":[{"zh":"请您等一下，我去问问经理。","py":"Qǐng nín děng yíxià, wǒ qù wènwen jīnglǐ.","ko":"잠시만 기다려 주세요, 매니저한테 물어볼게요."},{"zh":"你帮我看一下这个报告。","py":"Nǐ bāng wǒ kàn yīxià zhège bàogào.","ko":"이 보고서 좀 봐 줘.","pat":"동사 + 一下 = 좀 ~해 보다 (看一下·等一下·问一下)"},{"zh":"爸，我给你介绍一下我的新工作。","py":"Bà, wǒ gěi nǐ jièshào yīxià wǒ de xīn gōngzuò.","ko":"아빠, 내 새 일 좀 소개해 줄게."}],"c":[["一","一","한 일"],["下","下","아래 하"]],"why":"한(一) 번 아래로(下) → 한번 ~해 보다"},{"id":7,"w":"真","p":"zhēn","k":"형","ko":"진짜의, 참된, 정말","g":"n4o","ex":[{"zh":"{H}，你今天真漂亮！","py":"{H}, nǐ jīntiān zhēn piàoliang!","ko":"{H}, 너 오늘 진짜 예쁘다!"},{"zh":"这里的菜真好吃！","py":"Zhèlǐ de cài zhēn hǎochī!","ko":"여기 음식 진짜 맛있다!","pat":"真 + 형용사 = 정말 ~하다 (감탄)"},{"zh":"这个客户真不好说话。","py":"Zhège kèhù zhēn bù hǎo shuōhuà.","ko":"이 고객 진짜 까다로워."}],"c":[["真","眞","참 진"]],"why":"참(眞) → 진짜·정말"},{"id":8,"w":"从","p":"cóng","k":"부","ko":"지금까지, 여태(부정문에서)","g":"n4o","ex":[{"zh":"爸，我从没见过这么热的天气。","py":"Bà, wǒ cóng méi jiàn guo zhème rè de tiānqì.","ko":"아빠, 나 이렇게 더운 날씨는 여태 본 적이 없어."},{"zh":"他从不喝酒，也不抽烟。","py":"Tā cóng bù hē jiǔ, yě bù chōuyān.","ko":"그 사람은 술도 담배도 전혀 안 해.","pat":"从 + 不/没(+过) = 여태 ~하지 않다/한 적 없다"},{"zh":"这台机器我们从没修过，得问问老板。","py":"Zhè tái jīqì wǒmen cóng méi xiū guo, děi wènwen lǎobǎn.","ko":"이 기계는 한 번도 안 고쳐 봐서 사장님께 물어봐야 해."}],"c":[["从","從","좇을 종"]],"why":"사람 뒤를 좇음(從) → ~부터·여태"},{"id":9,"w":"等","p":"děng","k":"개·조","ko":"~까지 기다려, ~할 때가 되면 / 등, 따위","g":"n4o","ex":[{"zh":"{H}，等我下班了就给你打电话。","py":"{H}, děng wǒ xiàbān le jiù gěi nǐ dǎ diànhuà.","ko":"{H}, 나 퇴근하면 바로 전화할게."},{"zh":"等你到了，给我发个短信。","py":"Děng nǐ dào le, gěi wǒ fā gè duǎnxìn.","ko":"도착하면 문자 하나 보내 줘.","pat":"等 + 상황 + (了), (就)… = ~하게 되면 …하다"},{"zh":"爸，我给你们买了咖啡、饼干等东西。","py":"Bà, wǒ gěi nǐmen mǎi le kāfēi, bǐnggān děng dōngxi.","ko":"아빠, 커피랑 과자 같은 거 사 왔어."}],"c":[["等","等","무리 등"]],"why":"같은 무리(等)로 줄 서 기다림 → 기다리다·등"},{"id":10,"w":"点","p":"diǎn","k":"명·양","ko":"점, 시(시각), 조금","g":"n4o","ex":[{"zh":"{H}，你几点下班？我去接你。","py":"{H}, nǐ jǐ diǎn xiàbān? Wǒ qù jiē nǐ.","ko":"{H}, 너 몇 시에 퇴근해? 내가 데리러 갈게."},{"zh":"请您说慢一点儿，好吗？","py":"Qǐng nín shuō màn yīdiǎnr, hǎo ma?","ko":"좀 천천히 말씀해 주시겠어요?","pat":"형용사 + (一)点儿 = 좀 더 ~하게"},{"zh":"老板，客户下午三点到工厂。","py":"Lǎobǎn, kèhù xiàwǔ sān diǎn dào gōngchǎng.","ko":"사장님, 고객이 오후 3시에 공장에 도착해요."}],"c":[["点","點","점 점"]],"why":"작은 점(點) → 점·시·조금"},{"id":11,"w":"每","p":"měi","k":"부","ko":"매번, ~마다","g":"n4o","ex":[{"zh":"我每个周末都去新加坡看{H}。","py":"Wǒ měi ge zhōumò dōu qù Xīnjiāpō kàn {H}.","ko":"나 주말마다 싱가포르에 {H} 보러 가."},{"zh":"每天早上我都喝一杯咖啡。","py":"Měi tiān zǎoshang wǒ dōu hē yī bēi kāfēi.","ko":"매일 아침 커피 한 잔씩 마셔.","pat":"每 + 시간/양사 + 都 = ~마다 항상"},{"zh":"每次开会，老板都让我先说。","py":"Měi cì kāihuì, lǎobǎn dōu ràng wǒ xiān shuō.","ko":"회의할 때마다 사장님이 나보고 먼저 말하래."}],"c":[["每","每","매양 매"]],"why":"매양(每) → 매번·~마다"},{"id":12,"w":"让","p":"ràng","k":"개","ko":"~에게 (~당하다, 피동), ~하게 하다","g":"n4o","ex":[{"zh":"老板让我明天去客户那里。","py":"Lǎobǎn ràng wǒ míngtiān qù kèhù nàli.","ko":"사장님이 나보고 내일 고객사에 가래."},{"zh":"妈妈让我早点儿回家。","py":"Māma ràng wǒ zǎo diǎnr huí jiā.","ko":"엄마가 일찍 들어오래.","pat":"让 + 사람 + 동사 = ~에게 …하게 하다(시키다)"},{"zh":"我的雨伞让风吹坏了。","py":"Wǒ de yǔsǎn ràng fēng chuī huài le.","ko":"우산이 바람에 망가졌어."}],"c":[["让","讓","사양할 양"]],"why":"양보해(讓) 남에게 시킴 → ~하게 하다"},{"id":13,"w":"关系","p":"guānxì","k":"동","ko":"관계되다, 영향을 미치다","g":"n4o","ex":[{"zh":"这次检查关系到公司的发展。","py":"Zhè cì jiǎnchá guānxì dào gōngsī de fāzhǎn.","ko":"이번 점검은 회사 발전에 영향을 미쳐."},{"zh":"这关系到大家的安全。","py":"Zhè guānxì dào dàjiā de ānquán.","ko":"이건 모두의 안전과 직결돼.","pat":"关系到 + 명사 = ~에 영향을 미치다/직결되다"},{"zh":"妈，吃得好不好关系到身体健康。","py":"Mā, chī de hǎo bu hǎo guānxì dào shēntǐ jiànkāng.","ko":"엄마, 잘 먹느냐가 건강에 영향을 줘."}],"c":[["关","關","관계할 관"],["系","係","맬 계"]],"why":"관계(關)로 묶임(係) → 관계되다"},{"id":14,"w":"节","p":"jié","k":"동","ko":"절약하다, 아끼다","g":"n4o","ex":[{"zh":"工厂里大家都要节水节电。","py":"Gōngchǎng lǐ dàjiā dōu yào jié shuǐ jié diàn.","ko":"공장에서는 다들 물이랑 전기를 아껴야 해."},{"zh":"下班的时候记得关灯节电。","py":"Xiàbān de shíhou jìde guān dēng jié diàn.","ko":"퇴근할 때 불 끄고 전기 아끼는 거 잊지 마.","pat":"节 + 水/电 = 물·전기를 아끼다"},{"zh":"{H}，洗澡的时候我们也要节水。","py":"{H}, xǐzǎo de shíhou wǒmen yě yào jié shuǐ.","ko":"{H}, 샤워할 때도 물 아껴야 해."}],"c":[["节","節","마디 절"]],"why":"마디(節)를 지어 끊음 → 절약하다"},{"id":15,"w":"老","p":"lǎo","k":"부","ko":"늘, 항상, 매우","g":"n4o","ex":[{"zh":"妈，你别老担心我。","py":"Mā, nǐ bié lǎo dānxīn wǒ.","ko":"엄마, 나 맨날 걱정하지 마."},{"zh":"你怎么老迟到？早点儿出门吧。","py":"Nǐ zěnme lǎo chídào? Zǎo diǎnr chūmén ba.","ko":"너 왜 맨날 지각해? 좀 일찍 나와.","pat":"老 + 동사 = 늘 ~하다 (주로 불만; 别老…)"},{"zh":"这台机器老出问题，得换新的了。","py":"Zhè tái jīqì lǎo chū wèntí, děi huàn xīn de le.","ko":"이 기계 자꾸 고장 나, 새 걸로 바꿔야겠어."}],"c":[["老","老","늙을 로"]],"why":"늙도록(老) 오래 → 늘·항상"},{"id":16,"w":"像","p":"xiàng","k":"부","ko":"마치 ~같다, ~처럼","g":"n4o","ex":[{"zh":"{H}，你笑起来像个孩子。","py":"{H}, nǐ xiào qǐlai xiàng ge háizi.","ko":"{H}, 너 웃으니까 꼭 애 같아."},{"zh":"这里的天气像夏天一样热。","py":"Zhèlǐ de tiānqì xiàng xiàtiān yīyàng rè.","ko":"여기 날씨는 여름처럼 더워.","pat":"像 + 명사 + 一样 = 마치 ~처럼"},{"zh":"妈，大家都说我长得像爸爸。","py":"Mā, dàjiā dōu shuō wǒ zhǎng de xiàng bàba.","ko":"엄마, 다들 나 아빠 닮았대."}],"c":[["像","像","모양 상"]],"why":"모양(像)이 닮음 → ~같다·~처럼"},{"id":17,"w":"啊","p":"ā","k":"감","ko":"아, 오(감탄)","g":"n4o","ex":[{"zh":"啊，我忘了带护照！","py":"Ā, wǒ wàng le dài hùzhào!","ko":"아, 여권 안 챙겼다!"},{"zh":"啊，下雨了！我没带伞。","py":"Ā, xià yǔ le! Wǒ méi dài sǎn.","ko":"아, 비 온다! 우산 안 가져왔는데.","pat":"啊, + 문장 = 아! (깨달음·놀람의 감탄)"},{"zh":"啊，{H}，你怎么来了？","py":"Ā, {H}, nǐ zěnme lái le?","ko":"어, {H}, 너 어떻게 왔어?"}],"c":[["啊","啊","어조사 아"]],"why":"감탄의 어조사 → 아!·오!"},{"id":18,"w":"爱情","p":"àiqíng","k":"명","ko":"사랑, 애정","g":"n4o","ex":[{"zh":"妈妈常说，爱情需要两个人一起努力。","py":"Māma cháng shuō, àiqíng xūyào liǎng ge rén yìqǐ nǔlì.","ko":"엄마는 사랑은 두 사람이 같이 노력해야 한다고 자주 말해."},{"zh":"这是一部关于爱情的电影。","py":"Zhè shì yī bù guānyú àiqíng de diànyǐng.","ko":"이건 사랑에 관한 영화야.","pat":"关于爱情的 + 명사 = wù hěn mǎnyì.","ko":"고객이 우리 서비스에 아주 만족한다고 했어."},{"zh":"我想对大家表示感谢。","py":"Wǒ xiǎng duì dàjiā biǎoshì gǎnxiè.","ko":"모두에게 감사를 표하고 싶어요.","pat":"表示 + 感谢/同意/欢迎 = ~의 뜻을 나타내다"},{"zh":"{H}点点头，表示同意我的看法。","py":"{H} diǎndiǎn tóu, biǎoshì tóngyì wǒ de kànfǎ.","ko":"{H}가 고개를 끄덕이며 내 생각에 동의했어."}],"c":[["表","表","겉 표"],["示","示","보일 시"]],"why":"겉으로(表) 보임(示) → 나타내다"},{"id":36,"w":"表扬","p":"biǎoyáng","k":"동","ko":"칭찬하다, 표창하다","g":"n4o","ex":[{"zh":"{H}，今天老板在会上表扬我了！","py":"{H}, jīntiān lǎobǎn zài huì shang biǎoyáng wǒ le!","ko":"{H}, 오늘 사장님이 회의에서 나 칭찬했어!"},{"zh":"他工作认真，受到了老板的表扬。","py":"Tā gōngzuò rènzhēn, shòudào le lǎobǎn de biǎoyáng.","ko":"그 사람 일 열심히 해서 사장님께 칭찬받았어.","pat":"受到 + (누구의) 表扬 = 칭찬을 받다"},{"zh":"妈，小时候你总是表扬我。","py":"Mā, xiǎo shíhou nǐ zǒngshì biǎoyáng wǒ.","ko":"엄마, 어릴 때 엄마는 늘 나 칭찬해 줬지."}],"c":[["表","表","겉 표"],["扬","揚","날릴 양"]],"why":"드러내(表) 높임(揚) → 칭찬하다"},{"id":37,"w":"饼干","p":"bǐnggān","k":"명","ko":"과자, 비스킷","g":"n4o","ex":[{"zh":"妈，你寄来的饼干我都吃完了。","py":"Mā, nǐ jì lái de bǐnggān wǒ dōu chī wán le.","ko":"엄마, 보내준 과자 다 먹었어."},{"zh":"我买了一盒饼干当早饭。","py":"Wǒ mǎi le yī hé bǐnggān dāng zǎofàn.","ko":"아침 대신 과자 한 상자 샀어.","pat":"一盒/一包 + 饼干 = 과자 한 상자/봉지"},{"zh":"{H}，你包里有饼干吗？我有点儿饿。","py":"{H}, nǐ bāo lǐ yǒu bǐnggān ma? Wǒ yǒudiǎnr è.","ko":"{H}, 가방에 과자 있어? 좀 배고파."}],"c":[["饼","餠","떡 병"],["干","乾","마를 건"]],"why":"마른(乾) 떡(餠) → 과자"},{"id":38,"w":"并且","p":"bìngqiě","k":"연","ko":"게다가, 그리고, 또한","g":"n4o","ex":[{"zh":"这家公司价格便宜，并且质量很好。","py":"Zhè jiā gōngsī jiàgé piányi, bìngqiě zhìliàng hěn hǎo.","ko":"이 회사는 가격이 싸고, 게다가 품질도 좋아."},{"zh":"他通过了考试，并且拿了第一名。","py":"Tā tōngguò le kǎoshì, bìngqiě ná le dì yī míng.","ko":"그 사람 시험 붙고 1등까지 했어.","pat":"동작1, 并且 + 동작2 = ~하고 또한 …하다"},{"zh":"{H}很会做饭，并且做得很快。","py":"{H} hěn huì zuòfàn, bìngqiě zuò de hěn kuài.","ko":"{H}는 요리를 잘하고, 게다가 빨리 해."}],"c":[["并","並","아우를 병"],["且","且","또 차"]],"why":"아우르고(並) 또(且) → 게다가"},{"id":39,"w":"博士","p":"bóshì","k":"명","ko":"박사","g":"n4o","ex":[{"zh":"爸，读完MBA我还想读博士。","py":"Bà, dú wán MBA wǒ hái xiǎng dú bóshì.","ko":"아빠, MBA 끝나면 박사도 하고 ùguǎn tiānqì zěnmeyàng, tā dōu qù pǎobù.","ko":"날씨가 어떻든 그 사람은 달리러 나가.","pat":"不管 + 의문사/A不A + 都 = ~든 상관없이 다"},{"zh":"妈，不管我在哪儿，都会想你们。","py":"Mā, bùguǎn wǒ zài nǎr, dōu huì xiǎng nǐmen.","ko":"엄마, 내가 어디 있든 엄마 아빠 생각할 거야."}],"c":[["不","不","아닐 불"],["管","管","주관할 관"]],"why":"상관(管)하지 않음(不) → ~을 막론하고"},{"id":44,"w":"不仅","p":"bùjǐn","k":"연","ko":"~뿐만 아니라","g":"n4o","ex":[{"zh":"{H}不仅漂亮，而且很聪明。","py":"{H} bùjǐn piàoliang, érqiě hěn cōngming.","ko":"{H}는 예쁠 뿐만 아니라 똑똑하기도 해."},{"zh":"他不仅会说中文，而且会说日语。","py":"Tā bùjǐn huì shuō Zhōngwén, érqiě huì shuō Rìyǔ.","ko":"그 사람은 중국어뿐 아니라 일본어도 해.","pat":"不仅 A, 而且 B = A뿐만 아니라 B도"},{"zh":"我爸不仅会做饭，还会修车。","py":"Wǒ bà bùjǐn huì zuòfàn, hái huì xiū chē.","ko":"우리 아빠는 요리뿐만 아니라 차도 고칠 줄 알아."}],"c":[["不","不","아닐 불"],["仅","僅","겨우 근"]],"why":"겨우(僅) ~만이 아님(不) → ~뿐 아니라"},{"id":45,"w":"擦","p":"cā","k":"동","ko":"닦다, 문지르다, 바르다","g":"n4o","ex":[{"zh":"先把机器上的水擦干净。","py":"Xiān bǎ jīqì shang de shuǐ cā gānjìng.","ko":"먼저 기계 위에 있는 물부터 깨끗이 닦아."},{"zh":"出了这么多汗，快擦擦脸吧。","py":"Chū le zhème duō hàn, kuài cāca liǎn ba.","ko":"땀 엄청 났네, 얼른 얼굴 좀 닦아.","pat":"擦 + 桌子/脸/眼泪 (擦干净) = ~을 닦다"},{"zh":"妈，我来擦桌子，你去休息吧。","py":"Mā, wǒ lái cā zhuōzi, nǐ qù xiūxi ba.","ko":"엄마, 내가 상 닦을게, 가서 쉬어."}],"c":[["擦","擦","문지를 찰"]],"why":"손(扌)으로 문지름(擦) → 닦다"},{"id":46,"w":"猜","p":"cāi","k":"동","ko":"추측하다, 알아맞히다","g":"n4o","ex":[{"zh":"{H}，你猜我给你买了什么？","py":"{H}, nǐ cāi wǒ gěi nǐ mǎi le shénme?","ko":"{H}, 내가 너한테 뭐 사왔게?"},{"zh":"你猜猜我今年多大？","py":"Nǐ cāicai wǒ jīnnián duō dà?","ko":"나 올해 몇 살인지 맞혀 봐.","pat":"你猜(猜) + 의문문 = 맞혀 봐"},{"zh":"我猜客户明天会给我们打电话。","py":"Wǒ cāi kèhù míngtiān huì gěi wǒmen dǎ diànhuà.","ko":"고객이 내일 우리한테 전화할 것 같아."}],"c":[["猜","猜","의심할 시"]],"why":"의심하며(猜) 헤아림 → 추측하다"},{"id":47,"w":"材料","p":"cáiliào","k":"명","ko":"재료, 자료","g":"n4o","ex":[{"zh":"开会要用的材料我已经准备好了。","py":"Kāihuì yào yòng de cáiliào wǒ yǐjīng zhǔnbèi hǎo le.","ko":"회의 때 쓸 자료는 이미 준비해 뒀어요."},{"zh":"面试要准备哪些材料？","py":"Miànshì yào zhǔnbèi nǎxiē cáiliào?","ko":"면접 보려면 어떤 서류 준비해야 해?","pat":"准备/交 + 材料 = 서류(자료)를 준비·제출하다"},{"zh":"这种材料太贵了，我们换一种吧。","py":"Zhè zhǒng cáiliào tài guì le, wǒmen huàn yī zhǒng ba.","ko":"이 재료 너무 비싸, 다른 걸로 바꾸자."}],"c":[["材","材","재목 재"],["料","料","헤아릴 료"]],"why":"재목(材)과 거리(料) → 재료"},{"id":48,"w":"参观","p":"cānguān","k":"동","ko":"참관하다, 견학하다","g":"n4o","ex":[{"zh":"下周有客户要来参观我们的工厂。","py":"Xià zhōu yǒu kèhù yào lái cānguān wǒmen de gōngchǎng.","ko":"다음 주에 고객이 우리 공장 견학하러 와."},{"zh":"去北京一定要参观长城。","py":"Qù Běijīng yīdìng yào cānguān Chángchéng.","ko":"베이징 가면 만리장성은 꼭 가 봐야 해.","pat":"参观 + 장소(工厂/学校/长城) = ~을 견학·관람하다"},{"zh":"爸妈来的时候，我带他们参观了我们公司。","py":"Bà mā lái de shíhou, wǒ dài tāmen cānguān le wǒmen gōngsī.","ko":"엄마 아빠 왔을 때 우리 회사 구경시켜 드렸어."}],"c":[["参","參","참여할 참"],["观","觀","볼 관"]],"why":"참여해(參) 봄(觀) → 참관하다"},{"id":49,"w":"餐厅","p":"cāntīng","k":"명","ko":"식당, 레스토랑","g":"n4o","ex":[{"zh":"{H}，我订了一家韩国餐厅。","py":"{H}, wǒ dìng le yì jiā Hánguó cāntīng.","ko":"{H}, 나 한국 식당 하나 예약했어."},{"zh":"我们今晚在这家餐厅吃饭吧。","py":"Wǒmen jīn wǎn zài zhè jiā cāntīng chīfàn ba.","ko":"오늘 저녁 이 식당에서 먹자.","pat":"在 + 一家餐厅 + 吃饭 = ~식당에서 식사하다"},{"zh":"公司附近新开了一家餐厅。","py":"Gōngsī fùjìn xīn kāi le yī jiā cāntīng.","ko":"회사 근처에 식당이 새로 생겼어."}],"c":[["餐","餐","밥 찬"],["厅","廳","관청 청"]],"why":"밥(餐) 먹는 대청(廳) → 식당"},{"id":50,"w":"厕所","p":"cèsuǒ","k":"명","ko":"화장실","g":"n4o","ex":[{"zh":"厕所在办公室旁边，您往前走就到了。","py":"Cèsuǒ zài bàngōngshì pángbiān, nín wǎng qián zǒu jiù dào le.","ko":"화장실은 사무실 옆에 있어요, 앞으로 쭉 가시면 돼요."},{"zh":"不好意思，我先去上个厕所。","py":"Bù hǎoyìsi, wǒ xiān qù shàng gè cèsuǒ.","ko":"미안, 나 화장실 좀 먼저 다녀올게.","pat":"上厕所 = 화장실에 가다 (용변)"},{"zh":"工厂的厕所坏了，我已经找人来修了。","py":"Gōngchǎng de cèsuǒ huài le, wǒ yǐjīng zhǎo rén lái xiū le.","ko":"공장 화장실 고장 나서 수리할 사람 불렀어."}],"c":[["厕","廁","뒷간 측"],["所","所","바 소"]],"why":"뒷간(廁)이 있는 곳(所) → 화장실"},{"id":51,"w":"场","p":"chǎng","k":"양","ko":"번, 회(경기·공연 등)","g":"n4o","ex":[{"zh":"这个周末我们去看一场电影吧。","py":"Zhège zhōumò wǒmen qù kàn yì chǎng diànyǐng ba.","ko":"이번 주말에 우리 영화 한 편 보러 가자."},{"zh":"明天有一场很重要的比赛。","py":"Míngtiān yǒu yī chǎng hěn zhòngyào de bǐsài.","ko":"내일 아주 중요한 경기가 하나 있어.","pat":"一场 + 比赛/电影/雨 = 한 차례의 ~"},{"zh":"客户请我们去看了一场演出。","py":"Kèhù qǐng wǒmen qù kàn le yī chǎng yǎnchū.","ko":"고객이 우리를 공연에 초대해 줬어."}],"c":[["场","場","마당 장"]],"why":"마당(場)에서 벌인 판 → 회·번"},{"id":52,"w":"超过","p":"chāoguò","k":"동","ko":"초과하다, 넘다, 앞지르다","g":"n4o","ex":[{"zh":"水的温度不能超过六十度。","py":"Shuǐ de wēndù bù néng chāoguò liùshí dù.","ko":"물 온도가 60도를 넘으면 안 돼."},{"zh":"这个箱子不能超过二十公斤。","py":"Zhège xiāngzi bù néng chāoguò èrshí gōngjīn.","ko":"이 상자는 20kg을 넘으면 안 돼.","pat":"超过 + 수량 = ~을 넘다"},{"zh":"妈，我在这边已经工作超过两年了。","py":"Mā, wǒ zài zhèbiān yǐjīng gōngzuò chāoguò liǎng nián le.","ko":"엄마, 여기서 일한 지 벌써 2년 넘었어."}],"c":[["超","超","뛰어넘을 초"],["过","過","지날 과"]],"why":"뛰어넘어(超) 지남(過) → 초과하다"},{"id":53,"w":"成功","p":"chénggōng","k":"동·형","ko":"성공하다, 성공적이다","g":"n4o","ex":[{"zh":"这次和客户的会议很成功。","py":"Zhè cì hé kèhù de huìyì hěn chénggōng.","ko":"이번 고객 미팅은 아주 성공적이었어."},{"zh":"祝你这次面试成功！","py":"Zhù nǐ zhè cì miànshì chénggōng!","ko":"이번 면접 꼭 붙길 바라!","pat":"祝你 + (일) + 成功 = ~에 성공하길 바라"},{"zh":"爸，你说成功最重要的是什么？","py":"Bà, nǐ shuō chénggōng zuì zhòngyào de shì shénme?","ko":"아빠, 성공하는 데 제일 중요한 게 뭐라고 생각해?"}],"c":[["成","成","이룰 성"],["功","功","공 공"]],"why":"공(功)을 이룸(成) → 성공"},{"id":54,"w":"诚实","p":"chéngshí","k":"형","ko":"성실하다, 정직하다","g":"n4o","ex":[{"zh":"爸爸常说，做生意最重要的是诚实。","py":"Bàba cháng shuō, zuò shēngyi zuì zhòngyào de shì chéngshí.","ko":"아빠는 장사에서 제일 중요한 건 정직이라고 자주 말해."},{"zh":"他是一个很诚实的人。","py":"Tā shì yī gè hěn chéngshí de rén.","ko":"그는 아주 정직한 사람이야.","pat":"诚实的人 / 对…诚实 = 정직한 사람 / ~에게 정직하다"},{"zh":"对客户一定要诚实，做不到就别答应。","py":"Duì kèhù yīdìng yào chéngshí, zuò bu dào jiù bié dāying.","ko":"고객한테는 꼭 정직해야 해, 못 할 거면 약속하지 마."}],"c":[["诚","誠","정성 성"],["实","實","열매 실"]],"why":"정성(誠)스럽고 알참(實) → 성실하다"},{"id":55,"w":"成为","p":"chéngwéi","k":"동","ko":"~이 되다","g":"n4o","ex":[{"zh":"我希望将来能成为一名好经理。","py":"Wǒ xīwàng jiānglái néng chéngwéi yì míng hǎo jīnglǐ.","ko":"나중에 좋은 매니저가 됐으면 좋겠어."},{"zh":"我们很快就成为了好朋友。","py":"Wǒmen hěn kuài jiù chéngwéi le hǎo péngyou.","ko":"우린 금방 좋은 친구가 됐어.","pat":"成为 + 朋友/명사 = ~이 되다"},{"zh":"他们公司已经成为我们最大的客户。","py":"Tāmen gōngsī yǐjīng chéngwéi wǒmen zuì dà de kèhù.","ko":"그 회사가 우리 최대 고객이 됐어."}],"c":[["成","成","이룰 성"],["为","爲","할 위"]],"why":"이루어(成) ~이 됨(爲) → ~이 되다"},{"id":56,"w":"乘坐","p":"chéngzuò","k":"동","ko":"(교통수단을) 타다","g":"n4o","ex":[{"zh":"我每周五乘坐巴士去新加坡。","py":"Wǒ měi zhōuwǔ chéngzuò bāshì qù Xīnjiāpō.","ko":"나는 매주 금요일에 버스 타고 싱가포르에 가."},{"zh":"请乘坐地铁二号线到机场。","py":"Qǐng chéngzuò dìtiě èr hào xiàn dào jīchǎng.","ko":"지하철 2호선을 타고 공항으로 가세요.","pat":"乘坐 + 飞机/地铁/公共汽车 = (교통수단을) 타다 (안내문체)"},{"zh":"去客户那里，我们乘坐公司的车吧。","py":"Qù kèhù nàlǐ, wǒmen chéngzuò gōngsī de chē ba.","ko":"고객사 갈 때 회사 차 타고 가자."}],"c":[["乘","乘","탈 승"],["坐","坐","앉을 좌"]],"why":"타서(乘) 앉음(坐) → 타다"},{"id":57,"w":"吃惊","p":"chījīng","k":"동","ko":"놀라다","g":"n4o","ex":[{"zh":"听说我会说中文，客户很吃惊。","py":"Tīngshuō wǒ huì shuō Zhōngwén, kèhù hěn chījīng.","ko":"내가 중국어 할 줄 안다니까 고객이 엄청 놀랐어."},{"zh":"听到这个消息，我很吃惊。","py":"Tīng dào zhège xiāoxi, wǒ hěn chījīng.","ko":"그 소식 듣고 엄청 놀랐어.","pat":"听到/看到… + 很吃惊 = ~을 듣고/보고 놀라다 (참고: 大吃一惊 깜짝 놀라다)"},{"zh":"{H}看到我送的花，非常吃惊。","py":"{H} kàn dào wǒ sòng de huā, fēicháng chījīng.","ko":"{H}가 내가 준 꽃 보고 엄청 놀랐어."}],"c":[["吃","吃","먹을 흘"],["惊","驚","놀랄 경"]],"why":"놀람(驚)을 먹음(吃) → 놀라다"},{"id":58,"w":"重","p":"chóng","k":"부·명·형","ko":"다시, 거듭 / 무겁다, 중요하다, 무게","g":"n4o","ex":[{"zh":"这份报告写错了，我重写一份。","py":"Zhè fèn bàogào xiě cuò le, wǒ chóng xiě yí fèn.","ko":"이 보고서 잘못 썼네, 다시 하나 쓸게."},{"zh":"这个箱子太重了，我们一起搬吧。","py":"Zhège xiāngzi tài zhòng le, wǒmen yīqǐ bān ba.","ko":"이 상자 너무 무거워, 같이 옮기자.","pat":"太重了(zhòng) = 너무 무겁다 / 重(chóng) + 동사 = 다시 ~하다"},{"zh":"妈，照片没拍好，我们重拍一张吧。","py":"Mā, zhàopiàn méi pāi hǎo, wǒmen chóng pāi yī zhāng ba.","ko":"엄마, 사진 잘 안 나왔어, 다시 찍자."}],"c":[["重","重","거듭 중"]],"why":"겹쳐 쌓여(重) 무거움 → 거듭·무겁다"},{"id":59,"w":"重新","p":"chóngxīn","k":"부","ko":"다시, 새로","g":"n4o","ex":[{"zh":"妈，我重新找了一个房子。","py":"Mā, wǒ chóngxīn zhǎo le yí ge fángzi.","ko":"엄마, 나 집 새로 구했어."},{"zh":"没关系，我们重新开始吧。","py":"Méi guānxi, wǒmen chóngxīn kāishǐ ba.","ko":"괜찮아, 처음부터 다시 하자.","pat":"重新 + 开始/做/写 = 처음부터 다시 ~하다"},{"zh":"{H}，我的手机坏了，得重新买一个。","py":"{H}, wǒ d ":"Máfan nǐ bāng wǒ dǎyìn liǎng fèn hétong.","ko":"미안한데 계약서 두 부만 프린트해 줘."},{"zh":"你把这份报告打印出来给我。","py":"Nǐ bǎ zhè fèn bàogào dǎyìn chūlai gěi wǒ.","ko":"이 보고서 뽑아서 나 줘.","pat":"把 + 문서 + 打印出来 = ~을 출력하다"},{"zh":"{H}，我想用你的电脑打印一张照片。","py":"{H}, wǒ xiǎng yòng nǐ de diànnǎo dǎyìn yī zhāng zhàopiàn.","ko":"{H}, 네 컴퓨터로 사진 한 장 뽑고 싶어."}],"c":[["打","打","칠 타"],["印","印","도장 인"]],"why":"도장(印) 찍듯 침(打) → 인쇄하다"},{"id":73,"w":"打折","p":"dǎzhé","k":"동","ko":"할인하다","g":"n4o","ex":[{"zh":"{H}，这家商店今天打折。","py":"{H}, zhè jiā shāngdiàn jīntiān dǎzhé.","ko":"{H}, 이 가게 오늘 할인해."},{"zh":"这件衣服打折以后只要一百块。","py":"Zhè jiàn yīfu dǎzhé yǐhòu zhǐ yào yībǎi kuài.","ko":"이 옷 할인하니까 100위안밖에 안 해.","pat":"打折 / 打 + 숫자 + 折 = 할인하다 / 정가의 X0%로 할인 (打八折 = 20% 할인)"},{"zh":"客户问我们这个月能不能打折。","py":"Kèhù wèn wǒmen zhège yuè néng bu néng dǎzhé.","ko":"고객이 이번 달에 할인 되냐고 물어봤어."}],"c":[["打","打","칠 타"],["折","折","꺾을 절"]],"why":"값을 꺾음(折) → 할인하다"},{"id":74,"w":"打针","p":"dǎzhēn","k":"동","ko":"주사를 놓다(맞다)","g":"n4o","ex":[{"zh":"妈，我感冒了，去医院打针了。","py":"Mā, wǒ gǎnmào le, qù yīyuàn dǎzhēn le.","ko":"엄마, 나 감기 걸려서 병원 가서 주사 맞았어."},{"zh":"大夫说不用打针，吃药就行。","py":"Dàifu shuō bù yòng dǎzhēn, chī yào jiù xíng.","ko":"의사가 주사 안 맞고 약만 먹어도 된대.","pat":"打针 / 吃药 = 주사 맞다 / 약 먹다"},{"zh":"{H}，你别怕，打针一点儿也不疼。","py":"{H}, nǐ bié pà, dǎzhēn yīdiǎnr yě bù téng.","ko":"{H}, 무서워하지 마, 주사 하나도 안 아파."}],"c":[["打","打","칠 타"],["针","針","바늘 침"]],"why":"바늘(針)을 놓음(打) → 주사하다"},{"id":75,"w":"大夫","p":"dàifu","k":"명","ko":"의사","g":"n4o","ex":[{"zh":"大夫说我需要多休息。","py":"Dàifu shuō wǒ xūyào duō xiūxi.","ko":"의사가 나 좀 많이 쉬어야 한대."},{"zh":"你发烧了，快去看大夫吧。","py":"Nǐ fāshāo le, kuài qù kàn dàifu ba.","ko":"너 열 나, 빨리 병원 가 봐.","pat":"看大夫 = 진찰받다, 병원에 가다"},{"zh":"王大夫是这家医院最好的大夫。","py":"Wáng dàifu shì zhè jiā yīyuàn zuì hǎo de dàifu.","ko":"왕 선생님이 이 병원에서 제일 좋은 의사야."}],"c":[["大","大","큰 대"],["夫","夫","지아비 부"]],"why":"큰(大) 어른(夫, 옛 관직) → 의사"},{"id":76,"w":"大约","p":"dàyuē","k":"부","ko":"대략, 아마","g":"n4o","ex":[{"zh":"从这儿到新加坡大约要一个小时。","py":"Cóng zhèr dào Xīnjiāpō dàyuē yào yí ge xiǎoshí.","ko":"여기서 싱가포르까지 대  도"],["歉","歉","흉년들 겸"]],"why":"미안함(歉)을 말함(道) → 사과하다"},{"id":85,"w":"得意","p":"déyì","k":"형","ko":"득의양양하다, 우쭐하다","g":"n4o","ex":[{"zh":"拿到奖金以后，小王得意极了。","py":"Ná dào jiǎngjīn yǐhòu, Xiǎo Wáng déyì jí le.","ko":"보너스 받고 나서 샤오왕이 엄청 우쭐해졌어."},{"zh":"听到老师表扬，他得意地笑了。","py":"Tīng dào lǎoshī biǎoyáng, tā déyì de xiào le.","ko":"선생님 칭찬 듣고 걔가 의기양양하게 웃었어.","pat":"得意地 + 동사 = 의기양양하게 ~하다"},{"zh":"爸，你别太得意，下次我一定赢你。","py":"Bà, nǐ bié tài déyì, xià cì wǒ yīdìng yíng nǐ.","ko":"아빠, 너무 좋아하지 마, 다음엔 꼭 이길 거야."}],"c":[["得","得","얻을 득"],["意","意","뜻 의"]],"why":"뜻(意)을 얻음(得) → 우쭐하다"},{"id":86,"w":"低","p":"dī","k":"형·동","ko":"낮다, 숙이다","g":"n4o","ex":[{"zh":"这个温度太低了，再高一点儿。","py":"Zhège wēndù tài dī le, zài gāo yìdiǎnr.","ko":"이 온도 너무 낮아, 조금 더 올려."},{"zh":"他低着头，一句话也不说。","py":"Tā dī zhe tóu, yī jù huà yě bù shuō.","ko":"그는 고개 숙인 채 한마디도 안 해.","pat":"低头 / 低着头 = 고개를 숙이다"},{"zh":"爸，今天韩国的气温很低，多穿点儿衣服。","py":"Bà, jīntiān Hánguó de qìwēn hěn dī, duō chuān diǎnr yīfu.","ko":"아빠, 오늘 한국 기온 낮대, 옷 따뜻하게 입어."}],"c":[["低","低","낮을 저"]],"why":"사람(亻)이 밑(氐)에 → 낮다"},{"id":87,"w":"底","p":"dǐ","k":"명","ko":"밑, 바닥, 끝(말)","g":"n4o","ex":[{"zh":"我月底要交MBA的作业。","py":"Wǒ yuèdǐ yào jiāo MBA de zuòyè.","ko":"나 월말에 MBA 과제 내야 돼."},{"zh":"年底公司会给大家发奖金。","py":"Niándǐ gōngsī huì gěi dàjiā fā jiǎngjīn.","ko":"연말에 회사가 다들 보너스 줄 거야.","pat":"月底/年底 = 월말/연말"},{"zh":"机器底下有水，你过来看看。","py":"Jīqì dǐxia yǒu shuǐ, nǐ guòlai kànkan.","ko":"기계 밑에 물 있어, 와서 좀 봐."}],"c":[["底","底","밑 저"]],"why":"집(广) 아래 밑바닥 → 밑·끝"},{"id":88,"w":"地球","p":"dìqiú","k":"명","ko":"지구","g":"n4o","ex":[{"zh":"我们只有一个地球，要少用塑料袋。","py":"Wǒmen zhǐ yǒu yí ge dìqiú, yào shǎo yòng sùliàodài.","ko":"지구는 하나뿐이니까 비닐봉지 좀 덜 써야 해."},{"zh":"我们每个人都要保护地球。","py":"Wǒmen měi gè rén dōu yào bǎohù dìqiú.","ko":"우리 모두 지구를 지켜야 해.","pat":"保护地球 = 지구를 지키다"},{"zh":"{H}，你是我在地球上最爱的人。","py":"{H}, nǐ shì wǒ zài dìqiú shang zuì ài de rén.","ko":"{H}, 넌 지구에서 내가 제일 사랑하는 사람이야."}],"c":[["地","地","땅 지"],["球","球","공 구"]],"why":"땅(地)이 공(球) 모양 → 지구"},{"id":89,"w":"地址","p":"dìzhǐ","k":"명","ko":"주소","g":"n4o","ex":[{"zh":"请把您公司  늦게 도착할 거야."},{"zh":"下班时间这条路经常堵车。","py":"Xiàbān shíjiān zhè tiáo lù jīngcháng dǔchē.","ko":"퇴근 시간엔 이 길 자주 막혀.","pat":"路上/经常 + 堵车 = 길이 막히다"},{"zh":"老板，路上堵车，我十分钟以后到。","py":"Lǎobǎn, lùshang dǔchē, wǒ shí fēnzhōng yǐhòu dào.","ko":"사장님, 길이 막혀서 10분 뒤에 도착해요."}],"c":[["堵","堵","담 도"],["车","車","수레 차"]],"why":"차(車)가 담(堵)에 막힘 → 차가 막히다"},{"id":94,"w":"肚子","p":"dùzi","k":"명","ko":"배","g":"n4o","ex":[{"zh":"我肚子饿了，我们去吃饭吧。","py":"Wǒ dùzi è le, wǒmen qù chī fàn ba.","ko":"나 배고파, 우리 밥 먹으러 가자."},{"zh":"我肚子疼，今天不能去了。","py":"Wǒ dùzi téng, jīntiān bù néng qù le.","ko":"나 배 아파서 오늘 못 가.","pat":"肚子 + 疼/饿 = 배가 아프다/고프다"},{"zh":"同事中午吃坏了肚子，下午请假了。","py":"Tóngshì zhōngwǔ chī huài le dùzi, xiàwǔ qǐngjià le.","ko":"동료가 점심 먹고 배탈 나서 오후에 휴가 냈어."}],"c":[["肚","肚","배 두"],["子","子","아들 자"]],"why":"배(肚)+접미사(子) → 배"},{"id":95,"w":"短信","p":"duǎnxìn","k":"명","ko":"문자 메시지","g":"n4o","ex":[{"zh":"妈，我到了就给你发短信。","py":"Mā, wǒ dào le jiù gěi nǐ fā duǎnxìn.","ko":"엄마, 도착하면 바로 문자 보낼게."},{"zh":"我收到了一条奇怪的短信。","py":"Wǒ shōu dào le yī tiáo qíguài de duǎnxìn.","ko":"이상한 문자 하나 받았어.","pat":"发/收到 + 一条短信 = 문자를 보내다/받다"},{"zh":"客户发短信说会议推迟到明天。","py":"Kèhù fā duǎnxìn shuō huìyì tuīchí dào míngtiān.","ko":"고객이 문자로 회의를 내일로 미루자고 했어."}],"c":[["短","短","짧을 단"],["信","信","편지 신"]],"why":"짧은(短) 편지(信) → 문자"},{"id":96,"w":"对面","p":"duìmiàn","k":"명","ko":"맞은편, 건너편","g":"n4o","ex":[{"zh":"我们办公室对面有一家咖啡店。","py":"Wǒmen bàngōngshì duìmiàn yǒu yì jiā kāfēidiàn.","ko":"우리 사무실 맞은편에 카페가 하나 있어."},{"zh":"银行就在超市对面。","py":"Yínháng jiù zài chāoshì duìmiàn.","ko":"은행은 마트 바로 맞은편이야.","pat":"A在B对面 = A는 B 맞은편에 있다"},{"zh":"{H}，坐在我对面的那个人一直看你。","py":"{H}, zuò zài wǒ duìmiàn de nàge rén yīzhí kàn nǐ.","ko":"{H}, 내 맞은편에 앉은 사람이 계속 너 쳐다봐."}],"c":[["对","對","대할 대"],["面","面","낯 면"]],"why":"마주(對)한 낯(面) → 맞은편"},{"id":97,"w":"对于","p":"duìyú","k":"개","ko":"~에 대하여","g":"n4o","ex":[{"zh":"对于这个问题，你有什么看法？","py":"Duìyú zhège wèntí, nǐ yǒu shénme kànfǎ?","ko":"이 문제에 대해서 넌 어떻게 생각해?"},{"zh":"对于我来说，健康最重要。","py":"Duìyú wǒ lái shuō, jiànkāng zuì zhòngyào.","ko":"나한테는 건강이 제일 중요해.","pat":"对于 + 사람 + 来说 = ~에게 있어서"},{"zh":"对于我的工作，爸妈一直很支持。","py":"Duìyú wǒ de gōngzuò, bà mā yīzhí hěn zhīchí.","ko":"내 일에 대해서 엄마 아빠는 늘 지지해 줘."}],"c":[["对","對","대할 대"],["于","於","어조사 어"]],"why":"~에(於) 대하여(對) → ~에 대해"},{"id":98,"w":"多么","p":"duōme","k":"부","ko":"얼마나","g":"n4o","ex":[{"zh":"{H}，你知道我多么想你吗？","py":"{H}, nǐ zhīdào wǒ duōme xiǎng nǐ ma?","ko":"{H}, 내가 너 얼마나 보고 싶은지 알아?"},{"zh":"今天的天气多么好啊！","py":"Jīntiān de tiānqì duōme hǎo a!","ko":"오늘 날씨 얼마나 좋은지!","pat":"多么 + 형용사 + 啊 = 얼마나 ~한가! (감탄)"},{"zh":"这次的合作对公司多么重要啊！","py":"Zhè cì de hézuò duì gōngsī duōme zhòngyào a!","ko":"이번 협력이 회사에 얼마나 중요한데!"}],"c":[["多","多","많을 다"],["么","麽","작을 마"]],"why":"많이(多)+어조사(麽) → 얼마나"},{"id":99,"w":"而","p":"ér","k":"연","ko":"그리고, 그러나, ~하면서","g":"n4o","ex":[{"zh":"我做这份工作不是为了钱，而是为了经验。","py":"Wǒ zuò zhè fèn gōngzuò bú shì wèile qián, ér shì wèile jīngyàn.","ko":"내가 이 일 하는 건 돈 때문이 아니라 경험 때문이야."},{"zh":"南方人爱吃米饭，而北方人爱吃面条。","py":"Nánfāng rén ài chī mǐfàn, ér běifāng rén ài chī miàntiáo.","ko":"남쪽 사람은 밥을 좋아하고, 북쪽 사람은 면을 좋아해.","pat":"A…, 而 B… = A는 ~한 반면 B는 (대조)"},{"zh":"遇到问题要想办法，而不是生气。","py":"Yù dào wèntí yào xiǎng bànfǎ, ér bù shì shēngqì.","ko":"문제 생기면 화낼 게 아니라 방법을 찾아야 해."}],"c":[["而","而","말이을 이"]],"why":"말을 이음(而) → 그리고·그러나"},{"id":100,"w":"儿童","p":"értóng","k":"명","ko":"아동, 어린이","g":"n4o","ex":[{"zh":"这种药儿童不能吃。","py":"Zhè zhǒng yào értóng bù néng chī.","ko":"이 약은 어린이는 먹으면 안 돼."},{"zh":"六月一日是儿童节。","py":"Liù yuè yī rì shì Értóng Jié.","ko":"6월 1일은 어린이날이야.","pat":"儿童节 / 儿童 + 명사 = 어린이날 / 어린이용 ~"},{"zh":"{H}，这本书是给儿童看的，太简单了。","py":"{H}, zhè běn shū shì gěi értóng kàn de, tài jiǎndān le.","ko":"{H}, 이 책 어린이용이야, 너무 쉬워."}],"c":[["儿","兒","아이 아"],["童","童","아이 동"]],"why":"아이(兒)+아이(童) → 아동"},{"id":101,"w":"法律","p":"fǎlǜ","k":"명","ko":"법률","g":"n4o","ex":[{"zh":"这个问题要问懂法律的人。","py":"Zhège wèntí yào wèn dǒng fǎlǜ de rén.","ko":"이 문제는 법률 아는 사람한테 물어봐야 해."},{"zh":"每个人都应该遵守法律。","py":"Měi gè rén dōu yīnggāi zūnshǒu fǎlǜ.","ko":"누구나 법을 지켜야 해.","pat":"遵守法律 = 법을 지키다"},{"zh":"{H}的妹妹在大学学法律。","py":"{H} de mèimei zài dàxué xué fǎlǜ. "},{"id":131,"w":"共同","p":"gòngtóng","k":"형","ko":"공동의, 공통의, 함께","g":"n4o","ex":[{"zh":"{H}和我有很多共同的爱好。","py":"{H} hé wǒ yǒu hěn duō gòngtóng de àihào.","ko":"{H}랑 나는 공통 취미가 많아."},{"zh":"这件事需要大家共同努力。","py":"Zhè jiàn shì xūyào dàjiā gòngtóng nǔlì.","ko":"이 일은 다 같이 노력해야 해.","pat":"共同 + 努力/解决 / 共同的 + 명사 = 함께 ~하다 / 공통의 ~"},{"zh":"爸妈和我共同的希望，就是全家都健康。","py":"Bà mā hé wǒ gòngtóng de xīwàng, jiù shì quán jiā dōu jiànkāng.","ko":"엄마 아빠랑 나의 공통된 바람은 온 가족이 건강한 거야."}],"c":[["共","共","한가지 공"],["同","同","한가지 동"]],"why":"함께(共) 같이(同) → 공동"},{"id":132,"w":"够","p":"gòu","k":"동·부","ko":"충분하다, 닿다, 꽤","g":"n4o","ex":[{"zh":"这些材料够用吗？","py":"Zhèxiē cáiliào gòu yòng ma?","ko":"이 재료들로 충분해?"},{"zh":"钱不够，我们少买一点儿吧。","py":"Qián bù gòu, wǒmen shǎo mǎi yīdiǎnr ba.","ko":"돈이 모자라, 좀 적게 사자.","pat":"명사 + (不)够 = ~이 충분하다/모자라다"},{"zh":"妈，菜已经够多了，别再做了。","py":"Mā, cài yǐjīng gòu duō le, bié zài zuò le.","ko":"엄마, 음식 이미 충분히 많아, 더 하지 마."}],"c":[["够","夠","많을 구"]],"why":"넉넉히 많음(多) → 충분하다"},{"id":133,"w":"购物","p":"gòuwù","k":"동","ko":"쇼핑하다","g":"n4o","ex":[{"zh":"周末{H}想带我去购物。","py":"Zhōumò {H} xiǎng dài wǒ qù gòuwù.","ko":"주말에 {H}가 나 데리고 쇼핑 가고 싶대."},{"zh":"我周末喜欢去购物中心逛逛。","py":"Wǒ zhōumò xǐhuan qù gòuwù zhōngxīn guàngguang.","ko":"주말엔 쇼핑몰 돌아다니는 거 좋아해.","pat":"购物中心 / 网上购物 = 쇼핑몰 / 온라인 쇼핑"},{"zh":"妈，这次回首尔，我想陪你去购物。","py":"Mā, zhè cì huí Shǒu'ěr, wǒ xiǎng péi nǐ qù gòuwù.","ko":"엄마, 이번에 서울 가면 엄마랑 쇼핑하고 싶어."}],"c":[["购","購","살 구"],["物","物","물건 물"]],"why":"물건(物)을 삼(購) → 쇼핑"},{"id":134,"w":"估计","p":"gūjì","k":"동","ko":"추측하다, 예상하다, 어림잡다","g":"n4o","ex":[{"zh":"我估计这批货下周能到。","py":"Wǒ gūjì zhè pī huò xià zhōu néng dào.","ko":"제 예상으로는 이 물건 다음 주에 도착할 거예요."},{"zh":"我估计他今天不会来了。","py":"Wǒ gūjì tā jīntiān bù huì lái le.","ko":"걔 오늘 안 올 것 같아.","pat":"我估计 + 추측 = 아마 ~일 것 같아"},{"zh":"妈，按我的估计，明年就能存够钱了。","py":"Mā, àn wǒ de gūjì, míngnián jiù néng cún gòu qián le.","ko":"엄마, 내 예상으론 내년이면 돈 충분히 모을 수 있어."}],"c":[["估","估","값 고"],["计","計","셀 계"]],"why":"값 매겨(估) 셈(計) → 추측하다"},{"id":135,"w":"鼓励","p":"gǔlì","k":"동","ko":"격려하다, 장려하다","g":"n4o","ex":[{ ,"이을 속"]],"why":"잇고(繼) 이음(續) → 계속"},{"id":181,"w":"记者","p":"jìzhě","k":"명","ko":"기자","g":"n4o","ex":[{"zh":"{H}的朋友是一名记者。","py":"{H} de péngyou shì yì míng jìzhě.","ko":"{H} 친구는 기자야."},{"zh":"记者问了他很多问题。","py":"Jìzhě wèn le tā hěn duō wèntí.","ko":"기자가 그한테 질문을 많이 했어.","pat":"记者 + 采访/问 = 기자가 취재하다/묻다"},{"zh":"下周有个记者要来我们工厂参观。","py":"Xià zhōu yǒu gè jìzhě yào lái wǒmen gōngchǎng cānguān.","ko":"다음 주에 기자 한 명이 우리 공장 견학하러 와."}],"c":[["记","記","기록할 기"],["者","者","놈 자"]],"why":"기록하는(記) 사람(者) → 기자"},{"id":182,"w":"加班","p":"jiābān","k":"동","ko":"초과 근무하다, 야근하다","g":"n4o","ex":[{"zh":"{H}，今晚我要加班，不能陪你聊天了。","py":"{H}, jīn wǎn wǒ yào jiābān, bù néng péi nǐ liáotiān le.","ko":"{H}, 오늘 밤 야근이라 너랑 얘기 못 하겠어."},{"zh":"我昨天加班到晚上十点。","py":"Wǒ zuótiān jiābān dào wǎnshang shí diǎn.","ko":"어제 밤 10시까지 야근했어.","pat":"加班到 + 시간 = ~시까지 야근하다"},{"zh":"老板，今天晚上需要几个人加班？","py":"Lǎobǎn, jīntiān wǎnshang xūyào jǐ gè rén jiābān?","ko":"사장님, 오늘 밤 야근할 사람 몇 명 필요해요?"}],"c":[["加","加","더할 가"],["班","班","나눌 반"]],"why":"근무조(班)를 더함(加) → 야근"},{"id":183,"w":"家具","p":"jiājù","k":"명","ko":"가구","g":"n4o","ex":[{"zh":"新家的家具是{H}帮我选的。","py":"Xīn jiā de jiājù shì {H} bāng wǒ xuǎn de.","ko":"새 집 가구는 {H}가 골라 준 거야."},{"zh":"我们周末去买几件家具吧。","py":"Wǒmen zhōumò qù mǎi jǐ jiàn jiājù ba.","ko":"주말에 가구 몇 개 사러 가자.","pat":"一件/几件 + 家具 = 가구 한 점 (양사 件)"},{"zh":"办公室的家具太旧了，老板想换新的。","py":"Bàngōngshì de jiājù tài jiù le, lǎobǎn xiǎng huàn xīn de.","ko":"사무실 가구가 너무 낡아서 사장님이 새 걸로 바꾸고 싶어 해."}],"c":[["家","家","집 가"],["具","具","갖출 구"]],"why":"집(家)의 도구(具) → 가구"},{"id":184,"w":"加油站","p":"jiāyóuzhàn","k":"명","ko":"주유소","g":"n4o","ex":[{"zh":"前面有个加油站，我们去加点儿油。","py":"Qiánmiàn yǒu ge jiāyóuzhàn, wǒmen qù jiā diǎnr yóu.","ko":"앞에 주유소 있다, 기름 좀 넣고 가자."},{"zh":"前面有加油站吗？车快没油了。","py":"Qiánmiàn yǒu jiāyóuzhàn ma? Chē kuài méi yóu le.","ko":"앞에 주유소 있어? 기름 거의 없어.","pat":"去加油站加油 = 주유소에 가서 기름을 넣다"},{"zh":"{H}，你在加油站旁边等我，我五分钟到。","py":"{H}, nǐ zài jiāyóuzhàn pángbiān děng wǒ, wǒ wǔ fēnzhōng dào.","ko":"{H}, 주유소 옆에서 기다려, 5분이면 가."}],"c":[["加","加","더할 가"],["油","油","기름 유"],["站","站","역마을 참"]],"why":"기름(油) 더하는(加) 곳(站) → 주유소"},{"id":185,"w":"假","p":"jiǎ","k":"형","ko":"가짜의, 거짓의","g":"n4o","ex":[{"zh":"{H}说网上卖的很多化妆品都是假的。","py":"{H} shuō wǎng shang mài de hěn duō huàzhuāngpǐn dōu shì jiǎ de.","ko":"{H}가 인터넷에서 파는 화장품 중에 가짜가 많대."},{"zh":"这块手表是假的，太便宜了。","py":"Zhè kuài shǒubiǎo shì jiǎ de, tài piányi le.","ko":"이 시계 가짜야, 너무 싸잖아.","pat":"是假的 / 真的还是假的 = 가짜다 / 진짜야 가짜야"},{"zh":"你说的是真的还是假的？老板真的要加工资吗？","py":"Nǐ shuō de shì zhēn de háishi jiǎ de? Lǎobǎn zhēn de yào jiā gōngzī ma?","ko":"그거 진짜야 가짜야? 사장님이 진짜 월급 올려 준대?"}],"c":[["假","假","거짓 가"]],"why":"거짓(假) → 가짜"},{"id":186,"w":"价格","p":"jiàgé","k":"명","ko":"가격","g":"n4o","ex":[{"zh":"这个价格我们还能再商量。","py":"Zhège jiàgé wǒmen hái néng zài shāngliang.","ko":"이 가격은 저희가 좀 더 상의해 볼 수 있어요."},{"zh":"这个价格太贵了，能便宜一点儿吗？","py":"Zhège jiàgé tài guì le, néng piányi yīdiǎnr ma?","ko":"이 가격 너무 비싸요, 좀 깎아 줄 수 있어요?","pat":"价格 + 贵/高/便宜 = 가격이 ~하다"},{"zh":"{H}，这家餐厅的价格不贵，菜也好吃。","py":"{H}, zhè jiā cāntīng de jiàgé bù guì, cài yě hǎochī.","ko":"{H}, 이 식당 가격도 안 비싸고 음식도 맛있어."}],"c":[["价","價","값 가"],["格","格","격식 격"]],"why":"값(價)의 등급(格) → 가격"},{"id":187,"w":"减少","p":"jiǎnshǎo","k":"동","ko":"감소하다, 줄이다","g":"n4o","ex":[{"zh":"我们要减少不必要的浪费。","py":"Wǒmen yào jiǎnshǎo bú bìyào de làngfèi.","ko":"불필요한 낭비를 줄여야 해."},{"zh":"每天运动可以减少压力。","py":"Měi tiān yùndòng kěyǐ jiǎnshǎo yālì.","ko":"매일 운동하면 스트레스가 줄어.","pat":"减少 + 压力/浪费/时间 = ~을 줄이다"},{"zh":"爸，你得减少抽烟，最好别抽了。","py":"Bà, nǐ děi jiǎnshǎo chōuyān, zuìhǎo bié chōu le.","ko":"아빠, 담배 줄여야 해, 끊으면 제일 좋고."}],"c":[["减","減","덜 감"],["少","少","적을 소"]],"why":"덜어(減) 적게(少) → 감소"},{"id":188,"w":"建议","p":"jiànyì","k":"동·명","ko":"제안하다, 건의하다, 제안","g":"n4o","ex":[{"zh":"我建议先跟客户见个面。","py":"Wǒ jiànyì xiān gēn kèhù jiàn ge miàn.","ko":"먼저 고객이랑 한번 만나 보는 걸 제안해요."},{"zh":"你能给我一些建议吗？","py":"Nǐ néng gěi wǒ yīxiē jiànyì ma?","ko":"나한테 조언 좀 해 줄 수 있어?","pat":"给 + 사람 + 建议 / 建议你… = ~에게 조언하다 / ~하는 게 좋겠어"},{"zh":"妈，大夫建议你多走路。","py":"Mā, dàifu jiànyì nǐ duō zǒulù.","ko":"엄마, 의사가 많이 걸으라고 했어."}],"c":[["建","建","세울 건"],["议","議","의논할 의"]],"why":"의견 ":"Nǐ gěi tā liú ge diànhuà hàomǎ ba.","ko":"그 사람한테 전화번호 남겨 둬.","pat":"留 + 电话/话 = 번호·말을 남기다"},{"zh":"爸，你别担心，我会留在这边继续工作。","py":"Bà, nǐ bié dānxīn, wǒ huì liú zài zhèbiān jìxù gōngzuò.","ko":"아빠, 걱정 마, 여기 남아서 계속 일할 거야."}],"c":[["留","留","머무를 류"]],"why":"留學(유학)의 '머무를 류' — 남다, 머물다"},{"id":265,"w":"流利","p":"liúlì","k":"형","ko":"유창하다","g":"n4o","ex":[{"zh":"你的英语说得真流利。","py":"Nǐ de Yīngyǔ shuō de zhēn liúlì.","ko":"영어를 정말 유창하게 하시네요."},{"zh":"他能说一口流利的英语。","py":"Tā néng shuō yì kǒu liúlì de Yīngyǔ.","ko":"그는 영어를 유창하게 해.","pat":"一口流利的 + 언어 = 유창한 ~어"},{"zh":"我们老板英语和马来语都很流利。","py":"Wǒmen lǎobǎn Yīngyǔ hé Mǎláiyǔ dōu hěn liúlì.","ko":"우리 사장님은 영어랑 말레이어 둘 다 유창해."}],"c":[["流","流","흐를 류"],["利","利","이로울 리"]],"why":"물 흐르듯(流) 매끄러움(利) → 유창하다"},{"id":266,"w":"流行","p":"liúxíng","k":"동","ko":"유행하다, 퍼지다","g":"n4o","ex":[{"zh":"{H}，这种颜色今年在韩国很流行。","py":"{H}, zhè zhǒng yánsè jīnnián zài Hánguó hěn liúxíng.","ko":"{H}, 이 색깔 올해 한국에서 엄청 유행이야."},{"zh":"这首歌最近特别流行。","py":"Zhè shǒu gē zuìjìn tèbié liúxíng.","ko":"이 노래 요즘 엄청 유행해.","pat":"最近 + 很/特别 + 流行 = 요즘 유행하다"},{"zh":"最近公司里流行感冒，大家小心点儿。","py":"Zuìjìn gōngsī li liúxíng gǎnmào, dàjiā xiǎoxīn diǎnr.","ko":"요즘 회사에 감기 돌아, 다들 조심해."}],"c":[["流","流","흐를 류"],["行","行","다닐 행"]],"why":"흘러(流) 퍼져 다님(行) → 유행하다"},{"id":267,"w":"旅行","p":"lǚxíng","k":"동","ko":"여행하다, 여행","g":"n4o","ex":[{"zh":"{H}，我们明年去济州岛旅行吧。","py":"{H}, wǒmen míngnián qù Jìzhōu Dǎo lǚxíng ba.","ko":"{H}, 우리 내년에 제주도 여행 가자."},{"zh":"放假的时候我们去云南旅行吧。","py":"Fàngjià de shíhou wǒmen qù Yúnnán lǚxíng ba.","ko":"방학 때 우리 윈난으로 여행 가자.","pat":"去 + 장소 + 旅行 = ~로 여행 가다"},{"zh":"这次旅行我拍了很多照片。","py":"Zhè cì lǚxíng wǒ pāi le hěn duō zhàopiàn.","ko":"이번 여행에서 사진 엄청 많이 찍었어."}],"c":[["旅","旅","나그네 려"],["行","行","다닐 행"]],"why":"나그네(旅)로 다님(行) → 여행"},{"id":268,"w":"律师","p":"lǜshī","k":"명","ko":"변호사","g":"n4o","ex":[{"zh":"合同的问题要问律师。","py":"Hétong de wèntí yào wèn lǜshī.","ko":"계약서 문제는 변호사한테 물어봐야 돼."},{"zh":"这件事最好请个律师。","py":"Zhè jiàn shì zuìhǎo qǐng ge lǜshī.","ko":"이 일은 변호사 쓰는 게 좋겠어.","pat":"请/找 + 律师 = 변호사를 쓰다·찾다"},{"zh":"{H}，你 评","p":"pīpíng","k":"동","ko":"비판하다, 꾸짖다","g":"n4o","ex":[{"zh":"今天老板批评了我们。","py":"Jīntiān lǎobǎn pīpíng le wǒmen.","ko":"오늘 사장님한테 혼났어."},{"zh":"他上班迟到，被老板批评了。","py":"Tā shàngbān chídào, bèi lǎobǎn pīpíng le.","ko":"그는 지각해서 사장님한테 혼났어.","pat":"被 + 사람 + 批评 = ~에게 꾸중 듣다"},{"zh":"我小时候爸爸很少批评我。","py":"Wǒ xiǎo shíhou bàba hěn shǎo pīpíng wǒ.","ko":"어릴 때 아빠는 나를 거의 안 혼냈어."}],"c":[["批","批","비평할 비"],["评","評","평할 평"]],"why":"따지고(批) 평함(評) → 비판하다"},{"id":296,"w":"皮肤","p":"pífū","k":"명","ko":"피부","g":"n4o","ex":[{"zh":"{H}说我的皮肤有点儿干。","py":"{H} shuō wǒ de pífū yǒudiǎnr gān.","ko":"{H}가 내 피부가 좀 건조하대."},{"zh":"她的皮肤又白又好。","py":"Tā de pífū yòu bái yòu hǎo.","ko":"그녀는 피부가 하얗고 좋아.","pat":"皮肤 + 白/好 = 피부가 하얗다·좋다"},{"zh":"在工厂工作要保护好皮肤。","py":"Zài gōngchǎng gōngzuò yào bǎohù hǎo pífū.","ko":"공장에서 일할 땐 피부 잘 보호해야 해."}],"c":[["皮","皮","가죽 피"],["肤","膚","살갗 부"]],"why":"가죽(皮)과 살갗(膚) → 피부"},{"id":297,"w":"脾气","p":"píqi","k":"명","ko":"성격, 성질, 화","g":"n4o","ex":[{"zh":"我们老板脾气很好。","py":"Wǒmen lǎobǎn píqi hěn hǎo.","ko":"우리 사장님은 성격이 좋아."},{"zh":"别总是对孩子发脾气。","py":"Bié zǒngshì duì háizi fā píqi.","ko":"애한테 맨날 화내지 마.","pat":"发脾气 = 화를 내다·성질부리다"},{"zh":"妈，爸的脾气还是那么急吗？","py":"Mā, bà de píqi háishi nàme jí ma?","ko":"엄마, 아빠 성격 아직도 그렇게 급해?"}],"c":[["脾","脾","지라 비"],["气","氣","기운 기"]],"why":"비장(脾)의 기운(氣) → 성질, 성격"},{"id":298,"w":"皮鞋","p":"píxié","k":"명","ko":"가죽 구두","g":"n4o","ex":[{"zh":"明天见客户，我得穿皮鞋。","py":"Míngtiān jiàn kèhù, wǒ děi chuān píxié.","ko":"내일 고객 만나니까 구두 신어야 돼."},{"zh":"我想买一双黑色的皮鞋。","py":"Wǒ xiǎng mǎi yì shuāng hēisè de píxié.","ko":"검은 구두 한 켤레 사고 싶어.","pat":"一双 + 皮鞋 = 구두 한 켤레"},{"zh":"爸，你的皮鞋太旧了，我给你买双新的。","py":"Bà, nǐ de píxié tài jiù le, wǒ gěi nǐ mǎi shuāng xīn de.","ko":"아빠, 구두 너무 낡았어, 새 걸로 하나 사줄게."}],"c":[["皮","皮","가죽 피"],["鞋","鞋","신 혜"]],"why":"가죽(皮) 신(鞋) → 가죽 구두"},{"id":299,"w":"篇","p":"piān","k":"명·양","ko":"편(글을 세는 단위), 장","g":"n4o","ex":[{"zh":"这周我要写完一篇报告。","py":"Zhè zhōu wǒ yào xiě wán yī piān bàogào.","ko":"이번 주에 보고서 한 편 다 써야 돼."},{"zh":"这篇文章写得很好。","py":"Zhè piān wénzhāng xiě de hěn hǎo.","ko":"이 글 정말 잘 썼다.","pat":"一篇/这篇 + 文章 = 글 한 편/이 글"},{"zh":"爸，这篇新闻说韩国经济不太好。","py":"Bà, zhè piān xīnwén shuō Hánguó jīngjì bú tài hǎo.","ko":"아빠, 이 기사에 한국 경제가 별로 안 좋대."}],"c":[["篇","篇","책 편"]],"why":"長篇(장편)의 '책 편' — 글 세는 단위"},{"id":300,"w":"乒乓球","p":"pīngpāngqiú","k":"명","ko":"탁구","g":"n4o","ex":[{"zh":"爸，你还在打乒乓球吗？","py":"Bà, nǐ hái zài dǎ pīngpāngqiú ma?","ko":"아빠, 아직도 탁구 쳐?"},{"zh":"我们下午去打乒乓球吧。","py":"Wǒmen xiàwǔ qù dǎ pīngpāngqiú ba.","ko":"우리 오후에 탁구 치러 가자.","pat":"打 + 乒乓球 = 탁구를 치다"},{"zh":"{H}，你乒乓球打得比我好。","py":"{H}, nǐ pīngpāngqiú dǎ de bǐ wǒ hǎo.","ko":"{H}, 너 탁구 나보다 잘 친다."}],"c":[["乒","乒","물건 부딪는 소리 병"],["乓","乓","물건 부딪는 소리 방"],["球","球","공 구"]],"why":"핑퐁(乒乓) 소리 나는 공(球) → 탁구"},{"id":301,"w":"破","p":"pò","k":"동·형","ko":"깨지다, 찢어지다, 낡다, 깨뜨리다","g":"n4o","ex":[{"zh":"{H}，你的袜子破了！","py":"{H}, nǐ de wàzi pò le!","ko":"{H}, 너 양말 찢어졌어!"},{"zh":"小心，别把杯子打破了。","py":"Xiǎoxīn, bié bǎ bēizi dǎpò le.","ko":"조심해, 컵 깨뜨리지 마.","pat":"打破 + 물건 = ~를 깨뜨리다"},{"zh":"这个箱子破了，换一个新的吧。","py":"Zhège xiāngzi pò le, huàn yí ge xīn de ba.","ko":"이 상자 찢어졌어, 새 걸로 바꾸자."}],"c":[["破","破","깨뜨릴 파"]],"why":"破壞(파괴)의 '깨뜨릴 파'"},{"id":302,"w":"葡萄","p":"pútao","k":"명","ko":"포도","g":"n4o","ex":[{"zh":"妈，韩国的葡萄现在很甜吧？","py":"Mā, Hánguó de pútao xiànzài hěn tián ba?","ko":"엄마, 한국 포도 지금 엄청 달지?"},{"zh":"吃葡萄不吐葡萄皮。","py":"Chī pútao bù tǔ pútao pí.","ko":"포도 먹고 포도 껍질 안 뱉는다.","pat":"吃葡萄不吐葡萄皮 = 유명한 중국어 잰말놀이"},{"zh":"{H}，我给你买了一斤葡萄。","py":"{H}, wǒ gěi nǐ mǎi le yì jīn pútao.","ko":"{H}, 너 주려고 포도 한 근 샀어."}],"c":[["葡","葡","포도 포"],["萄","萄","포도 도"]],"why":"외래어 음역 葡萄 → 포도"},{"id":303,"w":"普遍","p":"pǔbiàn","k":"형","ko":"보편적이다, 널리 퍼져 있다","g":"n4o","ex":[{"zh":"这个问题在工厂里很普遍。","py":"Zhège wèntí zài gōngchǎng li hěn pǔbiàn.","ko":"이 문제는 공장에서 아주 흔해."},{"zh":"人们普遍认为他是个好老板。","py":"Rénmen pǔbiàn rènwéi tā shì ge hǎo lǎobǎn.","ko":"사람들은 대체로 그가 좋은 사장이라고 생각해.","pat":"普遍认为 = 일반적으로 ~라고 여기다"},{"zh":"妈，在新加坡说英语很普遍。","py":"Mā, zài Xīnjiāpō shuō Yīngyǔ hěn pǔbiàn.","ko":"엄마, 싱가포르에선 영어 쓰는 게 아주 보편적이야."}],"c":[["普","普","넓을 보"],["遍","遍","두루 편"]],"why":"넓게(普) 두루(遍) 퍼짐 → 보편적이다"},{"id":304,"w":"普通话","p":"pǔtōnghuà","k":"명","ko":"표준 중국어, 보통화","g":"n4o","ex":[{"zh":"{H}的普通话说得很标准。","py":"{H} de pǔtōnghuà shuō de hěn biāozhǔn.","ko":"{H}는 표준 중국어를 아주 정확하게 해."},{"zh":"请大家说普通话。","py":"Qǐng dàjiā shuō pǔtōnghuà.","ko":"다들 표준 중국어로 말해 주세요.","pat":"说 + 普通话 = 표준 중국어를 하다"},{"zh":"妈，我现在能用普通话跟同事聊天了。","py":"Mā, wǒ xiànzài néng yòng pǔtōnghuà gēn tóngshì liáotiān le.","ko":"엄마, 나 이제 중국어로 동료들이랑 수다 떨 수 있어."}],"c":[["普","普","넓을 보"],["通","通","통할 통"],["话","話","말씀 화"]],"why":"널리(普) 통하는(通) 말(話) → 표준 중국어"},{"id":305,"w":"其次","p":"qícì","k":"대","ko":"그다음, 다음으로","g":"n4o","ex":[{"zh":"首先要安全，其次是速度。","py":"Shǒuxiān yào ānquán, qícì shì sùdù.","ko":"우선 안전이고, 그다음이 속도야."},{"zh":"首先要努力，其次要有耐心。","py":"Shǒuxiān yào nǔlì, qícì yào yǒu nàixīn.","ko":"우선 노력해야 하고, 그다음은 인내심이 있어야 해.","pat":"首先…，其次… = 우선 ~, 그다음 ~"},{"zh":"{H}，我最喜欢韩国菜，其次是中国菜。","py":"{H}, wǒ zuì xǐhuan Hánguó cài, qícì shì Zhōngguó cài.","ko":"{H}, 난 한국 음식이 제일 좋고 그다음이 중국 음식이야."}],"c":[["其","其","그 기"],["次","次","버금 차"]],"why":"그(其) 다음(次) → 그다음"},{"id":306,"w":"其中","p":"qízhōng","k":"명","ko":"그중, 그 안","g":"n4o","ex":[{"zh":"我们有十个客户，其中三个在新加坡。","py":"Wǒmen yǒu shí ge kèhù, qízhōng sān ge zài Xīnjiāpō.","ko":"우리 고객이 열 곳인데, 그중 세 곳이 싱가포르에 있어."},{"zh":"这是其中一个原因。","py":"Zhè shì qízhōng yí ge yuányīn.","ko":"이게 그중 한 가지 이유야.","pat":"其中 + 一个 = 그중 하나"},{"zh":"我家有四口人，其中我妈最会做饭。","py":"Wǒ jiā yǒu sì kǒu rén, qízhōng wǒ mā zuì huì zuò fàn.","ko":"우리 가족은 네 명인데 그중에 엄마가 요리를 제일 잘해."}],"c":[["其","其","그 기"],["中","中","가운데 중"]],"why":"그(其) 가운데(中) → 그중"},{"id":307,"w":"气候","p":"qìhòu","k":"명","ko":"기후","g":"n4o","ex":[{"zh":"妈，新山的气候一年四季都很热。","py":"Mā, Xīnshān de qìhòu yī nián sì jì dōu hěn rè.","ko":"엄마, 조호르바루 기후는 일 년 내내 더워."},{"zh":"我不太习惯这里的气候。","py":"Wǒ bú tài xíguàn zhèlǐ de qìhòu.","ko":"여기 기후에 아직 잘 적응이 안 돼.","pat":"习惯/适应 + 气候 = 기후에 익숙해지다"},{"zh":"这种气候，机器很容易坏。","py":"Zhè zhǒng qìhòu, jīqì hěn róngyì huài.","ko":"이런 기후에선 기계가 쉽게 고장 나."}],"c":[["气","氣","기운 기"],["候","候","기후 후"]],"why":"대기의 기운(氣)과 철의 변화(候) → 기후"},{"id":308,"w":"千万","p":"qiānwàn","k":"부","ko":"부디, 절대로, 제발","g":"n4o","ex":[{"zh":"妈，你千万别担心我。","py":"Mā, nǐ qiānwàn bié dānxīn wǒ.","ko":"엄마, 내 걱정은 절대 하지 마."},{"zh":"开车千万别喝酒。","py":"Kāichē qiānwàn bié hē jiǔ.","ko":"운전할 땐 절대 술 마시지 마.","pat":"千万 + 别/要 = 절대 ~하지 마 / 꼭 ~해"},{"zh":"{H}，晚上一个人千万别走那条路。","py":"{H}, wǎnshang yí ge rén qiānwàn bié zǒu nà tiáo lù.","ko":"{H}, 밤에 혼자 그 길로 절대 다니지 마."}],"c":[["千","千","일천 천"],["万","萬","일만 만"]],"why":"천(千) 번 만(萬) 번 → 부디, 절대로"},{"id":309,"w":"签证","p":"qiānzhèng","k":"동·명","ko":"비자를 발급하다, 비자","g":"n4o","ex":[{"zh":"{H}，我妈来新加坡需要签证吗？","py":"{H}, wǒ mā lái Xīnjiāpō xūyào qiānzhèng ma?","ko":"{H}, 우리 엄마가 싱가포르 오려면 비자 필요해?"},{"zh":"办签证需要多长时间？","py":"Bàn qiānzhèng xūyào duō cháng shíjiān?","ko":"비자 받는 데 얼마나 걸려?","pat":"办 + 签证 = 비자를 받다(발급받다)"},{"zh":"爸，韩国人去马来西亚不用签证。","py":"Bà, Hánguó rén qù Mǎláixīyà búyòng qiānzhèng.","ko":"아빠, 한국 사람은 말레이시아 갈 때 비자 필요 없어."}],"c":[["签","簽","서명할 첨"],["证","證","증거 증"]],"why":"서명한(簽) 증명서(證) → 비자"},{"id":310,"w":"敲","p":"qiāo","k":"동","ko":"두드리다, 노크하다, 치다","g":"n4o","ex":[{"zh":"进老板办公室前要先敲门。","py":"Jìn lǎobǎn bàngōngshì qián yào xiān qiāo mén.","ko":"사장님 사무실 들어가기 전엔 먼저 노크해야 돼."},{"zh":"有人在敲门，你去看看。","py":"Yǒu rén zài qiāo mén, nǐ qù kànkan.","ko":"누가 노크해, 가서 좀 봐.","pat":"敲 + 门 = 노크하다"},{"zh":"爸用手敲了敲我的头说：“加油！”","py":"Bà yòng shǒu qiāo le qiāo wǒ de tóu shuō: “Jiāyóu!”","ko":"아빠가 손으로 내 머리를 톡톡 치면서 \"힘내!\"라고 했어."}],"c":[["敲","敲","두드릴 고"]],"why":"推敲(퇴고)의 '두드릴 고' — 노크하다"},{"id":311,"w":"桥","p":"qiáo","k":"명","ko":"다리, 교량","g":"n4o","ex":[{"zh":"每个周末我都要过那座桥去新加坡。","py":"Měi ge zhōumò wǒ dōu yào guò nà zuò qiáo qù Xīnjiāpō.","ko":"주말마다 나는 그 다리를 건너서 싱가포르에 가."},{"zh":"河上有一座很长的桥。","py":"Hé shang yǒu yí zuò hěn cháng de qiáo.","ko":"강 위에 아주 긴 다리가 하나 있어.","pat":"一座 + 桥 = 다리 하나"},{"zh":"老板，桥上堵车，我要晚到十分钟。","py":"Lǎobǎn, qiáo shang dǔchē, wǒ yào wǎn dào shí fēnzhōng.","ko":"사장님, 다리 위가 막혀서 10분 늦을 것 같아요."}],"c":[["桥","橋","다리 교"]],"why":"鐵橋(철교)의 '다리 교'"},{"id":312,"w":"巧克力","p":"qiǎokèlì","k":"명","ko":"초콜릿","g":"n4o","ex":[{"zh":"{H}最喜欢吃巧克力。","py":"{H} zuì xǐhuan chī qiǎokèlì.","ko":"{H}는 초콜릿을 제일 좋아해."},{"zh":"我饿了，给我一块巧克力吧。","py":"Wǒ è le, gěi wǒ yí kuài qiǎokèlì ba.","ko":"배고파, 초콜릿 한 조각만 줘.","pat":"一块 + 巧克力 = 초콜릿 한 조각"},{"zh":"同事从日本回来，给大家带了巧克力。","py":"Tóngshì cóng Rìběn huílai, gěi dàjiā dài le qiǎokèlì.","ko":"동료가 일본 갔다 와서 다들한테 초콜릿 사 왔어."}],"c":[["巧","巧","공교할 교"],["克","克","이길 극"],["力","力","힘 력"]],"why":"chocolate의 음역 巧克力 → 초콜릿"},{"id":313,"w":"亲戚","p":"qīnqi","k":"명","ko":"친척","g":"n4o","ex":[{"zh":"过年的时候亲戚都来我家。","py":"Guònián de shíhou qīnqi dōu lái wǒ jiā.","ko":"설날엔 친척들이 다 우리 집에 와."},{"zh":"春节的时候大家都去走亲戚。","py":"Chūnjié de shíhou dàjiā dōu qù zǒu qīnqi.","ko":"설날엔 다들 친척 집에 인사 다녀.","pat":"走亲戚 = 친척 집을 방문하다"},{"zh":"老板的亲戚也在我们工厂工作。","py":"Lǎobǎn de qīnqi yě zài wǒmen gōngchǎng gōngzuò.","ko":"사장님 친척도 우리 공장에서 일해."}],"c":[["亲","親","친할 친"],["戚","戚","겨레 척"]],"why":"친족(親)과 겨레붙이(戚) → 친척"},{"id":314,"w":"轻","p":"qīng","k":"형","ko":"가볍다, (정도가) 약하다, 부드럽다","g":"n4o","ex":[{"zh":"这个箱子很轻，我一个人拿就行。","py":"Zhège xiāngzi hěn qīng, wǒ yī ge rén ná jiù xíng.","ko":"이 상자 가벼워서 나 혼자 들면 돼."},{"zh":"她轻轻地关上了门。","py":"Tā qīngqīng de guānshang le mén.","ko":"그녀가 문을 살며시 닫았어.","pat":"轻轻地 + 동사 = 살살·가볍게 ~하다"},{"zh":"妈，别担心，我的病很轻。","py":"Mā, bié dānxīn, wǒ de bìng hěn qīng.","ko":"엄마, 걱정 마, 별로 안 심해."}],"c":[["轻","輕","가벼울 경"]],"why":"輕量(경량)의 '가벼울 경'"},{"id":315,"w":"轻松","p":"qīngsōng","k":"형","ko":"홀가분하다, 수월하다, 편안하다","g":"n4o","ex":[{"zh":"考完试以后，我轻松多了。","py":"Kǎo wán shì yǐhòu, wǒ qīngsōng duō le.","ko":"시험 끝나고 나니까 훨씬 홀가분해."},{"zh":"这次考试他轻松地通过了。","py":"Zhè cì kǎoshì tā qīngsōng de tōngguò le.","ko":"이번 시험 그는 수월하게 통과했어.","pat":"轻松地 + 동사 = 수월하게 ~하다"},{"zh":"{H}，跟你在一起我觉得很轻松。","py":"{H}, gēn nǐ zài yìqǐ wǒ juéde hěn qīngsōng.","ko":"{H}, 너랑 있으면 마음이 편해."}],"c":[["轻","輕","가벼울 경"],["松","鬆","느슨할 송"]],"why":"가볍고(輕) 느슨함(鬆) → 홀가분하다"},{"id":316,"w":"情况","p":"qíngkuàng","k":"명","ko":"상황, 정황","g":"n4o","ex":[{"zh":"你先说一下现在的情况。","py":"Nǐ xiān shuō yīxià xiànzài de qíngkuàng.","ko":"먼저 지금 상황부터 말해 봐."},{"zh":"我先去了解一下情况。","py":"Wǒ xiān qù liǎojiě yíxià qíngkuàng.","ko":"내가 먼저 가서 상황 좀 파악할게.","pat":"了解 + 情况 = 상황을 파악하다"},{"zh":"妈，爸的身体情况好点儿了吗？","py":"Mā, bà de shēntǐ qíngkuàng hǎo diǎnr le ma?","ko":"엄마, 아빠 몸 상태 좀 나아졌어?"}],"c":[["情","情","실상 정"],["况","況","상황 황"]],"why":"실정(情)과 형편(況) → 상황"},{"id":317,"w":"区别","p":"qūbié","k":"동·명","ko":"구별하다, 차이","g":"n4o","ex":[{"zh":"这两种材料有什么区别？","py":"Zhè liǎng zhǒng cáiliào yǒu shénme qūbié?","ko":"이 두 가지 재료는 뭐가 달라요?"},{"zh":"这两个词的区别在哪儿？","py":"Zhè liǎng ge cí de qūbié zài nǎr?","ko":"이 두 단어의 차이가 뭐야?","pat":"A和B的区别 / 区别在哪儿 = 차이가 어디에 있어"},{"zh":"爸，这两个工作的收入没什么区别。","py":"Bà, zhè liǎng ge gōngzuò de shōurù méi shénme qūbié.","ko":"아빠, 이 두 일자리 수입은 별 차이 없어."}],"c":[["区","區","구분할 구"],["别","別","나눌 별"]],"why":"구분하여(區) 나눔(別) → 구별, 차이"},{"id":318,"w":"取","p":"qǔ","k":"동","ko":"가지다, 찾다, 취하다","g":"n4o","ex":[{"zh":"我下班后去银行取钱。","py":"Wǒ xiàbān hòu qù yínháng qǔ qián.","ko":"나 퇴근하고 은행 가서 돈 찾을 거야."},{"zh":"到机场以后先去取行李。","py":"Dào jīchǎng yǐhòu xiān qù qǔ xíngli.","ko":"공항 도착하면 먼저 짐부터 찾아.","pat":"取 + 钱/票/行李 = 돈을 찾다·표/짐을 찾다"},{"zh":"妈，你寄的东西我已经取到了。","py":"Mā, nǐ jì de dōngxi wǒ yǐjīng qǔdào le.","ko":"엄마, 보내준 거 벌써 찾았어."}],"c":[["取","取","가질 취"]],"why":"取得(취득)의 '가질 취' — 찾다, 취하다"},{"id":319,"w":"全部","p":"quánbù","k":"명","ko":"전부, 모두","g":"n4o","ex":[{"zh":"这些文件我已经全部看完了。","py":"Zhèxiē wénjiàn wǒ yǐjīng quánbù kàn wán le.","ko":"이 서류들 벌써 전부 다 봤어."},{"zh":"这个月的钱全部花完了。","py":"Zhège yuè de qián quánbù huāwán le.","ko":"이번 달 돈 전부 다 썼어.","pat":"全部 + 동사 + 完 = 전부 다 ~했다"},{"zh":"妈，我把全部的钱都存在银行了。","py":"Mā, wǒ bǎ quánbù de qián dōu cún zài yínháng le.","ko":"엄마, 돈은 전부 은행에 넣어뒀어."}],"c":[["全","全","온전할 전"],["部","部","떼 부"]],"why":"온(全) 무리(部) → 전부"},{"id":320,"w":"缺点","p":"quēdiǎn","k":"명","ko":"단점, 결점","g":"n4o","ex":[{"zh":"{H}，我最大的缺点是太着急。","py":"{H}, wǒ zuì dà de quēdiǎn shì tài zháojí.","ko":"{H}, 내 가장 큰 단점은 너무 조급한 거야."},{"zh":"每个人都有优点和缺点。","py":"Měi ge rén dōu yǒu yōudiǎn hé quēdiǎn.","ko":"누구나 장점과 단점이 있어.","pat":"优点和缺点 = 장점과 단점"},{"zh":"这台机器的缺点是声音太大。","py":"Zhè tái jīqì de quēdiǎn shì shēngyīn tài dà.","ko":"이 기계 단점은 소리가 너무 크다는 거야."}],"c":[["缺","缺","이지러질 결"],["点","點","점 점"]],"why":"모자란(缺) 점(點) → 결점, 단점"},{"id":321,"w":"缺少","p":"quēshǎo","k":"동","ko":"부족하다, 모자라다","g":"n4o","ex":[{"zh":"我们工厂缺少有经验的工人。","py":"Wǒmen gōngchǎng quēshǎo yǒu jīngyàn de gōngrén.","ko":"우리 공장은 경험 있는 직원이 부족해."},{"zh":"我们缺少的是时间。","py":"Wǒmen quēshǎo de shì shíjiān.","ko":"우리한테 부족한 건 시간이야.","pat":"缺少 + 经验/时间 = ~이 부족하다"},{"zh":"{H}，我的生活里不能缺少你。","py":"{H}, wǒ de shēnghuó li bù néng quēshǎo nǐ.","ko":"{H}, 내 삶에 네가 없으면 안 돼."}],"c":[["缺","缺","이지러질 결"],["少","少","적을 소"]],"why":"모자라고(缺) 적음(少) → 부족하다"},{"id":322,"w":"却","p":"què","k":"부","ko":"오히려, 그러나, 도리어","g":"n4o","ex":[{"zh":"我很想去，却没有时间。","py":"Wǒ hěn xiǎng qù, què méiyǒu shíjiān.","ko":"정말 가고 싶은데 시간이 없어."},{"zh":"他虽然很累，却很开心。","py":"Tā suīrán hěn lèi, què hěn kāixīn.","ko":"그는 피곤하지만 오히려 즐거워해.","pat":"虽然…，却… = 비록 ~지만 ~하다"},{"zh":"价格低了，客户却还是不满意。","py":"Jiàgé dī le, kèhù què háishi bù mǎnyì.","ko":"가격을 낮췄는데도 고객은 여전히 불만이야."}],"c":[["却","却","물리칠 각"]],"why":"退却(퇴각)의 '물리칠 각' → 도리어, 오히려"},{"id":323,"w":"确实","p":"quèshí","k":"부","ko":"확실히, 정말로","g":"n4o","ex":[{"zh":"这个价格确实有点儿高。","py":"Zhège jiàgé quèshí yǒudiǎnr gāo.","ko":"이 가격은 확실히 좀 비싸네요."},{"zh":"你说得确实有道理。","py":"Nǐ shuō de quèshí yǒu dàolǐ.","ko":"네 말 확실히 일리가 있어.","pat":"确实 + 형용사/有道理 = 확실히 ~하다"},{"zh":"妈，这边的工作确实比韩国轻松。","py":"Mā, zhèbiān de gōngzuò quèshí bǐ Hánguó qīngsōng.","ko":"엄마, 여기 일이 확실히 한국보다 수월해."}],"c":[["确","確","굳을 확"],["实","實","참될 실"]],"why":"굳고(確) 참됨(實) → 확실히"},{"id":324,"w":"然而","p":"rán’ér","k":"연","ko":"그러나, 하지만","g":"n4o","ex":[{"zh":"计划很好，然而钱不够。","py":"Jìhuà hěn hǎo, rán'ér qián bù gòu.","ko":"계획은 좋은데, 하지만 돈이 부족해."},{"zh":"大家都以为他会来，然而他没来。","py":"Dàjiā dōu yǐwéi tā huì lái, rán'ér tā méi lái.","ko":"다들 그가 올 줄 알았지만 그는 안 왔어.","pat":"…，然而… = ~했지만 그러나 ~"},{"zh":"爸妈想让我回韩国，然而我更喜欢这里。","py":"Bà mā xiǎng ràng wǒ huí Hánguó, rán'ér wǒ gèng xǐhuan zhèlǐ.","ko":"부모님은 내가 한국 오길 바라는데, 난 여기가 더 좋아."}],"c":[["然","然","그럴 연"],["而","而","말 이을 이"]],"why":"그러(然)하나(而) → 그러나"},{"id":325,"w":"热闹","p":"rènao","k":"형·동·명","ko":"떠들썩하다, "베이징은 중국의 수도야.","pat":"A是B的首都 = A는 B의 수도다"},{"zh":"老板下周要去印尼首都见客户。","py":"Lǎobǎn xià zhōu yào qù Yìnní shǒudū jiàn kèhù.","ko":"사장님이 다음 주에 인도네시아 수도로 고객 만나러 가셔."}],"c":[["首","首","머리 수"],["都","都","도읍 도"]],"why":"으뜸(首) 도읍(都) → 수도"},{"id":360,"w":"首先","p":"shǒuxiān","k":"부·대","ko":"먼저, 우선, 첫째","g":"n4o","ex":[{"zh":"首先，我介绍一下我们公司。","py":"Shǒuxiān, wǒ jièshào yīxià wǒmen gōngsī.","ko":"먼저 저희 회사를 소개해 드릴게요."},{"zh":"首先洗手，然后吃饭。","py":"Shǒuxiān xǐ shǒu, ránhòu chīfàn.","ko":"먼저 손 씻고 그다음에 밥 먹어.","pat":"首先…，然后… = 먼저 ~, 그다음 ~"},{"zh":"妈，到了机场首先给我打电话。","py":"Mā, dàole jīchǎng shǒuxiān gěi wǒ dǎ diànhuà.","ko":"엄마, 공항 도착하면 먼저 나한테 전화해."}],"c":[["首","首","머리 수"],["先","先","먼저 선"]],"why":"맨 처음(首) 먼저(先) → 우선"},{"id":361,"w":"受不了","p":"shòubuliǎo","k":"동","ko":"견딜 수 없다, 참을 수 없다","g":"n4o","ex":[{"zh":"天气这么热，我真受不了。","py":"Tiānqì zhème rè, wǒ zhēn shòubuliǎo.","ko":"날씨가 이렇게 더우니 진짜 못 참겠어."},{"zh":"今天热得让人受不了。","py":"Jīntiān rè de ràng rén shòubuliǎo.","ko":"오늘 더워서 견딜 수가 없어.","pat":"형용사 + 得 + (让人)受不了 = ~해서 견딜 수 없다"},{"zh":"这个客户每天打电话，我真受不了他。","py":"Zhège kèhù měi tiān dǎ diànhuà, wǒ zhēn shòubuliǎo tā.","ko":"이 고객 매일 전화해서 진짜 못 참겠어."}],"c":[["受","受","받을 수"],["不","不","아닐 불"],["了","了","마칠 료"]],"why":"끝까지(了) 받아내지(受) 못함(不) → 못 견디다"},{"id":362,"w":"输","p":"shū","k":"동","ko":"지다, 패하다, 수송하다","g":"n4o","ex":[{"zh":"爸，昨天的比赛韩国队输了。","py":"Bà, zuótiān de bǐsài Hánguó duì shū le.","ko":"아빠, 어제 경기 한국 팀이 졌어."},{"zh":"我们队输给了他们。","py":"Wǒmen duì shū gěi le tāmen.","ko":"우리 팀이 그 팀한테 졌어.","pat":"输给 + 상대 = ~에게 지다"},{"zh":"公司篮球比赛，我们输了两分。","py":"Gōngsī lánqiú bǐsài, wǒmen shū le liǎng fēn.","ko":"회사 농구 시합에서 우리가 2점 차로 졌어."}],"c":[["输","輸","보낼 수"]],"why":"輸送(수송)의 '보낼 수' → 내주다, 지다"},{"id":363,"w":"熟悉","p":"shúxi","k":"동","ko":"잘 알다, 익숙하다, 익히다","g":"n4o","ex":[{"zh":"我对这台机器很熟悉。","py":"Wǒ duì zhè tái jīqì hěn shúxi.","ko":"나는 이 기계를 잘 알아."},{"zh":"我对这里的环境还不太熟悉。","py":"Wǒ duì zhèlǐ de huánjìng hái bú tài shúxi.","ko":"난 아직 여기 환경이 좀 낯설어.","pat":"对 + 대상 + 熟悉 = ~에 익숙하다"},{"zh":"{H}，这条路你熟悉吗？","py":"{H}, zhè tiáo lù nǐ shúxi ma?" "순리대로(順) 편하게(便) → ~하는 김에"},{"id":368,"w":"顺利","p":"shùnlì","k":"형","ko":"순조롭다","g":"n4o","ex":[{"zh":"{H}，祝你面试顺利！","py":"{H}, zhù nǐ miànshì shùnlì!","ko":"{H}, 면접 잘 보길 바랄게!"},{"zh":"祝你在新公司一切顺利！","py":"Zhù nǐ zài xīn gōngsī yíqiè shùnlì!","ko":"새 회사에서 모든 일이 잘되길 바라!","pat":"祝你一切顺利 = 모든 일이 순조롭길 바라"},{"zh":"今天跟客户谈得很顺利。","py":"Jīntiān gēn kèhù tán de hěn shùnlì.","ko":"오늘 고객이랑 얘기가 순조롭게 됐어."}],"c":[["顺","順","순할 순"],["利","利","이로울 리"]],"why":"순하고(順) 이로움(利) → 순조롭다"},{"id":369,"w":"顺序","p":"shùnxù","k":"명","ko":"순서, 차례","g":"n4o","ex":[{"zh":"请按照顺序排队。","py":"Qǐng ànzhào shùnxù páiduì.","ko":"순서대로 줄 서 주세요."},{"zh":"请按照顺序回答问题。","py":"Qǐng ànzhào shùnxù huídá wèntí.","ko":"순서대로 질문에 답해 주세요.","pat":"按照 + 顺序 = 순서대로"},{"zh":"{H}，这些照片的顺序乱了。","py":"{H}, zhèxiē zhàopiàn de shùnxù luàn le.","ko":"{H}, 이 사진들 순서가 뒤죽박죽이야."}],"c":[["顺","順","순할 순"],["序","序","차례 서"]],"why":"따르는(順) 차례(序) → 순서"},{"id":370,"w":"说明","p":"shuōmíng","k":"동·명","ko":"설명하다, 설명","g":"n4o","ex":[{"zh":"我来说明一下这个问题。","py":"Wǒ lái shuōmíng yīxià zhège wèntí.","ko":"제가 이 문제를 설명해 드릴게요."},{"zh":"用之前先看一下说明书。","py":"Yòng zhīqián xiān kàn yíxià shuōmíngshū.","ko":"쓰기 전에 먼저 설명서 좀 봐.","pat":"说明书 = 설명서"},{"zh":"{H}，你不说话，说明你生气了。","py":"{H}, nǐ bù shuōhuà, shuōmíng nǐ shēngqì le.","ko":"{H}, 너 말 안 하는 거 보니까 화난 거구나."}],"c":[["说","說","말씀 설"],["明","明","밝을 명"]],"why":"말하여(說) 밝힘(明) → 설명하다"},{"id":371,"w":"硕士","p":"shuòshì","k":"명","ko":"석사","g":"n4o","ex":[{"zh":"妈，我明年就能拿到硕士学位了。","py":"Mā, wǒ míngnián jiù néng ná dào shuòshì xuéwèi le.","ko":"엄마, 나 내년이면 석사 학위 받아."},{"zh":"他在英国读硕士。","py":"Tā zài Yīngguó dú shuòshì.","ko":"그는 영국에서 석사 과정 중이야.","pat":"读 + 硕士 = 석사 과정을 하다"},{"zh":"老板说我读完硕士可以给我加工资。","py":"Lǎobǎn shuō wǒ dúwán shuòshì kěyǐ gěi wǒ jiā gōngzī.","ko":"사장님이 나 석사 마치면 월급 올려준대."}],"c":[["硕","碩","클 석"],["士","士","선비 사"]],"why":"큰(碩) 선비(士) → 석사"},{"id":372,"w":"死","p":"sǐ","k":"동·형","ko":"죽다, 융통성이 없다, 죽도록","g":"n4o","ex":[{"zh":"{H}，我饿死了，我们去吃饭吧。","py":"{H}, wǒ è sǐ le, wǒmen qù chī fàn ba.","ko":"{H}, 배고파 죽겠어, 밥 먹으러 가자."},{"zh":"今天忙死了，连饭都没吃。","py":"Jīntiān máng sǐ le, lián fàn dōu méi chī.","ko":"오늘 바빠 죽겠어, 밥도 못 먹었어.","pat":"형용사 + 死了 = ~해 죽겠다"},{"zh":"妈，你种的花怎么死了？","py":"Mā, nǐ zhòng de huā zěnme sǐ le?","ko":"엄마, 엄마가 키운 꽃 왜 죽었어?"}],"c":[["死","死","죽을 사"]],"why":"死亡(사망)의 '죽을 사'"},{"id":373,"w":"速度","p":"sùdù","k":"명","ko":"속도","g":"n4o","ex":[{"zh":"这台机器的速度太慢了。","py":"Zhè tái jīqì de sùdù tài màn le.","ko":"이 기계 속도가 너무 느려."},{"zh":"他打字的速度很快。","py":"Tā dǎzì de sùdù hěn kuài.","ko":"그는 타자 속도가 엄청 빨라.","pat":"…的速度 + 很快/慢 = ~하는 속도가 빠르다/느리다"},{"zh":"妈，你学手机的速度比我想的快。","py":"Mā, nǐ xué shǒujī de sùdù bǐ wǒ xiǎng de kuài.","ko":"엄마, 핸드폰 배우는 속도가 생각보다 빠르네."}],"c":[["速","速","빠를 속"],["度","度","법도 도"]],"why":"빠른(速) 정도(度) → 속도"},{"id":374,"w":"酸","p":"suān","k":"형","ko":"시다, 시큰하다","g":"n4o","ex":[{"zh":"走了一天，腿很酸。","py":"Zǒu le yī tiān, tuǐ hěn suān.","ko":"하루 종일 걸었더니 다리가 시큰거려."},{"zh":"这个菜酸酸甜甜的，很好吃。","py":"Zhège cài suānsuān tiántián de, hěn hǎochī.","ko":"이 음식 새콤달콤해서 맛있어.","pat":"酸酸甜甜 = 새콤달콤하다"},{"zh":"每天用电脑，我的眼睛很酸。","py":"Měi tiān yòng diànnǎo, wǒ de yǎnjing hěn suān.","ko":"매일 컴퓨터 써서 눈이 시큰해."}],"c":[["酸","酸","실 산"]],"why":"酸性(산성)의 '실 산' — 시다"},{"id":375,"w":"随便","p":"suíbiàn","k":"동·형·연","ko":"마음대로 하다, 아무렇게나, ~하든 상관없이","g":"n4o","ex":[{"zh":"{H}，吃什么都行，你随便点吧。","py":"{H}, chī shénme dōu xíng, nǐ suíbiàn diǎn ba.","ko":"{H}, 뭐 먹어도 괜찮으니까 마음대로 시켜."},{"zh":"你想去哪儿都行，随便你。","py":"Nǐ xiǎng qù nǎr dōu xíng, suíbiàn nǐ.","ko":"어디 가고 싶든 다 괜찮아, 너 마음대로 해.","pat":"随便你 = 네 마음대로 해"},{"zh":"妈，你别随便相信电话里的人。","py":"Mā, nǐ bié suíbiàn xiāngxìn diànhuà li de rén.","ko":"엄마, 전화 속 사람 말 함부로 믿지 마."}],"c":[["随","隨","따를 수"],["便","便","편할 편"]],"why":"편한(便) 대로 따름(隨) → 마음대로"},{"id":376,"w":"随着","p":"suízhe","k":"개","ko":"~에 따라, ~함에 따라","g":"n4o","ex":[{"zh":"随着公司发展，人越来越多。","py":"Suízhe gōngsī fāzhǎn, rén yuè lái yuè duō.","ko":"회사가 성장하면서 사람이 점점 많아져."},{"zh":"随着天气变冷，感冒的人越来越多。","py":"Suízhe tiānqì biàn lěng, gǎnmào de rén yuè lái yuè duō.","ko":"날씨가 추워지면서 감기 걸린 사람이 점점 늘어.","pat":"随着…，越来越… = ~함에 따라 점점 ~"},{"zh":"随着见面越来越多，我更了解{H}了。","py":"Suízhe jiànmià ":"명","ko":"태도","g":"n4o","ex":[{"zh":"他工作态度很认真。","py":"Tā gōngzuò tàidù hěn rènzhēn.","ko":"그 사람은 일하는 태도가 아주 성실해."},{"zh":"这家饭店的服务态度很好。","py":"Zhè jiā fàndiàn de fúwù tàidù hěn hǎo.","ko":"이 식당 서비스 태도가 아주 좋아.","pat":"服务态度 = 서비스 태도"},{"zh":"{H}，你对我的态度怎么突然变了？","py":"{H}, nǐ duì wǒ de tàidù zěnme tūrán biàn le?","ko":"{H}, 나한테 태도가 왜 갑자기 변했어?"}],"c":[["态","態","모습 태"],["度","度","법도 도"]],"why":"모습(態)의 정도(度) → 태도"},{"id":382,"w":"谈","p":"tán","k":"동","ko":"이야기하다, 논하다","g":"n4o","ex":[{"zh":"我们下周跟客户谈价格。","py":"Wǒmen xià zhōu gēn kèhù tán jiàgé.","ko":"우리 다음 주에 고객이랑 가격 얘기해."},{"zh":"我们找时间谈一谈吧。","py":"Wǒmen zhǎo shíjiān tán yi tán ba.","ko":"우리 시간 내서 얘기 좀 하자.","pat":"谈一谈/谈谈 = 이야기 좀 하다"},{"zh":"爸，我想跟你谈一下我的工作。","py":"Bà, wǒ xiǎng gēn nǐ tán yíxià wǒ de gōngzuò.","ko":"아빠, 내 일에 대해서 얘기 좀 하고 싶어."}],"c":[["谈","談","말씀 담"]],"why":"會談(회담)의 '말씀 담'"},{"id":383,"w":"汤","p":"tāng","k":"명","ko":"탕, 국","g":"n4o","ex":[{"zh":"妈，我想喝你做的汤。","py":"Mā, wǒ xiǎng hē nǐ zuò de tāng.","ko":"엄마, 엄마가 끓인 국 먹고 싶어."},{"zh":"饭前先喝一碗汤。","py":"Fàn qián xiān hē yì wǎn tāng.","ko":"밥 먹기 전에 국 한 그릇 먼저 마셔.","pat":"喝 + 汤 = 국을 먹다(마시다)"},{"zh":"中午同事请我喝了一碗鸡汤。","py":"Zhōngwǔ tóngshì qǐng wǒ hē le yì wǎn jītāng.","ko":"점심에 동료가 닭고기 국 한 그릇 사줬어."}],"c":[["汤","湯","끓을 탕"]],"why":"갈비湯의 '끓을 탕' — 국"},{"id":384,"w":"躺","p":"tǎng","k":"동","ko":"눕다","g":"n4o","ex":[{"zh":"{H}，你不舒服就躺一会儿。","py":"{H}, nǐ bù shūfu jiù tǎng yīhuìr.","ko":"{H}, 몸 안 좋으면 좀 누워 있어."},{"zh":"他躺在床上玩手机。","py":"Tā tǎng zài chuáng shang wán shǒujī.","ko":"그는 침대에 누워서 핸드폰 해.","pat":"躺在 + 장소 = ~에 눕다"},{"zh":"妈，你别一直躺着看电视。","py":"Mā, nǐ bié yìzhí tǎngzhe kàn diànshì.","ko":"엄마, 계속 누워서 TV만 보지 마."}],"c":[["躺","躺","누울 당"]],"why":"몸(身)+尙 → 몸을 누이다"},{"id":385,"w":"趟","p":"tàng","k":"양","ko":"번, 차례(왕복을 세는 단위)","g":"n4o","ex":[{"zh":"我这周要去一趟新加坡。","py":"Wǒ zhè zhōu yào qù yī tàng Xīnjiāpō.","ko":"나 이번 주에 싱가포르 한 번 다녀와야 돼."},{"zh":"我得去一趟超市。","py":"Wǒ děi qù yí tàng chāoshì.","ko":"나 마트 한 번 다녀와야 해.","pat":"去/来 + 一趟 + 장소 = ~에 한 번 다녀오다"},{"zh":"妈，为了这个签证我跑了三趟。","py":"Mā, wèile zhè ,"why":"推進(추진)의 '밀 추'"},{"id":399,"w":"推迟","p":"tuīchí","k":"동","ko":"연기하다, 미루다","g":"n4o","ex":[{"zh":"会议推迟到下午三点。","py":"Huìyì tuīchí dào xiàwǔ sān diǎn.","ko":"회의가 오후 세 시로 미뤄졌어."},{"zh":"考试推迟到下个月了。","py":"Kǎoshì tuīchí dào xià ge yuè le.","ko":"시험이 다음 달로 미뤄졌어.","pat":"推迟到 + 시간 = ~로 미루다"},{"zh":"妈，我回韩国的时间要推迟了。","py":"Mā, wǒ huí Hánguó de shíjiān yào tuīchí le.","ko":"엄마, 나 한국 가는 날짜 미뤄질 것 같아."}],"c":[["推","推","밀 추"],["迟","遲","더딜 지"]],"why":"밀어서(推) 늦춤(遲) → 연기하다"},{"id":400,"w":"脱","p":"tuō","k":"동","ko":"벗다, 빠지다, 벗어나다","g":"n4o","ex":[{"zh":"{H}家进门要先脱鞋。","py":"{H} jiā jìn mén yào xiān tuō xié.","ko":"{H}네 집은 들어갈 때 먼저 신발을 벗어야 돼."},{"zh":"热的话就把衣服脱了吧。","py":"Rè dehuà jiù bǎ yīfu tuō le ba.","ko":"더우면 옷 벗어.","pat":"脱 + 衣服/鞋 = 옷·신발을 벗다"},{"zh":"进办公室前，同事们要先脱下工作服。","py":"Jìn bàngōngshì qián, tóngshìmen yào xiān tuōxià gōngzuòfú.","ko":"사무실 들어가기 전에 동료들은 작업복부터 벗어야 해."}],"c":[["脱","脫","벗을 탈"]],"why":"脫衣(탈의)의 '벗을 탈'"},{"id":401,"w":"袜子","p":"wàzi","k":"명","ko":"양말, 스타킹","g":"n4o","ex":[{"zh":"我出差忘带袜子了。","py":"Wǒ chūchāi wàng dài wàzi le.","ko":"출장 오는데 양말 챙기는 걸 깜빡했어."},{"zh":"我买了三双袜子。","py":"Wǒ mǎi le sān shuāng wàzi.","ko":"양말 세 켤레 샀어.","pat":"수 + 双 + 袜子 = 양말 ~켤레"},{"zh":"妈，别给我寄袜子了，这里很便宜。","py":"Mā, bié gěi wǒ jì wàzi le, zhèlǐ hěn piányi.","ko":"엄마, 양말 그만 보내, 여기 엄청 싸."}],"c":[["袜","襪","버선 말"],["子","子","아들 자(접미사)"]],"why":"버선(襪)+명사 접미사(子) → 양말"},{"id":402,"w":"完全","p":"wánquán","k":"형·부","ko":"완전하다, 완전히, 전혀","g":"n4o","ex":[{"zh":"我完全同意你的看法。","py":"Wǒ wánquán tóngyì nǐ de kànfǎ.","ko":"네 의견에 완전히 동의해."},{"zh":"他们俩的性格完全不同。","py":"Tāmen liǎ de xìnggé wánquán bù tóng.","ko":"그 둘은 성격이 완전히 달라.","pat":"完全 + 不同/同意 = 완전히 ~"},{"zh":"爸，我的病已经完全好了。","py":"Bà, wǒ de bìng yǐjīng wánquán hǎo le.","ko":"아빠, 나 이제 완전히 다 나았어."}],"c":[["完","完","완전할 완"],["全","全","온전할 전"]],"why":"완전하고(完) 온전함(全) → 완전히"},{"id":403,"w":"往往","p":"wǎngwǎng","k":"부","ko":"흔히, 왕왕, 종종","g":"n4o","ex":[{"zh":"越着急，往往越容易出错。","py":"Yuè zháojí, wǎngwǎng yuè róngyì chūcuò.","ko":"서두를수록 흔히 실수하기 쉬워."},{"zh":"第一次做的事往往会出错。","py":"Dì-y ,"ko":"~을 막론하고, ~에 관계없이","g":"n4o","ex":[{"zh":"无论多忙，我每周都去看你。","py":"Wúlùn duō máng, wǒ měi zhōu dōu qù kàn nǐ.","ko":"아무리 바빠도 매주 너 보러 갈게."},{"zh":"无论天气怎么样，他都去跑步。","py":"Wúlùn tiānqì zěnmeyàng, tā dōu qù pǎobù.","ko":"날씨가 어떻든 그는 늘 달리러 가.","pat":"无论…都… = ~든 상관없이 다"},{"zh":"妈，无论我在哪儿，我都会想你们。","py":"Mā, wúlùn wǒ zài nǎr, wǒ dōu huì xiǎng nǐmen.","ko":"엄마, 내가 어디에 있든 늘 보고 싶을 거야."}],"c":[["无","無","없을 무"],["论","論","논할 론"]],"why":"논할(論) 것 없이(無) → ~을 막론하고"},{"id":413,"w":"误会","p":"wùhuì","k":"동·명","ko":"오해하다, 오해","g":"n4o","ex":[{"zh":"{H}，你误会了，我不是那个意思。","py":"{H}, nǐ wùhuì le, wǒ bù shì nàge yìsi.","ko":"{H}, 오해야, 그런 뜻이 아니었어."},{"zh":"这只是一个误会。","py":"Zhè zhǐ shì yí ge wùhuì.","ko":"이건 그냥 오해일 뿐이야.","pat":"一个误会 / 别误会 = 오해일 뿐·오해하지 마"},{"zh":"妈，你误会{H}了，她人很好。","py":"Mā, nǐ wùhuì {H} le, tā rén hěn hǎo.","ko":"엄마, {H}를 오해한 거야, 진짜 좋은 사람이야."}],"c":[["误","誤","그르칠 오"],["会","會","깨달을 회"]],"why":"잘못(誤) 이해함(會) → 오해하다"},{"id":414,"w":"西红柿","p":"xīhóngshì","k":"명","ko":"토마토","g":"n4o","ex":[{"zh":"{H}，我想吃西红柿炒鸡蛋。","py":"{H}, wǒ xiǎng chī xīhóngshì chǎo jīdàn.","ko":"{H}, 나 토마토 달걀 볶음 먹고 싶어."},{"zh":"我给你做个西红柿鸡蛋汤吧。","py":"Wǒ gěi nǐ zuò ge xīhóngshì jīdàn tāng ba.","ko":"내가 토마토 계란국 끓여 줄게.","pat":"西红柿鸡蛋汤 = 토마토 계란국 (대표 가정 요리)"},{"zh":"公司楼下的西红柿面很好吃。","py":"Gōngsī lóu xià de xīhóngshì miàn hěn hǎochī.","ko":"회사 건물 아래 토마토 국수 진짜 맛있어."}],"c":[["西","西","서녘 서"],["红","紅","붉을 홍"],["柿","柿","감 시"]],"why":"서양(西)에서 온 붉은(紅) 감(柿) → 토마토"},{"id":415,"w":"吸引","p":"xīyǐn","k":"동","ko":"끌어당기다, 매료시키다, 유인하다","g":"n4o","ex":[{"zh":"新加坡的工作很吸引我。","py":"Xīnjiāpō de gōngzuò hěn xīyǐn wǒ.","ko":"싱가포르 일자리가 나한테 아주 끌려."},{"zh":"这本书的内容很吸引人。","py":"Zhè běn shū de nèiróng hěn xīyǐn rén.","ko":"이 책 내용 정말 흥미로워.","pat":"很吸引人 = 사람을 끌다·매력적이다"},{"zh":"我们要用更好的价格吸引客户。","py":"Wǒmen yào yòng gèng hǎo de jiàgé xīyǐn kèhù.","ko":"우리는 더 좋은 가격으로 고객을 끌어와야 해."}],"c":[["吸","吸","마실 흡"],["引","引","끌 인"]],"why":"빨아들이고(吸) 끌어당김(引) → 매료시키다"},{"id":416,"w":"咸","p":"xián","k":"형","ko":"짜다","g":"n4o","ex":[{"zh":"妈，这个汤有点儿咸。","py":"Mā, zhège tāng yǒudiǎnr xi ":"Wǒ yǐwéi lǎobǎn huì shēngqì, xiāngfǎn, tā hái biǎoyáng le wǒ.","ko":"사장님이 화낼 줄 알았는데 오히려 칭찬해 줬어."}],"c":[["相","相","서로 상"],["反","反","돌이킬 반"]],"why":"서로(相) 반대로 돎(反) → 상반되다"},{"id":421,"w":"相同","p":"xiāngtóng","k":"형","ko":"서로 같다, 똑같다","g":"n4o","ex":[{"zh":"{H}和我的口味不完全相同。","py":"{H} hé wǒ de kǒuwèi bù wánquán xiāngtóng.","ko":"{H}랑 나는 입맛이 완전히 같진 않아."},{"zh":"这次的产品和上次的颜色相同吗？","py":"Zhè cì de chǎnpǐn hé shàng cì de yánsè xiāngtóng ma?","ko":"이번 제품 색깔이 지난번이랑 같아?","pat":"A和B + (명사) + 相同 = A와 B가 ~이 같다"},{"zh":"妈妈和我有相同的爱好，都喜欢做饭。","py":"Māma hé wǒ yǒu xiāngtóng de àihào, dōu xǐhuan zuò fàn.","ko":"엄마랑 나는 취미가 같아, 둘 다 요리 좋아해."}],"c":[["相","相","서로 상"],["同","同","한가지 동"]],"why":"서로(相) 같음(同) → 똑같다"},{"id":422,"w":"详细","p":"xiángxì","k":"형","ko":"상세하다, 자세하다","g":"n4o","ex":[{"zh":"请把问题写得详细一点。","py":"Qǐng bǎ wèntí xiě de xiángxì yīdiǎn.","ko":"문제를 좀 자세하게 써 줘."},{"zh":"请详细介绍一下你们的产品。","py":"Qǐng xiángxì jièshào yīxià nǐmen de chǎnpǐn.","ko":"제품 좀 자세히 소개해 주세요.","pat":"详细 + 介绍/说明 = 자세히 소개·설명하다"},{"zh":"他给我发了一份详细的报告。","py":"Tā gěi wǒ fā le yī fèn xiángxì de bàogào.","ko":"걔가 나한테 자세한 보고서를 보내 줬어."}],"c":[["详","詳","자세할 상"],["细","細","가늘 세"]],"why":"자세하고(详) 세밀함(细) → 상세하다"},{"id":423,"w":"响","p":"xiǎng","k":"동·형","ko":"소리가 나다, 울리다, (소리가) 크다","g":"n4o","ex":[{"zh":"车间里的机器太响了，听不清。","py":"Chējiān lǐ de jīqì tài xiǎng le, tīng bù qīng.","ko":"작업장 기계 소리가 너무 커서 잘 안 들려."},{"zh":"电话响了，你快接一下。","py":"Diànhuà xiǎng le, nǐ kuài jiē yīxià.","ko":"전화 울린다, 빨리 받아.","pat":"电话/手机 + 响了 = 전화가 울렸다"},{"zh":"声音小一点，别那么响，{H}还在睡觉。","py":"Shēngyīn xiǎo yīdiǎn, bié nàme xiǎng, {H} hái zài shuìjiào.","ko":"소리 좀 줄여, 너무 크다, {H} 아직 자고 있어."}],"c":[["响","響","울릴 향"]],"why":"鄕+音: 소리가 퍼져 울림 → 울리다"},{"id":424,"w":"消息","p":"xiāoxi","k":"명","ko":"소식, 뉴스, 정보","g":"n4o","ex":[{"zh":"妈妈，告诉你一个好消息！","py":"Māma, gàosu nǐ yī gè hǎo xiāoxi!","ko":"엄마, 좋은 소식 하나 알려 줄게!"},{"zh":"有什么消息马上告诉我。","py":"Yǒu shénme xiāoxi mǎshàng gàosu wǒ.","ko":"무슨 소식 있으면 바로 알려 줘.","pat":"有消息 / 告诉 + 사람 + 消息 = 소식이 있다·소식을 알려 주다"},{"zh":"我给{H}发了消息，她还没回。","py":"Wǒ gěi
