","py":"Zhè pī huò yīgòng sān qiān gè.","ko":"이번 물량은 전부 3천 개예요."},{"zh":"妈，我每个月给你寄一千块。","py":"Mā, wǒ měi gè yuè gěi nǐ jì yīqiān kuài.","ko":"엄마, 매달 천 링깃씩 보내 줄게.","pat":"숫자 + 千 + 块 = 천 원/링깃 단위 (一千块)"},{"zh":"{H}，从新山到首尔有四千多公里。","py":"{H}, cóng Xīnshān dào Shǒu'ěr yǒu sìqiān duō gōnglǐ.","ko":"{H}, 조호르바루에서 서울까지 4천 킬로가 넘어."}],"c":[["千","千","일천 천"]],"why":"일천 천(千)"},{"id":1322,"w":"铅笔","p":"qiānbǐ","k":"명","ko":"연필","g":"o","ex":[{"zh":"你有铅笔吗？借我用一下。","py":"Nǐ yǒu qiānbǐ ma? Jiè wǒ yòng yīxià.","ko":"연필 있어? 좀 빌려줘."},{"zh":"开会的时候老板总是用铅笔写字。","py":"Kāihuì de shíhou lǎobǎn zǒngshì yòng qiānbǐ xiě zì.","ko":"사장님은 회의 때 늘 연필로 적으셔.","pat":"用铅笔 + 写 = 연필로 쓰다"},{"zh":"妈，我小时候用的铅笔你还留着吗？","py":"Mā, wǒ xiǎoshíhou yòng de qiānbǐ nǐ hái liú zhe ma?","ko":"엄마, 나 어릴 때 쓰던 연필 아직 갖고 있어?"}],"c":[["铅","鉛","납 연"],["笔","筆","붓 필"]],"why":"납(鉛, 흑연) 붓(筆) → 연필"},{"id":1323,"w":"前面","p":"qiánmian","k":"명","ko":"앞, 앞쪽","g":"o","ex":[{"zh":"我在你店前面等你。","py":"Wǒ zài nǐ diàn qiánmian děng nǐ.","ko":"너네 가게 앞에서 기다릴게."},{"zh":"妈，你在出口前面等我，别走开。","py":"Mā, nǐ zài chūkǒu qiánmian děng wǒ, bié zǒu kāi.","ko":"엄마, 출구 앞에서 기다려, 딴 데 가지 말고.","pat":"在 + 장소 + 前面 = ~ 앞에서"},{"zh":"老板，客户的车就在我们前面。","py":"Lǎobǎn, kèhù de chē jiù zài wǒmen qiánmian.","ko":"사장님, 고객 차가 바로 우리 앞에 있어요."}],"c":[["前","前","앞 전"],["面","面","낯 면"]],"why":"앞(前) 쪽 면(面) → 앞"},{"id":1324,"w":"起床","p":"qǐchuáng","k":"동","ko":"일어나다(기상하다)","g":"o","ex":[{"zh":"周末在{H}家，我十点才起床。","py":"Zhōumò zài {H} jiā, wǒ shí diǎn cái qǐchuáng.","ko":"주말에 {H}네 집에서는 10시에야 일어나."},{"zh":"老板说明天要早点儿起床去见客户。","py":"Lǎobǎn shuō míngtiān yào zǎo diǎnr qǐchuáng qù jiàn kèhù.","ko":"사장님이 내일 일찍 일어나서 고객 만나러 가자셔.","pat":"早点儿起床 = 일찍 일어나다"},{"zh":"妈，我每天六点就起床去上班。","py":"Mā, wǒ měi tiān liù diǎn jiù qǐchuáng qù shàngbān.","ko":"엄마, 나 매일 6시에 일어나서 출근해."}],"c":[["起","起","일어날 기"],["床","床","평상 상"]],"why":"침상(床)에서 일어남(起) → 기상"},{"id":1325,"w":"起飞","p":"qǐfēi","k":"동","ko":"이륙하다","g":"o","ex":[{"zh":"爸爸的飞机几点起飞？","py":"Bàba de fēijī jǐ diǎn qǐfēi?","ko":"아빠 비행기 몇 시에 이륙해?"},{"zh":"{H}，我的飞机晚上八点起飞。","py":"{H}, wǒ de fēijī wǎnshang bā diǎn qǐfēi.","ko":"{H}, 내 비행기 저녁 8시에 떠.","pat":"飞机 + 시간 + 起飞 = 비행기가 ~시에 이륙하다"},{"zh":"老板，飞机推迟起飞了，我们会晚到。","py":"Lǎobǎn, fēijī tuīchí qǐfēi le, wǒmen huì wǎn dào.","ko":"사장님, 비행기 이륙이 늦어져서 저희 늦게 도착할 것 같아요."}],"c":[["起","起","일어날 기"],["飞","飛","날 비"]],"why":"일어나(起) 날아오름(飛) → 이륙"},{"id":1326,"w":"奇怪","p":"qíguài","k":"형","ko":"이상하다, 기이하다","g":"o","ex":[{"zh":"奇怪，这台机器昨天还是好的。","py":"Qíguài, zhè tái jīqì zuótiān hái shì hǎo de.","ko":"이상하네, 이 기계 어제까지는 멀쩡했는데."},{"zh":"{H}，今天你怎么这么安静？好奇怪。","py":"{H}, jīntiān nǐ zěnme zhème ānjìng? Hǎo qíguài.","ko":"{H}, 오늘 왜 이렇게 조용해? 이상하네.","pat":"好奇怪 / 真奇怪 = 이상하네"},{"zh":"妈，很奇怪，我最近总是想吃韩国菜。","py":"Mā, hěn qíguài, wǒ zuìjìn zǒngshì xiǎng chī Hánguó cài.","ko":"엄마, 이상하게 요즘 자꾸 한식이 먹고 싶어."}],"c":[["奇","奇","기이할 기"],["怪","怪","괴이할 괴"]],"why":"기이하고(奇) 괴이함(怪) → 이상하다"},{"id":1327,"w":"起来","p":"qǐlai","k":"동","ko":"일어나다, ~하기 시작하다(동사 뒤)","g":"o","ex":[{"zh":"快起来，我们要迟到了！","py":"Kuài qǐlai, wǒmen yào chídào le!","ko":"빨리 일어나, 우리 늦겠어!"},{"zh":"{H}，起来吧，太阳都出来了。","py":"{H}, qǐlai ba, tàiyáng dōu chūlai le.","ko":"{H}, 일어나, 해 떴어.","pat":"快起来 / 起来吧 = 어서 일어나"},{"zh":"妈，我早上六点就起来了。","py":"Mā, wǒ zǎoshang liù diǎn jiù qǐlai le.","ko":"엄마, 나 아침 6시에 벌써 일어났어."}],"c":[["起","起","일어날 기"],["来","來","올 래"]],"why":"일어나(起) 옴(來) → 일어나다"},{"id":1328,"w":"晴","p":"qíng","k":"형","ko":"맑다","g":"o","ex":[{"zh":"明天新加坡是晴天，我们去海边吧。","py":"Míngtiān Xīnjiāpō shì qíngtiān, wǒmen qù hǎibiān ba.","ko":"내일 싱가포르 맑대, 바닷가 가자."},{"zh":"老板，明天是晴天，可以安排客户参观。","py":"Lǎobǎn, míngtiān shì qíngtiān, kěyǐ ānpái kèhù cānguān.","ko":"사장님, 내일 맑대요, 고객 견학 잡아도 될 것 같아요.","pat":"晴天 = 맑은 날 (晴 + 天)"},{"zh":"妈，听说首尔这几天都是晴天。","py":"Mā, tīngshuō Shǒu'ěr zhè jǐ tiān dōu shì qíngtiān.","ko":"엄마, 서울 요 며칠 계속 맑다며."}],"c":[["晴","晴","갤 청"]],"why":"해(日)가 푸름(靑) → 날이 개다"},{"id":1329,"w":"请","p":"qǐng","k":"동","ko":"청하다, 부탁하다, 초대하다, ~해 주세요","g":"o","ex":[{"zh":"老板，我想请您看一下这个计划。","py":"Lǎobǎn, wǒ xiǎng qǐng nín kàn yīxià zhège jìhuà.","ko":"사장님, 이 계획 한번 봐 주셨으면 해요."},{"zh":"妈，这次我请你和爸爸吃饭。","py":"Mā, zhè cì wǒ qǐng nǐ hé bàba chīfàn.","ko":"엄마, 이번엔 내가 엄마 아빠 밥 살게.","pat":"请 + 사람 + 吃饭 = ~에게 밥을 사다·대접하다"},{"zh":"我想请客户来我们工厂看看。","py":"Wǒ xiǎng qǐng kèhù lái wǒmen gōngchǎng kànkan.","ko":"고객을 우리 공장에 한번 초대하고 싶어."}],"c":[["请","請","청할 청"]],"why":"말(言)로 청함(靑) → 부탁하다"},{"id":1330,"w":"清楚","p":"qīngchu","k":"형","ko":"분명하다, 뚜렷하다","g":"o","ex":[{"zh":"客户的要求你问清楚了吗？","py":"Kèhù de yāoqiú nǐ wèn qīngchu le ma?","ko":"고객 요구사항 확실하게 물어봤어?"},{"zh":"{H}，你说清楚，到底怎么了？","py":"{H}, nǐ shuō qīngchu, dàodǐ zěnme le?","ko":"{H}, 똑바로 말해 봐, 대체 무슨 일이야?","pat":"동사 + 清楚 = 분명히 ~하다 (说清楚·听清楚·看清楚)"},{"zh":"妈，电话声音不清楚，我等会儿再打给你。","py":"Mā, diànhuà shēngyīn bù qīngchu, wǒ děng huìr zài dǎ gěi nǐ.","ko":"엄마, 전화 소리가 잘 안 들려, 좀 이따 다시 걸게."}],"c":[["清","淸","맑을 청"],["楚","楚","산뜻할 초"]],"why":"맑고(淸) 산뜻함(楚) → 분명하다"},{"id":1331,"w":"请假","p":"qǐngjià","k":"동","ko":"휴가를 내다, 결석·결근을 신청하다","g":"o","ex":[{"zh":"我下周五想请假去新加坡。","py":"Wǒ xià zhōuwǔ xiǎng qǐngjià qù Xīnjiāpō.","ko":"다음 주 금요일에 휴가 내고 싱가포르 가고 싶어요."},{"zh":"同事今天生病了，跟老板请假了。","py":"Tóngshì jīntiān shēngbìng le, gēn lǎobǎn qǐngjià le.","ko":"동료가 오늘 아파서 사장님한테 휴가 냈어.","pat":"跟 + 사람 + 请假 = ~에게 휴가를 내다"},{"zh":"{H}，你生日那天我请假陪你。","py":"{H}, nǐ shēngrì nà tiān wǒ qǐngjià péi nǐ.","ko":"{H}, 네 생일날 휴가 내고 같이 있어 줄게."}],"c":[["请","請","청할 청"],["假","假","겨를 가"]],"why":"겨를(假, 휴가)을 청함(請) → 휴가 신청"},{"id":1332,"w":"其实","p":"qíshí","k":"부","ko":"사실은, 실은","g":"o","ex":[{"zh":"其实我也很想你。","py":"Qíshí wǒ yě hěn xiǎng nǐ.","ko":"사실 나도 너 많이 보고 싶었어."},{"zh":"妈，其实我在这边过得挺好的。","py":"Mā, qíshí wǒ zài zhèbiān guò de tǐng hǎo de.","ko":"엄마, 사실 나 여기서 꽤 잘 지내.","pat":"其实 + 문장 = 사실은 ~야 (예상과 다른 진짜 사정)"},{"zh":"老板，其实这个问题不难解决。","py":"Lǎobǎn, qíshí zhège wèntí bù nán jiějué.","ko":"사장님, 사실 이 문제는 해결하기 어렵지 않아요."}],"c":[["其","其","그 기"],["实","實","열매 실"]],"why":"그(其) 실제(實)는 → 사실"},{"id":1333,"w":"其他","p":"qítā","k":"대","ko":"그 밖의, 다른","g":"o","ex":[{"zh":"这个问题先放一下，我们说说其他的。","py":"Zhège wèntí xiān fàng yīxià, wǒmen shuōshuo qítā de.","ko":"이 문제는 잠깐 미뤄 두고 다른 얘기 하자."},{"zh":"客户问我们还有没有其他颜色。","py":"Kèhù wèn wǒmen hái yǒu méiyǒu qítā yánsè.","ko":"고객이 다른 색상도 있냐고 물어봤어.","pat":"还有其他 + 명사 + 吗 = 다른 ~도 있어?"},{"zh":"{H}，除了这家，还有其他好吃的吗？","py":"{H}, chúle zhè jiā, hái yǒu qítā hǎochī de ma?","ko":"{H}, 여기 말고 다른 맛집도 있어?"}],"c":[["其","其","그 기"],["他","他","다를 타"]],"why":"그(其) 밖의 다른(他) 것 → 기타"},{"id":1334,"w":"妻子","p":"qīzi","k":"명","ko":"아내","g":"o","ex":[{"zh":"张先生和他妻子一起来参观工厂。","py":"Zhāng xiānsheng hé tā qīzi yīqǐ lái cānguān gōngchǎng.","ko":"장 선생님이 아내분이랑 같이 공장 견학 오셨어."},{"zh":"老板的妻子也在公司帮忙。","py":"Lǎobǎn de qīzi yě zài gōngsī bāngmáng.","ko":"사장님 사모님도 회사 일을 도와주셔.","pat":"사람 + 的妻子 = ~의 아내"},{"zh":"他结婚三年了，妻子在新加坡工作。","py":"Tā jiéhūn sān nián le, qīzi zài Xīnjiāpō gōngzuò.","ko":"그 사람 결혼한 지 3년 됐는데, 아내는 싱가포르에서 일해."}],"c":[["妻","妻","아내 처"],["子","子","아들 자"]],"why":"아내(妻)+접미사 子 → 아내"},{"id":1335,"w":"去","p":"qù","k":"동","ko":"가다","g":"o","ex":[{"zh":"这个周末我去新加坡找{H}。","py":"Zhège zhōumò wǒ qù Xīnjiāpō zhǎo {H}.","ko":"이번 주말에 싱가포르 가서 {H} 만나."},{"zh":"老板，我下午去客户那边。","py":"Lǎobǎn, wǒ xiàwǔ qù kèhù nàbiān.","ko":"사장님, 저 오후에 고객사 다녀올게요.","pat":"去 + 장소 = ~에 가다 (去公司·去客户那边)"},{"zh":"妈，你什么时候去医院检查？","py":"Mā, nǐ shénme shíhou qù yīyuàn jiǎnchá?","ko":"엄마, 병원 검사는 언제 가?"}],"c":[["去","去","갈 거"]],"why":"갈 거(去) → 가다"},{"id":1336,"w":"去年","p":"qùnián","k":"명","ko":"작년","g":"o","ex":[{"zh":"我和{H}是去年认识的。","py":"Wǒ hé {H} shì qùnián rènshi de.","ko":"나랑 {H}는 작년에 알게 됐어."},{"zh":"去年我们工厂的生意比今年好。","py":"Qùnián wǒmen gōngchǎng de shēngyi bǐ jīnnián hǎo.","ko":"작년엔 우리 공장 장사가 올해보다 잘됐어.","pat":"去年 / 今年 / 明年 = 작년 / 올해 / 내년 (비교)"},{"zh":"妈，去年过年我没回家，今年一定回。","py":"Mā, qùnián guònián wǒ méi huí jiā, jīnnián yīdìng huí.","ko":"엄마, 작년 설엔 못 갔지만 올해는 꼭 갈게."}],"c":[["去","去","갈 거"],["年","年","해 년"]],"why":"지나간(去) 해(年) → 작년"},{"id":1337,"w":"裙子","p":"qúnzi","k":"명","ko":"치마, 스커트","g":"o","ex":[{"zh":"这条裙子很适合你。","py":"Zhè tiáo qúnzi hěn shìhé nǐ.","ko":"이 치마 너한테 잘 어울려."},{"zh":"妈，我给妹妹买了一条裙子。","py":"Mā, wǒ gěi mèimei mǎi le yī tiáo qúnzi.","ko":"엄마, 나 여동생 치마 하나 사 줬어.","pat":"一条裙子 = 치마 한 벌 (条 양사)"},{"zh":"同事穿了一条新裙子，大家都说好看。","py":"Tóngshì chuān le yī tiáo xīn qúnzi, dàjiā dōu shuō hǎokàn.","ko":"동료가 새 치마를 입고 와서 다들 예쁘다고 했어."}],"c":[["裙","裙","치마 군"],["子","子","아들 자"]],"why":"치마(裙)+접미사 子 → 치마"},{"id":1338,"w":"然后","p":"ránhòu","k":"연","ko":"그런 다음, 그 후에","g":"o","ex":[{"zh":"先检查一下电压，然后再开机。","py":"Xiān jiǎnchá yīxià diànyā, ránhòu zài kāijī.","ko":"먼저 전압 확인하고 그다음에 기계 켜."},{"zh":"{H}，我们先吃饭，然后去看电影吧。","py":"{H}, wǒmen xiān chīfàn, ránhòu qù kàn diànyǐng ba.","ko":"{H}, 먼저 밥 먹고 그다음에 영화 보러 가자.","pat":"先 A，然后 B = 먼저 A하고 그다음에 B"},{"zh":"妈，我先下班回家，然后给你打电话。","py":"Mā, wǒ xiān xiàbān huí jiā, ránhòu gěi nǐ dǎ diànhuà.","ko":"엄마, 일단 퇴근해서 집에 가고 그다음에 전화할게."}],"c":[["然","然","그러할 연"],["后","後","뒤 후"]],"why":"그리(然) 한 뒤(後) → 그런 후에"},{"id":1339,"w":"热","p":"rè","k":"형","ko":"덥다, 뜨겁다","g":"o","ex":[{"zh":"马来西亚一年四季都很热。","py":"Mǎláixīyà yī nián sì jì dōu hěn rè.","ko":"말레이시아는 일 년 내내 더워."},{"zh":"{H}，外面太热了，我们去商场吧。","py":"{H}, wàimian tài rè le, wǒmen qù shāngchǎng ba.","ko":"{H}, 밖에 너무 덥다, 쇼핑몰 가자.","pat":"太热了 = 너무 덥다 (太…了)"},{"zh":"妈，汤太热了，等一会儿再喝。","py":"Mā, tāng tài rè le, děng yīhuìr zài hē.","ko":"엄마, 국 너무 뜨거워, 좀 있다 마셔."}],"c":[["热","熱","더울 열"]],"why":"불(灬) 위에 있음 → 덥다, 뜨겁다"},{"id":1340,"w":"人","p":"rén","k":"명","ko":"사람","g":"o","ex":[{"zh":"今天来面试的人不多。","py":"Jīntiān lái miànshì de rén bù duō.","ko":"오늘 면접 보러 온 사람이 별로 없어."},{"zh":"妈，新加坡的地铁上人特别多。","py":"Mā, Xīnjiāpō de dìtiě shang rén tèbié duō.","ko":"엄마, 싱가포르 지하철엔 사람이 엄청 많아.","pat":"장소 + 人(很/特别)多 = ~에 사람이 많다"},{"zh":"{H}，你们店里今天人多吗？","py":"{H}, nǐmen diàn li jīntiān rén duō ma?","ko":"{H}, 오늘 가게에 사람 많아?"}],"c":[["人","人","사람 인"]],"why":"사람이 서 있는 모양(人)"},{"id":1341,"w":"认识","p":"rènshi","k":"동","ko":"알다(사람·글자 등), 인식하다","g":"o","ex":[{"zh":"妈妈，你什么时候想认识{H}？","py":"Māma, nǐ shénme shíhou xiǎng rènshi {H}?","ko":"엄마, {H}랑 언제 인사하고 싶어?"},{"zh":"认识你很高兴，以后多联系。","py":"Rènshi nǐ hěn gāoxìng, yǐhòu duō liánxì.","ko":"만나서 반가워, 앞으로 자주 연락하자.","pat":"认识你很高兴 = 만나서 반가워"},{"zh":"老板，我认识那家公司的经理。","py":"Lǎobǎn, wǒ rènshi nà jiā gōngsī de jīnglǐ.","ko":"사장님, 저 그 회사 매니저 알아요."}],"c":[["认","認","알 인"],["识","識","알 식"]],"why":"알아보고(認) 앎(識) → 인식하다"},{"id":1342,"w":"认为","p":"rènwéi","k":"동","ko":"~라고 여기다, 생각하다","g":"o","ex":[{"zh":"我认为这个价格客户能接受。","py":"Wǒ rènwéi zhège jiàgé kèhù néng jiēshòu.","ko":"제 생각엔 이 가격이면 고객이 받아들일 거예요."},{"zh":"{H}，你认为我该换工作吗？","py":"{H}, nǐ rènwéi wǒ gāi huàn gōngzuò ma?","ko":"{H}, 너는 내가 이직해야 한다고 생각해?","pat":"你认为 + 문장 + 吗？ = 넌 ~라고 생각해?"},{"zh":"妈，我认为在国外工作对我很有帮助。","py":"Mā, wǒ rènwéi zài guówài gōngzuò duì wǒ hěn yǒu bāngzhù.","ko":"엄마, 해외에서 일하는 게 나한테 큰 도움이 된다고 생각해."}],"c":[["认","認","알 인"],["为","爲","할 위"]],"why":"인정하여(認) ~로 여김(爲) → 생각하다"},{"id":1343,"w":"认真","p":"rènzhēn","k":"형","ko":"성실하다, 진지하다","g":"o","ex":[{"zh":"新同事工作很认真。","py":"Xīn tóngshì gōngzuò hěn rènzhēn.","ko":"새로 온 동료는 일을 아주 착실하게 해."},{"zh":"妈，我会认真准备HSK考试的。","py":"Mā, wǒ huì rènzhēn zhǔnbèi HSK kǎoshì de.","ko":"엄마, HSK 시험 열심히 준비할게.","pat":"认真 + 동사 = 열심히·꼼꼼히 ~하다 (认真准备·认真工作)"},{"zh":"{H}，你做事总是这么认真。","py":"{H}, nǐ zuò shì zǒngshì zhème rènzhēn.","ko":"{H}, 너는 일을 항상 이렇게 꼼꼼하게 하더라."}],"c":[["认","認","알 인"],["真","眞","참 진"]],"why":"참(眞)으로 인정함(認) → 진지하다"},{"id":1344,"w":"热情","p":"rèqíng","k":"형·명","ko":"친절하다, 열정적이다, 열정","g":"o","ex":[{"zh":"{H}的家人对我很热情。","py":"{H} de jiārén duì wǒ hěn rèqíng.","ko":"{H}네 가족들이 나한테 엄청 친절해."},{"zh":"马来西亚人对外国人很热情。","py":"Mǎláixīyà rén duì wàiguó rén hěn rèqíng.","ko":"말레이시아 사람들은 외국인한테 정말 친절해.","pat":"对 + 사람 + 很热情 = ~에게 친절하다"},{"zh":"老板，那个客户特别热情，请我们吃饭了。","py":"Lǎobǎn, nàge kèhù tèbié rèqíng, qǐng wǒmen chīfàn le.","ko":"사장님, 그 고객 엄청 친절해서 저희 밥까지 사 줬어요."}],"c":[["热","熱","더울 열"],["情","情","뜻 정"]],"why":"뜨거운(熱) 마음(情) → 열정적이다"},{"id":1345,"w":"容易","p":"róngyì","k":"형","ko":"쉽다, ~하기 쉽다","g":"o","ex":[{"zh":"您放心，这个问题很容易解决。","py":"Nín fàngxīn, zhège wèntí hěn róngyì jiějué.","ko":"걱정 마세요, 이 문제는 쉽게 해결돼요."},{"zh":"{H}，中文对我来说不容易。","py":"{H}, Zhōngwén duì wǒ lái shuō bù róngyì.","ko":"{H}, 나한테 중국어는 쉽지 않아.","pat":"A 对 B 来说不容易 = B에게 A는 쉽지 않다"},{"zh":"妈，在国外找工作没那么容易。","py":"Mā, zài guówài zhǎo gōngzuò méi nàme róngyì.","ko":"엄마, 외국에서 일 구하는 게 그렇게 쉽지 않아."}],"c":[["容","容","받아들일 용"],["易","易","쉬울 이"]],"why":"받아들이기(容) 쉬움(易) → 쉽다"},{"id":1346,"w":"如果","p":"rúguǒ","k":"연","ko":"만약 ~라면","g":"o","ex":[{"zh":"如果你累了，我们就在家休息。","py":"Rúguǒ nǐ lèi le, wǒmen jiù zài jiā xiūxi.","ko":"만약 피곤하면 그냥 집에서 쉬자."},{"zh":"老板，如果客户同意，我们下周就开始。","py":"Lǎobǎn, rúguǒ kèhù tóngyì, wǒmen xià zhōu jiù kāishǐ.","ko":"사장님, 고객이 동의하면 다음 주에 바로 시작할게요.","pat":"如果 A，就 B = 만약 A라면 B할게"},{"zh":"妈，如果有什么事，你马上给我打电话。","py":"Mā, rúguǒ yǒu shénme shì, nǐ mǎshàng gěi wǒ dǎ diànhuà.","ko":"엄마, 무슨 일 있으면 바로 나한테 전화해."}],"c":[["如","如","같을 여"],["果","果","실과 과"]],"why":"만일 결과(果)가 그와 같다면(如) → 만약"},{"id":1347,"w":"伞","p":"sǎn","k":"명","ko":"우산","g":"o","ex":[{"zh":"外面下雨了，别忘了带伞。","py":"Wàimian xiàyǔ le, bié wàng le dài sǎn.","ko":"밖에 비 와, 우산 챙기는 거 잊지 마."},{"zh":"你能借我一把伞吗？外面下雨了。","py":"Nǐ néng jiè wǒ yī bǎ sǎn ma? Wàimian xià yǔ le.","ko":"우산 하나 빌려줄 수 있어? 밖에 비 와.","pat":"一把伞 = 우산 하나 (把 양사)"},{"zh":"妈，我把伞忘在公司了。","py":"Mā, wǒ bǎ sǎn wàng zài gōngsī le.","ko":"엄마, 나 우산을 회사에 두고 왔어."}],"c":[["伞","傘","우산 산"]],"why":"펼친 우산 모양을 본뜬 글자(傘)"},{"id":1348,"w":"三","p":"sān","k":"수","ko":"셋, 3","g":"o","ex":[{"zh":"我每个星期去三次健身房。","py":"Wǒ měi gè xīngqī qù sān cì jiànshēnfáng.","ko":"난 일주일에 세 번 헬스장 가."},{"zh":"老板，这个项目还需要三个人。","py":"Lǎobǎn, zhège xiàngmù hái xūyào sān gè rén.","ko":"사장님, 이 프로젝트에 세 명이 더 필요해요.","pat":"三 + 양사 + 명사 = 세 ~ (三个人·三天)"},{"zh":"{H}，我三点到你店门口。","py":"{H}, wǒ sān diǎn dào nǐ diàn ménkǒu.","ko":"{H}, 나 세 시에 너희 가게 앞에 도착해."}],"c":[["三","三","석 삼"]],"why":"가로획 셋 → 삼(三)"},{"id":1349,"w":"上","p":"shàng","k":"명","ko":"위, 위쪽, 지난","g":"o","ex":[{"zh":"你的手机在桌子上。","py":"Nǐ de shǒujī zài zhuōzi shang.","ko":"네 휴대폰 책상 위에 있어."},{"zh":"{H}，你的包放在椅子上了。","py":"{H}, nǐ de bāo fàng zài yǐzi shang le.","ko":"{H}, 네 가방 의자 위에 놔뒀어.","pat":"명사 + 上 = ~ 위에 (椅子上·沙发上)"},{"zh":"我的眼镜是不是在沙发上？","py":"Wǒ de yǎnjìng shì bu shì zài shāfā shang?","ko":"내 안경 소파 위에 있나?"}],"c":[["上","上","윗 상"]],"why":"기준선 위(上)를 가리킴"},{"id":1350,"w":"上班","p":"shàngbān","k":"동","ko":"출근하다","g":"o","ex":[{"zh":"明天是假期，可是我还要上班。","py":"Míngtiān shì jiàqī, kěshì wǒ hái yào shàngbān.","ko":"내일 휴일인데 난 그래도 출근해야 돼."},{"zh":"{H}，你明天几点上班？","py":"{H}, nǐ míngtiān jǐ diǎn shàngbān?","ko":"{H}, 너 내일 몇 시 출근이야?","pat":"几点上班 = 몇 시 출근이야"},{"zh":"妈，我每天开车上班，半个小时就到。","py":"Mā, wǒ měi tiān kāichē shàngbān, bàn gè xiǎoshí jiù dào.","ko":"엄마, 나 매일 차로 출근하는데 30분이면 도착해."}],"c":[["上","上","윗 상"],["班","班","나눌 반"]],"why":"근무조(班)에 오름(上) → 출근"},{"id":1351,"w":"商店","p":"shāngdiàn","k":"명","ko":"가게, 상점","g":"o","ex":[{"zh":"公司旁边新开了一家商店。","py":"Gōngsī pángbiān xīn kāi le yī jiā shāngdiàn.","ko":"회사 옆에 가게가 새로 하나 생겼어."},{"zh":"{H}，这家商店的东西都很贵。","py":"{H}, zhè jiā shāngdiàn de dōngxi dōu hěn guì.","ko":"{H}, 이 가게 물건은 다 비싸.","pat":"这家/一家 + 商店 = 이/한 가게 (家 양사)"},{"zh":"妈，你家附近那家商店还开着吗？","py":"Mā, nǐ jiā fùjìn nà jiā shāngdiàn hái kāi zhe ma?","ko":"엄마, 집 근처 그 가게 아직 해?"}],"c":[["商","商","장사 상"],["店","店","가게 점"]],"why":"장사(商)하는 가게(店) → 상점"},{"id":1352,"w":"上网","p":"shàngwǎng","k":"동","ko":"인터넷을 하다, 온라인에 접속하다","g":"o","ex":[{"zh":"工厂里上网太慢了。","py":"Gōngchǎng li shàngwǎng tài màn le.","ko":"공장 안에선 인터넷이 너무 느려."},{"zh":"不知道的话，你上网查一下。","py":"Bù zhīdào de huà, nǐ shàngwǎng chá yīxià.","ko":"모르면 인터넷으로 한번 찾아봐.","pat":"上网查一下 = 인터넷으로 찾아보다"},{"zh":"妈，你学会用手机上网了吗？","py":"Mā, nǐ xuéhuì yòng shǒujī shàngwǎng le ma?","ko":"엄마, 휴대폰으로 인터넷 하는 거 배웠어?"}],"c":[["上","上","윗 상"],["网","網","그물 망"]],"why":"그물(網, 인터넷)에 오름(上) → 인터넷하다"},{"id":1353,"w":"上午","p":"shàngwǔ","k":"명","ko":"오전","g":"o","ex":[{"zh":"老板，今天上午十点开会。","py":"Lǎobǎn, jīntiān shàngwǔ shí diǎn kāihuì.","ko":"사장님, 오늘 오전 10시에 회의 있습니다."},{"zh":"{H}，周六上午你有空吗？","py":"{H}, zhōuliù shàngwǔ nǐ yǒu kòng ma?","ko":"{H}, 토요일 오전에 시간 있어?","pat":"요일 + 上午 = ~요일 오전 (周六上午)"},{"zh":"妈，我上午在开会，下午给你打电话。","py":"Mā, wǒ shàngwǔ zài kāihuì, xiàwǔ gěi nǐ dǎ diànhuà.","ko":"엄마, 오전엔 회의 중이라 오후에 전화할게."}],"c":[["上","上","윗 상"],["午","午","낮 오"]],"why":"정오(午)의 앞(上) → 오전"},{"id":1354,"w":"少","p":"shǎo","k":"형","ko":"적다, 모자라다","g":"o","ex":[{"zh":"这个月的订单比上个月少。","py":"Zhège yuè de dìngdān bǐ shàng gè yuè shǎo.","ko":"이번 달 주문이 지난달보다 적어."},{"zh":"{H}，你少喝点儿咖啡，对身体不好。","py":"{H}, nǐ shǎo hē diǎnr kāfēi, duì shēntǐ bù hǎo.","ko":"{H}, 커피 좀 줄여, 몸에 안 좋아.","pat":"少 + 동사 + 点儿 = 좀 덜 ~해 (少喝点儿·少吃点儿)"},{"zh":"妈，我的头发越来越少了。","py":"Mā, wǒ de tóufa yuè lái yuè shǎo le.","ko":"엄마, 내 머리숱이 점점 줄어."}],"c":[["少","少","적을 소"]],"why":"小(작다)에 삐침 → 적다"},{"id":1355,"w":"谁","p":"shéi","k":"대","ko":"누구","g":"o","ex":[{"zh":"这份报告是谁写的？","py":"Zhè fèn bàogào shì shéi xiě de?","ko":"이 보고서 누가 쓴 거야?"},{"zh":"{H}，刚才给你打电话的是谁？","py":"{H}, gāngcái gěi nǐ dǎ diànhuà de shì shéi?","ko":"{H}, 방금 너한테 전화한 사람 누구야?","pat":"~的是谁？ = ~한 사람은 누구야?"},{"zh":"妈，这个礼物是谁送你的？","py":"Mā, zhège lǐwù shì shéi sòng nǐ de?","ko":"엄마, 이 선물 누가 준 거야?"}],"c":[["谁","誰","누구 수"]],"why":"말(言)로 묻는 '누구'(誰)"},{"id":1356,"w":"生病","p":"shēngbìng","k":"동","ko":"병이 나다, 아프다","g":"o","ex":[{"zh":"爸爸生病了，我很担心。","py":"Bàba shēngbìng le, wǒ hěn dānxīn.","ko":"아빠가 편찮으셔서 너무 걱정돼."},{"zh":"{H}，你生病了就别去上班了。","py":"{H}, nǐ shēngbìng le jiù bié qù shàngbān le.","ko":"{H}, 아프면 출근하지 마.","pat":"生病了 = 아프다/병이 났다 (了와 함께)"},{"zh":"同事生病了，他的工作我先帮他做。","py":"Tóngshì shēngbìng le, tā de gōngzuò wǒ xiān bāng tā zuò.","ko":"동료가 아파서 그 사람 일은 내가 일단 대신 해."}],"c":[["生","生","날 생"],["病","病","병 병"]],"why":"병(病)이 생김(生) → 병나다"},{"id":1357,"w":"生气","p":"shēngqì","k":"동","ko":"화내다, 성나다","g":"o","ex":[{"zh":"别生气了，是我不对。","py":"Bié shēngqì le, shì wǒ bù duì.","ko":"화내지 마, 내가 잘못했어."},{"zh":"老板今天很生气，因为货又晚了。","py":"Lǎobǎn jīntiān hěn shēngqì, yīnwèi huò yòu wǎn le.","ko":"사장님이 오늘 엄청 화나셨어, 물건이 또 늦어서.","pat":"很生气，因为… = ~ 때문에 화가 났다"},{"zh":"妈，你别生气，我下次一定早点儿告诉你。","py":"Mā, nǐ bié shēngqì, wǒ xià cì yīdìng zǎo diǎnr gàosu nǐ.","ko":"엄마, 화내지 마, 다음엔 꼭 미리 말할게."}],"c":[["生","生","날 생"],["气","氣","기운 기"]],"why":"노기(氣)가 생김(生) → 화내다"},{"id":1358,"w":"生日","p":"shēngrì","k":"명","ko":"생일","g":"o","ex":[{"zh":"下周是{H}的生日，我得准备礼物。","py":"Xià zhōu shì {H} de shēngrì, wǒ děi zhǔnbèi lǐwù.","ko":"다음 주가 {H} 생일이라 선물 준비해야 돼."},{"zh":"妈，祝你生日快乐！我给你寄了礼物。","py":"Mā, zhù nǐ shēngrì kuàilè! Wǒ gěi nǐ jì le lǐwù.","ko":"엄마, 생일 축하해! 선물 보냈어.","pat":"祝你生日快乐 = 생일 축하해"},{"zh":"今天是老板的生日，我们给他买了蛋糕。","py":"Jīntiān shì lǎobǎn de shēngrì, wǒmen gěi tā mǎi le dàngāo.","ko":"오늘 사장님 생신이라 우리가 케이크 사 드렸어."}],"c":[["生","生","날 생"],["日","日","날 일"]],"why":"태어난(生) 날(日) → 생일"},{"id":1359,"w":"声音","p":"shēngyīn","k":"명","ko":"소리, 목소리","g":"o","ex":[{"zh":"妈，你的声音听起来有点儿累。","py":"Mā, nǐ de shēngyīn tīng qǐlai yǒudiǎnr lèi.","ko":"엄마, 목소리가 좀 피곤해 보여."},{"zh":"工厂里机器的声音太大了。","py":"Gōngchǎng li jīqì de shēngyīn tài dà le.","ko":"공장 안 기계 소리가 너무 커.","pat":"声音太大 = 소리가 너무 크다"},{"zh":"{H}，你的声音真好听。","py":"{H}, nǐ de shēngyīn zhēn hǎotīng.","ko":"{H}, 네 목소리 진짜 듣기 좋아."}],"c":[["声","聲","소리 성"],["音","音","소리 음"]],"why":"소리(聲)와 음(音) → 소리"},{"id":1360,"w":"什么","p":"shénme","k":"대","ko":"무엇, 무슨","g":"o","ex":[{"zh":"你晚上想吃什么？","py":"Nǐ wǎnshang xiǎng chī shénme?","ko":"저녁에 뭐 먹고 싶어?"},{"zh":"老板，您找我有什么事？","py":"Lǎobǎn, nín zhǎo wǒ yǒu shénme shì?","ko":"사장님, 무슨 일로 찾으셨어요?","pat":"有什么事？ = 무슨 일이에요?"},{"zh":"妈，过年你想要什么礼物？","py":"Mā, guònián nǐ xiǎng yào shénme lǐwù?","ko":"엄마, 설에 무슨 선물 받고 싶어?"}],"c":[["什","什","열 사람 십"],["么","麼","작을 마"]],"why":"의문사 什麼 → 무엇"},{"id":1361,"w":"身体","p":"shēntǐ","k":"명","ko":"몸, 건강","g":"o","ex":[{"zh":"妈妈，你要多注意身体。","py":"Māma, nǐ yào duō zhùyì shēntǐ.","ko":"엄마, 건강 잘 챙겨."},{"zh":"老板身体不舒服，今天没来公司。","py":"Lǎobǎn shēntǐ bù shūfu, jīntiān méi lái gōngsī.","ko":"사장님이 몸이 안 좋으셔서 오늘 회사에 안 나오셨어.","pat":"身体不舒服 = 몸이 안 좋다"},{"zh":"{H}，工作再忙也要注意身体。","py":"{H}, gōngzuò zài máng yě yào zhùyì shēntǐ.","ko":"{H}, 일이 아무리 바빠도 몸 챙겨."}],"c":[["身","身","몸 신"],["体","體","몸 체"]],"why":"몸(身)과 몸(體) → 신체"},{"id":1362,"w":"十","p":"shí","k":"수","ko":"열, 10","g":"o","ex":[{"zh":"这批货需要十天才能做完。","py":"Zhè pī huò xūyào shí tiān cái néng zuò wán.","ko":"이번 물량은 열흘은 걸려야 다 끝나요."},{"zh":"{H}，我十分钟以后到。","py":"{H}, wǒ shí fēnzhōng yǐhòu dào.","ko":"{H}, 나 10분 뒤에 도착해.","pat":"十分钟 = 10분 (十 + 分钟)"},{"zh":"妈，我已经出国快十年了。","py":"Mā, wǒ yǐjīng chūguó kuài shí nián le.","ko":"엄마, 나 외국 나온 지 벌써 10년이 다 돼 가."}],"c":[["十","十","열 십"]],"why":"가로세로 획 → 열(十)"},{"id":1363,"w":"试","p":"shì","k":"동","ko":"시험 삼아 해 보다, 시도하다","g":"o","ex":[{"zh":"您可以先试一下我们的样品。","py":"Nín kěyǐ xiān shì yīxià wǒmen de yàngpǐn.","ko":"먼저 저희 샘플을 한번 써 보셔도 돼요."},{"zh":"{H}，这件衣服你去试试吧。","py":"{H}, zhè jiàn yīfu nǐ qù shìshi ba.","ko":"{H}, 이 옷 한번 입어 봐.","pat":"试试 / 试一下 = 한번 해 보다"},{"zh":"妈，这种茶你试一下，很好喝。","py":"Mā, zhè zhǒng chá nǐ shì yīxià, hěn hǎohē.","ko":"엄마, 이 차 한번 마셔 봐, 맛있어."}],"c":[["试","試","시험 시"]],"why":"말(言)로 법식(式)을 시험함 → 시도하다"},{"id":1364,"w":"是","p":"shì","k":"동","ko":"~이다, 맞다","g":"o","ex":[{"zh":"{H}是我女朋友，她在新加坡工作。","py":"{H} shì wǒ nǚpéngyou, tā zài Xīnjiāpō gōngzuò.","ko":"{H}는 내 여자친구야, 싱가포르에서 일해."},{"zh":"我是坐地铁来的。","py":"Wǒ shì zuò dìtiě lái de.","ko":"나 지하철 타고 왔어.","pat":"是 + 방식/시간 + 的 = ~해서 온 거야 (과거 일 강조)"},{"zh":"这位是我们公司的老板。","py":"Zhè wèi shì wǒmen gōngsī de lǎobǎn.","ko":"이분이 우리 회사 사장님이셔."}],"c":[["是","是","옳을 시"]],"why":"옳을 시(是) → ~이다"},{"id":1365,"w":"时候","p":"shíhou","k":"명","ko":"때, 무렵","g":"o","ex":[{"zh":"你什么时候下班？我去接你。","py":"Nǐ shénme shíhou xiàbān? Wǒ qù jiē nǐ.","ko":"너 언제 퇴근해? 데리러 갈게."},{"zh":"老板，客户来的时候您告诉我一声。","py":"Lǎobǎn, kèhù lái de shíhou nín gàosu wǒ yī shēng.","ko":"사장님, 고객 오시면 저한테 한마디 해 주세요.","pat":"동사 + 的时候 = ~할 때"},{"zh":"妈，你什么时候来马来西亚看我？","py":"Mā, nǐ shénme shíhou lái Mǎláixīyà kàn wǒ?","ko":"엄마, 언제 말레이시아로 나 보러 올 거야?"}],"c":[["时","時","때 시"],["候","候","철 후"]],"why":"때(時)와 철(候) → 때, 무렵"},{"id":1366,"w":"时间","p":"shíjiān","k":"명","ko":"시간","g":"o","ex":[{"zh":"老板，您明天有时间吗？","py":"Lǎobǎn, nín míngtiān yǒu shíjiān ma?","ko":"사장님, 내일 시간 있으세요?"},{"zh":"{H}，我们没时间了，快点儿！","py":"{H}, wǒmen méi shíjiān le, kuài diǎnr!","ko":"{H}, 우리 시간 없어, 빨리!","pat":"有时间 / 没时间 = 시간이 있다 / 없다"},{"zh":"妈，最近我时间不多，周末再给你打电话。","py":"Mā, zuìjìn wǒ shíjiān bù duō, zhōumò zài gěi nǐ dǎ diànhuà.","ko":"엄마, 요즘 시간이 별로 없어서 주말에 전화할게."}],"c":[["时","時","때 시"],["间","間","사이 간"]],"why":"때(時)와 때 사이(間) → 시간"},{"id":1367,"w":"世界","p":"shìjiè","k":"명","ko":"세계, 세상","g":"o","ex":[{"zh":"{H}说她想和我一起去看看世界。","py":"{H} shuō tā xiǎng hé wǒ yīqǐ qù kànkan shìjiè.","ko":"{H}가 나랑 같이 세계를 돌아보고 싶대."},{"zh":"你是世界上最好的妈妈。","py":"Nǐ shì shìjiè shang zuì hǎo de māma.","ko":"엄마 :"Mā, nǐ de shǒujī shì bu shì huài le?","ko":"엄마, 휴대폰 고장 난 거 아니야?"}],"c":[["手","手","손 수"],["机","機","틀 기"]],"why":"손(手)에 드는 기계(機) → 휴대폰"},{"id":1372,"w":"树","p":"shù","k":"명","ko":"나무","g":"o","ex":[{"zh":"奶奶家门口有一棵很老的树。","py":"Nǎinai jiā ménkǒu yǒu yī kē hěn lǎo de shù.","ko":"할머니 댁 앞에 아주 오래된 나무가 한 그루 있어."},{"zh":"{H}，我们去那棵树下面坐一会儿吧。","py":"{H}, wǒmen qù nà kē shù xiàmian zuò yīhuìr ba.","ko":"{H}, 저 나무 밑에 가서 좀 앉아 있자.","pat":"一棵树 / 树下面 = 나무 한 그루 / 나무 밑"},{"zh":"工厂门口种了很多树。","py":"Gōngchǎng ménkǒu zhòng le hěn duō shù.","ko":"공장 입구에 나무를 많이 심었어."}],"c":[["树","樹","나무 수"]],"why":"나무(木)를 세움 → 나무"},{"id":1373,"w":"书","p":"shū","k":"명","ko":"책","g":"o","ex":[{"zh":"我在看一本关于管理的书。","py":"Wǒ zài kàn yī běn guānyú guǎnlǐ de shū.","ko":"요즘 경영에 관한 책 한 권 읽고 있어."},{"zh":"{H}，你最近在看什么书？","py":"{H}, nǐ zuìjìn zài kàn shénme shū?","ko":"{H}, 요즘 무슨 책 읽어?","pat":"看书 = 책을 읽다 (일상 표현)"},{"zh":"妈，我以前的书你帮我放好了吗？","py":"Mā, wǒ yǐqián de shū nǐ bāng wǒ fàng hǎo le ma?","ko":"엄마, 내 예전 책들 잘 챙겨 놨어?"}],"c":[["书","書","글 서"]],"why":"붓(聿)으로 쓴 글(書) → 책"},{"id":1374,"w":"双","p":"shuāng","k":"양","ko":"켤레, 쌍","g":"o","ex":[{"zh":"我给你买了一双新鞋。","py":"Wǒ gěi nǐ mǎi le yī shuāng xīn xié.","ko":"너 주려고 새 신발 한 켤레 샀어."},{"zh":"妈，我给爸爸买了一双运动鞋。","py":"Mā, wǒ gěi bàba mǎi le yī shuāng yùndòngxié.","ko":"엄마, 아빠 운동화 한 켤레 샀어.","pat":"一双 + 鞋/手套/筷子 = 한 켤레·한 쌍"},{"zh":"工厂的工人每个月发一双新手套。","py":"Gōngchǎng de gōngrén měi gè yuè fā yī shuāng xīn shǒutào.","ko":"공장 작업자들은 매달 새 장갑을 한 켤레씩 받아."}],"c":[["双","雙","두 쌍"]],"why":"새(隹) 두 마리를 손에 쥠 → 쌍"},{"id":1375,"w":"舒服","p":"shūfu","k":"형","ko":"편안하다, 몸 상태가 좋다","g":"o","ex":[{"zh":"我今天不太舒服，想早点儿回家。","py":"Wǒ jīntiān bù tài shūfu, xiǎng zǎo diǎnr huí jiā.","ko":"오늘 몸이 좀 안 좋아서 일찍 들어가고 싶어요."},{"zh":"老板，您哪儿不舒服？要不要去医院？","py":"Lǎobǎn, nín nǎr bù shūfu? Yào bu yào qù yīyuàn?","ko":"사장님, 어디 불편하세요? 병원 가실래요?","pat":"哪儿不舒服？ = 어디 불편해/아파?"},{"zh":"{H}，你家的沙发真舒服。","py":"{H}, nǐ jiā de shāfā zhēn shūfu.","ko":"{H}, 너희 집 소파 진짜 편하다."}],"c":[["舒","舒","펼 서"],["服","服","옷 복"]],"why":"몸을 펴고(舒) 옷(服)이 맞음 → 편안하다"},{"id":1376,"w":"水","p":"shuǐ","k":"명","ko":"물","g":"o","ex":[{"zh":"天气太热了，大家多喝水。","py":"Tiānqì tài rè le, dàjiā duō hē shuǐ.","ko":"날씨 너무 더우니까 다들 물 많이 마셔요."},{"zh":"{H}，你帮我倒杯水吧。","py":"{H}, nǐ bāng wǒ dào bēi shuǐ ba.","ko":"{H}, 물 한 잔만 따라 줘.","pat":"倒(一)杯水 = 물 한 잔 따르다"},{"zh":"老板，工厂今天下午停水。","py":"Lǎobǎn, gōngchǎng jīntiān xiàwǔ tíng shuǐ.","ko":"사장님, 공장 오늘 오후에 단수래요."}],"c":[["水","水","물 수"]],"why":"흐르는 물의 모양(水)"},{"id":1377,"w":"水果","p":"shuǐguǒ","k":"명","ko":"과일","g":"o","ex":[{"zh":"妈妈让我多吃水果。","py":"Māma ràng wǒ duō chī shuǐguǒ.","ko":"엄마가 과일 많이 먹으래."},{"zh":"{H}，我给你买了一些水果。","py":"{H}, wǒ gěi nǐ mǎi le yīxiē shuǐguǒ.","ko":"{H}, 과일 좀 사 왔어.","pat":"买(一些)水果 = 과일을 (좀) 사다"},{"zh":"客户来的时候，记得准备点儿水果。","py":"Kèhù lái de shíhou, jìde zhǔnbèi diǎnr shuǐguǒ.","ko":"고객 오실 때 과일 좀 준비해 둬."}],"c":[["水","水","물 수"],["果","果","실과 과"]],"why":"물(水)기 많은 열매(果) → 과일"},{"id":1378,"w":"睡觉","p":"shuìjiào","k":"동","ko":"잠을 자다","g":"o","ex":[{"zh":"很晚了，你快去睡觉吧。","py":"Hěn wǎn le, nǐ kuài qù shuìjiào ba.","ko":"많이 늦었어, 얼른 가서 자."},{"zh":"妈，我最近工作忙，每天很晚才睡觉。","py":"Mā, wǒ zuìjìn gōngzuò máng, měi tiān hěn wǎn cái shuìjiào.","ko":"엄마, 요즘 일이 바빠서 매일 늦게야 자.","pat":"很晚才睡觉 = 늦게서야 자다"},{"zh":"同事昨天一晚上没睡觉，今天很累。","py":"Tóngshì zuótiān yī wǎnshang méi shuìjiào, jīntiān hěn lèi.","ko":"동료가 어젯밤에 한숨도 못 자서 오늘 엄청 피곤해해."}],"c":[["睡","睡","졸 수"],["觉","覺","깨달을 각"]],"why":"잠(睡)+각(覺, 잠의 뜻) → 잠자다"},{"id":1379,"w":"水平","p":"shuǐpíng","k":"명","ko":"수준, 실력","g":"o","ex":[{"zh":"你的中文水平越来越高了。","py":"Nǐ de Zhōngwén shuǐpíng yuè lái yuè gāo le.","ko":"오빠 중국어 실력 점점 늘고 있어."},{"zh":"老板，我们的技术水平比他们高。","py":"Lǎobǎn, wǒmen de jìshù shuǐpíng bǐ tāmen gāo.","ko":"사장님, 우리 기술 수준이 그쪽보다 높아요.","pat":"技术/中文 + 水平 + 高 = ~ 수준이 높다"},{"zh":"妈，我的英语水平还不错，你放心。","py":"Mā, wǒ de Yīngyǔ shuǐpíng hái bùcuò, nǐ fàngxīn.","ko":"엄마, 내 영어 실력 꽤 괜찮으니까 걱정 마."}],"c":[["水","水","물 수"],["平","平","평평할 평"]],"why":"물(水)처럼 평평한(平) 기준 → 수준"},{"id":1380,"w":"说","p":"shuō","k":"동","ko":"말하다, 꾸짖다","g":"o","ex":[{"zh":"客户说下个月还要订货。","py":"Kèhù shuō xià gè yuè hái yào dìng huò.","ko":"고객이 다음 달에 또 주문하겠대."},{"zh":"{H}说她今天要加班。","py":"{H} shuō tā jīntiān yào jiābān.","ko":"{H}가 오늘 야근해야 한대.","pat":"사람 + 说 + 내용 = ~가 ~래 (말 전달)"},{"zh":"妈，爸爸说他下个月要去旅游。","py":"Mā, bàba shuō tā xià ge yuè yào qù lǚyóu.","ko":"엄마, 아빠가 다음 달에 여행 가신대."}],"c":[["说","說","말씀 설"]],"why":"말(言)로 풀어냄 → 말하다"},{"id":1381,"w":"说话","p":"shuōhuà","k":"동","ko":"말을 하다, 이야기하다","g":"o","ex":[{"zh":"你说话慢一点儿，我听不懂。","py":"Nǐ shuōhuà màn yīdiǎnr, wǒ tīng bù dǒng.","ko":"말 좀 천천히 해 줘, 못 알아듣겠어."},{"zh":"{H}，你怎么不说话？生气了吗？","py":"{H}, nǐ zěnme bù shuōhuà? Shēngqì le ma?","ko":"{H}, 왜 말이 없어? 화났어?","pat":"不说话 = 말을 안 하다"},{"zh":"开会的时候老板说话很快。","py":"Kāihuì de shíhou lǎobǎn shuōhuà hěn kuài.","ko":"회의할 때 사장님 말이 엄청 빨라."}],"c":[["说","說","말씀 설"],["话","話","말씀 화"]],"why":"말(話)을 함(說) → 이야기하다"},{"id":1382,"w":"叔叔","p":"shūshu","k":"명","ko":"삼촌, 아저씨","g":"o","ex":[{"zh":"叔叔下个月来新加坡出差。","py":"Shūshu xià gè yuè lái Xīnjiāpō chūchāi.","ko":"삼촌이 다음 달에 싱가포르로 출장 오셔."},{"zh":"叔叔、阿姨，欢迎你们来新山！","py":"Shūshu, āyí, huānyíng nǐmen lái Xīnshān!","ko":"삼촌, 숙모, 조호르바루에 오신 걸 환영해요!","pat":"叔叔阿姨 = 아저씨 아주머니 (어른을 부를 때)"},{"zh":"叔叔，好久不见，您身体还好吗？","py":"Shūshu, hǎojiǔ bù jiàn, nín shēntǐ hái hǎo ma?","ko":"삼촌, 오랜만이에요, 건강은 괜찮으세요?"}],"c":[["叔","叔","아재비 숙"],["叔","叔","아재비 숙"]],"why":"아재비(叔) 반복 → 삼촌"},{"id":1383,"w":"数学","p":"shùxué","k":"명","ko":"수학","g":"o","ex":[{"zh":"我小时候数学不太好。","py":"Wǒ xiǎoshíhou shùxué bù tài hǎo.","ko":"나 어릴 때 수학 별로 못했어."},{"zh":"这道数学题太难了，我不会做。","py":"Zhè dào shùxué tí tài nán le, wǒ bù huì zuò.","ko":"이 수학 문제 너무 어려워서 못 풀겠어.","pat":"数学题 / 数学老师 = 수학 문제 / 수학 선생님"},{"zh":"{H}，你上学的时候数学好吗？","py":"{H}, nǐ shàngxué de shíhou shùxué hǎo ma?","ko":"{H}, 너 학교 다닐 때 수학 잘했어?"}],"c":[["数","數","셈 수"],["学","學","배울 학"]],"why":"셈(數)을 배우는(學) 학문 → 수학"},{"id":1384,"w":"四","p":"sì","k":"수","ko":"넷, 4","g":"o","ex":[{"zh":"我在准备HSK四级考试。","py":"Wǒ zài zhǔnbèi HSK sì jí kǎoshì.","ko":"나 HSK 4급 시험 준비하고 있어."},{"zh":"老板，新机器四月就能到。","py":"Lǎobǎn, xīn jīqì sì yuè jiù néng dào.","ko":"사장님, 새 기계는 4월이면 들어와요.","pat":"四月 = 4월 (숫자 + 月)"},{"zh":"妈，我们四个人一起吃饭吧。","py":"Mā, wǒmen sì gè rén yīqǐ chīfàn ba.","ko":"엄마, 우리 넷이 같이 밥 먹자."}],"c":[["四","四","넉 사"]],"why":"넉 사(四)"},{"id":1385,"w":"司机","p":"sījī","k":"명","ko":"운전기사","g":"o","ex":[{"zh":"公司的司机会去机场接客户。","py":"Gōngsī de sījī huì qù jīchǎng jiē kèhù.","ko":"회사 기사님이 공항에 고객 마중 나갈 거야."},{"zh":"{H}，出租车司机找不到你家。","py":"{H}, chūzūchē sījī zhǎo bu dào nǐ jiā.","ko":"{H}, 택시 기사님이 너희 집을 못 찾으셔.","pat":"出租车司机 = 택시 기사"},{"zh":"妈，我在机场给你找了个司机。","py":"Mā, wǒ zài jīchǎng gěi nǐ zhǎo le gè sījī.","ko":"엄마, 공항에 기사님 한 분 불러 놨어."}],"c":[["司","司","맡을 사"],["机","機","틀 기"]],"why":"기계(機)를 맡음(司) → 운전기사"},{"id":1386,"w":"送","p":"sòng","k":"동","ko":"보내다, 선물하다, 배웅하다","g":"o","ex":[{"zh":"我送你回家吧。","py":"Wǒ sòng nǐ huí jiā ba.","ko":"내가 집까지 데려다줄게."},{"zh":"妈，明天我送你去机场。","py":"Mā, míngtiān wǒ sòng nǐ qù jīchǎng.","ko":"엄마, 내일 내가 공항까지 데려다줄게.","pat":"送 + 사람 + 去 + 장소 = ~를 ~까지 데려다주다"},{"zh":"老板，我送客户去宾馆了，晚点儿回来。","py":"Lǎobǎn, wǒ sòng kèhù qù bīnguǎn le, wǎn diǎnr huílai.","ko":"사장님, 고객 호텔까지 모셔다드리고 좀 늦게 돌아갈게요."}],"c":[["送","送","보낼 송"]],"why":"가서(辶) 보냄 → 배웅하다"},{"id":1387,"w":"岁","p":"suì","k":"양","ko":"살, 세 (나이)","g":"o","ex":[{"zh":"我妹妹比我小三岁。","py":"Wǒ mèimei bǐ wǒ xiǎo sān suì.","ko":"내 여동생은 나보다 세 살 어려."},{"zh":"老板的儿子今年刚满十八岁。","py":"Lǎobǎn de érzi jīnnián gāng mǎn shíbā suì.","ko":"사장님 아들이 올해 딱 열여덟 살 됐어.","pat":"满 + 숫자 + 岁 = 만 ~살이 되다"},{"zh":"{H}，你比我小几岁？","py":"{H}, nǐ bǐ wǒ xiǎo jǐ suì?","ko":"{H}, 너 나보다 몇 살 어려?"}],"c":[["岁","歲","해 세"]],"why":"해 세(歲) → 나이, 살"},{"id":1388,"w":"虽然","p":"suīrán","k":"연","ko":"비록 ~이지만","g":"o","ex":[{"zh":"虽然工作很忙，但是我每周都去看{H}。","py":"Suīrán gōngzuò hěn máng, dànshì wǒ měi zhōu dōu qù kàn {H}.","ko":"일은 바쁘지만 그래도 매주 {H} 보러 가."},{"zh":"虽然客户很急，但是质量不能差。","py":"Suīrán kèhù hěn jí, dànshì zhìliàng bù néng chà.","ko":"고객이 급하긴 해도 품질이 떨어지면 안 돼.","pat":"虽然 A，但是 B = 비록 A지만 B"},{"zh":"妈，虽然离家很远，但是我过得很好。","py":"Mā, suīrán lí jiā hěn yuǎn, dànshì wǒ guò de hěn hǎo.","ko":"엄마, 집에서 멀긴 해도 나 잘 지내."}],"c":[["虽","雖","비록 수"],["然","然","그러할 연"]],"why":"비록(雖) 그러하나(然) → 비록"},{"id":1389,"w":"所以","p":"suǒyǐ","k":"연","ko":"그래서, 그러므로","g":"o","ex":[{"zh":"今天路上堵车，所以我来晚了。","py":"Jīntiān lù shang dǔchē, suǒyǐ wǒ lái wǎn le.","ko":"오늘 길이 막혀서 늦었습니다."},{"zh":"因为下大雨，所以航班取消了。","py":"Yīnwèi xià dà yǔ, suǒyǐ hángbān qǔxiāo le.","ko":"비가 많이 와서 항공편이 취소됐어.","pat":"因为 A，所以 B = A해서 B하다"},{"zh":"妈，最近太忙了，所以没给你打电话。","py":"Mā, zuìjìn tài máng le, suǒyǐ méi gěi nǐ dǎ diànhuà.","ko":"엄마, 요즘 너무 바빠서 전화를 못 했어."}],"c":[["所","所","바 소"],["以","以","써 이"]],"why":"그런 바(所)로써(以) → 그래서"},{"id":1390,"w":"他","p":"tā","k":"대","ko":"그, 그 남자","g":"o","ex":[{"zh":"他是我们新来的工程师。","py":"Tā shì wǒmen xīn lái de gōngchéngshī.","ko":"저 사람은 우리 새로 온 엔지니어야."},{"zh":"妈，他是我在新加坡的好朋友。","py":"Mā, tā shì wǒ zài Xīnjiāpō de hǎo péngyou.","ko":"엄마, 얘는 싱가포르에 있는 내 친한 친구야.","pat":"他是 + 신분 = 그는 ~야"},{"zh":"{H}，他是你们店的新老板吗？","py":"{H}, tā shì nǐmen diàn de xīn lǎobǎn ma?","ko":"{H}, 저 사람이 너희 가게 새 사장님이야?"}],"c":[["他","他","다를 타"]],"why":"나와 다른(他) 사람(亻) → 그"},{"id":1391,"w":"她","p":"tā","k":"대","ko":"그녀","g":"o","ex":[{"zh":"她是我们最重要的客户。","py":"Tā shì wǒmen zuì zhòngyào de kèhù.","ko":"그분은 우리 제일 중요한 고객이야."},{"zh":"妈，她就是{H}，我给你看过照片。","py":"Mā, tā jiù shì {H}, wǒ gěi nǐ kàn guo zhàopiàn.","ko":"엄마, 이 사람이 {H}야, 사진 보여 준 적 있잖아.","pat":"她就是 + 이름 = 이 사람이 바로 ~야"},{"zh":"她是我们新来的同事，叫小李。","py":"Tā shì wǒmen xīn lái de tóngshì, jiào Xiǎo Lǐ.","ko":"이분은 새로 온 동료고, 샤오리라고 해."}],"c":[["她","她","그녀 타"]],"why":"女+也 → 여자인 '그녀'"},{"id":1392,"w":"它","p":"tā","k":"대","ko":"그것 (사물·동물)","g":"o","ex":[{"zh":"这台机器很旧了，它经常出问题。","py":"Zhè tái jīqì hěn jiù le, tā jīngcháng chū wèntí.","ko":"이 기계 너무 낡아서 자주 고장 나."},{"zh":"{H}，你的猫好像饿了，快给它吃东西。","py":"{H}, nǐ de māo hǎoxiàng è le, kuài gěi tā chī dōngxi.","ko":"{H}, 고양이 배고픈가 봐, 얼른 밥 줘.","pat":"동물/사물 → 它 (给它吃·它很好用)"},{"zh":"妈，这个手机我用了五年，它还很好用。","py":"Mā, zhège shǒujī wǒ yòng le wǔ nián, tā hái hěn hǎoyòng.","ko":"엄마, 이 폰 5년 썼는데 아직도 잘 돼."}],"c":[["它","它","다를 타"]],"why":"사람이 아닌 다른 것 → 그것"},{"id":1393,"w":"太","p":"tài","k":"부","ko":"너무, 아주","g":"o","ex":[{"zh":"这个价格太高了，能便宜点儿吗？","py":"Zhège jiàgé tài gāo le, néng piányi diǎnr ma?","ko":"이 가격은 너무 비싸요, 좀 깎아 줄 수 있어요?"},{"zh":"{H}，今天太累了，我们早点儿回家吧。","py":"{H}, jīntiān tài lèi le, wǒmen zǎo diǎnr huí jiā ba.","ko":"{H}, 오늘 너무 피곤하다, 일찍 집에 가자.","pat":"太 + 형용사 + 了 = 너무 ~하다"},{"zh":"妈，你做的菜太好吃了。","py":"Mā, nǐ zuò de cài tài hǎochī le.","ko":"엄마, 엄마 요리 너무 맛있어."}],"c":[["太","太","클 태"]],"why":"大(크다)에 점 하나 더 → 너무"},{"id":1394,"w":"太阳","p":"tàiyáng","k":"명","ko":"태양, 해","g":"o","ex":[{"zh":"今天太阳很大，我们下午再出去吧。","py":"Jīntiān tàiyáng hěn dà, wǒmen xiàwǔ zài chūqu ba.","ko":"오늘 햇볕 너무 세다, 오후에 나가자."},{"zh":"下午太阳太大，工人们要多休息。","py":"Xiàwǔ tàiyáng tài dà, gōngrénmen yào duō xiūxi.","ko":"오후엔 햇볕이 너무 세니까 작업자들 자주 쉬어야 해.","pat":"太阳很大 = 햇볕이 강하다"},{"zh":"妈，你那边下雪，我这边每天都有太阳。","py":"Mā, nǐ nàbiān xià xuě, wǒ zhèbiān měi tiān dōu yǒu tàiyáng.","ko":"엄마, 거긴 눈 오는데 여긴 매일 해가 쨍쨍해."}],"c":[["太","太","클 태"],["阳","陽","볕 양"]],"why":"크나큰(太) 볕(陽) → 태양"},{"id":1395,"w":"特别","p":"tèbié","k":"형·부","ko":"특별하다, 특히","g":"o","ex":[{"zh":"今天是个特别的日子。","py":"Jīntiān shì gè tèbié de rìzi.","ko":"오늘은 특별한 날이야."},{"zh":"这个礼物很特别，是我自己做的。","py":"Zhège lǐwù hěn tèbié, shì wǒ zìjǐ zuò de.","ko":"이 선물 특별해, 내가 직접 만든 거야.","pat":"很特别 / 特别的 + 명사 = 특별하다 / 특별한 ~"},{"zh":"老板，这个客户的要求很特别。","py":"Lǎobǎn, zhège kèhù de yāoqiú hěn tèbié.","ko":"사장님, 이 고객 요구 사항이 좀 특이해요."}],"c":[["特","特","특별할 특"],["别","別","다를 별"]],"why":"특히(特) 다름(別) → 특별하다"},{"id":1396,"w":"疼","p":"téng","k":"형","ko":"아프다","g":"o","ex":[{"zh":"妈，我头有点儿疼，想早点儿睡。","py":"Mā, wǒ tóu yǒudiǎnr téng, xiǎng zǎo diǎnr shuì.","ko":"엄마, 나 머리가 좀 아파서 일찍 자려고."},{"zh":"老板，我牙疼，下午想去看医生。","py":"Lǎobǎn, wǒ yá téng, xiàwǔ xiǎng qù kàn yīshēng.","ko":"사장님, 이가 아파서 오후에 병원 좀 다녀올게요.","pat":"신체 + 疼 = ~가 아프다 (头疼·牙疼·腿疼)"},{"zh":"{H}，你的腿还疼吗？","py":"{H}, nǐ de tuǐ hái téng ma?","ko":"{H}, 다리 아직 아파?"}],"c":[["疼","疼","아플 동"]],"why":"병(疒)+冬(음) → 아프다"},{"id":1397,"w":"题","p":"tí","k":"명","ko":"문제, 제목","g":"o","ex":[{"zh":"这次MBA作业的题目是什么？","py":"Zhè cì MBA zuòyè de tímù shì shénme?","ko":"이번 MBA 과제 제목이 뭐야?"},{"zh":"{H}，这道题你会做吗？帮我看看。","py":"{H}, zhè dào tí nǐ huì zuò ma? Bāng wǒ kànkan.","ko":"{H}, 이 문제 풀 수 있어? 좀 봐 줘.","pat":"一道题 / 做题 = 한 문제 / 문제를 풀다 (道 양사)"},{"zh":"妈，这次考试最后一道题我不会。","py":"Mā, zhè cì kǎoshì zuìhòu yī dào tí wǒ bù huì.","ko":"엄마, 이번 시험 마지막 문제 못 풀었어."}],"c":[["题","題","제목 제"]],"why":"머리(頁)에 다는 것 → 제목"},{"id":1398,"w":"甜","p":"tián","k":"형","ko":"달다, 달콤하다","g":"o","ex":[{"zh":"{H}，这杯咖啡太甜了。","py":"{H}, zhè bēi kāfēi tài tián le.","ko":"{H}, 이 커피 너무 달아."},{"zh":"妈，你做的蛋糕不太甜，我很喜欢。","py":"Mā, nǐ zuò de dàngāo bù tài tián, wǒ hěn xǐhuan.","ko":"엄마가 만든 케이크 별로 안 달아서 좋아.","pat":"不太甜 = 별로 안 달다 (不太 + 형용사)"},{"zh":"马来西亚的饮料都太甜了。","py":"Mǎláixīyà de yǐnliào dōu tài tián le.","ko":"말레이시아 음료는 다 너무 달아."}],"c":[["甜","甜","달 첨"]],"why":"혀(舌)에 단(甘) 맛 → 달다"},{"id":1399,"w":"天气","p":"tiānqì","k":"명","ko":"날씨","g":"o","ex":[{"zh":"妈妈，韩国现在天气冷吗？","py":"Māma, Hánguó xiànzài tiānqì lěng ma?","ko":"엄마, 한국 지금 날씨 추워?"},{"zh":"{H}，今天天气真好，我们出去走走吧。","py":"{H}, jīntiān tiānqì zhēn hǎo, wǒmen chūqu zǒuzou ba.","ko":"{H}, 오늘 날씨 진짜 좋다, 나가서 좀 걷자.","pat":"天气真好 / 天气怎么样？ = 날씨 좋다 / 날씨 어때?"},{"zh":"老板，天气不好，客户的飞机晚了。","py":"Lǎobǎn, tiānqì bù hǎo, kèhù de fēijī wǎn le.","ko":"사장님, 날씨가 안 좋아서 고객 비행기가 늦어졌어요."}],"c":[["天","天","하늘 천"],["气","氣","기운 기"]],"why":"하늘(天)의 기운(氣) → 날씨"},{"id":1400,"w":"条","p":"tiáo","k":"양","ko":"줄기, 개 (길쭉한 것을 세는 단위)","g":"o","ex":[{"zh":"我给爸爸买了一条领带。","py":"Wǒ gěi bàba mǎi le yī tiáo lǐngdài.","ko":"아빠 드리려고 넥타이 하나 샀어."},{"zh":"{H}，这条裙子是我送你的生日礼物。","py":"{H}, zhè tiáo qúnzi shì wǒ sòng nǐ de shēngrì lǐwù.","ko":"{H}, 이 치마는 내가 주는 생일 선물이야.","pat":"一条 + 裙子/路/鱼/河 = 길고 가는 것을 세는 양사"},{"zh":"工厂后面有一条小河。","py":"Gōngchǎng hòumian yǒu yī tiáo xiǎo hé.","ko":"공장 뒤에 작은 강이 하나 있어."}],"c":[["条","條","가지 조"]],"why":"나무(木)의 가는 가지(條) → 가늘고 긴 것"},{"id":1401,"w":"跳舞","p":"tiàowǔ","k":"동","ko":"춤을 추다","g":"o","ex":[{"zh":"{H}很喜欢跳舞，可是我不会。","py":"{H} hěn xǐhuan tiàowǔ, kěshì wǒ bù huì.","ko":"{H}는 춤추는 걸 좋아하는데 난 못 춰."},{"zh":"妈妈每天晚上都去公园跳舞。","py":"Māma měi tiān wǎnshang dōu qù gōngyuán tiàowǔ.","ko":"엄마는 매일 저녁 공원에 춤추러 가셔.","pat":"去 + 장소 + 跳舞 = ~에 춤추러 가다"},{"zh":"公司聚会的时候，同事们都去跳舞了。","py":"Gōngsī jùhuì de shíhou, tóngshìmen dōu qù tiàowǔ le.","ko":"회사 모임 때 동료들이 다 춤추러 나갔어."}],"c":[["跳","跳","뛸 도"],["舞","舞","춤출 무"]],"why":"뛰며(跳) 춤춤(舞) → 춤추다"},{"id":1402,"w":"提高","p":"tígāo","k":"동","ko":"높이다, 향상시키다","g":"o","ex":[{"zh":"我们要想办法提高生产效率。","py":"Wǒmen yào xiǎng bànfǎ tígāo shēngchǎn xiàolǜ.","ko":"생산 효율을 높일 방법을 찾아야 해."},{"zh":"妈，我的中文水平提高了很多。","py":"Mā, wǒ de Zhōngwén shuǐpíng tígāo le hěn duō.","ko":"엄마, 내 중국어 실력 많이 늘었어.","pat":"提高 + 水平/质量 = 수준·품질을 높이다"},{"zh":"客户希望我们提高服务质量。","py":"Kèhù xīwàng wǒmen tígāo fúwù zhìliàng.","ko":"고객이 우리가 서비스 품질을 높여 주길 바라."}],"c":[["提","提","끌 제"],["高","高","높을 고"]],"why":"끌어(提) 높임(高) → 향상시키다"},{"id":1403,"w":"听","p":"tīng","k":"동","ko":"듣다","g":"o","ex":[{"zh":"我每天开车的时候听中文歌。","py":"Wǒ měi tiān kāichē de shíhou tīng Zhōngwén gē.","ko":"난 매일 운전할 때 중국 노래 들어."},{"zh":"{H}，你听我说，这不是你的错。","py":"{H}, nǐ tīng wǒ shuō, zhè bù shì nǐ de cuò.","ko":"{H}, 내 말 들어 봐, 이건 네 잘못 아니야.","pat":"你听我说 = 내 말 좀 들어 봐"},{"zh":"老板，您听一下，这台机器声音不对。","py":"Lǎobǎn, nín tīng yīxià, zhè tái jīqì shēngyīn bù duì.","ko":"사장님, 들어 보세요, 이 기계 소리가 이상해요."}],"c":[["听","聽","들을 청"]],"why":"귀(耳)로 들음(聽) → 듣다"},{"id":1404,"w":"体育","p":"tǐyù","k":"명","ko":"체육, 스포츠","g":"o","ex":[{"zh":"我上学的时候最喜欢体育课。","py":"Wǒ shàngxué de shíhou zuì xǐhuan tǐyù kè.","ko":"나 학교 다닐 때 체육 시간을 제일 좋아했어."},{"zh":"{H}，你喜欢看体育比赛吗？","py":"{H}, nǐ xǐhuan kàn tǐyù bǐsài ma?","ko":"{H}, 너 스포츠 경기 보는 거 좋아해?","pat":"体育比赛 / 体育课 = 스포츠 경기 / 체육 수업"},{"zh":"我妹妹以前是体育老师。","py":"Wǒ mèimei yǐqián shì tǐyù lǎoshī.","ko":"내 여동생은 예전에 체육 선생님이었어."}],"c":[["体","體","몸 체"],["育","育","기를 육"]],"why":"몸(體)을 기름(育) → 체육"},{"id":1405,"w":"同事","p":"tóngshì","k":"명","ko":"직장 동료","g":"o","ex":[{"zh":"同事们今天给我过生日了。","py":"Tóngshìmen jīntiān gěi wǒ guò shēngrì le.","ko":"오늘 동료들이 내 생일 챙겨 줬어."},{"zh":"妈，我同事都对我很好，你别担心。","py":"Mā, wǒ tóngshì dōu duì wǒ hěn hǎo, nǐ bié dānxīn.","ko":"엄마, 동료들이 다 나한테 잘해 주니까 걱정 마.","pat":"我(的)同事 = 내 동료"},{"zh":"{H}，我想带你见一下我的同事。","py":"{H}, wǒ xiǎng dài nǐ jiàn yīxià wǒ de tóngshì.","ko":"{H}, 너 데리고 가서 내 동료들 소개해 주고 싶어."}],"c":[["同","同","한가지 동"],["事","事","일 사"]],"why":"같은(同) 일(事)을 함 → 동료"},{"id":1406,"w":"同学","p":"tóngxué","k":"명","ko":"학교 친구, 동창","g":"o","ex":[{"zh":"我MBA的同学来自很多国家。","py":"Wǒ MBA de tóngxué láizì hěn duō guójiā.","ko":"내 MBA 동기들은 여러 나라에서 왔어."},{"zh":"妈，我高中同学下个月结婚。","py":"Mā, wǒ gāozhōng tóngxué xià ge yuè jiéhūn.","ko":"엄마, 내 고등학교 동창이 다음 달에 결혼해.","pat":"高中/大学 + 同学 = 고등학교/대학 동창"},{"zh":"{H}，你大学同学也在新加坡工作吗？","py":"{H}, nǐ dàxué tóngxué yě zài Xīnjiāpō gōngzuò ma?","ko":"{H}, 네 대학 동기들도 싱가포르에서 일해?"}],"c":[["同","同","한가지 동"],["学","學","배울 학"]],"why":"같이(同) 배움(學) → 동창"},{"id":1407,"w":"同意","p":"tóngyì","k":"동","ko":"동의하다, 찬성하다","g":"o","ex":[{"zh":"老板同意我下周请假了。","py":"Lǎobǎn tóngyì wǒ xià zhōu qǐngjià le.","ko":"사장님이 다음 주 휴가 허락해 주셨어."},{"zh":"客户同意了我们的新价格。","py":"Kèhù tóngyì le wǒmen de xīn jiàgé.","ko":"고객이 우리 새 가격에 동의했어.","pat":"同意 + 의견/가격 = ~에 동의하다"},{"zh":"妈，你同意我明年回韩国买房子吗？","py":"Mā, nǐ tóngyì wǒ míngnián huí Hánguó mǎi fángzi ma?","ko":"엄마, 나 내년에 한국 가서 집 사는 거 찬성해?"}],"c":[["同","同","한가지 동"],["意","意","뜻 의"]],"why":"같은(同) 뜻(意) → 동의하다"},{"id":1408,"w":"头发","p":"tóufa","k":"명","ko":"머리카락","g":"o","ex":[{"zh":"你剪头发了？很好看。","py":"Nǐ jiǎn tóufa le? Hěn hǎokàn.","ko":"머리 잘랐어? 예쁘다."},{"zh":"妈，你的头发怎么白了这么多？","py":"Mā, nǐ de tóufa zěnme bái le zhème duō?","ko":"엄마, 머리가 왜 이렇게 많이 셌어?","pat":"头发白了 = 머리가 셌다"},{"zh":"工厂里头发长的同事要戴帽子。","py":"Gōngchǎng li tóufa cháng de tóngshì yào dài màozi.","ko":"공장에서는 머리 긴 동료들이 모자를 써야 해."}],"c":[["头","頭","머리 두"],["发","髮","터럭 발"]],"why":"머리(頭)의 털(髮) → 머리카락"},{"id":1409,"w":"腿","p":"tuǐ","k":"명","ko":"다리","g":"o","ex":[{"zh":"昨天跑步跑多了，今天腿很疼。","py":"Zuótiān pǎobù pǎo duō le, jīntiān tuǐ hěn téng.","ko":"어제 너무 많이 뛰어서 오늘 다리가 아파."},{"zh":"{H}个子高，腿也很长。","py":"{H} gèzi gāo, tuǐ yě hěn cháng.","ko":"{H}는 키도 크고 다리도 길어.","pat":"腿很长 = 다리가 길다"},{"zh":"妈，你的腿好点儿了吗？","py":"Mā, nǐ de tuǐ hǎo diǎnr le ma?","ko":"엄마, 다리는 좀 나아졌어?"}],"c":[["腿","腿","넓적다리 퇴"]],"why":"몸(月=肉)+退(음) → 다리"},{"id":1410,"w":"突然","p":"tūrán","k":"부·형","ko":"갑자기, 갑작스럽다","g":"o","ex":[{"zh":"机器突然停了，快叫师傅来看看。","py":"Jīqì tūrán tíng le, kuài jiào shīfu lái kànkan.","ko":"기계가 갑자기 멈췄어, 빨리 기사님 불러서 봐 달라고 해."},{"zh":"{H}，你怎么突然来新山了？","py":"{H}, nǐ zěnme tūrán lái Xīnshān le?","ko":"{H}, 너 갑자기 조호르바루엔 웬일이야?","pat":"怎么突然 + 동사 = 왜 갑자기 ~해?"},{"zh":"妈，我突然很想吃你做的菜。","py":"Mā, wǒ tūrán hěn xiǎng chī nǐ zuò de cài.","ko":"엄마, 갑자기 엄마 요리가 너무 먹고 싶어."}],"c":[["突","突","갑자기 돌"],["然","然","그러할 연"]],"why":"갑자기(突) 그러함(然) → 돌연"},{"id":1411,"w":"图书馆","p":"túshūguǎn","k":"명","ko":"도서관","g":"o","ex":[{"zh":"周末我在大学图书馆写MBA作业。","py":"Zhōumò wǒ zài dàxué túshūguǎn xiě MBA zuòyè.","ko":"주말엔 대학 도서관에서 MBA 과제 해."},{"zh":"妹妹每天放学后都去图书馆。","py":"Mèimei měi tiān fàngxué hòu dōu qù túshūguǎn.","ko":"여동생은 매일 학교 끝나면 도서관에 가.","pat":"去图书馆 = 도서관에 가다"},{"zh":"{H}，新加坡的图书馆很漂亮，我们去看看吧。","py":"{H}, Xīnjiāpō de túshūguǎn hěn piàoliang, wǒmen qù kànkan ba.","ko":"{H}, 싱가포르 도서관 예쁘던데 한번 가 보자."}],"c":[["图","圖","그림 도"],["书","書","글 서"],["馆","館","집 관"]],"why":"그림(圖)·책(書)을 둔 집(館) → 도서관"},{"id":1412,"w":"外","p":"wài","k":"명","ko":"밖, 바깥, 외국의","g":"o","ex":[{"zh":"客户的车停在公司门外。","py":"Kèhù de chē tíng zài gōngsī mén wài.","ko":"고객 차가 회사 문 밖에 서 있어."},{"zh":"妈，国外的生活我已经习惯了。","py":"Mā, guówài de shēnghuó wǒ yǐjīng xíguàn le.","ko":"엄마, 외국 생활엔 이제 익숙해졌어.","pat":"国外 = 외국, 해외 (国 + 外)"},{"zh":"{H}，我在你家楼外等你。","py":"{H}, wǒ zài nǐ jiā lóu wài děng nǐ.","ko":"{H}, 너희 집 건물 밖에서 기다릴게."}],"c":[["外","外","바깥 외"]],"why":"바깥 외(外) → 밖"},{"id":1413,"w":"完","p":"wán","k":"동","ko":"끝나다, 다 쓰다","g":"o","ex":[{"zh":"打印纸用完了，你再去买点儿吧。","py":"Dǎyìnzhǐ yòng wán le, nǐ zài qù mǎi diǎnr ba.","ko":"프린터 용지 다 떨어졌어, 가서 좀 더 사 와."},{"zh":"老板，这份报告我已经写完了。","py":"Lǎobǎn, zhè fèn bàogào wǒ yǐjīng xiě wán le.","ko":"사장님, 이 보고서 다 썼어요.","pat":"동사 + 完 = 다 ~하다 (写完·吃完·用完)"},{"zh":"{H}，你吃完饭我们去散步吧。","py":"{H}, nǐ chī wán fàn wǒmen qù sànbù ba.","ko":"{H}, 밥 다 먹으면 우리 산책 가자."}],"c":[["完","完","완전할 완"]],"why":"집(宀)이 갖춰짐 → 다 마치다"},{"id":1414,"w":"玩","p":"wán","k":"동","ko":"놀다, 장난하다","g":"o","ex":[{"zh":"我们周末去圣淘沙玩吧。","py":"Wǒmen zhōumò qù Shèngtáoshā wán ba.","ko":"우리 주말에 센토사 가서 놀자."},{"zh":"妈，你和爸爸来新山玩几天吧。","py":"Mā, nǐ hé bàba lái Xīnshān wán jǐ tiān ba.","ko":"엄마, 아빠랑 조호르바루에 며칠 놀러 와.","pat":"来/去 + 장소 + 玩 = ~에 놀러 오다/가다"},{"zh":"周末同事们一起去海边玩了。","py":"Zhōumò tóngshìmen yīqǐ qù hǎibiān wán le.","ko":"주말에 동료들이랑 바닷가에 놀러 갔어."}],"c":[["玩","玩","희롱할 완"]],"why":"구슬(王=玉)을 가지고 놂 → 놀다"},{"id":1415,"w":"万","p":"wàn","k":"수","ko":"만, 10000","g":"o","ex":[{"zh":"这台新机器要二十万。","py":"Zhè tái xīn jīqì yào èrshí wàn.","ko":"이 새 기계는 20만이나 해."},{"zh":"妈，我已经存了十万块，准备买房子。","py":"Mā, wǒ yǐjīng cún le shí wàn kuài, zhǔnbèi mǎi fángzi.","ko":"엄마, 벌써 10만 모았어, 집 살 준비하고 있어.","pat":"숫자 + 万 + 块 = ~만 (10만 = 十万)"},{"zh":"工厂一个月的电费要两万多。","py":"Gōngchǎng yī gè yuè de diànfèi yào liǎng wàn duō.","ko":"공장 한 달 전기료가 2만이 넘어."}],"c":[["万","萬","일만 만"]],"why":"일만 만(萬) → 10000"},{"id":1416,"w":"碗","p":"wǎn","k":"양·명","ko":"그릇, 공기 (그릇에 담긴 것을 세는 단위)","g":"o","ex":[{"zh":"我来洗碗，你休息吧。","py":"Wǒ lái xǐ wǎn, nǐ xiūxi ba.","ko":"설거지는 내가 할게, 너는 쉬어."},{"zh":"这家店的面条一碗只要八块。","py":"Zhè jiā diàn de miàntiáo yī wǎn zhǐ yào bā kuài.","ko":"이 가게 국수는 한 그릇에 8링깃밖에 안 해.","pat":"一碗 + 음식 = ~ 한 그릇"},{"zh":"妈，我想喝一大碗你做的汤。","py":"Mā, wǒ xiǎng hē yī dà wǎn nǐ zuò de tāng.","ko":"엄마, 엄마가 끓인 국 한 사발 먹고 싶어."}],"c":[["碗","碗","주발 완"]],"why":"돌(石)로 된 주발(碗) → 그릇"},{"id":1417,"w":"完成","p":"wánchéng","k":"동","ko":"완성하다, 끝내다","g":"o","ex":[{"zh":"这个项目下个月能完成吗？","py":"Zhège xiàngmù xià gè yuè néng wánchéng ma?","ko":"이 프로젝트 다음 달에 끝낼 수 있어?"},{"zh":"妈，我的MBA作业终于完成了。","py":"Mā, wǒ de MBA zuòyè zhōngyú wánchéng le.","ko":"엄마, MBA 과제 드디어 끝냈어.","pat":"完成 + 作业/任务/工作 = 과제·일을 끝내다"},{"zh":"{H}，你的工作什么时候能完成？","py":"{H}, nǐ de gōngzuò shénme shíhou néng wánchéng?","ko":"{H}, 네 일 언제쯤 끝나?"}],"c":[["完","完","완전할 완"],["成","成","이룰 성"]],"why":"완전히(完) 이룸(成) → 완성하다"},{"id":1418,"w":"往","p":"wǎng","k":"개","ko":"~쪽으로, ~을 향해","g":"o","ex":[{"zh":"往前走五分钟就到工厂了。","py":"Wǎng qián zǒu wǔ fēnzhōng jiù dào gōngchǎng le.","ko":"앞으로 5분만 걸어가시면 공장이에요."},{"zh":"{H}，往左走就是地铁站。","py":"{H}, wǎng zuǒ zǒu jiù shì dìtiě zhàn.","ko":"{H}, 왼쪽으로 가면 바로 지하철역이야.","pat":"往 + 左/右/前 + 走 = ~쪽으로 가다"},{"zh":"妈，出了机场往前走，我在门口等你。","py":"Mā, chū le jīchǎng wǎng qián zǒu, wǒ zài ménkǒu děng nǐ.","ko":"엄마, 공항 나와서 앞으로 쭉 오면 입구에서 기다릴게."}],"c":[["往","往","갈 왕"]],"why":"걸어(彳) 감 → …로 향하다"},{"id":1419,"w":"忘记","p":"wàngjì","k":"동","ko":"잊어버리다","g":"o","ex":[{"zh":"别忘记明天是我们的纪念日。","py":"Bié wàngjì míngtiān shì wǒmen de jìniànrì.","ko":"내일 우리 기념일인 거 잊지 마."},{"zh":"老板，我忘记把文件带来了。","py":"Lǎobǎn, wǒ wàngjì bǎ wénjiàn dài lái le.","ko":"사장님, 서류 가져오는 걸 깜빡했어요.","pat":"忘记 + 把 + 물건 + 带来 = ~를 가져오는 걸 깜빡하다"},{"zh":"妈，你别忘记按时吃药。","py":"Mā, nǐ bié wàngjì ànshí chī yào.","ko":"엄마, 약 제때 먹는 거 잊지 마."}],"c":[["忘","忘","잊을 망"],["记","記","기록할 기"]],"why":"기억(記)을 잊음(忘) → 잊어버리다"},{"id":1420,"w":"晚上","p":"wǎnshang","k":"명","ko":"저녁, 밤","g":"o","ex":[{"zh":"晚上我给你打视频电话。","py":"Wǎnshang wǒ gěi nǐ dǎ shìpín diànhuà.","ko":"저녁에 영상통화할게."},{"zh":"老板，今天晚上要加班吗？","py":"Lǎobǎn, jīntiān wǎnshang yào jiābān ma?","ko":"사장님, 오늘 저녁에 야근해야 해요?","pat":"今天晚上 / 明天晚上 = 오늘 저녁 / 내일 저녁"},{"zh":"妈，晚上一个人出门要小心。","py":"Mā, wǎnshang yī gè rén chūmén yào xiǎoxīn.","ko":"엄마, 저녁에 혼자 나갈 땐 조심해."}],"c":[["晚","晚","늦을 만"],["上","上","윗 상"]],"why":"늦은(晚) 때 → 저녁"},{"id":1421,"w":"喂","p":"wéi","k":"감","ko":"여보세요, 이봐","g":"o","ex":[{"zh":"喂，妈，你听得到吗？","py":"Wéi, mā, nǐ tīng de dào ma?","ko":"여보세요, 엄마, 내 말 들려?"},{"zh":"喂，您好，请问是王经理吗？","py":"Wéi, nín hǎo, qǐngwèn shì Wáng jīnglǐ ma?","ko":"여보세요, 안녕하세요, 왕 매니저님이세요?","pat":"喂，您好，请问是…吗？ = 여보세요, ~이세요? (전화 첫마디)"},{"zh":"喂，{H}，你到哪儿了？","py":"Wéi, {H}, nǐ dào nǎr le?","ko":"여보세요, {H}, 어디쯤이야?"}],"c":[["喂","喂","(부르는 소리) 위"]],"why":"입(口)으로 부르는 소리 → 여보세요"},{"id":1422,"w":"位","p":"wèi","k":"양","ko":"분 (사람을 높여 세는 단위)","g":"o","ex":[{"zh":"这两位是从新加坡来的客户。","py":"Zhè liǎng wèi shì cóng Xīnjiāpō lái de kèhù.","ko":"이 두 분은 싱가포르에서 오신 고객이야."},{"zh":"妈，这位是{H}的妈妈。","py":"Mā, zhè wèi shì {H} de māma.","ko":"엄마, 이분이 {H} 어머니셔.","pat":"这位是 + 사람 = 이분은 ~야 (소개)"},{"zh":"老板，那位客户已经等了半个小时了。","py":"Lǎobǎn, nà wèi kèhù yǐjīng děng le bàn gè xiǎoshí le.","ko":"사장님, 그 고객분 벌써 30분째 기다리고 계세요."}],"c":[["位","位","자리 위"]],"why":"사람(亻)이 서는(立) 자리 → ~분"},{"id":1423,"w":"为了","p":"wèile","k":"개","ko":"~을 위해서","g":"o","ex":[{"zh":"为了见{H}，我每个周末都去新加坡。","py":"Wèile jiàn {H}, wǒ měi gè zhōumò dōu qù Xīnjiāpō.","ko":"{H} 보려고 난 주말마다 싱가포르 가."},{"zh":"为了这个项目，同事们每天都加班。","py":"Wèile zhège xiàngmù, tóngshìmen měi tiān dōu jiābān.","ko":"이 프로젝트 때문에 동료들이 매일 야근해.","pat":"为了 + 목적, 주어 + 동사 = ~하기 위해 ~하다"},{"zh":"妈，为了早点儿回家，我会努力存钱。","py":"Mā, wèile zǎo diǎnr huí jiā, wǒ huì nǔlì cún qián.","ko":"엄마, 빨리 집에 가려고 열심히 돈 모을게."}],"c":[["为","爲","할 위"],["了","了","마칠 료"]],"why":"~을 위하여(爲)+了 → …하기 위해"},{"id":1424,"w":"为什么","p":"wèishénme","k":"대","ko":"왜, 어째서","g":"o","ex":[{"zh":"妈问我为什么还不回韩国。","py":"Mā wèn wǒ wèishénme hái bù huí Hánguó.","ko":"엄마가 왜 아직 한국에 안 들어오냐고 물어보셔."},{"zh":"{H}，你为什么不高兴？","py":"{H}, nǐ wèishénme bù gāoxìng?","ko":"{H}, 너 왜 기분 안 좋아?","pat":"为什么不 + 동사/형용사 = 왜 안 ~해?"},{"zh":"老板，这批货为什么还没到？","py":"Lǎobǎn, zhè pī huò wèishénme hái méi dào?","ko":"사장님, 이번 물건은 왜 아직 안 왔죠?"}],"c":[["为","爲","할 위"],["什","什","열 사람 십"],["么","麼","작을 마"]],"why":"무엇(什麼)을 위해(爲) → 왜"},{"id":1425,"w":"问","p":"wèn","k":"동","ko":"묻다, 질문하다","g":"o","ex":[{"zh":"我去问一下老板。","py":"Wǒ qù wèn yīxià lǎobǎn.","ko":"내가 사장님한테 물어보고 올게."},{"zh":"{H}，我妈问你什么时候来韩国。","py":"{H}, wǒ mā wèn nǐ shénme shíhou lái Hánguó.","ko":"{H}, 우리 엄마가 너 언제 한국 오냐고 물어봐.","pat":"问 + 사람 + 질문 = ~에게 ~를 묻다"},{"zh":"有不懂的地方，你随时问我。","py":"Yǒu bù dǒng de dìfang, nǐ suíshí wèn wǒ.","ko":"모르는 거 있으면 언제든 나한테 물어봐."}],"c":[["问","問","물을 문"]],"why":"문(門) 앞에서 입(口)으로 → 묻다"},{"id":1426,"w":"文化","p":"wénhuà","k":"명","ko":"문화","g":"o","ex":[{"zh":"{H}常常给我讲中国文化。","py":"{H} chángcháng gěi wǒ jiǎng Zhōngguó wénhuà.","ko":"{H}가 나한테 중국 문화 얘기를 자주 해 줘."},{"zh":"妈，我想多了解中国文化。","py":"Mā, wǒ xiǎng duō liǎojiě Zhōngguó wénhuà.","ko":"엄마, 나 중국 문화를 더 알고 싶어.","pat":"了解 + 中国文化 = 중국 문화를 이해하다"},{"zh":"同事给我介绍了很多马来西亚文化。","py":"Tóngshì gěi wǒ jièshào le hěn duō Mǎláixīyà wénhuà.","ko":"동료가 말레이시아 문화를 많이 소개해 줬어."}],"c":[["文","文","글월 문"],["化","化","될 화"]],"why":"글(文)로 교화됨(化) → 문화"},{"id":1427,"w":"问题","p":"wèntí","k":"명","ko":"문제, 질문","g":"o","ex":[{"zh":"有什么问题，您随时联系我。","py":"Yǒu shénme wèntí, nín suíshí liánxì wǒ.","ko":"문제 있으시면 언제든 연락 주세요."},{"zh":"{H}，没问题，周六我去接你。","py":"{H}, méi wèntí, zhōuliù wǒ qù jiē nǐ.","ko":"{H}, 문제없어, 토요일에 데리러 갈게.","pat":"没问题 = 문제없어, 좋아"},{"zh":"妈，我想问你一个问题。","py":"Mā, wǒ xiǎng wèn nǐ yī gè wèntí.","ko":"엄마, 나 하나 물어볼 게 있어."}],"c":[["问","問","물을 문"],["题","題","제목 제"]],"why":"물어보는(問) 제목(題) → 문제"},{"id":1428,"w":"我","p":"wǒ","k":"대","ko":"나, 저","g":"o","ex":[{"zh":"我来帮你搬东西。","py":"Wǒ lái bāng nǐ bān dōngxi.","ko":"짐 옮기는 거 내가 도와줄게."},{"zh":"老板，这件事交给我吧。","py":"Lǎobǎn, zhè jiàn shì jiāo gěi wǒ ba.","ko":"사장님, 이 일은 저한테 맡겨 주세요.","pat":"交给我 = 나한테 맡겨"},{"zh":"妈，我很好，你别担心。","py":"Mā, wǒ hěn hǎo, nǐ bié dānxīn.","ko":"엄마, 나 잘 지내, 걱정하지 마."}],"c":[["我","我","나 아"]],"why":"나 아(我) → 나"},{"id":1429,"w":"我们","p":"wǒmen","k":"대","ko":"우리","g":"o","ex":[{"zh":"我们下次一起去韩国吧。","py":"Wǒmen xià cì yīqǐ qù Hánguó ba.","ko":"우리 다음엔 같이 한국 가자."},{"zh":"妈，我们一家人很久没一起吃饭了。","py":"Mā, wǒmen yī jiā rén hěn jiǔ méi yīqǐ chīfàn le.","ko":"엄마, 우리 가족 같이 밥 먹은 지 진짜 오래됐다.","pat":"我们一家人 = 우리 가족"},{"zh":"老板，我们今天的任务都完成了。","py":"Lǎobǎn, wǒmen jīntiān de rènwu dōu wánchéng le.","ko":"사장님, 저희 오늘 할 일 다 끝냈어요."}],"c":[["我","我","나 아"],["们","們","무리 문"]],"why":"나(我)의 무리(們) → 우리"},{"id":1430,"w":"五","p":"wǔ","k":"수","ko":"다섯, 5","g":"o","ex":[{"zh":"我们五点半在地铁站见。","py":"Wǒmen wǔ diǎn bàn zài dìtiězhàn jiàn.","ko":"우리 다섯 시 반에 지하철역에서 보자."},{"zh":"{H}，五分钟后我到你家楼下。","py":"{H}, wǔ fēnzhōng hòu wǒ dào nǐ jiā lóu xià.","ko":"{H}, 5분 뒤에 너희 집 앞에 도착해.","pat":"五分钟后 = 5분 뒤"},{"zh":"妈，我们公司一共五十个人。","py":"Mā, wǒmen gōngsī yīgòng wǔshí gè rén.","ko":"엄마, 우리 회사는 전부 50명이야."}],"c":[["五","五","다섯 오"]],"why":"다섯 오(五)"},{"id":1431,"w":"洗","p":"xǐ","k":"동","ko":"씻다, 빨래하다","g":"o","ex":[{"zh":"工作服要每天洗。","py":"Gōngzuòfú yào měi tiān xǐ.","ko":"작업복은 매일 빨아야 해."},{"zh":"{H}，你先去洗手，饭马上好。","py":"{H}, nǐ xiān qù xǐ shǒu, fàn mǎshàng hǎo.","ko":"{H}, 먼저 손 씻고 와, 밥 금방 돼.","pat":"洗手 / 洗衣服 = 손을 씻다 / 빨래하다"},{"zh":"妈，衣服我自己洗，你别管了。","py":"Mā, yīfu wǒ zìjǐ xǐ, nǐ bié guǎn le.","ko":"엄마, 옷은 내가 빨게, 신경 쓰지 마."}],"c":[["洗","洗","씻을 세"]],"why":"물(氵)로 씻음 → 씻다"},{"id":1432,"w":"西","p":"xī","k":"명","ko":"서쪽","g":"o","ex":[{"zh":"我们工厂在新山的西边。","py":"Wǒmen gōngchǎng zài Xīnshān de xībian.","ko":"우리 공장은 조호바루 서쪽에 있어."},{"zh":"{H}，太阳从西边下山了，真漂亮。","py":"{H}, tàiyáng cóng xībian xià shān le, zhēn piàoliang.","ko":"{H}, 해가 서쪽으로 지고 있어, 진짜 예쁘다.","pat":"太阳从西边下山 = 해가 서쪽으로 지다"},{"zh":"老板，客户的新工厂在城市西边。","py":"Lǎobǎn, kèhù de xīn gōngchǎng zài chéngshì xībian.","ko":"사장님, 고객사 새 공장은 시내 서쪽에 있어요."}],"c":[["西","西","서녘 서"]],"why":"서녘 서(西) → 서쪽"},{"id":1433,"w":"下","p":"xià","k":"명·동","ko":"아래, 다음, 내리다","g":"o","ex":[{"zh":"你的文件在桌子下面。","py":"Nǐ de wénjiàn zài zhuōzi xiàmian.","ko":"네 서류 책상 밑에 있어."},{"zh":"{H}，我们在楼下的咖啡店见吧。","py":"{H}, wǒmen zài lóu xià de kāfēi diàn jiàn ba.","ko":"{H}, 우리 건물 아래 카페에서 보자.","pat":"楼下 / 楼上 = 건물 아래 / 위층"},{"zh":"妈，你的眼镜在沙发下面。","py":"Mā, nǐ de yǎnjìng zài shāfā xiàmian.","ko":"엄마, 안경 소파 밑에 있어."}],"c":[["下","下","아래 하"]],"why":"기준선 아래(下)를 가리킴"},{"id":1434,"w":"先","p":"xiān","k":"부","ko":"먼저, 우선","g":"o","ex":[{"zh":"你先吃吧，我还要开会。","py":"Nǐ xiān chī ba, wǒ hái yào kāihuì.","ko":"먼저 먹어, 나 아직 회의 있어."},{"zh":"我们先吃饭，再谈工作的事情。","py":"Wǒmen xiān chīfàn, zài tán gōngzuò de shìqing.","ko":"우리 먼저 밥 먹고 나서 일 얘기하자.","pat":"先 A，再 B = 먼저 A하고 나서 B하다"},{"zh":"老板，我先把这些材料送给客户。","py":"Lǎobǎn, wǒ xiān bǎ zhèxiē cáiliào sòng gěi kèhù.","ko":"사장님, 제가 먼저 이 자료들을 고객한테 갖다줄게요."}],"c":[["先","先","먼저 선"]],"why":"먼저 선(先) → 처음"},{"id":1435,"w":"向","p":"xiàng","k":"개","ko":"~을 향해, ~에게","g":"o","ex":[{"zh":"我代表公司向您表示感谢。","py":"Wǒ dàibiǎo gōngsī xiàng nín biǎoshì gǎnxiè.","ko":"회사를 대표해서 감사 말씀 드립니다."},{"zh":"妈，你帮我向奶奶问好。","py":"Mā, nǐ bāng wǒ xiàng nǎinai wènhǎo.","ko":"엄마, 할머니께 안부 좀 전해 줘.","pat":"向 + 사람 + 问好 = ~에게 안부를 전하다"},{"zh":"{H}，我们向左走还是向右走？","py":"{H}, wǒmen xiàng zuǒ zǒu háishi xiàng yòu zǒu?","ko":"{H}, 우리 왼쪽으로 가, 오른쪽으로 가?"}],"c":[["向","向","향할 향"]],"why":"향할 향(向) → …를 향하여"},{"id":1436,"w":"想","p":"xiǎng","k":"동·조동","ko":"생각하다, ~하고 싶다, 그리워하다","g":"o","ex":[{"zh":"让我想一想再回答您。","py":"Ràng wǒ xiǎng yī xiǎng zài huídá nín.","ko":"잠깐 생각해 보고 답변드릴게요."},{"zh":"妈，我想好了，明年回韩国。","py":"Mā, wǒ xiǎng hǎo le, míngnián huí Hánguó.","ko":"엄마, 나 생각 정리했어, 내년에 한국 갈 거야.","pat":"想好了 = 생각 다 했어/마음 정했어"},{"zh":"老板，我想了很久，还是觉得这个价格太低。","py":"Lǎobǎn, wǒ xiǎng le hěn jiǔ, háishi juéde zhège jiàgé tài dī.","ko":"사장님, 오래 생각해 봤는데 역시 이 가격은 너무 낮은 것 같아요."}],"c":[["想","想","생각 상"]],"why":"모습(相)을 마음(心)에 그림 → 생각하다"},{"id":1437,"w":"香蕉","p":"xiāngjiāo","k":"명","ko":"바나나","g":"o","ex":[{"zh":"马来西亚的香蕉又小又甜。","py":"Mǎláixīyà de xiāngjiāo yòu xiǎo yòu tián.","ko":"말레이시아 바나나는 작고 달아."},{"zh":"{H}，你早上吃一根香蕉吧。","py":"{H}, nǐ zǎoshang chī yī gēn xiāngjiāo ba.","ko":"{H}, 아침에 바나나 하나 먹어.","pat":"一根香蕉 = 바나나 한 개 (根 양사)"},{"zh":"妈，这边的香蕉一年四季都有。","py":"Mā, zhèbiān de xiāngjiāo yī nián sìjì dōu yǒu.","ko":"엄마, 여긴 바나나가 일 년 내내 있어."}],"c":[["香","香","향기 향"],["蕉","蕉","파초 초"]],"why":"향기로운(香) 파초(蕉) 열매 → 바나나"},{"id":1438,"w":"相信","p":"xiāngxìn","k":"동","ko":"믿다, 신뢰하다","g":"o","ex":[{"zh":"我相信你这次面试一定能过。","py":"Wǒ xiāngxìn nǐ zhè cì miànshì yīdìng néng guò.","ko":"오빠 이번 면접 꼭 붙을 거라고 믿어."},{"zh":"老板，相信我，这次不会有问题。","py":"Lǎobǎn, xiāngxìn wǒ, zhè cì bù huì yǒu wèntí.","ko":"사장님, 저 믿으세요, 이번엔 문제없을 거예요.","pat":"相信我 = 날 믿어"},{"zh":"妈，我相信爸爸的病很快会好的。","py":"Mā, wǒ xiāngxìn bàba de bìng hěn kuài huì hǎo de.","ko":"엄마, 아빠 병 금방 나으실 거라고 믿어."}],"c":[["相","相","서로 상"],["信","信","믿을 신"]],"why":"서로(相) 믿음(信) → 믿다"},{"id":1439,"w":"先生","p":"xiānsheng","k":"명","ko":"~씨, 선생님, 남편","g":"o","ex":[{"zh":"陈先生，这是我们的报价。","py":"Chén xiānsheng, zhè shì wǒmen de bàojià.","ko":"천 선생님, 이게 저희 견적입니다."},{"zh":"李先生，欢迎您下次再来新山。","py":"Lǐ xiānsheng, huānyíng nín xià cì zài lái Xīnshān.","ko":"리 선생님, 다음에 또 조호르바루에 오세요.","pat":"성 + 先生 = ~ 선생님/씨 (남성 존칭)"},{"zh":"妈，那位先生是爸爸的老朋友吗？","py":"Mā, nà wèi xiānsheng shì bàba de lǎo péngyou ma?","ko":"엄마, 저분 아빠 오랜 친구셔?"}],"c":[["先","先","먼저 선"],["生","生","날 생"]],"why":"먼저(先) 태어난(生) 분 → 선생, 씨"},{"id":1440,"w":"现在","p":"xiànzài","k":"명","ko":"지금, 현재","g":"o","ex":[{"zh":"妈，我现在去机场接你。","py":"Mā, wǒ xiànzài qù jīchǎng jiē nǐ.","ko":"엄마, 나 지금 공항으로 데리러 갈게."},{"zh":"{H}，你现在在哪儿？","py":"{H}, nǐ xiànzài zài nǎr?","ko":"{H}, 너 지금 어디야?","pat":"现在在哪儿？ = 지금 어디야?"},{"zh":"老板，客户现在就在楼下。","py":"Lǎobǎn, kèhù xiànzài jiù zài lóu xià.","ko":"사장님, 고객분 지금 아래층에 와 계세요."}],"c":[["现","現","나타날 현"],["在","在","있을 재"]],"why":"나타나(現) 있음(在) → 현재"},{"id":1441,"w":"笑","p":"xiào","k":"동","ko":"웃다, 비웃다","g":"o","ex":[{"zh":"你笑起来真好看。","py":"Nǐ xiào qǐlai zhēn hǎokàn.","ko":"너 웃으면 진짜 예뻐."},{"zh":"妈，你笑什么呀？","py":"Mā, nǐ xiào shénme ya?","ko":"엄마, 왜 웃어?","pat":"笑什么 = 뭘 웃어/왜 웃어"},{"zh":"老板今天一直在笑，好像有好事。","py":"Lǎobǎn jīntiān yīzhí zài xiào, hǎoxiàng yǒu hǎo shì.","ko":"사장님이 오늘 계속 웃으시네, 좋은 일 있나 봐."}],"c":[["笑","笑","웃음 소"]],"why":"대나무(竹)가 휘듯 웃음 → 웃다"},{"id":1442,"w":"小","p":"xiǎo","k":"형","ko":"작다, 어리다","g":"o","ex":[{"zh":"这个房间太小了，放不下机器。","py":"Zhège fángjiān tài xiǎo le, fàng bù xià jīqì.","ko":"이 방은 너무 작아서 기계가 안 들어가."},{"zh":"{H}，你的店虽然小，但是很漂亮。","py":"{H}, nǐ de diàn suīrán xiǎo, dànshì hěn piàoliang.","ko":"{H}, 네 가게 작긴 해도 엄청 예뻐.","pat":"A 虽然小，但是… = 작긴 해도 ~"},{"zh":"我小的时候很喜欢吃妈妈做的饭。","py":"Wǒ xiǎo de shíhou hěn xǐhuan chī māma zuò de fàn.","ko":"나 어렸을 때 엄마가 해 준 밥 정말 좋아했어."}],"c":[["小","小","작을 소"]],"why":"작을 소(小)"},{"id":1443,"w":"小时","p":"xiǎoshí","k":"명","ko":"시간 (60분)","g":"o","ex":[{"zh":"从新山到新加坡要一个小时。","py":"Cóng Xīnshān dào Xīnjiāpō yào yī gè xiǎoshí.","ko":"조호바루에서 싱가포르까지 한 시간 걸려."},{"zh":"妈，从首尔到新加坡要六个多小时。","py":"Mā, cóng Shǒu'ěr dào Xīnjiāpō yào liù gè duō xiǎoshí.","ko":"엄마, 서울에서 싱가포르까지 여섯 시간 넘게 걸려.","pat":"숫자 + 个多小时 = ~시간 넘게"},{"zh":"老板，这台机器每天要工作二十个小时。","py":"Lǎobǎn, zhè tái jīqì měi tiān yào gōngzuò èrshí gè xiǎoshí.","ko":"사장님, 이 기계는 하루 20시간 돌아가야 해요."}],"c":[["小","小","작을 소"],["时","時","때 시"]],"why":"작은(小) 시간 단위(時) → 1시간"},{"id":1444,"w":"小心","p":"xiǎoxīn","k":"동·형","ko":"조심하다, 주의하다","g":"o","ex":[{"zh":"地上有水，小心别滑倒。","py":"Dì shang yǒu shuǐ, xiǎoxīn bié huádǎo.","ko":"바닥에 물 있어, 미끄러지지 않게 조심해."},{"zh":"妈，下雪了，走路小心点儿。","py":"Mā, xià xuě le, zǒulù xiǎoxīn diǎnr.","ko":"엄마, 눈 오니까 걸을 때 조심해.","pat":"小心点儿 / 要小心 = 조심해"},{"zh":"{H}，过马路的时候要小心。","py":"{H}, guò mǎlù de shíhou yào xiǎoxīn.","ko":"{H}, 길 건널 때 조심해."}],"c":[["小","小","작을 소"],["心","心","마음 심"]],"why":"마음(心)을 작게(小) 씀 → 조심하다"},{"id":1445,"w":"校长","p":"xiàozhǎng","k":"명","ko":"교장, 총장","g":"o","ex":[{"zh":"我们学院的校长下周来讲课。","py":"Wǒmen xuéyuàn de xiàozhǎng xià zhōu lái jiǎngkè.","ko":"우리 학장님이 다음 주에 강의하러 오셔."},{"zh":"我妹妹的学校换了新校长。","py":"Wǒ mèimei de xuéxiào huàn le xīn xiàozhǎng.","ko":"여동생 학교에 교장 선생님이 새로 오셨어.","pat":"换了新校长 = 교장이 새로 바뀌었다"},{"zh":"{H}，你们学校的校长是男的还是女的？","py":"{H}, nǐmen xuéxiào de xiàozhǎng shì nán de háishi nǚ de?","ko":"{H}, 너희 학교 교장 선생님은 남자였어, 여자였어?"}],"c":[["校","校","학교 교"],["长","長","어른 장"]],"why":"학교(校)의 우두머리(長) → 교장"},{"id":1446,"w":"下午","p":"xiàwǔ","k":"명","ko":"오후","g":"o","ex":[{"zh":"下午三点我要去见客户。","py":"Xiàwǔ sān diǎn wǒ yào qù jiàn kèhù.","ko":"오후 세 시에 고객 만나러 가야 해."},{"zh":"{H}，周日下午我们去看电影吧。","py":"{H}, zhōurì xiàwǔ wǒmen qù kàn diànyǐng ba.","ko":"{H}, 일요일 오후에 영화 보러 가자.","pat":"요일 + 下午 = ~요일 오후"},{"zh":"妈，下午我给你打电话。","py":"Mā, xiàwǔ wǒ gěi nǐ dǎ diànhuà.","ko":"엄마, 오후에 전화할게."}],"c":[["下","下","아래 하"],["午","午","낮 오"]],"why":"정오(午)의 뒤(下) → 오후"},{"id":1447,"w":"下雨","p":"xiàyǔ","k":"동","ko":"비가 오다","g":"o","ex":[{"zh":"下雨了，我开车去接你。","py":"Xiàyǔ le, wǒ kāichē qù jiē nǐ.","ko":"비 온다, 내가 차로 데리러 갈게."},{"zh":"妈，首尔明天下雨，出门带伞。","py":"Mā, Shǒu'ěr míngtiān xiàyǔ, chūmén dài sǎn.","ko":"엄마, 서울 내일 비 온대, 나갈 때 우산 챙겨.","pat":"明天下雨 = 내일 비가 온다 (예보)"},{"zh":"下雨了，客户的货今天送不了了。","py":"Xiàyǔ le, kèhù de huò jīntiān sòng bu liǎo le.","ko":"비가 와서 고객 물건 오늘 배송 못 하겠어."}],"c":[["下","下","아래 하"],["雨","雨","비 우"]],"why":"비(雨)가 내림(下) → 비 오다"},{"id":1448,"w":"写","p":"xiě","k":"동","ko":"쓰다, 글을 쓰다","g":"o","ex":[{"zh":"这封邮件你帮我用中文写一下。","py":"Zhè fēng yóujiàn nǐ bāng wǒ yòng Zhōngwén xiě yīxià.","ko":"이 메일 중국어로 좀 써 줘."},{"zh":"妈，我给你写了一封信。","py":"Mā, wǒ gěi nǐ xiě le yī fēng xìn.","ko":"엄마, 엄마한테 편지 한 통 썼어.","pat":"写 + 一封信 = 편지를 한 통 쓰다"},{"zh":"{H}，你帮我写一下你的地址。","py":"{H}, nǐ bāng wǒ xiě yīxià nǐ de dìzhǐ.","ko":"{H}, 네 주소 좀 적어 줘."}],"c":[["写","寫","베낄 사"]],"why":"베껴 씀(寫) → 글씨를 쓰 ì shuō xīnwén shuō míngtiān huì xià dà yǔ.","ko":"동료가 그러는데 뉴스에서 내일 비 많이 온대."}],"c":[["新","新","새 신"],["闻","聞","들을 문"]],"why":"새로(新) 들은(聞) 소식 → 뉴스"},{"id":1458,"w":"新鲜","p":"xīnxiān","k":"형","ko":"신선하다, 싱싱하다","g":"o","ex":[{"zh":"这家店的水果很新鲜。","py":"Zhè jiā diàn de shuǐguǒ hěn xīnxiān.","ko":"이 가게 과일 엄청 싱싱해."},{"zh":"{H}，早上的空气特别新鲜。","py":"{H}, zǎoshang de kōngqì tèbié xīnxiān.","ko":"{H}, 아침 공기 진짜 상쾌하다.","pat":"空气新鲜 = 공기가 상쾌하다"},{"zh":"妈，这边的鱼都很新鲜。","py":"Mā, zhèbiān de yú dōu hěn xīnxiān.","ko":"엄마, 여기 생선은 다 신선해."}],"c":[["新","新","새 신"],["鲜","鮮","고울 선"]],"why":"새롭고(新) 고움(鮮) → 신선하다"},{"id":1459,"w":"信用卡","p":"xìnyòngkǎ","k":"명","ko":"신용카드","g":"o","ex":[{"zh":"我能用信用卡付钱吗？","py":"Wǒ néng yòng xìnyòngkǎ fù qián ma?","ko":"신용카드로 계산해도 돼요?"},{"zh":"这张信用卡是我上个月刚办的。","py":"Zhè zhāng xìnyòngkǎ shì wǒ shàng ge yuè gāng bàn de.","ko":"이 신용카드는 지난달에 막 만든 거야.","pat":"办信用卡 / 一张信用卡 = 신용카드를 만들다 / 카드 한 장"},{"zh":"妈，我的信用卡找不到了。","py":"Mā, wǒ de xìnyòngkǎ zhǎo bu dào le.","ko":"엄마, 내 신용카드가 안 보여."}],"c":[["信","信","믿을 신"],["用","用","쓸 용"],["卡","卡","음역자 가"]],"why":"신용(信用)+카드(卡) → 신용카드"},{"id":1460,"w":"洗手间","p":"xǐshǒujiān","k":"명","ko":"화장실","g":"o","ex":[{"zh":"洗手间在二楼左边。","py":"Xǐshǒujiān zài èr lóu zuǒbian.","ko":"화장실은 2층 왼쪽에 있어요."},{"zh":"{H}，你等我一下，我去个洗手间。","py":"{H}, nǐ děng wǒ yīxià, wǒ qù gè xǐshǒujiān.","ko":"{H}, 잠깐만, 나 화장실 좀 다녀올게.","pat":"去(个)洗手间 = 화장실 다녀오다"},{"zh":"客户问洗手间在哪儿，你带他去一下。","py":"Kèhù wèn xǐshǒujiān zài nǎr, nǐ dài tā qù yīxià.","ko":"고객이 화장실 어디냐고 하시니까 좀 안내해 드려."}],"c":[["洗","洗","씻을 세"],["手","手","손 수"],["间","間","사이 간"]],"why":"손(手) 씻는(洗) 칸(間) → 화장실"},{"id":1461,"w":"休息","p":"xiūxi","k":"동","ko":"쉬다, 휴식하다","g":"o","ex":[{"zh":"中午大家休息一个小时。","py":"Zhōngwǔ dàjiā xiūxi yī gè xiǎoshí.","ko":"점심에 다들 한 시간 쉬어요."},{"zh":"{H}，你今天太累了，早点儿休息吧。","py":"{H}, nǐ jīntiān tài lèi le, zǎo diǎnr xiūxi ba.","ko":"{H}, 오늘 너무 피곤했잖아, 일찍 쉬어.","pat":"早点儿休息 = 일찍 쉬어"},{"zh":"妈，周末你和爸爸好好休息。","py":"Mā, zhōumò nǐ hé bàba hǎohǎo xiūxi.","ko":"엄마, 주말엔 아빠랑 푹 쉬어."}],"c":[["休","休","쉴 휴"],["息","息","쉴 식"]],"why":"쉬고(休) 숨 돌림(息) → 휴식"},{"id":1462,"w":"希望","p":"xīwàng","k":"동·명","ko":"희망하다, 바라다, 희망","g":"o","ex":[{"zh":"我希望明年能和{H}一起回韩国。","py":"Wǒ xīwàng míngnián néng hé {H} yīqǐ huí Hánguó.","ko":"내년엔 {H}랑 같이 한국 갔으면 좋겠어."},{"zh":"你觉得这次面试有希望吗？","py":"Nǐ juéde zhè cì miànshì yǒu xīwàng ma?","ko":"이번 면접 가망 있을 것 같아?","pat":"有希望 / 没希望 = 가망이 있다 / 없다"},{"zh":"老板，希望我们明年合作更好。","py":"Lǎobǎn, xīwàng wǒmen míngnián hézuò gèng hǎo.","ko":"사장님, 내년엔 저희 협력이 더 잘되길 바랍니다."}],"c":[["希","希","바랄 희"],["望","望","바랄 망"]],"why":"바라고(希) 바람(望) → 희망"},{"id":1463,"w":"洗澡","p":"xǐzǎo","k":"동","ko":"샤워하다, 목욕하다","g":"o","ex":[{"zh":"我刚下班，先洗澡再给你打电话。","py":"Wǒ gāng xiàbān, xiān xǐzǎo zài gěi nǐ dǎ diànhuà.","ko":"나 방금 퇴근했어, 먼저 씻고 전화할게."},{"zh":"工厂下班前，工人们要洗澡换衣服。","py":"Gōngchǎng xiàbān qián, gōngrénmen yào xǐzǎo huàn yīfu.","ko":"공장 퇴근 전에 작업자들은 샤워하고 옷 갈아입어야 해.","pat":"洗澡换衣服 = 씻고 옷 갈아입다"},{"zh":"{H}，热水好了，你去洗澡吧。","py":"{H}, rèshuǐ hǎo le, nǐ qù xǐzǎo ba.","ko":"{H}, 뜨거운 물 다 됐어, 가서 씻어."}],"c":[["洗","洗","씻을 세"],["澡","澡","씻을 조"]],"why":"씻고(洗) 몸을 씻음(澡) → 목욕"},{"id":1464,"w":"选择","p":"xuǎnzé","k":"동·명","ko":"선택하다, 고르다","g":"o","ex":[{"zh":"客户最后选择了我们公司。","py":"Kèhù zuìhòu xuǎnzé le wǒmen gōngsī.","ko":"고객이 결국 우리 회사를 선택했어."},{"zh":"{H}，这两家饭店你选择哪家？","py":"{H}, zhè liǎng jiā fàndiàn nǐ xuǎnzé nǎ jiā?","ko":"{H}, 이 두 식당 중에 어디 고를래?","pat":"选择 + 哪 + 양사 = 어느 걸 고를래"},{"zh":"妈，你放心，我会选择对自己好的工作。","py":"Mā, nǐ fàngxīn, wǒ huì xuǎnzé duì zìjǐ hǎo de gōngzuò.","ko":"엄마, 걱정 마, 나한테 좋은 일 잘 고를게."}],"c":[["选","選","가릴 선"],["择","擇","가릴 택"]],"why":"가리고(選) 골라냄(擇) → 선택"},{"id":1465,"w":"雪","p":"xuě","k":"명","ko":"눈 (내리는 눈)","g":"o","ex":[{"zh":"妈妈说首尔已经下雪了。","py":"Māma shuō Shǒu'ěr yǐjīng xià xuě le.","ko":"엄마가 서울엔 벌써 눈 왔대."},{"zh":"老板，韩国那边雪很大，货会晚到。","py":"Lǎobǎn, Hánguó nàbiān xuě hěn dà, huò huì wǎn dào.","ko":"사장님, 한국 쪽에 눈이 많이 와서 물건이 늦게 올 거예요.","pat":"雪很大 = 눈이 많이 온다"},{"zh":"{H}，你见过雪吗？冬天带你去韩国看。","py":"{H}, nǐ jiàn guo xuě ma? Dōngtiān dài nǐ qù Hánguó kàn.","ko":"{H}, 눈 본 적 있어? 겨울에 한국 데려가서 보여 줄게."}],"c":[["雪","雪","눈 설"]],"why":"비(雨)처럼 내려 쓸어(彐) 냄 x":[{"zh":"看了一天电脑，我眼睛有点儿累。","py":"Kàn le yī tiān diànnǎo, wǒ yǎnjing yǒudiǎnr lèi.","ko":"하루 종일 컴퓨터 봤더니 눈이 좀 피곤해."},{"zh":"在工厂工作要保护好眼睛。","py":"Zài gōngchǎng gōngzuò yào bǎohù hǎo yǎnjing.","ko":"공장에서 일할 땐 눈을 잘 보호해야 해.","pat":"保护眼睛 = 눈을 보호하다"},{"zh":"{H}，你的眼睛真好看。","py":"{H}, nǐ de yǎnjing zhēn hǎokàn.","ko":"{H}, 네 눈 진짜 예쁘다."}],"c":[["眼","眼","눈 안"],["睛","睛","눈동자 정"]],"why":"눈(眼)과 눈동자(睛) → 눈"},{"id":1471,"w":"颜色","p":"yánsè","k":"명","ko":"색깔","g":"o","ex":[{"zh":"{H}，你喜欢什么颜色的包？","py":"{H}, nǐ xǐhuan shénme yánsè de bāo?","ko":"{H}, 무슨 색 가방 좋아해?"},{"zh":"客户说这个颜色太深了。","py":"Kèhù shuō zhège yánsè tài shēn le.","ko":"고객이 이 색깔 너무 진하대.","pat":"颜色 + 深/浅 = 색이 진하다/연하다"},{"zh":"妈妈，你喜欢这件衣服的颜色吗？","py":"Māma, nǐ xǐhuan zhè jiàn yīfu de yánsè ma?","ko":"엄마, 이 옷 색깔 마음에 들어?"}],"c":[["颜","顏","낯 안"],["色","色","빛 색"]],"why":"얼굴(颜)에 드러나는 빛(色) → 색깔"},{"id":1472,"w":"药","p":"yào","k":"명","ko":"약","g":"o","ex":[{"zh":"妈妈，你的药吃了没有？","py":"Māma, nǐ de yào chī le méiyǒu?","ko":"엄마, 약 드셨어?"},{"zh":"感冒了就吃点儿药，早点儿睡。","py":"Gǎnmào le jiù chī diǎnr yào, zǎo diǎnr shuì.","ko":"감기 걸렸으면 약 좀 먹고 일찍 자.","pat":"吃药 = 약을 먹다"},{"zh":"这种药一天吃三次，饭后吃。","py":"Zhè zhǒng yào yī tiān chī sān cì, fàn hòu chī.","ko":"이 약은 하루 세 번, 밥 먹고 먹어."}],"c":[["药","藥","약 약"]],"why":"풀(艹)로 만든 약(藥) → 약"},{"id":1473,"w":"要","p":"yào","k":"동·조동","ko":"원하다, ~하려고 하다, ~해야 한다","g":"o","ex":[{"zh":"这个客户要的货很多。","py":"Zhège kèhù yào de huò hěn duō.","ko":"이 고객이 원하는 물량이 많아."},{"zh":"{H}，你要不要喝咖啡？","py":"{H}, nǐ yào bù yào hē kāfēi?","ko":"{H}, 커피 마실래?","pat":"要不要 + 동사 = ~할래? (의향 묻기)"},{"zh":"爸爸，明天要下雨，别出去了。","py":"Bàba, míngtiān yào xià yǔ, bié chūqù le.","ko":"아빠, 내일 비 온대, 나가지 마."}],"c":[["要","要","요긴할 요"]],"why":"요긴하게(要) 여겨 원함 → 원하다·해야 한다"},{"id":1474,"w":"要求","p":"yāoqiú","k":"동·명","ko":"요구하다, 요구","g":"o","ex":[{"zh":"老板要求我们周五前做完。","py":"Lǎobǎn yāoqiú wǒmen zhōuwǔ qián zuò wán.","ko":"사장님이 금요일 전까지 끝내라고 하셨어."},{"zh":"客户要求我们下个月送货。","py":"Kèhù yāoqiú wǒmen xià ge yuè sòng huò.","ko":"고객이 다음 달에 납품해 달래.","pat":"要求 + 사람 + 동작 = ~에게 ~하라고 요구하다"},{"zh":"妈妈总是要求我早点儿结婚。","py":"Māma zǒngshì yāoqiú wǒ zǎo diǎnr jiéhūn.","ko":"엄마는 맨날 나한테 빨리 결혼하라고 해."}],"c":[["要","要","구할 요"],["求","求","구할 구"]],"why":"구하고(要) 바람(求) → 요구하다"},{"id":1475,"w":"也","p":"yě","k":"부","ko":"~도, 역시","g":"o","ex":[{"zh":"{H}，我也想你了。","py":"{H}, wǒ yě xiǎng nǐ le.","ko":"{H}, 나도 보고 싶었어."},{"zh":"老板明天去新加坡，我也去。","py":"Lǎobǎn míngtiān qù Xīnjiāpō, wǒ yě qù.","ko":"사장님 내일 싱가포르 가시는데 나도 가.","pat":"A……，B也…… = B도 ~하다"},{"zh":"爸爸，你也要多运动啊。","py":"Bàba, nǐ yě yào duō yùndòng a.","ko":"아빠도 운동 많이 해야 돼."}],"c":[["也","也","어조사 야"]],"why":"한문 문말 어조사 야(也) → 중국어에선 '~도'"},{"id":1476,"w":"爷爷","p":"yéye","k":"명","ko":"할아버지 (친가)","g":"o","ex":[{"zh":"爷爷今年八十岁了，身体还很好。","py":"Yéye jīnnián bāshí suì le, shēntǐ hái hěn hǎo.","ko":"할아버지 올해 여든이신데 아직 정정하셔."},{"zh":"我爷爷奶奶都住在韩国。","py":"Wǒ yéye nǎinai dōu zhù zài Hánguó.","ko":"우리 할아버지 할머니는 다 한국에 사셔.","pat":"爷爷奶奶 = 할아버지 할머니 (친조부모)"},{"zh":"妈妈，爷爷的生日是下个星期吗？","py":"Māma, yéye de shēngrì shì xià ge xīngqī ma?","ko":"엄마, 할아버지 생신이 다음 주야?"}],"c":[["爷","爺","아비 야"],["爷","爺","아비 야"]],"why":"아버지 윗대 어른(爷) 반복 → 할아버지"},{"id":1477,"w":"一","p":"yī","k":"수","ko":"하나, 1","g":"o","ex":[{"zh":"工厂一号线明天检查。","py":"Gōngchǎng yī hào xiàn míngtiān jiǎnchá.","ko":"공장 1번 라인 내일 점검해."},{"zh":"老板给了我一个星期的时间。","py":"Lǎobǎn gěi le wǒ yī ge xīngqī de shíjiān.","ko":"사장님이 나한테 일주일 시간 주셨어.","pat":"一 + 양사 + 명사 (一个星期·一次) = 한 ~"},{"zh":"我在新加坡只住一个晚上。","py":"Wǒ zài Xīnjiāpō zhǐ zhù yī ge wǎnshang.","ko":"싱가포르에서는 하룻밤만 자."}],"c":[["一","一","한 일"]],"why":"가로획 하나 → 숫자 1"},{"id":1478,"w":"一般","p":"yìbān","k":"형","ko":"보통이다, 일반적이다","g":"o","ex":[{"zh":"我一般七点到工厂。","py":"Wǒ yìbān qī diǎn dào gōngchǎng.","ko":"나 보통 7시에 공장 도착해."},{"zh":"{H}，你周末一般几点起床？","py":"{H}, nǐ zhōumò yìbān jǐ diǎn qǐchuáng?","ko":"{H}, 너 주말엔 보통 몇 시에 일어나?","pat":"주어 + 一般 + 동사 = 보통(대개) ~하다"},{"zh":"这种机器一般能用十年。","py":"Zhè zhǒng jīqì yìbān néng yòng shí nián.","ko":"이런 기계는 보통 10년은 써."}],"c":[["一","一","한 일"],["般","般","가지 반"]],"why":"한(一) 가지(般) 종류 → 일반적이다"},{"id":1479,"w":"一边","p":"yìbiān","k":"명·부","ko":"한쪽, ~하면서 ~하다","g":"o","ex":[{"zh":"你先站在一边，机器要开了。","py":"Nǐ xiān zhàn zài yìbiān, jīqì yào kāi le.","ko":"일단 한쪽에 서 있어, 기계 돌아가."},{"zh":"{H}，把包放在一边吧。","py":"{H}, bǎ bāo fàng zài yìbiān ba.","ko":"{H}, 가방은 한쪽에 둬.","pat":"放在/站在 + 一边 = 한쪽에 두다/서다"},{"zh":"路的一边是工厂，另一边是饭馆。","py":"Lù de yìbiān shì gōngchǎng, lìng yìbiān shì fànguǎn.","ko":"길 한쪽은 공장이고 다른 쪽은 식당이야."}],"c":[["一","一","한 일"],["边","邊","가 변"]],"why":"한(一)쪽 가장자리(边) → 한쪽"},{"id":1480,"w":"一点儿","p":"yìdiǎnr","k":"양","ko":"조금, 약간","g":"o","ex":[{"zh":"{H}，你再吃一点儿吧。","py":"{H}, nǐ zài chī yìdiǎnr ba.","ko":"{H}, 조금만 더 먹어."},{"zh":"李经理，价格能便宜一点儿吗？","py":"Lǐ jīnglǐ, jiàgé néng piányi yìdiǎnr ma?","ko":"이 매니저님, 가격 좀 더 싸게 안 될까요?","pat":"형용사 + 一点儿 = 좀 더 ~하게 (便宜一点儿·快一点儿)"},{"zh":"妈妈，我今天有一点儿累。","py":"Māma, wǒ jīntiān yǒu yìdiǎnr lèi.","ko":"엄마, 나 오늘 좀 피곤해."}],"c":[["一","一","한 일"],["点","點","점 점"],["儿","兒","아이 아"]],"why":"한(一) 점(点)만큼(儿 접미) → 조금"},{"id":1481,"w":"一定","p":"yídìng","k":"부·형","ko":"반드시, 꼭, 일정한","g":"o","ex":[{"zh":"妈妈，我春节一定回家。","py":"Māma, wǒ Chūnjié yídìng huí jiā.","ko":"엄마, 설에 꼭 집에 갈게."},{"zh":"{H}，到家以后一定给我打电话。","py":"{H}, dào jiā yǐhòu yídìng gěi wǒ dǎ diànhuà.","ko":"{H}, 집 도착하면 꼭 전화해.","pat":"一定要 + 동사 = 꼭 ~해야 해 / 꼭 ~해"},{"zh":"老板，我明天一定做完。","py":"Lǎobǎn, wǒ míngtiān yídìng zuò wán.","ko":"사장님, 내일 꼭 끝낼게요."}],"c":[["一","一","한 일"],["定","定","정할 정"]],"why":"하나로(一) 정해짐(定) → 반드시"},{"id":1482,"w":"衣服","p":"yīfu","k":"명","ko":"옷","g":"o","ex":[{"zh":"这件衣服是{H}给我买的。","py":"Zhè jiàn yīfu shì {H} gěi wǒ mǎi de.","ko":"이 옷 {H}가 사준 거야."},{"zh":"天冷了，多穿点儿衣服。","py":"Tiān lěng le, duō chuān diǎnr yīfu.","ko":"날 추워졌으니까 옷 좀 더 껴입어.","pat":"穿/洗/买 + 衣服 = 옷을 입다/빨다/사다"},{"zh":"明天见客户，我要穿哪件衣服？","py":"Míngtiān jiàn kèhù, wǒ yào chuān nǎ jiàn yīfu?","ko":"내일 고객 만나는데 무슨 옷 입지?"}],"c":[["衣","衣","옷 의"],["服","服","옷 복"]],"why":"옷(衣)과 옷(服) → 의복"},{"id":1483,"w":"一共","p":"yígòng","k":"부","ko":"모두, 합계","g":"o","ex":[{"zh":"这些货一共多少钱？","py":"Zhèxiē huò yígòng duōshao qián?","ko":"이 물건들 전부 얼마예요?"},{"zh":"我们工厂一共有五十个同事。","py":"Wǒmen gōngchǎng yígòng yǒu wǔshí ge tóngshì.","ko":"우리 공장 직원이 다 합쳐서 50명이야.","pat":"一共 + (有) + 수량 = 모두 합쳐 ~"},{"zh":"{H}，我们这次一共花了多少钱？","py":"{H}, wǒmen zhè cì yígòng huā le duōshao qián?","ko":"{H}, 우리 이번에 다 합쳐서 얼마 썼어?"}],"c":[["一","一","한 일"],["共","共","함께 공"]],"why":"하나로(一) 함께(共) 합침 → 모두"},{"id":1484,"w":"一会儿","p":"yíhuìr","k":"명","ko":"잠시, 잠깐","g":"o","ex":[{"zh":"老板，我一会儿去您办公室。","py":"Lǎobǎn, wǒ yíhuìr qù nín bàngōngshì.","ko":"사장님, 잠시 후에 사무실로 갈게요."},{"zh":"{H}，你等我一会儿，我马上下来。","py":"{H}, nǐ děng wǒ yíhuìr, wǒ mǎshàng xiàlái.","ko":"{H}, 잠깐만 기다려, 금방 내려갈게.","pat":"等(我)一会儿 = 잠깐 기다려"},{"zh":"妈妈，我一会儿给你回电话。","py":"Māma, wǒ yíhuìr gěi nǐ huí diànhuà.","ko":"엄마, 이따 다시 전화할게."}],"c":[["一","一","한 일"],["会","會","모일 회"],["儿","兒","아이 아"]],"why":"한(一) 번 모이는(会) 동안 → 잠깐"},{"id":1485,"w":"已经","p":"yǐjing","k":"부","ko":"이미, 벌써","g":"o","ex":[{"zh":"{H}，我已经到新加坡了。","py":"{H}, wǒ yǐjing dào Xīnjiāpō le.","ko":"{H}, 나 벌써 싱가포르 도착했어."},{"zh":"老板，文件我已经发给您了。","py":"Lǎobǎn, wénjiàn wǒ yǐjing fā gěi nín le.","ko":"사장님, 문서 이미 보내드렸어요.","pat":"已经 + 동사 + 了 = 이미 ~했다"},{"zh":"爸爸，我已经三十多岁了，别担心。","py":"Bàba, wǒ yǐjing sānshí duō suì le, bié dānxīn.","ko":"아빠, 나 벌써 서른 넘었어, 걱정 마."}],"c":[["已","已","이미 이"],["经","經","지날 경"]],"why":"이미(已) 지나감(经) → 벌써"},{"id":1486,"w":"阴","p":"yīn","k":"형","ko":"흐리다","g":"o","ex":[{"zh":"天阴了，可能要下雨。","py":"Tiān yīn le, kěnéng yào xià yǔ.","ko":"날이 흐려졌네, 비 올 것 같아."},{"zh":"今天阴天，没有太阳，挺凉快的。","py":"Jīntiān yīntiān, méiyǒu tàiyáng, tǐng liángkuai de.","ko":"오늘 흐려서 해가 없으니까 꽤 시원해.","pat":"阴天 / 天阴了 = 흐린 날 / 날이 흐려지다"},{"zh":"妈妈，韩国那边天阴不阴？","py":"Māma, Hánguó nàbiān tiān yīn bù yīn?","ko":"엄마, 한국은 날씨 흐려?"}],"c":[["阴","陰","그늘 음"]],"why":"햇빛 없는 그늘(陰) → 흐리다"},{"id":1487,"w":"应该","p":"yīnggāi","k":"조동","ko":"마땅히 ~해야 한다","g":"o","ex":[{"zh":"这个问题应该先告诉客户。","py":"Zhège wèntí yīnggāi xiān gàosu kèhù.","ko":"이 문제는 먼저 고객한테 알려야 해."},{"zh":"爸爸，你应该多休息，别太累了。","py":"Bàba, nǐ yīnggāi duō xiūxi, bié tài lèi le.","ko":"아빠, 좀 더 쉬어야 돼, 너무 무리하지 마.","pat":"应该 + 동사 = (마땅히) ~해야 한다"},{"zh":"{H}，你今天应该早点儿休息。","py":"{H}, nǐ jīntiān yīnggāi zǎo diǎnr xiūxi.","ko":"{H}, 오늘은 일찍 쉬는 게 좋겠어."}],"c":[["应","應","응할 응"],["该","該","마땅 해"]],"why":"응당(应) 마땅함(该) → ~해야 한다"},{"id":1488,"w":"影响","p":"yǐngxiǎng","k":"동·명","ko":"영향을 주다, 영향","g":"o","ex":[{"zh":"停电会影响我们的工作。","py":"Tíngdiàn huì yǐngxiǎng wǒmen de gōngzuò.","ko":"정전되면 우리 일에 영향이 가."},{"zh":"{H}，别玩手机了，会影响睡觉。","py":"{H}, bié wán shǒujī le, huì yǐngxiǎng shuìjiào.","ko":"{H}, 폰 그만해, 잠 설쳐.","pat":"影响 + 명사(工作·睡觉·心情) = ~에 영향을 주다"},{"zh":"妈妈，别让这件事影响你的心情。","py":"Māma, bié ràng zhè jiàn shì yǐngxiǎng nǐ de xīnqíng.","ko":"엄마, 이 일 때문에 기분 상하지 마."}],"c":[["影","影","그림자 영"],["响","響","울릴 향"]],"why":"그림자(影)와 메아리(响) → 영향"},{"id":1489,"w":"银行","p":"yínháng","k":"명","ko":"은행","g":"o","ex":[{"zh":"我下午要去银行给妈妈转钱。","py":"Wǒ xiàwǔ yào qù yínháng gěi māma zhuǎn qián.","ko":"오후에 엄마한테 돈 보내러 은행 가야 해."},{"zh":"我的银行卡找不到了。","py":"Wǒ de yínháng kǎ zhǎo bù dào le.","ko":"내 은행 카드가 안 보여.","pat":"银行卡 = 은행 카드 / 去银行 + 동사"},{"zh":"{H}，这附近有银行吗？","py":"{H}, zhè fùjìn yǒu yínháng ma?","ko":"{H}, 이 근처에 은행 있어?"}],"c":[["银","銀","은 은"],["行","行","다닐 행"]],"why":"은(银)을 다루는 가게(行) → 은행"},{"id":1490,"w":"饮料","p":"yǐnliào","k":"명","ko":"음료","g":"o","ex":[{"zh":"{H}，你想喝什么饮料？","py":"{H}, nǐ xiǎng hē shénme yǐnliào?","ko":"{H}, 무슨 음료 마실래?"},{"zh":"少喝饮料，多喝水。","py":"Shǎo hē yǐnliào, duō hē shuǐ.","ko":"음료는 적게 마시고 물을 많이 마셔.","pat":"喝饮料 = 음료를 마시다"},{"zh":"爸爸，冰箱里的饮料你随便喝。","py":"Bàba, bīngxiāng lǐ de yǐnliào nǐ suíbiàn hē.","ko":"아빠, 냉장고에 있는 음료 마음대로 마셔."}],"c":[["饮","飮","마실 음"],["料","料","헤아릴 료"]],"why":"마시는(饮) 재료(料) → 음료"},{"id":1491,"w":"因为","p":"yīnwèi","k":"연","ko":"왜냐하면, ~때문에","g":"o","ex":[{"zh":"因为下雨，我们晚到了半个小时。","py":"Yīnwèi xià yǔ, wǒmen wǎn dào le bàn ge xiǎoshí.","ko":"비 때문에 우리 30분 늦게 도착했어요."},{"zh":"因为太忙，所以我这个周末不去新加坡了。","py":"Yīnwèi tài máng, suǒyǐ wǒ zhège zhōumò bù qù Xīnjiāpō le.","ko":"너무 바빠서 이번 주말엔 싱가포르 안 가.","pat":"因为A，所以B = A 때문에 (그래서) B"},{"zh":"{H}生气是因为我忘了她的生日。","py":"{H} shēngqì shì yīnwèi wǒ wàng le tā de shēngrì.","ko":"{H}가 화난 건 내가 생일을 까먹어서야."}],"c":[["因","因","인할 인"],["为","爲","할 위"]],"why":"원인(因)이 되기(为) 때문 → 왜냐하면"},{"id":1492,"w":"音乐","p":"yīnyuè","k":"명","ko":"음악","g":"o","ex":[{"zh":"{H}开车的时候喜欢听音乐。","py":"{H} kāichē de shíhou xǐhuan tīng yīnyuè.","ko":"{H}는 운전할 때 음악 듣는 걸 좋아해."},{"zh":"爸爸每天早上都听音乐。","py":"Bàba měitiān zǎoshang dōu tīng yīnyuè.","ko":"아빠는 매일 아침 음악 들으셔.","pat":"听音乐 = 음악을 듣다"},{"zh":"工厂里声音太大，听不到音乐。","py":"Gōngchǎng lǐ shēngyīn tài dà, tīng bù dào yīnyuè.","ko":"공장 안이 너무 시끄러워서 음악이 안 들려."}],"c":[["音","音","소리 음"],["乐","樂","노래 악"]],"why":"소리(音)로 된 노래(乐) → 음악"},{"id":1493,"w":"一起","p":"yìqǐ","k":"부","ko":"함께, 같이","g":"o","ex":[{"zh":"{H}，周末一起去看电影吧。","py":"{H}, zhōumò yìqǐ qù kàn diànyǐng ba.","ko":"{H}, 주말에 같이 영화 보러 가자."},{"zh":"老板，明天我跟您一起去见客户。","py":"Lǎobǎn, míngtiān wǒ gēn nín yìqǐ qù jiàn kèhù.","ko":"사장님, 내일 같이 고객 만나러 가요.","pat":"跟 + 사람 + 一起 + 동사 = ~와 함께 ~하다"},{"zh":"妈妈，春节我们一家人一起吃饭吧。","py":"Māma, Chūnjié wǒmen yī jiā rén yìqǐ chīfàn ba.","ko":"엄마, 설에 가족 다 같이 밥 먹자."}],"c":[["一","一","한 일"],["起","起","일어날 기"]],"why":"한(一)곳에서 함께 일어남(起) → 같이"},{"id":1494,"w":"以前","p":"yǐqián","k":"명","ko":"이전, 예전","g":"o","ex":[{"zh":"我以前在新加坡修电梯。","py":"Wǒ yǐqián zài Xīnjiāpō xiū diàntī.","ko":"나 예전에 싱가포르에서 엘리베이터 고쳤어."},{"zh":"爸爸以前是老师，现在已经不工作了。","py":"Bàba yǐqián shì lǎoshī, xiànzài yǐjing bù gōngzuò le.","ko":"아빠는 예전에 선생님이셨는데 지금은 일 안 하셔.","pat":"以前……，现在…… = 예전엔 ~, 지금은 ~"},{"zh":"{H}，你以前来过新山吗？","py":"{H}, nǐ yǐqián lái guo Xīnshān ma?","ko":"{H}, 너 전에 조호르바루 와 본 적 있어?"}],"c":[["以","以","써 이"],["前","前","앞 전"]],"why":"그로써(以) 앞(前) 시점 → 이전"},{"id":1495,"w":"医生","p":"yīshēng","k":"명","ko":"의사","g":"o","ex":[{"zh":"爸爸，医生怎么说？","py":"Bàba, yīshēng zěnme shuō?","ko":"아빠, 의사가 뭐래?"},{"zh":"{H}，你不舒服就去看医生吧。","py":"{H}, nǐ bù shūfu jiù qù kàn yīshēng ba.","ko":"{H}, 몸 안 좋으면 병원 가 봐.","pat":"看医生 = 진찰받다, 병원에 가다"},{"zh":"同事生病了，医生让他休息三天。","py":"Tóngshì shēngbìng le, yīshēng ràng tā xiūxi sān tiān.","ko":"동료가 아파서 의사가 3일 쉬래."}],"c":[["医","醫","의원 의"],["生","生","날 생"]],"why":"의술(医) 하는 사람(生) → 의사"},{"id":1496,"w":"意思","p":"yìsi","k":"명","ko":"뜻, 의미, 재미","g":"o","ex":[{"zh":"老板，您这句话是什么意思？","py":"Lǎobǎn, nín zhè jù huà shì shénme yìsi?","ko":"사장님, 그 말씀 무슨 뜻이에요?"},{"zh":"{H}，这个中文词是什么意思？","py":"{H}, zhège Zhōngwén cí shì shénme yìsi?","ko":"{H}, 이 중국어 단어 무슨 뜻이야?","pat":"……是什么意思？ = ~는 무슨 뜻이야?"},{"zh":"客户的意思是价格还要再低一点儿。","py":"Kèhù de yìsi shì jiàgé hái yào zài dī yìdiǎnr.","ko":"고객 말은 가격을 좀 더 낮춰 달라는 거야."}],"c":[["意","意","뜻 의"],["思","思","생각 사"]],"why":"뜻(意)과 생각(思) → 의미"},{"id":1497,"w":"一样","p":"yíyàng","k":"형","ko":"같다, 똑같다","g":"o","ex":[{"zh":"这两家的价格不一样。","py":"Zhè liǎng jiā de jiàgé bù yíyàng.","ko":"이 두 업체 가격이 달라요."},{"zh":"爸爸跟我一样，都不爱吃甜的。","py":"Bàba gēn wǒ yíyàng, dōu bù ài chī tián de.","ko":"아빠도 나처럼 단 거 안 좋아해.","pat":"A 跟 B 一样 = A는 B와 같다"},{"zh":"{H}，我们俩的手机一样。","py":"{H}, wǒmen liǎ de shǒujī yíyàng.","ko":"{H}, 우리 둘 폰 똑같다."}],"c":[["一","一","한 일"],["样","樣","모양 양"]],"why":"한(一) 가지 모양(样) → 같다"},{"id":1498,"w":"医院","p":"yīyuàn","k":"명","ko":"병원","g":"o","ex":[{"zh":"同事不舒服，我送他去医院了。","py":"Tóngshì bù shūfu, wǒ sòng tā qù yīyuàn le.","ko":"동료가 몸이 안 좋아서 병원에 데려다줬어."},{"zh":"妈妈，爸爸去医院检查了吗？","py":"Māma, bàba qù yīyuàn jiǎnchá le ma?","ko":"엄마, 아빠 병원 가서 검사받았어?","pat":"去医院 + 동사(检查·看病) = 병원에 가서 ~하다"},{"zh":"{H}工作的地方就在医院旁边。","py":"{H} gōngzuò de dìfang jiù zài yīyuàn pángbiān.","ko":"{H}가 일하는 곳은 바로 병원 옆이야."}],"c":[["医","醫","의원 의"],["院","院","집 원"]],"why":"치료(医)하는 집(院) → 병원"},{"id":1499,"w":"一直","p":"yìzhí","k":"부","ko":"계속, 줄곧, 곧장","g":"o","ex":[{"zh":"这台机器一直有问题。","py":"Zhè tái jīqì yìzhí yǒu wèntí.","ko":"이 기계 계속 문제가 있어."},{"zh":"{H}，我一直在等你的电话。","py":"{H}, wǒ yìzhí zài děng nǐ de diànhuà.","ko":"{H}, 계속 네 전화 기다리고 있었어.","pat":"一直在 + 동사 = 계속 ~하고 있다"},{"zh":"妈妈一直希望我回韩国工作。","py":"Māma yìzhí xīwàng wǒ huí Hánguó gōngzuò.","ko":"엄마는 계속 내가 한국 돌아가서 일하길 바라셔."}],"c":[["一","一","한 일"],["直","直","곧을 직"]],"why":"한(一) 줄로 곧게(直) → 줄곧"},{"id":1500,"w":"椅子","p":"yǐzi","k":"명","ko":"의자","g":"o","ex":[{"zh":"会议室的椅子不够了。","py":"Huìyìshì de yǐzi bú gòu le.","ko":"회의실 의자가 모자라."},{"zh":"{H}，这把椅子坐着很舒服。","py":"{H}, zhè bǎ yǐzi zuò zhe hěn shūfu.","ko":"{H}, 이 의자 앉아 보니까 편하다.","pat":"一把椅子 = 의자 하나 (양사 把)"},{"zh":"爸爸，你站上椅子太危险了。","py":"Bàba, nǐ zhàn shàng yǐzi tài wēixiǎn le.","ko":"아빠, 의자 위에 올라가는 거 너무 위험해."}],"c":[["椅","椅","의자 의"],["子","子","아들 자"]],"why":"의자(椅)+명사접미(子) → 의자"},{"id":1501,"w":"用","p":"yòng","k":"동","ko":"사용하다, 쓰다","g":"o","ex":[{"zh":"妈妈，这个手机你会用吗？","py":"Māma, zhège shǒujī nǐ huì yòng ma?","ko":"엄마, 이 핸드폰 쓸 줄 알아?"},{"zh":"{H}，你的电脑能借我用一下吗？","py":"{H}, nǐ de diànnǎo néng jiè wǒ yòng yíxià ma?","ko":"{H}, 네 컴퓨터 잠깐 써도 돼?","pat":"用一下 / 借我用一下 = 잠깐 쓰다(빌리다)"},{"zh":"这台机器我们已经用了十年了。","py":"Zhè tái jīqì wǒmen yǐjing yòng le shí nián le.","ko":"이 기계 벌써 10년 썼어."}],"c":[["用","用","쓸 용"]],"why":"쓸 용(用) → 사용하다"},{"id":1502,"w":"又","p":"yòu","k":"부","ko":"또, 다시","g":"o","ex":[{"zh":"{H}，你又买新衣服了？","py":"{H}, nǐ yòu mǎi xīn yīfu le?","ko":"{H}, 또 새 옷 샀어?"},{"zh":"这台机器又坏了，真没办法。","py":"Zhè tái jīqì yòu huài le, zhēn méi bànfǎ.","ko":"이 기계 또 고장 났어, 진짜 답이 없다.","pat":"又 + 동사 + 了 = 또 ~했다 (이미 일어난 반복)"},{"zh":"爸爸，你怎么又喝酒了？","py":"Bàba, nǐ zěnme yòu hē jiǔ le?","ko":"아빠, 왜 또 술 마셨어?"}],"c":[["又","又","또 우"]],"why":"오른손이 또(又) 나옴 → 또, 다시"},{"id":1503,"w":"有","p":"yǒu","k":"동","ko":"있다, 가지고 있다","g":"o","ex":[{"zh":"工厂附近有一家中国饭馆。","py":"Gōngchǎng fùjìn yǒu yì jiā Zhōngguó fànguǎn.","ko":"공장 근처에 중국 식당이 하나 있어."},{"zh":"{H}，你明天晚上有时间吗？","py":"{H}, nǐ míngtiān wǎnshang yǒu shíjiān ma?","ko":"{H}, 내일 저녁에 시간 있어?","pat":"有时间/有空 = 시간이 있다"},{"zh":"妈妈，家里有什么需要的吗？","py":"Māma, jiā lǐ yǒu shénme xūyào de ma?","ko":"엄마, 집에 뭐 필요한 거 있어?"}],"c":[["有","有","있을 유"]],"why":"손(又)에 고기(月)가 있음 → 있다"},{"id":1504,"w":"右边","p":"yòubian","k":"명","ko":"오른쪽","g":"o","ex":[{"zh":"{H}，你右边那个人是谁？","py":"{H}, nǐ yòubian nàge rén shì shéi?","ko":"{H}, 네 오른쪽에 있는 사람 누구야?"},{"zh":"我们的工厂在银行右边。","py":"Wǒmen de gōngchǎng zài yínháng yòubian.","ko":"우리 공장은 은행 오른쪽에 있어.","pat":"A 在 B 右边 = A는 B 오른쪽에 있다"},{"zh":"爸爸，照片右边的是我的老板。","py":"Bàba, zhàopiàn yòubian de shì wǒ de lǎobǎn.","ko":"아빠, 사진 오른쪽에 있는 사람이 우리 사장님이야."}],"c":[["右","右","오른 우"],["边","邊","가 변"]],"why":"오른(右)쪽 가장자리(边) → 오른쪽"},{"id":1505,"w":"有名","p":"yǒumíng","k":"형","ko":"유명하다","g":"o","ex":[{"zh":"新
