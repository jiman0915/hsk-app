+ 元 = ~위안 (화폐 단위)"},{"zh":"妈妈，在中国坐地铁只要几元钱。","py":"Māma, zài Zhōngguó zuò dìtiě zhǐ yào jǐ yuán qián.","ko":"엄마, 중국에선 지하철 타는 데 몇 위안밖에 안 해."}],"c":[["元","元","으뜸 원"]],"why":"으뜸·처음(元) → 시작의, 화폐 단위"},{"id":1510,"w":"远","p":"yuǎn","k":"형","ko":"멀다","g":"o","ex":[{"zh":"新山离新加坡不远。","py":"Xīnshān lí Xīnjiāpō bù yuǎn.","ko":"조호르바루는 싱가포르에서 멀지 않아."},{"zh":"{H}，你公司离地铁站远吗？","py":"{H}, nǐ gōngsī lí dìtiězhàn yuǎn ma?","ko":"{H}, 너희 회사에서 지하철역까지 멀어?","pat":"A 离 B (不)远 = A는 B에서 멀다(멀지 않다)"},{"zh":"客户的工厂太远了，开车要三个小时。","py":"Kèhù de gōngchǎng tài yuǎn le, kāichē yào sān ge xiǎoshí.","ko":"고객 공장이 너무 멀어서 차로 세 시간 걸려."}],"c":[["远","遠","멀 원"]],"why":"길(辶)이 멀다(遠) → 멀다"},{"id":1511,"w":"愿意","p":"yuànyì","k":"조동·동","ko":"기꺼이 ~하다, 원하다","g":"o","ex":[{"zh":"客户愿意多等一个星期。","py":"Kèhù yuànyì duō děng yí ge xīngqī.","ko":"고객이 일주일 더 기다려 주겠대."},{"zh":"{H}，你愿意跟我去韩国见我爸妈吗？","py":"{H}, nǐ yuànyì gēn wǒ qù Hánguó jiàn wǒ bàmā ma?","ko":"{H}, 나랑 한국 가서 우리 부모님 만나 볼래?","pat":"愿意 + 동사 = 기꺼이 ~하다 / ~할 의향이 있다"},{"zh":"同事们都不愿意周末加班。","py":"Tóngshìmen dōu bù yuànyì zhōumò jiābān.","ko":"동료들은 다 주말 출근을 싫어해."}],"c":[["愿","願","원할 원"],["意","意","뜻 의"]],"why":"원하는(愿) 뜻(意) → 기꺼이 하다"},{"id":1512,"w":"遇到","p":"yùdào","k":"동","ko":"마주치다, 맞닥뜨리다","g":"o","ex":[{"zh":"工作中遇到问题就问我。","py":"Gōngzuò zhōng yùdào wèntí jiù wèn wǒ.","ko":"일하다가 문제 생기면 나한테 물어봐."},{"zh":"我在新加坡遇到了以前的同事。","py":"Wǒ zài Xīnjiāpō yùdào le yǐqián de tóngshì.","ko":"싱가포르에서 예전 동료를 우연히 만났어.","pat":"遇到 + 사람/问题/困难 = ~를 (우연히) 만나다, ~에 부딪히다"},{"zh":"爸爸，开车遇到大雨就慢点儿开。","py":"Bàba, kāichē yùdào dà yǔ jiù màn diǎnr kāi.","ko":"아빠, 운전하다 비 많이 오면 천천히 가."}],"c":[["遇","遇","만날 우"],["到","到","이를 도"]],"why":"만남(遇)에 이름(到) → 마주치다"},{"id":1513,"w":"越","p":"yuè","k":"부","ko":"~할수록 더 (越…越…)","g":"o","ex":[{"zh":"越过这条线就不安全了。","py":"Yuèguò zhè tiáo xiàn jiù bù ānquán le.","ko":"이 선 넘어가면 위험해."},{"zh":"{H}，越过这座山就到海边了。","py":"{H}, yuèguò zhè zuò shān jiù dào hǎibiān le.","ko":"{H}, 이 산만 넘으면 바닷가야.","pat":"越过 + 장소/선 = ~을 넘다"},{"zh":"别越过黄线，那边的机器很危险。","py":"Bié yuèguò huáng xiàn, nàbiān de jīqì hěn wēixiǎn.","ko":"노란 선 넘지 마, 저쪽 기계 위험해."}],"c":[["越","越","넘을 월"]],"why":"뛰어(走) 넘음(越) → 넘다"},{"id":1514,"w":"月","p":"yuè","k":"명","ko":"달, 월","g":"o","ex":[{"zh":"下个月我要回韩国。","py":"Xià ge yuè wǒ yào huí Hánguó.","ko":"다음 달에 한국 들어가."},{"zh":"这个月工厂特别忙，每天都加班。","py":"Zhège yuè gōngchǎng tèbié máng, měitiān dōu jiābān.","ko":"이번 달에 공장이 엄청 바빠서 매일 야근해.","pat":"这个月/下个月/上个月 = 이번/다음/지난 달"},{"zh":"我每个月都给爸妈寄一点儿钱。","py":"Wǒ měi ge yuè dōu gěi bàmā jì yìdiǎnr qián.","ko":"나는 매달 부모님께 돈을 조금씩 보내드려."}],"c":[["月","月","달 월"]],"why":"초승달 상형(月) → 달"},{"id":1515,"w":"月亮","p":"yuèliang","k":"명","ko":"달 (하늘의 달)","g":"o","ex":[{"zh":"{H}，你看，今晚的月亮真漂亮。","py":"{H}, nǐ kàn, jīnwǎn de yuèliang zhēn piàoliang.","ko":"{H}, 봐봐, 오늘 밤 달 진짜 예쁘다."},{"zh":"今天晚上的月亮又大又圆。","py":"Jīntiān wǎnshang de yuèliang yòu dà yòu yuán.","ko":"오늘 밤 달이 크고 둥그네.","pat":"月亮 + 又大又圆 = 달이 크고 둥글다"},{"zh":"加班到很晚，出来时月亮已经很高了。","py":"Jiābān dào hěn wǎn, chūlái shí yuèliang yǐjing hěn gāo le.","ko":"늦게까지 야근하고 나오니 달이 벌써 높이 떠 있었어."}],"c":[["月","月","달 월"],["亮","亮","밝을 량"]],"why":"밝게(亮) 빛나는 달(月) → 달"},{"id":1516,"w":"运动","p":"yùndòng","k":"명·동","ko":"운동, 운동하다","g":"o","ex":[{"zh":"机器在运动，别把手放进去。","py":"Jīqì zài yùndòng, bié bǎ shǒu fàng jìnqu.","ko":"기계 움직이고 있으니까 손 넣지 마."},{"zh":"地球一直在运动，可是我们感觉不到。","py":"Dìqiú yìzhí zài yùndòng, kěshì wǒmen gǎnjué bù dào.","ko":"지구는 계속 움직이는데 우리는 못 느껴.","pat":"在运动 = (물체가) 움직이고 있다"},{"zh":"门打开以后，机器就停止运动了。","py":"Mén dǎkāi yǐhòu, jīqì jiù tíngzhǐ yùndòng le.","ko":"문을 열면 기계가 바로 멈춰."}],"c":[["运","運","옮길 운"],["动","動","움직일 동"]],"why":"옮기고(运) 움직임(动) → 운동"},{"id":1517,"w":"在","p":"zài","k":"동·개·부","ko":"~에 있다, ~에서, ~하고 있다","g":"o","ex":[{"zh":"爷爷要是还在，一定很高兴。","py":"Yéye yàoshi hái zài, yídìng hěn gāoxìng.","ko":"할아버지가 살아 계셨으면 정말 기뻐하셨을 거야."},{"zh":"老板在吗？客户来找他了。","py":"Lǎobǎn zài ma? Kèhù lái zhǎo tā le.","ko":"사장님 계세요? 고객이 찾아왔어요.","pat":"……在吗？ = (사람이) 있어요?"},{"zh":"{H}，你奶奶还在吗？","py":"{H}, nǐ nǎinai hái zài ma?","ko":"{H}, 할머니 아직 살아 계셔?"}],"c":[["在","在","있을 재"]],"why":"있을 재(在) → 존재하다, ~에 있다"},{"id":1518,"w":"再","p":"zài","k":"부","ko":"다시, 또, 더","g":"o","ex":[{"zh":"不好意思，请您再说一遍。","py":"Bù hǎoyìsi, qǐng nín zài shuō yí biàn.","ko":"죄송한데 한 번만 더 말씀해 주세요."},{"zh":"{H}，我们下次再来这家店吧。","py":"{H}, wǒmen xià cì zài lái zhè jiā diàn ba.","ko":"{H}, 다음에 이 가게 또 오자.","pat":"下次再 + 동사 = 다음에 또 ~하다"},{"zh":"妈妈，你再等我一年，我就回韩国。","py":"Māma, nǐ zài děng wǒ yī nián, wǒ jiù huí Hánguó.","ko":"엄마, 1년만 더 기다려, 그럼 한국 갈게."}],"c":[["再","再","두 재"]],"why":"두 번(再) → 다시, 또"},{"id":1519,"w":"再见","p":"zàijiàn","k":"동","ko":"안녕히 가세요, 또 만나요","g":"o","ex":[{"zh":"{H}，再见，下周末见！","py":"{H}, zàijiàn, xià zhōumò jiàn!","ko":"{H}, 안녕, 다음 주말에 보자!"},{"zh":"老板，我先下班了，明天再见。","py":"Lǎobǎn, wǒ xiān xiàbān le, míngtiān zàijiàn.","ko":"사장님, 먼저 퇴근할게요, 내일 뵐게요.","pat":"……，明天再见 = 내일 또 봬요 (작별 인사)"},{"zh":"妈妈，我要上飞机了，再见！","py":"Māma, wǒ yào shàng fēijī le, zàijiàn!","ko":"엄마, 나 비행기 타야 돼, 안녕!"}],"c":[["再","再","두 재"],["见","見","볼 견"]],"why":"다시(再) 봄(见) → 또 만나요"},{"id":1520,"w":"早上","p":"zǎoshang","k":"명","ko":"아침","g":"o","ex":[{"zh":"我每天早上六点起床。","py":"Wǒ měi tiān zǎoshang liù diǎn qǐchuáng.","ko":"나 매일 아침 6시에 일어나."},{"zh":"明天早上九点，客户来工厂开会。","py":"Míngtiān zǎoshang jiǔ diǎn, kèhù lái gōngchǎng kāihuì.","ko":"내일 아침 9시에 고객이 공장에 와서 회의해.","pat":"明天早上 + 시각 = 내일 아침 ~시"},{"zh":"{H}，你早上吃了什么？","py":"{H}, nǐ zǎoshang chī le shénme?","ko":"{H}, 아침에 뭐 먹었어?"}],"c":[["早","早","이를 조"],["上","上","윗 상"]],"why":"이른(早) 때 위쪽(上) 시간 → 아침"},{"id":1521,"w":"怎么","p":"zěnme","k":"대","ko":"어떻게, 왜","g":"o","ex":[{"zh":"王经理，您的工厂怎么走？","py":"Wáng jīnglǐ, nín de gōngchǎng zěnme zǒu?","ko":"왕 매니저님, 공장 어떻게 가요?"},{"zh":"妈妈，这个菜怎么做？","py":"Māma, zhège cài zěnme zuò?","ko":"엄마, 이 요리 어떻게 해?","pat":"怎么 + 동사 = 어떻게 ~해? (방식)"},{"zh":"{H}，你今天怎么不高兴？","py":"{H}, nǐ jīntiān zěnme bù gāoxìng?","ko":"{H}, 오늘 왜 기분 안 좋아?"}],"c":[["怎","怎","어찌 즘"],["么","麼","어조사 마"]],"why":"어찌(怎)+어조사(么) → 어떻게"},{"id":1522,"w":"怎么样","p":"zěnmeyàng","k":"대","ko":"어떠하다, 어때","g":"o","ex":[{"zh":"那家饭馆的菜不怎么样。","py":"Nà jiā fànguǎn de cài bù zěnmeyàng.","ko":"그 식당 음식 별로야."},{"zh":"{H}说这部电影不怎么样。","py":"{H} shuō zhè bù diànyǐng bù zěnmeyàng.","ko":"{H}가 이 영화 별로래.","pat":"不怎么样 = 별로다"},{"zh":"爸爸说他最近身体不怎么样。","py":"Bàba shuō tā zuìjìn shēntǐ bù zěnmeyàng.","ko":"아빠가 요즘 몸이 별로 안 좋대."}],"c":[["怎","怎","어찌 즘"],["么","麼","어조사 마"],["样","樣","모양 양"]],"why":"어떤(怎么) 모양(样) → 어떠하다"},{"id":1523,"w":"站","p":"zhàn","k":"동·명","ko":"서다, 역, 정류장","g":"o","ex":[{"zh":"{H}，别一直站着，坐下休息吧。","py":"{H}, bié yìzhí zhàn zhe, zuò xià xiūxi ba.","ko":"{H}, 계속 서 있지 말고 앉아서 쉬어."},{"zh":"爸爸，你站在那儿，我给你照张相。","py":"Bàba, nǐ zhàn zài nàr, wǒ gěi nǐ zhào zhāng xiàng.","ko":"아빠, 거기 서 봐, 사진 찍어 줄게.","pat":"站在 + 장소 = ~에 서다"},{"zh":"同事在机器旁边站了一天，很累。","py":"Tóngshì zài jīqì pángbiān zhàn le yī tiān, hěn lèi.","ko":"동료가 하루 종일 기계 옆에 서 있어서 피곤해해."}],"c":[["站","站","설 참"]],"why":"우뚝 섬(站) → 서다, 역"},{"id":1524,"w":"张","p":"zhāng","k":"양·동","ko":"장 (종이·책상 등 평평한 것을 세는 단위), 열다","g":"o","ex":[{"zh":"医生让我张开嘴。","py":"Yīshēng ràng wǒ zhāng kāi zuǐ.","ko":"의사가 입을 벌려 보래."},{"zh":"{H}，张开手，我给你一个东西。","py":"{H}, zhāngkāi shǒu, wǒ gěi nǐ yī ge dōngxi.","ko":"{H}, 손 펴 봐, 뭐 하나 줄게.","pat":"张开 + 手/嘴 = ~를 펴다(벌리다)"},{"zh":"爸爸张开手，抱了我一下。","py":"Bàba zhāngkāi shǒu, bào le wǒ yíxià.","ko":"아빠가 팔을 벌려서 나를 한번 안아 줬어."}],"c":[["张","張","베풀 장"]],"why":"활(弓)을 길게(長) 당김 → 펼치다"},{"id":1525,"w":"丈夫","p":"zhàngfu","k":"명","ko":"남편","g":"o","ex":[{"zh":"{H}说，以后我会是个好丈夫。","py":"{H} shuō, yǐhòu wǒ huì shì ge hǎo zhàngfu.","ko":"{H}가 나중에 내가 좋은 남편이 될 거래."},{"zh":"李小姐的丈夫是我们以前的客户。","py":"Lǐ xiǎojiě de zhàngfu shì wǒmen yǐqián de kèhù.","ko":"리 씨 남편분이 우리 예전 고객이셨어.","pat":"……的丈夫 = ~의 남편"},{"zh":"妈妈常说，她的丈夫什么都不会做。","py":"Māma cháng shuō, tā de zhàngfu shénme dōu bù huì zuò.","ko":"엄마는 자기 남편이 할 줄 아는 게 하나도 없다고 자주 말해."}],"c":[["丈","丈","어른 장"],["夫","夫","지아비 부"]],"why":"어른(丈)인 사내(夫) → 남편"},{"id":1526,"w":"找","p":"zhǎo","k":"동","ko":"찾다, 거슬러 주다","g":"o","ex":[{"zh":"老板，您在找什么？","py":"Lǎobǎn, nín zài zhǎo shénme?","ko":"사장님, 뭐 찾으세요?"},{"zh":"{H}，你找到新工作了吗？","py":"{H}, nǐ zhǎodào xīn gōngzuò le ma?","ko":"{H}, 새 일자리 구했어?","pat":"找到 + 명사 = ~를 찾아내다 (找到工作)"},{"zh":"妈妈，我的手机找到了，别担心。","py":"Māma, wǒ de shǒujī zhǎodào le, bié dānxīn.","ko":"엄마, 폰 찾았어, 걱정 마."}],"c":[["找","找","찾을 조"]],"why":"손(扌)으로 찾음 → 찾다"},{"id":1527,"w":"照顾","p":"zhàogù","k":"동","ko":"돌보다, 보살피다","g":"o","ex":[{"zh":"{H}生病了，我去照顾她。","py":"{H} shēngbìng le, wǒ qù zhàogù tā.","ko":"{H}가 아파서 내가 돌봐주러 가."},{"zh":"妈妈，爸爸生病了，辛苦你照顾他。","py":"Māma, bàba shēngbìng le, xīnkǔ nǐ zhàogù tā.","ko":"엄마, 아빠 아프신데 돌보느라 고생 많아.","pat":"照顾 + 사람 = ~를 돌보다"},{"zh":"我刚来马来西亚的时候，同事很照顾我。","py":"Wǒ gāng lái Mǎláixīyà de shíhou, tóngshì hěn zhàogù wǒ.","ko":"말레이시아 처음 왔을 때 동료들이 많이 챙겨 줬어."}],"c":[["照","照","비칠 조"],["顾","顧","돌아볼 고"]],"why":"비춰보며(照) 돌아봄(顾) → 돌보다"},{"id":1528,"w":"着急","p":"zháojí","k":"형","ko":"조급해하다, 초조하다","g":"o","ex":[{"zh":"别着急，货明天就到。","py":"Bié zháojí, huò míngtiān jiù dào.","ko":"걱정 마세요, 물건 내일 바로 도착해요."},{"zh":"老板很着急，客户一直在等。","py":"Lǎobǎn hěn zháojí, kèhù yìzhí zài děng.","ko":"사장님이 엄청 초조해하셔, 고객이 계속 기다리고 있거든.","pat":"很着急 = 매우 초조하다 (别着急 = 조급해하지 마)"},{"zh":"{H}找不到护照，着急得哭了。","py":"{H} zhǎo bù dào hùzhào, zháojí de kū le.","ko":"{H}가 여권을 못 찾아서 발을 동동 구르다 울었어."}],"c":[["着","着","붙을 착"],["急","急","급할 급"]],"why":"급함(急)이 들러붙음(着) → 조급해하다"},{"id":1529,"w":"照片","p":"zhàopiàn","k":"명","ko":"사진","g":"o","ex":[{"zh":"妈妈，我给你发几张照片。","py":"Māma, wǒ gěi nǐ fā jǐ zhāng zhàopiàn.","ko":"엄마, 사진 몇 장 보내줄게."},{"zh":"{H}，你把昨天的照片发给我吧。","py":"{H}, nǐ bǎ zuótiān de zhàopiàn fā gěi wǒ ba.","ko":"{H}, 어제 사진 나한테 보내 줘.","pat":"把照片发给 + 사람 = 사진을 ~에게 보내다"},{"zh":"客户要我们照几张机器的照片。","py":"Kèhù yào wǒmen zhào jǐ zhāng jīqì de zhàopiàn.","ko":"고객이 기계 사진 몇 장 찍어 달래."}],"c":[["照","照","비칠 조"],["片","片","조각 편"]],"why":"비춰(照) 찍은 조각(片) → 사진"},{"id":1530,"w":"这","p":"zhè","k":"대","ko":"이, 이것","g":"o","ex":[{"zh":"这是我们新买的机器。","py":"Zhè shì wǒmen xīn mǎi de jīqì.","ko":"이게 저희가 새로 산 기계예요."},{"zh":"{H}，这是我给你买的礼物。","py":"{H}, zhè shì wǒ gěi nǐ mǎi de lǐwù.","ko":"{H}, 이거 너 주려고 산 선물이야.","pat":"这是 + 명사 = 이것은 ~이다"},{"zh":"爸爸，这家饭馆的菜很像韩国菜。","py":"Bàba, zhè jiā fànguǎn de cài hěn xiàng Hánguó cài.","ko":"아빠, 이 식당 음식 한국 음식이랑 비슷해."}],"c":[["这","這","이 저"]],"why":"이(這) → 이것"},{"id":1531,"w":"正在","p":"zhèngzài","k":"부","ko":"지금 ~하고 있는 중이다","g":"o","ex":[{"zh":"我正在开会，一会儿给你打电话。","py":"Wǒ zhèngzài kāihuì, yíhuìr gěi nǐ dǎ diànhuà.","ko":"나 지금 회의 중이야, 좀 이따 전화할게."},{"zh":"同事们正在检查新机器。","py":"Tóngshìmen zhèngzài jiǎnchá xīn jīqì.","ko":"동료들이 지금 새 기계 점검하고 있어.","pat":"正在 + 동사 = 지금 ~하고 있다"},{"zh":"妈妈打电话的时候，我正在洗澡。","py":"Māma dǎ diànhuà de shíhou, wǒ zhèngzài xǐzǎo.","ko":"엄마가 전화했을 때 나 샤워하고 있었어."}],"c":[["正","正","바를 정"],["在","在","있을 재"]],"why":"바로(正) ~하고 있음(在) → 한창 ~중"},{"id":1532,"w":"只","p":"zhǐ","k":"부","ko":"단지, 오직, 겨우","g":"o","ex":[{"zh":"这次只来了两个客户。","py":"Zhè cì zhǐ lái le liǎng ge kèhù.","ko":"이번엔 고객 두 명만 왔어."},{"zh":"爸爸早上只喝了一杯咖啡。","py":"Bàba zǎoshang zhǐ hē le yī bēi kāfēi.","ko":"아빠 아침에 커피 한 잔만 드셨어.","pat":"只 + 동사 + 수량 = ~만 ~했다"},{"zh":"{H}，我只想跟你在一起。","py":"{H}, wǒ zhǐ xiǎng gēn nǐ zài yìqǐ.","ko":"{H}, 난 너랑만 있고 싶어."}],"c":[["只","只","다만 지"]],"why":"다만(只) → 단지, 오직"},{"id":1533,"w":"知道","p":"zhīdào","k":"동","ko":"알다","g":"o","ex":[{"zh":"你知道老板去哪儿了吗？","py":"Nǐ zhīdào lǎobǎn qù nǎr le ma?","ko":"사장님 어디 가셨는지 알아?"},{"zh":"妈妈，我知道了，你别说了。","py":"Māma, wǒ zhīdào le, nǐ bié shuō le.","ko":"엄마, 알았어, 그만 말해.","pat":"我知道了 = 알았어"},{"zh":"{H}，你知道这附近哪儿有好吃的吗？","py":"{H}, nǐ zhīdào zhè fùjìn nǎr yǒu hǎochī de ma?","ko":"{H}, 이 근처에 맛있는 데 어디 있는지 알아?"}],"c":[["知","知","알 지"],["道","道","길 도"]],"why":"도리(道)를 앎(知) → 알다"},{"id":1534,"w":"只有","p":"zhǐyǒu","k":"연","ko":"~해야만 비로소, 오직","g":"o","ex":[{"zh":"冰箱里只有两瓶水了。","py":"Bīngxiāng lǐ zhǐyǒu liǎng píng shuǐ le.","ko":"냉장고에 물 두 병밖에 없어."},{"zh":"我们工厂只有一台这样的机器。","py":"Wǒmen gōngchǎng zhǐyǒu yī tái zhèyàng de jīqì.","ko":"우리 공장에 이런 기계는 한 대밖에 없어.","pat":"只有 + 수량 + 명사 = ~밖에 없다"},{"zh":"{H}，我一个月只有两个周末能去看你。","py":"{H}, wǒ yī ge yuè zhǐyǒu liǎng ge zhōumò néng qù kàn nǐ.","ko":"{H}, 한 달에 주말 두 번밖에 너 보러 못 가."}],"c":[["只","只","다만 지"],["有","有","있을 유"]],"why":"다만(只) 있음(有) → ~만 있다"},{"id":1535,"w":"中国","p":"Zhōngguó","k":"명","ko":"중국","g":"o","ex":[{"zh":"{H}的老家在中国南方。","py":"{H} de lǎojiā zài Zhōngguó nánfāng.","ko":"{H} 고향은 중국 남쪽이야."},{"zh":"我们的新机器是从中国买的。","py":"Wǒmen de xīn jīqì shì cóng Zhōngguó mǎi de.","ko":"우리 새 기계는 중국에서 사 온 거야.","pat":"从中国 + 동사 = 중국에서 ~하다"},{"zh":"爸爸，明年我们一起去中国旅游吧。","py":"Bàba, míngnián wǒmen yìqǐ qù Zhōngguó lǚyóu ba.","ko":"아빠, 내년에 같이 중국 여행 가자."}],"c":[["中","中","가운데 중"],["国","國","나라 국"]],"why":"세상 가운데(中) 나라(国) → 중국"},{"id":1536,"w":"中间","p":"zhōngjiān","k":"명","ko":"가운데, 중간, 사이","g":"o","ex":[{"zh":"照片中间的那个人是我爸爸。","py":"Zhàopiàn zhōngjiān de nàge rén shì wǒ bàba.","ko":"사진 가운데 있는 사람이 우리 아빠야."},{"zh":"老板坐在中间，客户坐在两边。","py":"Lǎobǎn zuò zài zhōngjiān, kèhù zuò zài liǎngbiān.","ko":"사장님은 가운데, 고객들은 양쪽에 앉아.","pat":"坐/站在中间 = 가운데 앉다/서다"},{"zh":"{H}，你站中间，我们三个照张相。","py":"{H}, nǐ zhàn zhōngjiān, wǒmen sān ge zhào zhāng xiàng.","ko":"{H}, 네가 가운데 서, 우리 셋이 사진 찍자."}],"c":[["中","中","가운데 중"],["间","間","사이 간"]],"why":"가운데(中) 사이(间) → 중간"},{"id":1537,"w":"中文","p":"Zhōngwén","k":"명","ko":"중국어","g":"o","ex":[{"zh":"我每天晚上学一个小时中文。","py":"Wǒ měi tiān wǎnshang xué yí ge xiǎoshí Zhōngwén.","ko":"나 매일 저녁 한 시간씩 중국어 공부해."},{"zh":"我们老板的中文说得很好。","py":"Wǒmen lǎobǎn de Zhōngwén shuō de hěn hǎo.","ko":"우리 사장님 중국어 엄청 잘하셔.","pat":"中文说得很好 = 중국어를 잘하다"},{"zh":"{H}，你教我说中文吧。","py":"{H}, nǐ jiāo wǒ shuō Zhōngwén ba.","ko":"{H}, 나 중국어 가르쳐 줘."}],"c":[["中","中","가운데 중"],["文","文","글월 문"]],"why":"중국(中)의 글(文) → 중국어"},{"id":1538,"w":"中午","p":"zhōngwǔ","k":"명","ko":"정오, 점심때","g":"o","ex":[{"zh":"中午我们一起去吃饭吧。","py":"Zhōngwǔ wǒmen yìqǐ qù chīfàn ba.","ko":"점심에 같이 밥 먹으러 가자."},{"zh":"{H}，你中午吃饭了吗？","py":"{H}, nǐ zhōngwǔ chīfàn le ma?","ko":"{H}, 점심 먹었어?","pat":"中午 + 吃饭 = 점심(을 먹다)"},{"zh":"妈妈，韩国中午的时候，这里是十一点。","py":"Māma, Hánguó zhōngwǔ de shíhou, zhèlǐ shì shíyī diǎn.","ko":"엄마, 한국이 정오일 때 여기는 11시야."}],"c":[["中","中","가운데 중"],["午","午","낮 오"]],"why":"오시(午)의 한가운데(中) → 정오"},{"id":1539,"w":"重要","p":"zhòngyào","k":"형","ko":"중요하다","g":"o","ex":[{"zh":"这个客户对我们很重要。","py":"Zhège kèhù duì wǒmen hěn zhòngyào.","ko":"이 고객은 우리한테 아주 중요해."},{"zh":"爸爸，身体比钱重要多了。","py":"Bàba, shēntǐ bǐ qián zhòngyào duō le.","ko":"아빠, 돈보다 건강이 훨씬 중요해.","pat":"A 比 B 重要 = A가 B보다 중요하다"},{"zh":"{H}，你对我来说最重要。","py":"{H}, nǐ duì wǒ lái shuō zuì zhòngyào.","ko":"{H}, 나한텐 네가 제일 중요해."}],"c":[["重","重","무거울 중"],["要","要","요긴할 요"]],"why":"무겁고(重) 요긴함(要) → 중요하다"},{"id":1540,"w":"终于","p":"zhōngyú","k":"부","ko":"마침내, 결국","g":"o","ex":[{"zh":"新机器终于到了！","py":"Xīn jīqì zhōngyú dào le!","ko":"새 기계가 드디어 왔어!"},{"zh":"妈妈，我终于通过考试了！","py":"Māma, wǒ zhōngyú tōngguò kǎoshì le!","ko":"엄마, 나 드디어 시험 붙었어!","pat":"终于 + 동사 + 了 = 드디어 ~했다"},{"zh":"{H}，你终于来了，我等了半天。","py":"{H}, nǐ zhōngyú lái le, wǒ děng le bàntiān.","ko":"{H}, 드디어 왔네, 한참 기다렸어."}],"c":[["终","終","마칠 종"],["于","於","어조사 어"]],"why":"끝(终)에 이르러(于) → 마침내"},{"id":1541,"w":"周末","p":"zhōumò","k":"명","ko":"주말","g":"o","ex":[{"zh":"{H}，这个周末你有空吗？","py":"{H}, zhège zhōumò nǐ yǒu kòng ma?","ko":"{H}, 이번 주말에 시간 있어?"},{"zh":"老板，这个周末我要去新加坡。","py":"Lǎobǎn, zhège zhōumò wǒ yào qù Xīnjiāpō.","ko":"사장님, 이번 주말에 저 싱가포르 가요.","pat":"这个周末 = 이번 주말"},{"zh":"爸爸周末常常去爬山。","py":"Bàba zhōumò chángcháng qù pá shān.","ko":"아빠는 주말에 자주 등산 가셔."}],"c":[["周","週","주일 주"],["末","末","끝 말"]],"why":"한 주(周)의 끝(末) → 주말"},{"id":1542,"w":"住","p":"zhù","k":"동","ko":"살다, 묵다","g":"o","ex":[{"zh":"我住在新山，{H}住在新加坡。","py":"Wǒ zhù zài Xīnshān, {H} zhù zài Xīnjiāpō.","ko":"나는 조호르바루에 살고 {H}는 싱가포르에 살아."},{"zh":"妈妈，我住的地方离工厂很近。","py":"Māma, wǒ zhù de dìfang lí gōngchǎng hěn jìn.","ko":"엄마, 내가 사는 데는 공장에서 가까워.","pat":"住的地方 = 사는 곳 (住在 + 장소 = ~에 살다)"},{"zh":"客户来新山的时候住在哪儿？","py":"Kèhù lái Xīnshān de shíhou zhù zài nǎr?","ko":"고객이 조호르바루 올 때 어디서 묵어?"}],"c":[["住","住","살 주"]],"why":"사람(亻)이 머무름(主) → 살다, 묵다"},{"id":1543,"w":"准备","p":"zhǔnbèi","k":"동","ko":"준비하다, ~할 계획이다","g":"o","ex":[{"zh":"我在准备HSK四级考试。","py":"Wǒ zài zhǔnbèi HSK sì jí kǎoshì.","ko":"나 HSK 4급 시험 준비하고 있어."},{"zh":"老板，开会的东西都准备好了。","py":"Lǎobǎn, kāihuì de dōngxi dōu zhǔnbèi hǎo le.","ko":"사장님, 회의 자료 다 준비됐어요.","pat":"准备好了 = 다 준비됐다"},{"zh":"{H}，晚饭我来准备，你休息吧。","py":"{H}, wǎnfàn wǒ lái zhǔnbèi, nǐ xiūxi ba.","ko":"{H}, 저녁은 내가 준비할게, 너는 쉬어."}],"c":[["准","準","준할 준"],["备","備","갖출 비"]],"why":"기준(准)에 맞게 갖춤(备) → 준비하다"},{"id":1544,"w":"桌子","p":"zhuōzi","k":"명","ko":"탁자, 테이블","g":"o","ex":[{"zh":"把文件放在我桌子上吧。","py":"Bǎ wénjiàn fàng zài wǒ zhuōzi shang ba.","ko":"서류 내 책상 위에 놔둬."},{"zh":"{H}，你的桌子上东西太多了。","py":"{H}, nǐ de zhuōzi shang dōngxi tài duō le.","ko":"{H}, 너 책상 위에 물건 너무 많아.","pat":"桌子上 + 명사 = 책상(테이블) 위의 ~"},{"zh":"妈妈，饭菜都放在桌子上了。","py":"Māma, fàncài dōu fàng zài zhuōzi shang le.","ko":"엄마, 음식 다 상에 차려 놨어."}],"c":[["桌","桌","탁자 탁"],["子","子","아들 자"]],"why":"탁자(桌)+명사접미(子) → 탁자"},{"id":1545,"w":"主要","p":"zhǔyào","k":"형·부","ko":"주요하다, 주로","g":"o","ex":[{"zh":"我们的客户主要在新加坡。","py":"Wǒmen de kèhù zhǔyào zài Xīnjiāpō.","ko":"우리 고객은 주로 싱가포르에 있어."},{"zh":"我来新山主要是为了工作。","py":"Wǒ lái Xīnshān zhǔyào shì wèile gōngzuò.","ko":"내가 조호르바루 온 건 주로 일 때문이야.","pat":"主要是 + 이유/명사 = 주로 ~이다"},{"zh":"{H}的客人主要是年轻女孩子。","py":"{H} de kèrén zhǔyào shì niánqīng nǚ háizi.","ko":"{H}의 손님은 주로 젊은 여자들이야."}],"c":[["主","主","주인 주"],["要","要","요긴할 요"]],"why":"주된(主) 요긴함(要) → 주요한"},{"id":1546,"w":"注意","p":"zhùyì","k":"동","ko":"주의하다, 조심하다","g":"o","ex":[{"zh":"儿子，下雨天开车要注意安全。","py":"Érzi, xià yǔ tiān kāichē yào zhùyì ānquán.","ko":"아들, 비 오는 날 운전 조심해."},{"zh":"{H}，你最近要注意休息。","py":"{H}, nǐ zuìjìn yào zhùyì xiūxi.","ko":"{H}, 요즘 좀 잘 쉬어.","pat":"注意 + 동사/명사 = ~에 신경 쓰다(주의하다)"},{"zh":"老板，我没注意到这个问题。","py":"Lǎobǎn, wǒ méi zhùyì dào zhège wèntí.","ko":"사장님, 이 문제를 미처 못 봤어요."}],"c":[["注","注","뜻 둘 주"],["意","意","뜻 의"]],"why":"뜻(意)을 쏟음(注) → 주의하다"},{"id":1547,"w":"字","p":"zì","k":"명","ko":"글자","g":"o","ex":[{"zh":"{H}，这个字怎么读？","py":"{H}, zhège zì zěnme dú?","ko":"{H}, 이 글자 어떻게 읽어?"},{"zh":"爸爸的字写得很漂亮。","py":"Bàba de zì xiě de hěn piàoliang.","ko":"아빠 글씨 진짜 예뻐.","pat":"字 + 写得 + 평가 = 글씨를 ~하게 쓰다"},{"zh":"老板，这个字写错了。","py":"Lǎobǎn, zhège zì xiě cuò le.","ko":"사장님, 이 글자 잘못 쓰셨어요."}],"c":[["字","字","글자 자"]],"why":"집(宀) 안의 아이(子)처럼 불어남 → 글자"},{"id":1548,"w":"自己","p":"zìjǐ","k":"대","ko":"자기, 자신, 스스로","g":"o","ex":[{"zh":"这件事我自己来做吧。","py":"Zhè jiàn shì wǒ zìjǐ lái zuò ba.","ko":"이 일은 제가 직접 할게요."},{"zh":"{H}，你一个人在家要照顾好自己。","py":"{H}, nǐ yī ge rén zài jiā yào zhàogù hǎo zìjǐ.","ko":"{H}, 혼자 집에 있을 때 몸 잘 챙겨.","pat":"照顾好自己 = 자기 몸을 잘 챙기다"},{"zh":"爸爸总是自己修家里的东西。","py":"Bàba zǒngshì zìjǐ xiū jiā lǐ de dōngxi.","ko":"아빠는 늘 집 물건을 직접 고치셔."}],"c":[["自","自","스스로 자"],["己","己","몸 기"]],"why":"스스로(自)의 몸(己) → 자기"},{"id":1549,"w":"自行车","p":"zìxíngchē","k":"명","ko":"자전거","g":"o","ex":[{"zh":"{H}，我们骑自行车去海边吧。","py":"{H}, wǒmen qí zìxíngchē qù hǎibiān ba.","ko":"{H}, 우리 자전거 타고 바닷가 가자."},{"zh":"同事每天骑自行车来工厂。","py":"Tóngshì měitiān qí zìxíngchē lái gōngchǎng.","ko":"동료는 매일 자전거 타고 공장에 와.","pat":"骑自行车 = 자전거를 타다"},{"zh":"我小时候，爸爸教我骑自行车。","py":"Wǒ xiǎoshíhou, bàba jiāo wǒ qí zìxíngchē.","ko":"어릴 때 아빠가 자전거 타는 거 가르쳐 줬어."}],"c":[["自","自","스스로 자"],["行","行","다닐 행"],["车","車","수레 차"]],"why":"스스로(自) 다니는(行) 수레(车) → 자전거"},{"id":1550,"w":"总是","p":"zǒngshì","k":"부","ko":"늘, 항상","g":"o","ex":[{"zh":"老板总是最早到工厂。","py":"Lǎobǎn zǒngshì zuì zǎo dào gōngchǎng.","ko":"사장님은 항상 제일 먼저 공장에 오셔."},{"zh":"妈妈总是担心我吃不好。","py":"Māma zǒngshì dānxīn wǒ chī bù hǎo.","ko":"엄마는 늘 내가 밥 제대로 못 먹을까 봐 걱정해.","pat":"总是 + 동사 = 늘 ~하다"},{"zh":"{H}总是说我穿得太简单了。","py":"{H} zǒngshì shuō wǒ chuān de tài jiǎndān le.","ko":"{H}는 늘 내가 옷을 너무 대충 입는대."}],"c":[["总","總","다 총"],["是","是","이 시"]],"why":"다(总) 이러함(是) → 늘, 언제나"},{"id":1551,"w":"走","p":"zǒu","k":"동","ko":"걷다, 가다, 떠나다","g":"o","ex":[{"zh":"{H}，吃完饭我们走一走吧。","py":"{H}, chī wán fàn wǒmen zǒu yi zǒu ba.","ko":"{H}, 밥 먹고 좀 걷자."},{"zh":"工厂离我家很近，走十分钟就到。","py":"Gōngchǎng lí wǒ jiā hěn jìn, zǒu shí fēnzhōng jiù dào.","ko":"공장이 집에서 가까워서 걸어서 10분이면 가.","pat":"走 + 시간 + 就到 = 걸어서 ~면 도착하다"},{"zh":"爸爸每天晚饭后出去走半个小时。","py":"Bàba měitiān wǎnfàn hòu chūqù zǒu bàn ge xiǎoshí.","ko":"아빠는 매일 저녁 먹고 30분씩 걸으러 나가셔."}],"c":[["走","走","달릴 주"]],"why":"달릴 주(走) → 중국어에선 걷다·가다"},{"id":1552,"w":"最","p":"zuì","k":"부","ko":"가장, 제일","g":"o","ex":[{"zh":"这家是新山最好吃的饭馆。","py":"Zhè jiā shì Xīnshān zuì hǎochī de fànguǎn.","ko":"여기가 조호르바루에서 제일 맛있는 식당이야."},{"zh":"老板最喜欢喝中国茶。","py":"Lǎobǎn zuì xǐhuan hē Zhōngguó chá.","ko":"사장님은 중국차를 제일 좋아하셔.","pat":"最喜欢 + 명사 = 가장 좋아하다"},{"zh":"妈妈，我最想吃你做的菜。","py":"Māma, wǒ zuì xiǎng chī nǐ zuò de cài.","ko":"엄마, 엄마가 해 준 음식이 제일 먹고 싶어."}],"c":[["最","最","가장 최"]],"why":"가장 최(最) → 가장, 제일"},{"id":1553,"w":"嘴","p":"zuǐ","k":"명","ko":"입","g":"o","ex":[{"zh":"{H}，你嘴上有东西。","py":"{H}, nǐ zuǐ shang yǒu dōngxi.","ko":"{H}, 입에 뭐 묻었어."},{"zh":"同事嘴很甜，客户都喜欢他。","py":"Tóngshì zuǐ hěn tián, kèhù dōu xǐhuan tā.","ko":"동료가 말을 예쁘게 해서 고객들이 다 좋아해.","pat":"嘴甜 = 말을 예쁘게 하다 (입이 달다)"},{"zh":"爸爸，你的嘴怎么破了？","py":"Bàba, nǐ de zuǐ zěnme pò le?","ko":"아빠, 입이 왜 터졌어?"}],"c":[["嘴","嘴","부리 취"]],"why":"입(口)의 부리(觜) → 입"},{"id":1554,"w":"最后","p":"zuìhòu","k":"명","ko":"맨 마지막, 결국","g":"o","ex":[{"zh":"最后一个问题，什么时候能送到？","py":"Zuìhòu yí ge wèntí, shénme shíhou néng sòng dào?","ko":"마지막 질문인데요, 언제 받을 수 있어요?"},{"zh":"{H}，最后一天我们去哪儿玩？","py":"{H}, zuìhòu yī tiān wǒmen qù nǎr wán?","ko":"{H}, 마지막 날에 우리 어디 놀러 가?","pat":"最后 + 一 + 양사 = 마지막 ~"},{"zh":"妈妈，最后我还是决定留在马来西亚。","py":"Māma, zuìhòu wǒ háishi juédìng liú zài Mǎláixīyà.","ko":"엄마, 결국 나 말레이시아에 남기로 했어."}],"c":[["最","最","가장 최"],["后","後","뒤 후"]],"why":"가장(最) 뒤(后) → 최후"},{"id":1555,"w":"最近","p":"zuìjìn","k":"명","ko":"요즘, 최근","g":"o","ex":[{"zh":"爸爸，你最近身体怎么样？","py":"Bàba, nǐ zuìjìn shēntǐ zěnmeyàng?","ko":"아빠, 요즘 건강 어때?"},{"zh":"{H}，你最近工作忙不忙？","py":"{H}, nǐ zuìjìn gōngzuò máng bù máng?","ko":"{H}, 요즘 일 바빠?","pat":"最近 + 忙不忙/怎么样 = 요즘 ~해?"},{"zh":"最近客户的要求越来越高。","py":"Zuìjìn kèhù de yāoqiú yuè lái yuè gāo.","ko":"요즘 고객 요구가 점점 까다로워져."}],"c":[["最","最","가장 최"],["近","近","가까울 근"]],"why":"가장(最) 가까운(近) 때 → 최근"},{"id":1556,"w":"坐","p":"zuò","k":"동","ko":"앉다, (탈것을) 타다","g":"o","ex":[{"zh":"请坐，喝杯茶吧。","py":"Qǐng zuò, hē bēi chá ba.","ko":"앉으세요, 차 한 잔 드세요."},{"zh":"{H}，你坐我旁边吧。","py":"{H}, nǐ zuò wǒ pángbiān ba.","ko":"{H}, 내 옆에 앉아.","pat":"坐 + 사람 + 旁边 = ~ 옆에 앉다"},{"zh":"爸爸在电脑前一坐就是三个小时。","py":"Bàba zài diànnǎo qián yī zuò jiù shì sān ge xiǎoshí.","ko":"아빠는 컴퓨터 앞에 한번 앉으면 세 시간이야."}],"c":[["坐","坐","앉을 좌"]],"why":"흙(土) 위에 두 사람이 앉음 → 앉다"},{"id":1557,"w":"做","p":"zuò","k":"동","ko":"하다, 만들다","g":"o","ex":[{"zh":"{H}是做美容的。","py":"{H} shì zuò měiróng de.","ko":"{H}는 미용 일 해."},{"zh":"妈妈，今天晚上你做什么菜？","py":"Māma, jīntiān wǎnshang nǐ zuò shénme cài?","ko":"엄마, 오늘 저녁에 무슨 요리해?","pat":"做菜/做饭 = 요리하다"},{"zh":"你在这家工厂做了几年了？","py":"Nǐ zài zhè jiā gōngchǎng zuò le jǐ nián le?","ko":"이 공장에서 몇 년 일했어?"}],"c":[["做","做","지을 주"]],"why":"사람(亻)이 지음(故) → 하다, 만들다"},{"id":1558,"w":"左边","p":"zuǒbian","k":"명","ko":"왼쪽","g":"o","ex":[{"zh":"会议室在左边，请跟我来。","py":"Huìyìshì zài zuǒbian, qǐng gēn wǒ lái.","ko":"회의실은 왼쪽이에요, 따라오세요."},{"zh":"{H}，你左边那家店的衣服很便宜。","py":"{H}, nǐ zuǒbian nà jiā diàn de yīfu hěn piányi.","ko":"{H}, 네 왼쪽 그 가게 옷 싸.","pat":"명사 + 左边 = ~의 왼쪽"},{"zh":"爸爸，开车的时候多看看左边。","py":"Bàba, kāichē de shíhou duō kànkan zuǒbian.","ko":"아빠, 운전할 때 왼쪽 잘 봐."}],"c":[["左","左","왼 좌"],["边","邊","가 변"]],"why":"왼(左)쪽 가장자리(边) → 왼쪽"},{"id":1559,"w":"昨天","p":"zuótiān","k":"명","ko":"어제","g":"o","ex":[{"zh":"我昨天加班到晚上十点。","py":"Wǒ zuótiān jiābān dào wǎnshang shí diǎn.","ko":"나 어제 밤 10시까지 야근했어."},{"zh":"{H}，昨天晚上你几点睡的？","py":"{H}, zuótiān wǎnshang nǐ jǐ diǎn shuì de?","ko":"{H}, 어젯밤에 몇 시에 잤어?","pat":"昨天晚上 = 어젯밤"},{"zh":"妈妈，你昨天寄的东西我收到了。","py":"Māma, nǐ zuótiān jì de dōngxi wǒ shōudào le.","ko":"엄마, 어제 보낸 거 받았어."}],"c":[["昨","昨","어제 작"],["天","天","하늘 천"]],"why":"어제(昨)의 날(天) → 어제"},{"id":1560,"w":"作业","p":"zuòyè","k":"명","ko":"숙제, 과제","g":"o","ex":[{"zh":"MBA的作业太多了。","py":"MBA de zuòyè tài duō le.","ko":"MBA 과제가 너무 많아."},{"zh":"{H}，今天晚上我要写作业，不能陪你了。","py":"{H}, jīntiān wǎnshang wǒ yào xiě zuòyè, bù néng péi nǐ le.","ko":"{H}, 오늘 밤엔 과제해야 돼서 같이 못 있어.","pat":"写作业 / 做作业 = 과제(숙제)를 하다"},{"zh":"妈妈，我小时候总是最后一天才做作业。","py":"Māma, wǒ xiǎoshíhou zǒngshì zuìhòu yī tiān cái zuò zuòyè.","ko":"엄마, 나 어릴 때 늘 마지막 날에야 숙제했잖아."}],"c":[["作","作","지을 작"],["业","業","업 업"]],"why":"일(业)을 지음(作) → 숙제, 작업"},{"id":1561,"w":"安全","p":"ānquán","k":"형","ko":"안전하다","g":"o","ex":[{"zh":"在工厂里一定要注意安全。","py":"Zài gōngchǎng lǐ yídìng yào zhùyì ānquán.","ko":"공장 안에서는 꼭 안전에 주의해야 해."},{"zh":"{H}，晚上一个人坐车不安全。","py":"{H}, wǎnshang yī ge rén zuò chē bù ānquán.","ko":"{H}, 밤에 혼자 차 타는 거 위험해.","pat":"……不安全 = ~는 위험하다(안전하지 않다)"},{"zh":"爸爸，这条路很安全，你放心吧。","py":"Bàba, zhè tiáo lù hěn ānquán, nǐ fàngxīn ba.","ko":"아빠, 이 길 안전하니까 걱정 마."}],"c":[["安","安","편안 안"],["全","全","온전할 전"]],"why":"편안하고(安) 온전함(全) → 안전하다"},{"id":1562,"w":"包子","p":"bāozi","k":"명","ko":"만두 (소가 든 찐빵)","g":"o","ex":[{"zh":"早上我买了两个包子。","py":"Zǎoshang wǒ mǎi le liǎng ge bāozi.","ko":"아침에 바오쯔 두 개 샀어."},{"zh":"妈妈，你还记得我小时候爱吃包子吗？","py":"Māma, nǐ hái jìde wǒ xiǎoshíhou ài chī bāozi ma?","ko":"엄마, 나 어릴 때 찐빵 좋아했던 거 기억나?","pat":"吃包子 = 바오쯔를 먹다"},{"zh":"{H}，这家的包子特别好吃。","py":"{H}, zhè jiā de bāozi tèbié hǎochī.","ko":"{H}, 이 집 바오쯔 진짜 맛있어."}],"c":[["包","包","쌀 포"],["子","子","아들 자"]],"why":"소를 싼(包) 것(子) → 찐빵"},{"id":1563,"w":"遍","p":"biàn","k":"양","ko":"번, 회 (처음부터 끝까지 하는 횟수)","g":"o","ex":[{"zh":"这个文件我看了三遍。","py":"Zhège wénjiàn wǒ kàn le sān biàn.","ko":"이 서류 세 번이나 봤어."},{"zh":"妈妈，你把地址再说一遍。","py":"Māma, nǐ bǎ dìzhǐ zài shuō yī biàn.","ko":"엄마, 주소 다시 한 번 말해 줘.","pat":"再 + 동사 + 一遍 = 한 번 더 ~하다"},{"zh":"{H}，这部电影我看了两遍了。","py":"{H}, zhè bù diànyǐng wǒ kàn le liǎng biàn le.","ko":"{H}, 이 영화 벌써 두 번 봤어."}],"c":[["遍","遍","두루 편"]],"why":"두루(遍) 한 바퀴 → 번(처음부터 끝까지)"},{"id":1564,"w":"表演","p":"biǎoyǎn","k":"동·명","ko":"공연하다, 연기하다, 공연","g":"o","ex":[{"zh":"晚上有表演，{H}想去看。","py":"Wǎnshang yǒu biǎoyǎn, {H} xiǎng qù kàn.","ko":"저녁에 공연이 있는데 {H}가 보러 가고 싶대."},{"zh":"下班后，同事们一起去看了一场表演。","py":"Xiàbān hòu, tóngshìmen yìqǐ qù kàn le yī chǎng biǎoyǎn.","ko":"퇴근하고 동료들이랑 같이 공연 하나 봤어.","pat":"看(一场)表演 = 공연을 보다"},{"zh":"爸爸年轻的时候在学校表演过节目。","py":"Bàba niánqīng de shíhou zài xuéxiào biǎoyǎn guo jiémù.","ko":"아빠는 젊었을 때 학교에서 무대에 선 적 있어."}],"c":[["表","表","겉 표"],["演","演","펼 연"]],"why":"겉으로(表) 펼쳐 보임(演) → 공연하다"},{"id":1565,"w":"比如","p":"bǐrú","k":"연","ko":"예를 들면","g":"o","ex":[{"zh":"颜色有很多，比如金色和银色。","py":"Yánsè yǒu hěn duō, bǐrú jīnsè hé yínsè.","ko":"색은 여러 가지예요, 예를 들면 금색이랑 은색이요."},{"zh":"{H}喜欢运动，比如游泳和跑步。","py":"{H} xǐhuan yùndòng, bǐrú yóuyǒng hé pǎobù.","ko":"{H}는 운동 좋아해, 예를 들면 수영이랑 달리기.","pat":"……，比如A和B = 예를 들면 A와 B"},{"zh":"妈妈，有些东西这里买不到，比如你做的菜。","py":"Māma, yǒuxiē dōngxi zhèlǐ mǎi bù dào, bǐrú nǐ zuò de cài.","ko":"엄마, 여기서 못 사는 것도 있어, 예를 들면 엄마가 해 준 음식."}],"c":[["比","比","견줄 비"],["如","如","같을 여"]],"why":"견주어(比) 같은(如) 것 → 예를 들면"},{"id":1566,"w":"差不多","p":"chàbuduō","k":"부·형","ko":"거의, 비슷하다","g":"o","ex":[{"zh":"我和{H}的爱好差不多。","py":"Wǒ hé {H} de àihào chàbuduō.","ko":"나랑 {H}는 취미가 비슷해."},{"zh":"新机器和旧机器的价格差不多。","py":"Xīn jīqì hé jiù jīqì de jiàgé chàbuduō.","ko":"새 기계랑 옛날 기계 가격이 비슷해.","pat":"A 和 B 差不多 = A와 B가 비슷하다"},{"zh":"爸爸，我跟你年轻时差不多高。","py":"Bàba, wǒ gēn nǐ niánqīng shí chàbuduō gāo.","ko":"아빠, 나 아빠 젊었을 때랑 키 비슷해."}],"c":[["差","差","다를 차"],["不","不","아닐 불"],["多","多","많을 다"]],"why":"차이(差)가 많지(多) 않음(不) → 비슷하다"},{"id":1567,"w":"尝","p":"cháng","k":"동","ko":"맛보다","g":"o","ex":[{"zh":"妈妈，你尝尝我做的菜。","py":"Māma, nǐ cháng chang wǒ zuò de cài.","ko":"엄마, 내가 만든 요리 맛 좀 봐."},{"zh":"{H}，你尝一下，这个汤咸不咸？","py":"{H}, nǐ cháng yíxià, zhège tāng xián bù xián?","ko":"{H}, 맛 좀 봐, 이 국 짜?","pat":"尝一下 / 尝尝 = 맛 좀 봐"},{"zh":"客户带来了中国茶，大家都尝尝吧。","py":"Kèhù dàilái le Zhōngguó chá, dàjiā dōu chángchang ba.","ko":"고객이 중국차 가져왔어, 다들 맛 좀 봐."}],"c":[["尝","嘗","맛볼 상"]],"why":"맛볼 상(嘗) → 맛보다"},{"id":1568,"w":"出发","p":"chūfā","k":"동","ko":"출발하다","g":"o","ex":[{"zh":"我们八点从工厂出发。","py":"Wǒmen bā diǎn cóng gōngchǎng chūfā.","ko":"우리 8시에 공장에서 출발해."},{"zh":"{H}，你几点从家里出发？","py":"{H}, nǐ jǐ diǎn cóng jiā lǐ chūfā?","ko":"{H}, 몇 시에 집에서 출발해?","pat":"几点 + 从 + 장소 + 出发 = 몇 시에 ~에서 출발해"},{"zh":"爸爸，你们出发了吗？我去机场接你们。","py":"Bàba, nǐmen chūfā le ma? Wǒ qù jīchǎng jiē nǐmen.","ko":"아빠, 출발했어? 공항으로 마중 갈게."}],"c":[["出","出","날 출"],["发","發","떠날 발"]],"why":"나가서(出) 떠남(发) → 출발하다"},{"id":1569,"w":"出生","p":"chūshēng","k":"동","ko":"태어나다","g":"o","ex":[{"zh":"{H}，你是在哪儿出生的？","py":"{H}, nǐ shì zài nǎr chūshēng de?","ko":"{H}, 너 어디서 태어났어?"},{"zh":"我们老板是在新加坡出生的。","py":"Wǒmen lǎobǎn shì zài Xīnjiāpō chūshēng de.","ko":"우리 사장님은 싱가포르에서 태어나셨어.","pat":"是在 + 장소 + 出生的 = ~에서 태어났다"},{"zh":"妈妈，我出生的那天下大雪了吗？","py":"Māma, wǒ chūshēng de nà tiān xià dà xuě le ma?","ko":"엄마, 나 태어난 날에 눈 많이 왔어?"}],"c":[["出","出","날 출"],["生","生","날 생"]],"why":"나와서(出) 태어남(生) → 출생하다"},{"id":1570,"w":"大概","p":"dàgài","k":"부","ko":"아마, 대략","g":"o","ex":[{"zh":"老板，这个大概要三天。","py":"Lǎobǎn, zhège dàgài yào sān tiān.","ko":"사장님, 이거 아마 3일 정도 걸려요."},{"zh":"{H}，我大概七点到你家。","py":"{H}, wǒ dàgài qī diǎn dào nǐ jiā.","ko":"{H}, 나 7시쯤 너희 집 도착해.","pat":"大概 + 시간/수량 = 대략 ~"},{"zh":"爸爸，从机场到家大概要多长时间？","py":"Bàba, cóng jīchǎng dào jiā dàgài yào duō cháng shíjiān?","ko":"아빠, 공항에서 집까지 대략 얼마나 걸려?"}],"c":[["大","大","큰 대"],["概","概","대개 개"]],"why":"크게(大) 대강(概) 보면 → 아마, 대개"},{"id":1571,"w":"到处","p":"dàochù","k":"명","ko":"곳곳, 어디나","g":"o","ex":[{"zh":"我到处找手机，还是没找到。","py":"Wǒ dàochù zhǎo shǒujī, háishi méi zhǎo dào.","ko":"핸드폰 여기저기 다 찾았는데 아직 못 찾았어."},{"zh":"下大雨以后，工厂里到处都是水。","py":"Xià dà yǔ yǐhòu, gōngchǎng lǐ dàochù dōu shì shuǐ.","ko":"비가 많이 오고 나니 공장 안이 온통 물이야.","pat":"到处都是 + 명사 = 온통 ~투성이다"},{"zh":"{H}，你的东西别到处乱放。","py":"{H}, nǐ de dōngxi bié dàochù luàn fàng.","ko":"{H}, 물건 아무 데나 두지 마."}],"c":[["到","到","이를 도"],["处","處","곳 처"]],"why":"이르는(到) 곳(处)마다 → 도처"},{"id":1572,"w":"地点","p":"dìdiǎn","k":"명","ko":"장소, 지점","g":"o","ex":[{"zh":"开会的地点改了吗？","py":"Kāihuì de dìdiǎn gǎi le ma?","ko":"회의 장소 바뀌었어?"},{"zh":"请告诉我见面的时间和地点。","py":"Qǐng gàosu wǒ jiànmiàn de shíjiān hé dìdiǎn.","ko":"만날 시간이랑 장소 알려 줘.","pat":"时间和地点 = 시간과 장소"},{"zh":"王经理，送货的地点是你们的新工厂吗？","py":"Wáng jīnglǐ, sòng huò de dìdiǎn shì nǐmen de xīn gōngchǎng ma?","ko":"왕 매니저님, 배송 장소가 새 공장인가요?"}],"c":[["地","地","땅 지"],["点","點","점 점"]],"why":"땅(地) 위의 한 점(点) → 지점"},{"id":1573,"w":"丢","p":"diū","k":"동","ko":"잃어버리다, 버리다","g":"o","ex":[{"zh":"妈妈，我的钱包丢了。","py":"Māma, wǒ de qiánbāo diū le.","ko":"엄마, 나 지갑 잃어버렸어."},{"zh":"同事把工厂的钥匙丢了。","py":"Tóngshì bǎ gōngchǎng de yàoshi diū le.","ko":"동료가 공장 열쇠를 잃어버렸어.","pat":"把 + 물건 + 丢了 = ~를 잃어버렸다"},{"zh":"{H}，别把护照丢了。","py":"{H}, bié bǎ hùzhào diū le.","ko":"{H}, 여권 잃어버리지 마."}],"c":[["丢","丟","잃을 주"]],"why":"한(一) 번 가면(去) 사라짐 → 잃어버리다"},{"id":1574,"w":"对话","p":"duìhuà","k":"명·동","ko":"대화, 대화하다","g":"o","ex":[{"zh":"我每天跟{H}用中文对话。","py":"Wǒ měi tiān gēn {H} yòng Zhōngwén duìhuà.","ko":"나 매일 {H}랑 중국어로 대화해."},{"zh":"老板跟客户的对话我都记下来了。","py":"Lǎobǎn gēn kèhù de duìhuà wǒ dōu jì xiàlái le.","ko":"사장님이랑 고객 대화 내가 다 적어 놨어.","pat":"A 跟 B 的对话 = A와 B의 대화"},{"zh":"爸爸，我们好久没有好好对话了。","py":"Bàba, wǒmen hǎojiǔ méiyǒu hǎohǎo duìhuà le.","ko":"아빠, 우리 진지하게 대화 안 한 지 오래됐다."}],"c":[["对","對","대할 대"],["话","話","말씀 화"]],"why":"마주하여(对) 말함(话) → 대화하다"},{"id":1575,"w":"方法","p":"fāngfǎ","k":"명","ko":"방법","g":"o","ex":[{"zh":"你这个方法比我的好。","py":"Nǐ zhège fāngfǎ bǐ wǒ de hǎo.","ko":"네 방법이 내 것보다 낫다."},{"zh":"妈妈，学中文最好的方法是多说。","py":"Māma, xué Zhōngwén zuì hǎo de fāngfǎ shì duō shuō.","ko":"엄마, 중국어 배우는 제일 좋은 방법은 많이 말하는 거야.","pat":"……最好的方法是…… = ~하는 가장 좋은 방법은 ~"},{"zh":"{H}，你有什么减肥的好方法？","py":"{H}, nǐ yǒu shénme jiǎnféi de hǎo fāngfǎ?","ko":"{H}, 살 빼는 좋은 방법 있어?"}],"c":[["方","方","모 방"],["法","法","법 법"]],"why":"방도(方)와 법(法) → 방법"},{"id":1576,"w":"方向","p":"fāngxiàng","k":"명","ko":"방향","g":"o","ex":[{"zh":"{H}，我们好像走错方向了。","py":"{H}, wǒmen hǎoxiàng zǒu cuò fāngxiàng le.","ko":"{H}, 우리 방향 잘못 간 것 같아."},{"zh":"爸爸，机场在哪个方向？","py":"Bàba, jīchǎng zài nǎge fāngxiàng?","ko":"아빠, 공항은 어느 방향이야?","pat":"在哪个方向 = 어느 쪽(방향)이야"},{"zh":"老板，我们公司以后的发展方向是什么？","py":"Lǎobǎn, wǒmen gōngsī yǐhòu de fāzhǎn fāngxiàng shì shénme?","ko":"사장님, 우리 회사 앞으로 발전 방향이 뭐예요?"}],"c":[["方","方","모 방"],["向","向","향할 향"]],"why":"모(方)난 쪽으로 향함(向) → 방향"},{"id":1577,"w":"发生","p":"fāshēng","k":"동","ko":"발생하다, 일어나다","g":"o","ex":[{"zh":"昨天工厂发生了什么事？","py":"Zuótiān gōngchǎng fāshēng le shénme shì?","ko":"어제 공장에 무슨 일 있었어?"},{"zh":"{H}，你怎么哭了？发生什么事了？","py":"{H}, nǐ zěnme kū le? Fāshēng shénme shì le?","ko":"{H}, 왜 울어? 무슨 일 있어?","pat":"发生什么事了？ = 무슨 일 있어?"},{"zh":"妈妈，这种事以后不会再发生了。","py":"Māma, zhè zhǒng shì yǐhòu bù huì zài fāshēng le.","ko":"엄마, 이런 일 앞으로 다시는 안 생길 거야."}],"c":[["发","發","필 발"],["生","生","날 생"]],"why":"피어나(发) 생겨남(生) → 발생하다"},{"id":1578,"w":"发展","p":"fāzhǎn","k":"동·명","ko":"발전하다, 발전","g":"o","ex":[{"zh":"马来西亚这几年发展得很快。","py":"Mǎláixīyà zhè jǐ nián fāzhǎn de hěn kuài.","ko":"말레이시아는 요 몇 년 빠르게 발전했어."},{"zh":"妈妈，我想在这边好好发展。","py":"Māma, wǒ xiǎng zài zhèbiān hǎohǎo fāzhǎn.","ko":"엄마, 나 여기서 제대로 자리 잡고 싶어.","pat":"好好发展 = 제대로 성장하다(자리 잡다)"},{"zh":"老板想把公司发展到新加坡。","py":"Lǎobǎn xiǎng bǎ gōngsī fāzhǎn dào Xīnjiāpō.","ko":"사장님은 회사를 싱가포르까지 키우고 싶어 하셔."}],"c":[["发","發","필 발"],["展","展","펼 전"]],"why":"피어나(发) 펼쳐짐(展) → 발전하다"},{"id":1579,"w":"刚","p":"gāng","k":"부","ko":"방금, 막, 겨우","g":"o","ex":[{"zh":"我刚下班，马上去找你。","py":"Wǒ gāng xiàbān, mǎshàng qù zhǎo nǐ.","ko":"나 방금 퇴근했어, 바로 너 보러 갈게."},{"zh":"妈妈，我刚吃完饭，你吃了吗？","py":"Māma, wǒ gāng chī wán fàn, nǐ chī le ma?","ko":"엄마, 나 방금 밥 다 먹었어, 엄마는 먹었어?","pat":"刚 + 동사 + 完 = 방금 ~을 끝냈다"},{"zh":"这台机器是刚买的，还不太会用。","py":"Zhè tái jīqì shì gāng mǎi de, hái bù tài huì yòng.","ko":"이 기계는 막 산 거라 아직 잘 못 다뤄."}],"c":[["刚","剛","굳셀 강"]],"why":"굳셀 강(剛) → 단단하다, 방금"},{"id":1580,"w":"号码","p":"hàomǎ","k":"명","ko":"번호","g":"o","ex":[{"zh":"请给我您的电话号码。","py":"Qǐng gěi wǒ nín de diànhuà hàomǎ.","ko":"전화번호 좀 알려주세요."},{"zh":"{H}，你换手机号码了吗？","py":"{H}, nǐ huàn shǒujī hàomǎ le ma?","ko":"{H}, 폰 번호 바꿨어?","pat":"手机号码 = 휴대폰 번호"},{"zh":"老板，酒店的房间号码是多少？","py":"Lǎobǎn, jiǔdiàn de fángjiān hàomǎ shì duōshao?","ko":"사장님, 호텔 방 번호가 몇 번이에요?"}],"c":[["号","號","이름 호"],["码","碼","마노 마"]],"why":"번호(号)와 숫자(码) → 번호"},{"id":1581,"w":"好像","p":"hǎoxiàng","k":"부","ko":"마치 ~인 것 같다","g":"o","ex":[{"zh":"{H}今天好像不太开心。","py":"{H} jīntiān hǎoxiàng bú tài kāixīn.","ko":"{H}가 오늘 기분이 좀 안 좋은 것 같아."},{"zh":"爸爸，你好像又瘦了。","py":"Bàba, nǐ hǎoxiàng yòu shòu le.","ko":"아빠, 또 살 빠진 것 같아.","pat":"好像 + 상태 + 了 = ~한 것 같다"},{"zh":"这台机器的声音好像不太对。","py":"Zhè tái jīqì de shēngyīn hǎoxiàng bù tài duì.","ko":"이 기계 소리가 좀 이상한 것 같아."}],"c":[["好","好","좋을 호"],["像","像","모양 상"]],"why":"모양(像)이 꼭 그러함(好) → 마치 ~같다"},{"id":1582,"w":"合适","p":"héshì","k":"형","ko":"알맞다, 적당하다","g":"o","ex":[{"zh":"这个价格对客户来说很合适。","py":"Zhège jiàgé duì kèhù lái shuō hěn héshì.","ko":"이 가격이면 고객한테 딱 적당해."},{"zh":"{H}，这件衣服你穿很合适。","py":"{H}, zhè jiàn yīfu nǐ chuān hěn héshì.","ko":"{H}, 이 옷 너한테 딱이야.","pat":"穿 + 很合适 = (옷이) 딱 맞다/잘 어울리다"},{"zh":"爸爸，你觉得哪天回韩国比较合适？","py":"Bàba, nǐ juéde nǎ tiān huí Hánguó bǐjiào héshì?","ko":"아빠, 언제 한국 들어가는 게 좋을 것 같아?"}],"c":[["合","合","합할 합"],["适","適","맞을 적"]],"why":"합하여(合) 꼭 맞음(适) → 적합하다"},{"id":1583,"w":"坚持","p":"jiānchí","k":"동","ko":"꾸준히 하다, 끝까지 버티다","g":"o","ex":[{"zh":"{H}每天坚持跑步。","py":"{H} měi tiān jiānchí pǎobù.","ko":"{H}는 매일 꾸준히 달리기 해."},{"zh":"爸爸，你要坚持每天走走路。","py":"Bàba, nǐ yào jiānchí měitiān zǒuzou lù.","ko":"아빠, 매일 꾸준히 좀 걸어.","pat":"坚持 + 每天 + 동사 = 꾸준히 ~하다"},{"zh":"老板坚持要自己去见客户。","py":"Lǎobǎn jiānchí yào zìjǐ qù jiàn kèhù.","ko":"사장님이 굳이 직접 고객 만나러 가시겠대."}],"c":[["坚","堅","굳을 견"],["持","持","가질 지"]],"why":"굳게(坚) 지님(持) → 견지하다"},{"id":1584,"w":"饺子","p":"jiǎozi","k":"명","ko":"교자 (물만두)","g":"o","ex":[{"zh":"过年的时候，我们家都吃饺子。","py":"Guònián de shíhou, wǒmen jiā dōu chī jiǎozi.","ko":"설에는 우리 집은 늘 만두 먹어."},{"zh":"{H}，你包的饺子比饭馆的还好吃。","py":"{H}, nǐ bāo de jiǎozi bǐ fànguǎn de hái hǎochī.","ko":"{H}, 네가 빚은 만두가 식당 것보다 더 맛있어.","pat":"包饺子 = 만두를 빚다"},{"zh":"同事们中午一起去吃饺子了。","py":"Tóngshìmen zhōngwǔ yìqǐ qù chī jiǎozi le.","ko":"동료들이 점심에 다 같이 만두 먹으러 갔어."}],"c":[["饺","餃","경단 교"],["子","子","아들 자"]],"why":"경단(饺)+명사접미(子) → 만두"},{"id":1585,"w":"开心","p":"kāixīn","k":"형","ko":"즐겁다, 기쁘다","g":"o","ex":[{"zh":"{H}，见到你我真开心！","py":"{H}, jiàn dào nǐ wǒ zhēn kāixīn!","ko":"{H}, 너 보니까 진짜 좋다!"},{"zh":"爸爸听到这个消息很开心。","py":"Bàba tīngdào zhège xiāoxi hěn kāixīn.","ko":"아빠가 이 소식 듣고 엄청 기뻐하셨어.","pat":"听到/见到 + …… + 很开心 = ~해서 기쁘다"},{"zh":"今天的会开得很顺利，老板很开心。","py":"Jīntiān de huì kāi de hěn shùnlì, lǎobǎn hěn kāixīn.","ko":"오늘 회의 잘 끝나서 사장님 기분 좋으셔."}],"c":[["开","開","열 개"],["心","心","마음 심"]],"why":"마음(心)이 열림(开) → 즐겁다"},{"id":1586,"w":"可是","p":"kěshì","k":"연","ko":"그러나, 하지만","g":"o","ex":[{"zh":"我很想去，可是明天要加班。","py":"Wǒ hěn xiǎng qù, kěshì míngtiān yào jiābān.","ko":"정말 가고 싶은데 내일 야근해야 해."},{"zh":"妈妈，我也想回家，可是机票太贵了。","py":"Māma, wǒ yě xiǎng huí jiā, kěshì jīpiào tài guì le.","ko":"엄마, 나도 집에 가고 싶은데 비행기표가 너무 비싸.","pat":"A，可是B = A지만 B"},{"zh":"{H}想吃蛋糕，可是又怕胖。","py":"{H} xiǎng chī dàngāo, kěshì yòu pà pàng.","ko":"{H}는 케이크 먹고 싶은데 살찔까 봐 걱정해."}],"c":[["可","可","옳을 가"],["是","是","이 시"]],"why":"옳기는(可) 이러나(是) → 그러나"},{"id":1587,"w":"矿泉水","p":"kuàngquánshuǐ","k":"명","ko":"생수, 미네랄 워터","g":"o","ex":[{"zh":"给客户准备几瓶矿泉水吧。","py":"Gěi kèhù zhǔnbèi jǐ píng kuàngquánshuǐ ba.","ko":"고객분들 드릴 생수 몇 병 준비해 줘."},{"zh":"我去买两瓶矿泉水。","py":"Wǒ qù mǎi liǎng píng kuàngquánshuǐ.","ko":"생수 두 병 사 올게.","pat":"一瓶矿泉水 = 생수 한 병 (양사 瓶)"},{"zh":"爸爸，爬山别忘了带矿泉水。","py":"Bàba, pá shān bié wàng le dài kuàngquánshuǐ.","ko":"아빠, 등산 갈 때 생수 챙기는 거 잊지 마."}],"c":[["矿","鑛","쇳돌 광"],["泉","泉","샘 천"],["水","水","물 수"]],"why":"광물(矿) 샘(泉)의 물(水) → 생수"},{"id":1588,"w":"来自","p":"láizì","k":"동","ko":"~에서 오다, ~출신이다","g":"o","ex":[{"zh":"我们的同事来自五个国家。","py":"Wǒmen de tóngshì láizì wǔ ge guójiā.","ko":"우리 동료들은 다섯 나라에서 왔어."},{"zh":"这次的客户来自印度尼西亚。","py":"Zhè cì de kèhù láizì Yìndùníxīyà.","ko":"이번 고객은 인도네시아에서 왔어.","pat":"来自 + 국가/지역 = ~에서 왔다"},{"zh":"{H}，你们店里的东西都来自韩国吗？","py":"{H}, nǐmen diàn lǐ de dōngxi dōu láizì Hánguó ma?","ko":"{H}, 너희 가게 물건 다 한국에서 온 거야?"}],"c":[["来","來","올 래"],["自","自","부터 자"]],"why":"~로부터(自) 옴(来) → ~에서 오다"},{"id":1589,"w":"凉快","p":"liángkuai","k":"형","ko":"시원하다, 선선하다","g":"o","ex":[{"zh":"今天下了雨，凉快多了。","py":"Jīntiān xià le yǔ, liángkuai duō le.","ko":"오늘 비 와서 훨씬 시원해졌어."},{"zh":"妈妈，韩国现在凉快了吧？","py":"Māma, Hánguó xiànzài liángkuai le ba?","ko":"엄마, 한국 지금 선선해졌지?","pat":"凉快了 = 시원해졌다"},{"zh":"{H}，晚上海边很凉快，我们去走走吧。","py":"{H}, wǎnshang hǎibiān hěn liángkuai, wǒmen qù zǒuzou ba.","ko":"{H}, 밤에 바닷가 시원하니까 산책 가자."}],"c":[["凉","涼","서늘할 량"],["快","快","쾌할 쾌"]],"why":"서늘하여(凉) 상쾌함(快) → 시원하다"},{"id":1590,"w":"毛","p":"máo","k":"명·양","ko":"털, 마오 (위안의 1/10)","g":"o","ex":[{"zh":"{H}家的猫掉了很多毛。","py":"{H} jiā de māo diào le hěn duō máo.","ko":"{H}네 고양이 털이 엄청 빠졌어."},{"zh":"同事的衣服上都是猫毛。","py":"Tóngshì de yīfu shang dōu shì māo máo.","ko":"동료 옷에 고양이 털이 잔뜩 붙어 있어.","pat":"猫毛/狗毛 = 고양이/개 털"},{"zh":"妈妈，咱们家狗的毛太长了。","py":"Māma, zánmen jiā gǒu de máo tài cháng le.","ko":"엄마, 우리 집 개 털 너무 길어."}],"c":[["毛","毛","털 모"]],"why":"털이 난 모양 상형(毛) → 털"},{"id":1591,"w":"平时","p":"píngshí","k":"명","ko":"평소","g":"o","ex":[{"zh":"我平时很少喝酒。","py":"Wǒ píngshí hěn shǎo hē jiǔ.","ko":"나 평소에 술 잘 안 마셔."},{"zh":"{H}平时工作很忙，周末才有空。","py":"{H} píngshí gōngzuò hěn máng, zhōumò cái yǒu kòng.","ko":"{H}는 평소에 일이 바빠서 주말에만 시간 있어.","pat":"平时……，周末…… = 평소엔 ~, 주말엔 ~"},{"zh":"爸爸平时不爱说话，可是很关心我。","py":"Bàba píngshí bù ài shuōhuà, kěshì hěn guānxīn wǒ.","ko":"아빠는 평소에 말이 없지만 나를 많이 챙기셔."}],"c":[["平","平","평평할 평"],["时","時","때 시"]],"why":"평상의(平) 때(时) → 평소"},{"id":1592,"w":"沙发","p":"shāfā","k":"명","ko":"소파","g":"o","ex":[{"zh":"爸爸在沙发上睡着了。","py":"Bàba zài shāfā shang shuì zháo le.","ko":"아빠가 소파에서 잠드셨어."},{"zh":"你先坐在沙发上休息一下吧。","py":"Nǐ xiān zuò zài shāfā shang xiūxi yíxià ba.","ko":"먼저 소파에 앉아서 좀 쉬어.","pat":"坐在沙发上 = 소파에 앉다"},{"zh":"老板办公室的沙发很舒服。","py":"Lǎobǎn bàngōngshì de shāfā hěn shūfu.","ko":"사장님 사무실 소파 엄청 편해."}],"c":[["沙","沙","모래 사"],["发","發","필 발"]],"why":"음역 sha-fa(沙发) → 소파"},{"id":1593,"w":"勺子","p":"sháozi","k":"명","ko":"숟가락, 국자","g":"o","ex":[{"zh":"服务员，能再给我一个勺子吗？","py":"Fúwùyuán, néng zài gěi wǒ yí ge sháozi ma?","ko":"저기요, 숟가락 하나 더 주실 수 있어요?"},{"zh":"爸爸，用勺子吃米饭更方便。","py":"Bàba, yòng sháozi chī mǐfàn gèng fāngbiàn.","ko":"아빠, 밥은 숟가락으로 먹는 게 더 편해.","pat":"用勺子 + 동사 = 숟가락으로 ~하다"},{"zh":"{H}，你的勺子掉地上了，我去换一个。","py":"{H}, nǐ de sháozi diào dì shang le, wǒ qù huàn yī ge.","ko":"{H}, 숟가락 바닥에 떨어졌네, 내가 바꿔 올게."}],"c":[["勺","勺","구기 작"],["子","子","아들 자"]],"why":"구기(勺)+명사접미(子) → 국자, 숟가락"},{"id":1594,"w":"生活","p":"shēnghuó","k":"명·동","ko":"생활, 생활하다","g":"o","ex":[{"zh":"我已经习惯了马来西亚的生活。","py":"Wǒ yǐjing xíguàn le Mǎláixīyà de shēnghuó.","ko":"나 이제 말레이시아 생활에 익숙해졌어."},{"zh":"妈妈，你别担心我在这边的生活。","py":"Māma, nǐ bié dānxīn wǒ zài zhèbiān de shēnghuó.","ko":"엄마, 여기서 내 생활 걱정하지 마.","pat":"……的生活 = ~에서의 생활"},{"zh":"{H}，我们以后的生活一定会很好。","py":"{H}, wǒmen yǐhòu de shēnghuó yídìng huì hěn hǎo.","ko":"{H}, 우리 앞으로의 생활은 분명 좋을 거야."}],"c":[["生","生","날 생"],["活","活","살 활"]],"why":"나서(生) 살아감(活) → 생활"},{"id":1595,"w":"收","p":"shōu","k":"동","ko":"받다, 거두다, 치우다","g":"o","ex":[{"zh":"客户的钱已经收到了。","py":"Kèhù de qián yǐjing shōu dào le.","ko":"고객 돈 이미 받았어."},{"zh":"{H}，这个礼物你一定要收下。","py":"{H}, zhège lǐwù nǐ yídìng yào shōuxià.","ko":"{H}, 이 선물 꼭 받아 줘.  때 테니스 잘 치셨어."}],"c":[["网","網","그물 망"],["球","球","공 구"]],"why":"그물(网) 너머로 치는 공(球) → 테니스"},{"id":1600,"w":"网站","p":"wǎngzhàn","k":"명","ko":"웹사이트","g":"o","ex":[{"zh":"您可以先看看我们的网站。","py":"Nín kěyǐ xiān kànkan wǒmen de wǎngzhàn.","ko":"먼저 저희 웹사이트 한번 보세요."},{"zh":"妈妈，机票我已经在网站上买好了。","py":"Māma, jīpiào wǒ yǐjing zài wǎngzhàn shang mǎi hǎo le.","ko":"엄마, 비행기표 이미 사이트에서 샀어.","pat":"在网站上 + 동사 = 웹사이트에서 ~하다"},{"zh":"{H}，你们店有网站吗？","py":"{H}, nǐmen diàn yǒu wǎngzhàn ma?","ko":"{H}, 너희 가게 웹사이트 있어?"}],"c":[["网","網","그물 망"],["站","站","역마을 참"]],"why":"그물망(网) 위의 정거장(站) → 웹사이트"},{"id":1601,"w":"卫生间","p":"wèishēngjiān","k":"명","ko":"화장실","g":"o","ex":[{"zh":"请问，卫生间在哪儿？","py":"Qǐngwèn, wèishēngjiān zài nǎr?","ko":"실례지만, 화장실 어디예요?"},{"zh":"{H}，我去一下卫生间，你等我。","py":"{H}, wǒ qù yíxià wèishēngjiān, nǐ děng wǒ.","ko":"{H}, 나 화장실 좀 다녀올게, 기다려.","pat":"去一下卫生间 = 화장실 좀 다녀오다"},{"zh":"老板，工厂的卫生间又坏了。","py":"Lǎobǎn, gōngchǎng de wèishēngjiān yòu huài le.","ko":"사장님, 공장 화장실 또 고장 났어요."}],"c":[["卫","衛","지킬 위"],["生","生","날 생"],["间","間","사이 간"]],"why":"위생(卫生)을 위한 칸(间) → 화장실"},{"id":1602,"w":"行","p":"xíng","k":"형","ko":"괜찮다, 좋다, 된다","g":"o","ex":[{"zh":"行，就按你说的办。","py":"Xíng, jiù àn nǐ shuō de bàn.","ko":"좋아, 네 말대로 하자."},{"zh":"{H}，明天晚上七点见，行吗？","py":"{H}, míngtiān wǎnshang qī diǎn jiàn, xíng ma?","ko":"{H}, 내일 저녁 7시에 보자, 괜찮아?","pat":"……，行吗？ = ~해도 돼? / 괜찮아?"},{"zh":"妈妈，这个周末不行，我要加班。","py":"Māma, zhège zhōumò bù xíng, wǒ yào jiābān.","ko":"엄마, 이번 주말은 안 돼, 출근해야 해."}],"c":[["行","行","다닐 행"]],"why":"다닐 행(行) → 통하다, 좋다"},{"id":1603,"w":"学期","p":"xuéqī","k":"명","ko":"학기","g":"o","ex":[{"zh":"这个学期我有三门课。","py":"Zhège xuéqī wǒ yǒu sān mén kè.","ko":"이번 학기에 수업이 세 개야."},{"zh":"妈妈，下个学期我的课就少了。","py":"Māma, xià ge xuéqī wǒ de kè jiù shǎo le.","ko":"엄마, 다음 학기엔 수업이 줄어.","pat":"下个学期 = 다음 학기"},{"zh":"{H}，这个学期结束以后，我们去旅游吧。","py":"{H}, zhège xuéqī jiéshù yǐhòu, wǒmen qù lǚyóu ba.","ko":"{H}, 이번 학기 끝나면 여행 가자."}],"c":[["学","學","배울 학"],["期","期","기약할 기"]],"why":"배우는(学) 기간(期) → 학기"},{"id":1604,"w":"页","p":"yè","k":"양","ko":"쪽, 페이지","g":"o","ex":[{"zh":"请看第五页的价格。","py":"Qǐng kàn dì wǔ yè de jiàgé.","ko":"5페이지 가격 봐주세요."},{"zh":"{H}，这本书你看到第几页了？","py":"{H}, zhè běn shū nǐ kàndào dì jǐ yè le?","ko":"{H}, 이 책 몇 페이지까지 읽었어?","pat":"第 + 수 + 页 = ~페이지"},{"zh":"MBA的作业要写二十页。","py":"MBA de zuòyè yào xiě èrshí yè.","ko":"MBA 과제 20페이지 써야 돼."}],"c":[["页","頁","책장 엽"]],"why":"머리(頁) → 책의 한 장 → 쪽"},{"id":1605,"w":"以为","p":"yǐwéi","k":"동","ko":"(잘못) ~인 줄 알다, 여기다","g":"o","ex":[{"zh":"{H}，我以为你今天不来了。","py":"{H}, wǒ yǐwéi nǐ jīntiān bù lái le.","ko":"{H}, 너 오늘 안 오는 줄 알았어."},{"zh":"妈妈，我还以为你已经睡了。","py":"Māma, wǒ hái yǐwéi nǐ yǐjing shuì le.","ko":"엄마, 벌써 자는 줄 알았어.","pat":"我还以为…… = (사실과 달리) ~인 줄 알았어"},{"zh":"我以为客户今天会来，结果没来。","py":"Wǒ yǐwéi kèhù jīntiān huì lái, jiéguǒ méi lái.","ko":"고객이 오늘 올 줄 알았는데 안 왔어."}],"c":[["以","以","써 이"],["为","爲","할 위"]],"why":"~로써(以) 삼음(为) → 여기다(착각)"},{"id":1606,"w":"羽毛球","p":"yǔmáoqiú","k":"명","ko":"배드민턴","g":"o","ex":[{"zh":"下班后我们去打羽毛球吧。","py":"Xiàbān hòu wǒmen qù dǎ yǔmáoqiú ba.","ko":"퇴근하고 배드민턴 치러 가자."},{"zh":"{H}，你羽毛球打得比我好。","py":"{H}, nǐ yǔmáoqiú dǎ de bǐ wǒ hǎo.","ko":"{H}, 너 배드민턴 나보다 잘 친다.","pat":"打羽毛球 = 배드민턴을 치다"},{"zh":"爸爸以前每天早上都打羽毛球。","py":"Bàba yǐqián měitiān zǎoshang dōu dǎ yǔmáoqiú.","ko":"아빠는 예전에 매일 아침 배드민턴 치셨어."}],"c":[["羽","羽","깃 우"],["毛","毛","털 모"],["球","球","공 구"]],"why":"깃털(羽毛)로 만든 공(球) → 배드민턴"},{"id":1607,"w":"语言","p":"yǔyán","k":"명","ko":"언어, 말","g":"o","ex":[{"zh":"在新加坡，很多人会说三种语言。","py":"Zài Xīnjiāpō, hěn duō rén huì shuō sān zhǒng yǔyán.","ko":"싱가포르에선 많은 사람이 세 가지 언어를 해."},{"zh":"{H}，你会说几种语言？","py":"{H}, nǐ huì shuō jǐ zhǒng yǔyán?","ko":"{H}, 너 몇 개 언어 할 줄 알아?","pat":"说 + 수 + 种语言 = ~개 언어를 하다"},{"zh":"我跟客户语言不通，只能用英语。","py":"Wǒ gēn kèhù yǔyán bù tōng, zhǐ néng yòng Yīngyǔ.","ko":"고객이랑 말이 안 통해서 영어로 할 수밖에 없어."}],"c":[["语","語","말씀 어"],["言","言","말씀 언"]],"why":"말(语)과 말씀(言) → 언어"},{"id":1608,"w":"脏","p":"zāng","k":"형","ko":"더럽다","g":"o","ex":[{"zh":"儿子，衣服脏了要自己洗啊。","py":"Érzi, yīfu zāng le yào zìjǐ xǐ a.","ko":"아들, 옷 더러워지면 직접 빨아야 해."},{"zh":"{H}，桌子脏了，我来擦一下。","py":"{H}, zhuōzi zāng le, wǒ lái cā yíxià.","ko":"{H}, 테이블 더러워졌네, 내가 닦을게.","pat":"……脏了 = 더러워졌다"},{"zh":"工厂里很脏，别穿新鞋来。","py":"Gōngchǎng lǐ hěn zāng, bié chuān xīn xié lái.","ko":"공장 안이 더러우니까 새 신발 신고 오지 마."}],"c":[["脏","髒","더러울 장"]],"why":"뼈(骨)에 때 낌 → 더럽다"},{"id":1609,"w":"咱们","p":"zánmen","k":"대","ko":"우리 (듣는 사람 포함)","g":"o","ex":[{"zh":"{H}，咱们晚上吃什么？","py":"{H}, zánmen wǎnshang chī shénme?","ko":"{H}, 우리 저녁에 뭐 먹을까?"},{"zh":"老板，咱们什么时候去见客户？","py":"Lǎobǎn, zánmen shénme shíhou qù jiàn kèhù?","ko":"사장님, 우리 언제 고객 만나러 가요?","pat":"咱们 + 동사 = (듣는 사람 포함) 우리 ~하다"},{"zh":"妈妈，咱们家今年春节吃什么？","py":"Māma, zánmen jiā jīnnián Chūnjié chī shénme?","ko":"엄마, 우리 집 올해 설에 뭐 먹어?"}],"c":[["咱","咱","우리 찰"],["们","們","들 문"]],"why":"우리(咱)+복수(们) → (듣는 이 포함) 우리"},{"id":1610,"w":"照","p":"zhào","k":"동","ko":"비추다, (사진을) 찍다, 거울에 비추어 보다","g":"o","ex":[{"zh":"早上的阳光照进了房间。","py":"Zǎoshang de yángguāng zhào jìn le fángjiān.","ko":"아침 햇살이 방 안으로 비쳐 들어왔어."},{"zh":"太阳照在车里，太热了。","py":"Tàiyáng zhào zài chē lǐ, tài rè le.","ko":"햇빛이 차 안으로 비쳐서 너무 더워.","pat":"阳光/太阳 + 照在 + 장소 = 햇빛이 ~에 비치다"},{"zh":"{H}，别用手机照我的脸。","py":"{H}, bié yòng shǒujī zhào wǒ de liǎn.","ko":"{H}, 폰 불빛으로 내 얼굴 비추지 마."}],"c":[["照","照","비칠 조"]],"why":"불(灬)로 밝게 비춤(昭) → 비추다"},{"id":1611,"w":"只要","p":"zhǐyào","k":"연","ko":"~하기만 하면","g":"o","ex":[{"zh":"只要有时间，我就去看{H}。","py":"Zhǐyào yǒu shíjiān, wǒ jiù qù kàn {H}.","ko":"시간만 있으면 {H} 보러 가."},{"zh":"妈妈，只要你身体好，我就放心了。","py":"Māma, zhǐyào nǐ shēntǐ hǎo, wǒ jiù fàngxīn le.","ko":"엄마, 엄마만 건강하면 난 안심이야.","pat":"只要A，就B = A하기만 하면 B"},{"zh":"只要机器不坏，这些货明天就能做完。","py":"Zhǐyào jīqì bù huài, zhèxiē huò míngtiān jiù néng zuò wán.","ko":"기계만 고장 안 나면 이 물건 내일 다 만들 수 있어."}],"c":[["只","只","다만 지"],["要","要","요긴할 요"]],"why":"다만(只) 그것만 요함(要) → ~하기만 하면"},{"id":1612,"w":"最好","p":"zuìhǎo","k":"부","ko":"가장 좋기는, ~하는 게 제일 좋다","g":"o","ex":[{"zh":"你最好先给客户打个电话。","py":"Nǐ zuìhǎo xiān gěi kèhù dǎ ge diànhuà.","ko":"먼저 고객한테 전화해 보는 게 제일 좋겠어."},{"zh":"{H}，你最好带把伞，今天会下雨。","py":"{H}, nǐ zuìhǎo dài bǎ sǎn, jīntiān huì xià yǔ.","ko":"{H}, 우산 챙기는 게 좋겠어, 오늘 비 온대.","pat":"你最好 + 동사 = ~하는 게 좋겠어"},{"zh":"爸爸，你最好别一个人去爬山。","py":"Bàba, nǐ zuìhǎo bié yī ge rén qù pá shān.","ko":"아빠, 혼자 등산 안 가는 게 좋겠어."}],"c":[["最","最","가장 최"],["好","好","좋을 호"]],"why":"가장(最) 좋음(好) → 제일 좋다"},{"id":1613,"w":"白","p":"bái","k":"형·부","ko":"하얗다, 헛되이","g":"o","ex":[{"zh":"{H}穿白裙子很漂亮。","py":"{H} chuān bái qúnzi hěn piàoliang.","ko":"{H}는 흰 치마 입으면 예뻐."},{"zh":"客户要白色的，不要黑色的。","py":"Kèhù yào báisè de, bù yào hēisè de.","ko":"고객은 하얀색 원해, 검은색 말고.","pat":"白色的 = 흰색 (것)"},{"zh":"爸爸，你的头发怎么白了这么多？","py":"Bàba, nǐ de tóufa zěnme bái le zhème duō?","ko":"아빠, 머리가 왜 이렇게 많이 하얘졌어?"}],"c":[["白","白","흰 백"]],"why":"흰 백(白) → 하얗다"},{"id":1614,"w":"北京","p":"Běijīng","k":"명","ko":"베이징","g":"o","ex":[{"zh":"爸爸，咱们明年一起去北京吧。","py":"Bàba, zánmen míngnián yìqǐ qù Běijīng ba.","ko":"아빠, 우리 내년에 같이 베이징 가자."},{"zh":"{H}，你去过北京吗？","py":"{H}, nǐ qù guo Běijīng ma?","ko":"{H}, 베이징 가 봤어?","pat":"去过北京 = 베이징에 가 봤다"},{"zh":"老板下个月要去北京见客户。","py":"Lǎobǎn xià ge yuè yào qù Běijīng jiàn kèhù.","ko":"사장님 다음 달에 베이징 가서 고객 만나셔."}],"c":[["北","北","북녘 북"],["京","京","서울 경"]],"why":"북쪽(北)의 서울(京) → 베이징"},{"id":1615,"w":"唱歌","p":"chànggē","k":"동","ko":"노래를 부르다","g":"o","ex":[{"zh":"{H}唱歌特别好听。","py":"{H} chànggē tèbié hǎotīng.","ko":"{H}는 노래를 진짜 잘해."},{"zh":"下班以后，同事们去唱歌了。","py":"Xiàbān yǐhòu, tóngshìmen qù chànggē le.","ko":"퇴근하고 동료들 노래 부르러 갔어.","pat":"去唱歌 = 노래(방) 하러 가다"},{"zh":"妈妈，你年轻的时候喜欢唱歌吗？","py":"Māma, nǐ niánqīng de shíhou xǐhuan chànggē ma?","ko":"엄마, 젊었을 때 노래 부르는 거 좋아했어?"}],"c":[["唱","唱","부를 창"],["歌","歌","노래 가"]],"why":"노래(歌)를 부름(唱) → 노래하다"},{"id":1616,"w":"春","p":"chūn","k":"명","ko":"봄","g":"o","ex":[{"zh":"韩国春天的花很漂亮。","py":"Hánguó chūntiān de huā hěn piàoliang.","ko":"한국 봄꽃 진짜 예뻐."},{"zh":"{H}，明年春天跟我回韩国吧。","py":"{H}, míngnián chūntiān gēn wǒ huí Hánguó ba.","ko":"{H}, 내년 봄에 나랑 한국 가자.","pat":"春天 = 봄 (구어에서는 주로 春天)"},{"zh":"爸爸，春天到了，你又可以去爬山了。","py":"Bàba, chūntiān dào le, nǐ yòu kěyǐ qù pá shān le.","ko":"아빠, 봄 왔으니 또 등산 갈 수 있겠다."}],"c":[["春","春","봄 춘"]],"why":"봄 춘(春) → 봄"},{"id":1617,"w":"打篮球","p":"dǎlánqiú","k":"동","ko":"농구를 하다","g":"o","ex":[{"zh":"同事们周五晚上打篮球。","py":"Tóngshìmen zhōuwǔ wǎnshang dǎ lánqiú.","ko":"동료들은 금요일 저녁에 농구해."},{"zh":"爸爸，我上学的时候每天打篮球。","py":"Bàba, wǒ shàngxué de shíhou měitiān dǎ lánqiú.","ko":"아빠, 나 학교 다닐 때 매일 농구했잖아.","pat":"打篮球 = 농구하다 (打 + 구기 종목)"},{"zh":"{H}，你喜欢看男生打篮球吗？","py":"{H}, nǐ xǐhuan kàn nánshēng dǎ lánqiú ma?","ko":"{H}, 남자들 농구하는 거 보는 거 좋아해?"}],"c":[["打","打","칠 타"],["篮","籃","바구니 람"],["球","球","공 구"]],"why":"바구니(篮)에 공(球)을 침(打) → 농구하다"},{"id":1618,"w":"电子邮件","p":"diànzǐyóujiàn","k":"명","ko":"이메일","g":"o","ex":[{"zh":"我已经给客户发了电子邮件。","py":"Wǒ yǐjing gěi kèhù fā le diànzǐ yóujiàn.","ko":"고객한테 이메일 벌써 보냈어."},{"zh":"妈妈，电子邮件你会发吗？我教你。","py":"Māma, diànzǐ yóujiàn nǐ huì fā ma? Wǒ jiāo nǐ.","ko":"엄마, 이메일 보낼 줄 알아? 내가 알려 줄게.","pat":"发电子邮件 = 이메일을 보내다"},{"zh":"老板，客户的电子邮件您看了吗？","py":"Lǎobǎn, kèhù de diànzǐ yóujiàn nín kàn le ma?","ko":"사장님, 고객 이메일 보셨어요?"}],"c":[["电","電","번개 전"],["子","子","아들 자"],["邮","郵","우편 우"],["件","件","물건 건"]],"why":"전자(电子) 우편(邮) 물건(件) → 이메일"},{"id":1619,"w":"第一","p":"dìyī","k":"수","ko":"첫 번째, 제일","g":"o","ex":[{"zh":"这是我第一次见{H}的父母。","py":"Zhè shì wǒ dìyī cì jiàn {H} de fùmǔ.","ko":"{H} 부모님 뵙는 건 이번이 처음이야."},{"zh":"我第一天来工厂的时候什么都不懂。","py":"Wǒ dì yī tiān lái gōngchǎng de shíhou shénme dōu bù dǒng.","ko":"공장에 처음 온 날엔 아무것도 몰랐어.","pat":"第一天 / 第一次 = 첫날 / 처음"},{"zh":"妈妈，身体第一，工作第二。","py":"Māma, shēntǐ dì yī, gōngzuò dì èr.","ko":"엄마, 건강이 먼저고 일은 그다음이야."}],"c":[["第","第","차례 제"],["一","一","한 일"]],"why":"차례(第)의 첫째(一) → 제1"},{"id":1620,"w":"冬","p":"dōng","k":"명","ko":"겨울","g":"o","ex":[{"zh":"妈妈，韩国冬天冷，多穿点儿。","py":"Māma, Hánguó dōngtiān lěng, duō chuān diǎnr.","ko":"엄마, 한국 겨울 추우니까 옷 많이 입어."},{"zh":"{H}，冬天我们去韩国看雪吧。","py":"{H}, dōngtiān wǒmen qù Hánguó kàn xuě ba.","ko":"{H}, 겨울에 한국 가서 눈 보자.","pat":"冬天 = 겨울 (구어에서는 주로 冬天)"},{"zh":"马来西亚没有冬天，我有点儿想韩国的雪。","py":"Mǎláixīyà méiyǒu dōngtiān, wǒ yǒudiǎnr xiǎng Hánguó de xuě.","ko":"말레이시아는 겨울이 없어서 한국 눈이 좀 그리워."}],"c":[["冬","冬","겨울 동"]],"why":"겨울 동(冬) → 겨울"},{"id":1621,"w":"服务员","p":"fúwùyuán","k":"명","ko":"종업원","g":"o","ex":[{"zh":"服务员，我们要点菜。","py":"Fúwùyuán, wǒmen yào diǎn cài.","ko":"저기요, 주문할게요."},{"zh":"{H}，你叫一下服务员，再要一瓶水。","py":"{H}, nǐ jiào yíxià fúwùyuán, zài yào yī píng shuǐ.","ko":"{H}, 직원 좀 불러 줘, 물 한 병 더 시키자.","pat":"叫(一下)服务员 = 직원(종업원)을 부르다"},{"zh":"客户说那家酒店的服务员很好。","py":"Kèhù shuō nà jiā jiǔdiàn de fúwùyuán hěn hǎo.","ko":"고객이 그 호텔 직원들이 친절하대."}],"c":[["服","服","일할 복"],["务","務","힘쓸 무"],["员","員","인원 원"]],"why":"섬기며(服) 힘쓰는(务) 사람(员) → 종업원"},{"id":1622,"w":"公共汽车","p":"gōnggòngqìchē","k":"명","ko":"버스","g":"o","ex":[{"zh":"我坐公共汽车去新加坡。","py":"Wǒ zuò gōnggòng qìchē qù Xīnjiāpō.","ko":"나 버스 타고 싱가포르 가."},{"zh":"爸爸每天坐公共汽车去上班。","py":"Bàba měitiān zuò gōnggòng qìchē qù shàngbān.","ko":"아빠는 매일 버스 타고 출근하셔.","pat":"坐公共汽车 + 去 + 장소 = 버스 타고 ~에 가다"},{"zh":"{H}，我们坐公共汽车去吧，很方便。","py":"{H}, wǒmen zuò gōnggòng qìchē qù ba, hěn fāngbiàn.","ko":"{H}, 버스 타고 가자, 편해."}],"c":[["公","公","공변될 공"],["共","共","함께 공"],["汽","汽","김 기"],["车","車","수레 차"]],"why":"공공(公共)의 증기(汽) 수레(车) → 버스"},{"id":1623,"w":"刮风","p":"guāfēng","k":"동","ko":"바람이 불다","g":"o","ex":[{"zh":"{H}，外面刮风了，多穿一件吧。","py":"{H}, wàimiàn guāfēng le, duō chuān yí jiàn ba.","ko":"{H}, 밖에 바람 분다, 하나 더 입어."},{"zh":"妈妈，韩国那边刮风了吗？冷不冷？","py":"Māma, Hánguó nàbiān guā fēng le ma? Lěng bù lěng?","ko":"엄마, 한국 바람 불어? 추워?","pat":"刮风了 = 바람이 분다"},{"zh":"今天刮风，工厂外面的东西要收进来。","py":"Jīntiān guā fēng, gōngchǎng wàimiàn de dōngxi yào shōu jìnlái.","ko":"오늘 바람 불어서 공장 밖에 있는 물건 들여놔야 해."}],"c":[["刮","颳","모진바람 괄"],["风","風","바람 풍"]],"why":"바람(风)이 휘몰아침(刮) → 바람이 불다"},{"id":1624,"w":"黑","p":"hēi","k":"형","ko":"검다, 어둡다","g":"o","ex":[{"zh":"这些东西怎么变黑了？","py":"Zhèxiē dōngxi zěnme biàn hēi le?","ko":"이것들 왜 까맣게 변했지?"},{"zh":"{H}，天黑了，我送你回家。","py":"{H}, tiān hēi le, wǒ sòng nǐ huí jiā.","ko":"{H}, 날 어두워졌다, 집에 데려다줄게.","pat":"天黑了 = 날이 어두워졌다"},{"zh":"爸爸，你去海边玩，怎么变得这么黑？","py":"Bàba, nǐ qù hǎibiān wán, zěnme biàn de zhème hēi?","ko":"아빠, 바닷가 놀러 가더니 왜 이렇게 까매졌어?"}],"c":[["黑","黑","검을 흑"]],"why":"검을 흑(黑) → 검다"},{"id":1625,"w":"红","p":"hóng","k":"형","ko":"빨갛다, 붉다","g":"o","ex":[{"zh":"{H}，你的脸怎么这么红？","py":"{H}, nǐ de liǎn zěnme zhème hóng?","ko":"{H}, 얼굴이 왜 이렇게 빨개?"},{"zh":"中国人过年喜欢穿红衣服。","py":"Zhōngguó rén guònián xǐhuan chuān hóng yīfu.","ko":"중국 사람들은 설에 빨간 옷 입는 걸 좋아해.","pat":"红 + 명사 = 빨간 ~"},{"zh":"妈妈，你买的红苹果很甜。","py":"Māma, nǐ mǎi de hóng píngguǒ hěn tián.","ko":"엄마가 산 빨간 사과 엄청 달아."}],"c":[["红","紅","붉을 홍"]],"why":"붉을 홍(紅) → 붉다"},{"id":1626,"w":"黄河","p":"Huánghé","k":"명","ko":"황허강","g":"o","ex":[{"zh":"黄河是中国第二长的河。","py":"Huánghé shì Zhōngguó dì èr cháng de hé.","ko":"황허는 중국에서 두 번째로 긴 강이야."},{"zh":"爸爸说他很想去黄河边看看。","py":"Bàba shuō tā hěn xiǎng qù Huánghé biān kànkan.","ko":"아빠가 황허 강가에 꼭 가 보고 싶대.","pat":"黄河边 = 황허 강가"},{"zh":"{H}，你看过黄河吗？","py":"{H}, nǐ kàn guo Huánghé ma?","ko":"{H}, 황허 본 적 있어?"}],"c":[["黄","黃","누를 황"],["河","河","물 하"]],"why":"누런(黄) 강물(河) → 황하"},{"id":1627,"w":"火车站","p":"huǒchēzhàn","k":"명","ko":"기차역","g":"o","ex":[{"zh":"妈妈，我去火车站接你。","py":"Māma, wǒ qù huǒchēzhàn jiē nǐ.","ko":"엄마, 내가 기차역으로 마중 갈게."},{"zh":"{H}，我在火车站门口等你。","py":"{H}, wǒ zài huǒchēzhàn ménkǒu děng nǐ.","ko":"{H}, 기차역 입구에서 기다릴게.","pat":"在火车站门口 = 기차역 입구에서"},{"zh":"客户问我们工厂离火车站远不远。","py":"Kèhù wèn wǒmen gōngchǎng lí huǒchēzhàn yuǎn bù yuǎn.","ko":"고객이 우리 공장이 기차역에서 먼지 물어봤어."}],"c":[["火","火","불 화"],["车","車","수레 차"],["站","站","역마을 참"]],"why":"불(火) 수레(车)의 정거장(站) → 기차역"},{"id":1628,"w":"聊天","p":"liáotiān","k":"동","ko":"수다를 떨다, 이야기를 나누다","g":"o","ex":[{"zh":"下班后，我常常和同事聊天。","py":"Xiàbān hòu, wǒ chángcháng hé tóngshì liáotiān.","ko":"퇴근하고 동료들이랑 자주 수다 떨어."},{"zh":"爸爸喜欢在饭桌上跟我聊天。","py":"Bàba xǐhuan zài fànzhuō shang gēn wǒ liáotiān.","ko":"아빠는 밥상에서 나랑 얘기하는 걸 좋아하셔.","pat":"跟 + 사람 + 聊天 = ~와 수다 떨다"},{"zh":"我跟{H}每天晚上都打电话聊天。","py":"Wǒ gēn {H} měitiān wǎnshang dōu dǎ diànhuà liáotiān.","ko":"나는 {H}랑 매일 밤 전화로 수다 떨어."}],"c":[["聊","聊","한담할 료"],["天","天","하늘 천"]],"why":"하늘(天) 아래 한담(聊) → 수다 떨다"},{"id":1629,"w":"绿","p":"lǜ","k":"형","ko":"초록색이다, 푸르다","g":"o","ex":[{"zh":"机器上的绿灯是什么意思？","py":"Jīqì shang de lǜ dēng shì shénme yìsi?","ko":"기계에 있는 초록불은 무슨 뜻이야?"},{"zh":"{H}，绿灯了，快走吧。","py":"{H}, lǜ dēng le, kuài zǒu ba.","ko":"{H}, 초록불이다, 빨리 건너자.","pat":"绿灯 = 초록불"},{"zh":"妈妈，春天到了，山都绿了吧？","py":"Māma, chūntiān dào le, shān dōu lǜ le ba?","ko":"엄마, 봄 왔으니 산이 다 푸르러졌지?"}],"c":[["绿","綠","푸를 록"]],"why":"실(糸)을 푸르게 물들임 → 초록색"},{"id":1630,"w":"面条","p":"miàntiáo","k":"명","ko":"국수, 면","g":"o","ex":[{"zh":"中午我吃了一碗面条。","py":"Zhōngwǔ wǒ chī le yì wǎn miàntiáo.","ko":"점심에 국수 한 그릇 먹었어."},{"zh":"妈妈，我生日那天吃了面条。","py":"Māma, wǒ shēngrì nà tiān chī le miàntiáo.","ko":"엄마, 생일날 국수 먹었어.","pat":"吃面条 = 국수를 먹다 (생일엔 长寿面)"},{"zh":"{H}，你做的面条真好吃。","py":"{H}, nǐ zuò de miàntiáo zhēn hǎochī.","ko":"{H}, 네가 만든 국수 진짜 맛있다."}],"c":[["面","麵","국수 면"],["条","條","가지 조"]],"why":"국수(面) 가닥(条) → 국수"},{"id":1631,"w":"爬山","p":"páshān","k":"동","ko":"등산하다","g":"o","ex":[{"zh":"{H}，下个周末我们去爬山吧。","py":"{H}, xià ge zhōumò wǒmen qù páshān ba.","ko":"{H}, 다음 주말에 등산 가자."},{"zh":"老板周末常常带我们去爬山。","py":"Lǎobǎn zhōumò chángcháng dài wǒmen qù pá shān.","ko":"사장님이 주말에 자주 우리 데리고 등산 가셔.","pat":"去爬山 = 등산 가다"},{"zh":"爸爸，你身体不好，别去爬山了。","py":"Bàba, nǐ shēntǐ bù hǎo, bié qù pá shān le.","ko":"아빠, 몸도 안 좋은데 등산 가지 마."}],"c":[["爬","爬","기어오를 파"],["山","山","메 산"]],"why":"산(山)을 기어오름(爬) → 등산하다"},{"id":1632,"w":"秋","p":"qiū","k":"명","ko":"가을","g":"o","ex":[{"zh":"韩国秋天的天气最舒服。","py":"Hánguó qiūtiān de tiānqì zuì shūfu.","ko":"한국은 가을 날씨가 제일 좋아."},{"zh":"{H}，秋天的时候我带你去韩国。","py":"{H}, qiūtiān de shíhou wǒ dài nǐ qù Hánguó.","ko":"{H}, 가을에 너 데리고 한국 갈게.","pat":"秋天 = 가을 (구어에서는 주로 秋天)"},{"zh":"爸爸，秋天来了，早上出去要多穿点儿。","py":"Bàba, qiūtiān lái le, zǎoshang chūqù yào duō chuān diǎnr.","ko":"아빠, 가을이야, 아침에 나갈 때 옷 좀 더 입어."}],"c":[["秋","秋","가을 추"]],"why":"벼(禾)가 불(火)처럼 익는 때 → 가을"},{"id":1633,"w":"刷牙","p":"shuāyá","k":"동","ko":"이를 닦다","g":"o","ex":[{"zh":"{H}，刷牙以后别再吃东西了。","py":"{H}, shuāyá yǐhòu bié zài chī dōngxi le.","ko":"{H}, 양치하고 나서 또 먹지 마."},{"zh":"爸爸，睡觉前一定要刷牙。","py":"Bàba, shuìjiào qián yídìng yào shuā yá.","ko":"아빠, 자기 전에 꼭 양치해.","pat":"睡觉前刷牙 = 자기 전에 양치하다"},{"zh":"在工厂吃完午饭，我都去刷牙。","py":"Zài gōngchǎng chī wán wǔfàn, wǒ dōu qù shuā yá.","ko":"공장에서 점심 먹고 나면 나는 늘 양치해."}],"c":[["刷","刷","솔질할 쇄"],["牙","牙","어금니 아"]],"why":"이(牙)를 솔질함(刷) → 양치질하다"},{"id":1634,"w":"踢足球","p":"tīzúqiú","k":"동","ko":"축구를 하다","g":"o","ex":[{"zh":"我小时候常常跟爸爸踢足球。","py":"Wǒ xiǎo shíhou chángcháng gēn bàba tī zúqiú.","ko":"어렸을 때 아빠랑 자주 축구했어."},{"zh":"同事们周六下午踢足球，叫我也去。","py":"Tóngshìmen zhōuliù xiàwǔ tī zúqiú, jiào wǒ yě qù.","ko":"동료들이 토요일 오후에 축구하는데 나도 오래.","pat":"踢足球 = 축구하다 (足球는 踢)"},{"zh":"{H}，你说你弟弟也爱踢足球？","py":"{H}, nǐ shuō nǐ dìdi yě ài tī zúqiú?","ko":"{H}, 네 남동생도 축구 좋아한다고 했지?"}],"c":[["踢","踢","찰 척"],["足","足","발 족"],["球","球","공 구"]],"why":"발(足)로 하는 공(球)을 참(踢) → 축구하다"},{"id":1635,"w":"夏","p":"xià","k":"명","ko":"여름","g":"o","ex":[{"zh":"马来西亚一年都像夏天。","py":"Mǎláixīyà yì nián dōu xiàng xiàtiān.","ko":"말레이시아는 일 년 내내 여름 같아."},{"zh":"韩国的夏天也很热，可是比这里好。","py":"Hánguó de xiàtiān yě hěn rè, kěshì bǐ zhèlǐ hǎo.","ko":"한국 여름도 덥긴 한데 여기보단 나아.","pat":"夏天 = 여름 (구어에서는 주로 夏天)"},{"zh":"{H}，今年夏天我们去哪儿旅游？","py":"{H}, jīnnián xiàtiān wǒmen qù nǎr lǚyóu?","ko":"{H}, 올여름에 우리 어디로 여행 가?"}],"c":[["夏","夏","여름 하"]],"why":"여름 하(夏) → 여름"},{"id":1636,"w":"小姐","p":"xiǎojiě","k":"명","ko":"아가씨, ~양, (여성) 종업원","g":"o","ex":[{"zh":"李小姐，您要的东西已经寄出去了。","py":"Lǐ xiǎojiě, nín yào de dōngxi yǐjing jì chūqu le.","ko":"리 씨, 요청하신 물건 이미 발송했어요."},{"zh":"王小姐，请问您找哪位？","py":"Wáng xiǎojiě, qǐngwèn nín zhǎo nǎ wèi?","ko":"왕 선생님, 실례지만 누구 찾으세요?","pat":"성 + 小姐 = ~씨 (여성 호칭)"},{"zh":"妈妈，那位小姐是{H}的朋友。","py":"Māma, nà wèi xiǎojiě shì {H} de péngyou.","ko":"엄마, 저 아가씨는 {H} 친구야."}],"c":[["小","小","작을 소"],["姐","姐","누이 저"]],"why":"젊은(小) 누이(姐) → 아가씨"},{"id":1637,"w":"行李箱","p":"xínglǐxiāng","k":"명","ko":"여행 가방, 캐리어","g":"o","ex":[{"zh":"我的行李箱放在{H}家。","py":"Wǒ de xínglǐxiāng fàng zài {H} jiā.","ko":"내 캐리어 {H}네 집에 놔뒀어."},{"zh":"妈妈，你的行李箱太重了，我来拿。","py":"Māma, nǐ de xínglǐxiāng tài zhòng le, wǒ lái ná.","ko":"엄마, 캐리어 너무 무겁다, 내가 들게.","pat":"行李箱太重 = 캐리어가 무겁다"},{"zh":"老板出差的行李箱放在办公室了。","py":"Lǎobǎn chūchāi de xínglǐxiāng fàng zài bàngōngshì le.","ko":"사장님 출장 캐리어 사무실에 뒀어."}],"c":[["行","行","다닐 행"],["李","李","오얏 리"],["箱","箱","상자 상"]],"why":"여행(行) 짐(李)을 넣는 상자(箱) → 캐리어"},{"id":1638,"w":"熊
