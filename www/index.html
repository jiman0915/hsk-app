 방"],["间","間","사이 간"]],"why":"방(房) 칸(间) → 방"},{"id":1121,"w":"放心","p":"fàngxīn","k":"동","ko":"안심하다, 마음을 놓다","g":"o","ex":[{"zh":"爸，你放心，我会照顾好自己。","py":"bà, nǐ fàngxīn, wǒ huì zhàogù hǎo zìjǐ.","ko":"아빠, 안심해, 나 스스로 잘 챙길게."},{"zh":"您放心，这批货下周一一定到。","py":"Nín fàngxīn, zhè pī huò xià zhōuyī yídìng dào.","ko":"안심하세요, 이번 물건은 다음 주 월요일에 꼭 도착해요.","pat":"您放心，… = 안심하세요, ~"},{"zh":"{H}，你放心，我开车会小心的。","py":"{H}, nǐ fàngxīn, wǒ kāichē huì xiǎoxīn de.","ko":"{H}, 걱정 마, 운전 조심해서 할게."}],"c":[["放","放","놓을 방"],["心","心","마음 심"]],"why":"마음(心)을 내려놓음(放) → 안심하다"},{"id":1122,"w":"发烧","p":"fāshāo","k":"동","ko":"열이 나다","g":"o","ex":[{"zh":"我有点儿发烧，今天请一天假。","py":"wǒ yǒudiǎnr fāshāo, jīntiān qǐng yī tiān jià.","ko":"열이 좀 나서 오늘 하루 휴가 낼게요."},{"zh":"同事的孩子发烧到三十九度，他今天请假了。","py":"Tóngshì de háizi fāshāo dào sānshíjiǔ dù, tā jīntiān qǐngjià le.","ko":"동료 애가 39도까지 열이 나서 동료가 오늘 휴가 냈어.","pat":"发烧 + 到 + 숫자 + 度 = ~도까지 열이 나다"},{"zh":"妈，你发烧了怎么不早点儿告诉我？","py":"Mā, nǐ fāshāo le zěnme bù zǎo diǎnr gàosu wǒ?","ko":"엄마, 열났으면 왜 진작 말 안 했어?"}],"c":[["发","發","필 발"],["烧","燒","사를 소"]],"why":"열기(烧)가 일어남(发) → 열이 나다"},{"id":1123,"w":"发现","p":"fāxiàn","k":"동","ko":"발견하다, 알아차리다","g":"o","ex":[{"zh":"检查的时候我发现了一个问题。","py":"jiǎnchá de shíhou wǒ fāxiàn le yī ge wèntí.","ko":"점검하다가 문제 하나를 발견했어."},{"zh":"我发现{H}最近瘦了不少。","py":"Wǒ fāxiàn {H} zuìjìn shòule bù shǎo.","ko":"보니까 {H}가 요즘 살이 많이 빠졌더라.","pat":"我发现 + 문장 = 보니까 ~더라"},{"zh":"回家以后我发现爸爸的头发白了很多。","py":"Huí jiā yǐhòu wǒ fāxiàn bàba de tóufa báile hěn duō.","ko":"집에 가 보니 아빠 머리가 많이 하얘지셨더라."}],"c":[["发","發","필 발"],["现","現","나타날 현"]],"why":"드러나(发) 나타남(现) → 발견하다"},{"id":1124,"w":"非常","p":"fēicháng","k":"부","ko":"매우, 아주","g":"o","ex":[{"zh":"非常感谢您对我们的支持。","py":"fēicháng gǎnxiè nín duì wǒmen de zhīchí.","ko":"저희를 지지해 주셔서 정말 감사합니다."},{"zh":"妈，这里的天气非常热，每天都三十多度。","py":"Mā, zhèlǐ de tiānqì fēicháng rè, měi tiān dōu sānshí duō dù.","ko":"엄마, 여기 날씨 엄청 더워, 매일 30도가 넘어.","pat":"非常 + 형용사 = 아주 ~하다"},{"zh":"{H}，你今天穿得非常漂亮。","py":"{H}, nǐ jīntiān chuān de fēicháng piàoliang.","ko":"{H}, 너 오늘 옷 진짜 예쁘게 입었다."}],"c":[["非","非","아닐 비"],["常","常","항상 상"]],"why":"보통(常)이 아님(非) → 매우"},{"id":1125,"w":"飞机","p":"fēijī","k":"명","ko":"비행기","g":"o","ex":[{"zh":"我坐明天早上的飞机回首尔。","py":"wǒ zuò míngtiān zǎoshang de fēijī huí Shǒu'ěr.","ko":"나 내일 아침 비행기로 서울 가."},{"zh":"{H}第一次坐飞机去韩国，有点儿紧张。","py":"{H} dì-yī cì zuò fēijī qù Hánguó, yǒudiǎnr jǐnzhāng.","ko":"{H}는 처음 비행기 타고 한국 가는 거라 좀 긴장했어.","pat":"坐飞机 + 去 = 비행기 타고 ~에 가다"},{"zh":"客户的飞机晚点了，我在机场等了两个小时。","py":"Kèhù de fēijī wǎndiǎn le, wǒ zài jīchǎng děngle liǎng ge xiǎoshí.","ko":"고객 비행기가 연착돼서 공항에서 두 시간 기다렸어."}],"c":[["飞","飛","날 비"],["机","機","틀 기"]],"why":"나는(飞) 기계(机) → 비행기"},{"id":1126,"w":"分","p":"fēn","k":"동·양","ko":"나누다, 분(시간), 점(점수)","g":"o","ex":[{"zh":"我们把这些零件分成三组吧。","py":"wǒmen bǎ zhèxiē língjiàn fēn chéng sān zǔ ba.","ko":"이 부품들 세 그룹으로 나누자."},{"zh":"{H}把蛋糕分给大家吃。","py":"{H} bǎ dàngāo fēn gěi dàjiā chī.","ko":"{H}가 케이크를 다 같이 먹으라고 나눠 줬어.","pat":"把 A 分给 B = A를 B에게 나눠 주다"},{"zh":"爸，我们把这些东西分到两个行李箱里吧。","py":"Bà, wǒmen bǎ zhèxiē dōngxi fēn dào liǎng ge xínglixiāng li ba.","ko":"아빠, 이 짐들 캐리어 두 개에 나눠 담자."}],"c":[["分","分","나눌 분"]],"why":"분리(分離)의 분 → 나누다"},{"id":1127,"w":"分钟","p":"fēnzhōng","k":"명","ko":"분(시간)","g":"o","ex":[{"zh":"再等我十分钟，我马上下来。","py":"zài děng wǒ shí fēnzhōng, wǒ mǎshàng xiàlai.","ko":"10분만 더 기다려, 금방 내려갈게."},{"zh":"妈，我在开会，十分钟以后给你打回去。","py":"Mā, wǒ zài kāihuì, shí fēnzhōng yǐhòu gěi nǐ dǎ huíqu.","ko":"엄마, 나 회의 중이야, 10분 뒤에 다시 전화할게.","pat":"숫자 + 分钟以后 = ~분 뒤에"},{"zh":"从我家到公司开车只要十五分钟。","py":"Cóng wǒ jiā dào gōngsī kāichē zhǐ yào shíwǔ fēnzhōng.","ko":"우리 집에서 회사까지 차로 15분밖에 안 걸려."}],"c":[["分","分","나눌 분"],["钟","鐘","쇠북 종"]],"why":"시계(钟)의 분(分) → 분"},{"id":1128,"w":"附近","p":"fùjìn","k":"명","ko":"부근, 근처","g":"o","ex":[{"zh":"{H}家附近新开了一家咖啡店。","py":"{H} jiā fùjìn xīn kāi le yī jiā kāfēi diàn.","ko":"{H} 집 근처에 카페가 새로 생겼어."},{"zh":"妈，你家附近是不是新开了一个超市？","py":"Mā, nǐ jiā fùjìn shì bu shì xīn kāile yí ge chāoshì?","ko":"엄마, 집 근처에 마트 새로 생겼지?","pat":"장소 + 附近 = ~ 근처"},{"zh":"工厂附近没有什么吃饭的地方。","py":"Gōngchǎng fùjìn méiyǒu shénme chīfàn de dìfang.","ko":"공장 근처에는 밥 먹을 데가 별로 없어."}],"c":[["附","附","붙을 부"],["近","近","가까울 근"]],"why":"붙어(附) 가까운(近) 곳 → 부근"},{"id":1129,"w":"复习","p":"fùxí","k":"동","ko":"복습하다","g":"o","ex":[{"zh":"下班以后我还要复习HSK。","py":"xiàbān yǐhòu wǒ hái yào fùxí HSK.","ko":"퇴근하고 나서 HSK 복습도 해야 돼."},{"zh":"明天考试，我今天晚上得好好复习一下。","py":"Míngtiān kǎoshì, wǒ jīntiān wǎnshang děi hǎohǎo fùxí yíxià.","ko":"내일 시험이라 오늘 밤에 제대로 복습해야 해.","pat":"好好复习(一下) = 제대로 복습하다"},{"zh":"同事看见我午饭时间还在复习，说我太认真了。","py":"Tóngshì kànjiàn wǒ wǔfàn shíjiān hái zài fùxí, shuō wǒ tài rènzhēn le.","ko":"동료가 내가 점심시간에도 복습하는 걸 보고 너무 열심이래."}],"c":[["复","復","회복할 복"],["习","習","익힐 습"]],"why":"다시(复) 익힘(习) → 복습하다"},{"id":1130,"w":"刚才","p":"gāngcái","k":"명","ko":"방금, 막","g":"o","ex":[{"zh":"刚才老板找你，你去哪儿了？","py":"gāngcái lǎobǎn zhǎo nǐ, nǐ qù nǎr le?","ko":"방금 사장님이 너 찾았어, 어디 갔었어?"},{"zh":"妈，刚才我在开车，没听见电话。","py":"Mā, gāngcái wǒ zài kāichē, méi tīngjiàn diànhuà.","ko":"엄마, 방금 운전 중이라 전화 못 들었어.","pat":"刚才 + 동작 = 방금 ~했다"},{"zh":"{H}，刚才是你给我打电话吗？","py":"{H}, gāngcái shì nǐ gěi wǒ dǎ diànhuà ma?","ko":"{H}, 방금 나한테 전화한 거 너야?"}],"c":[["刚","剛","굳셀 강"],["才","才","재주 재"]],"why":"막(刚) 비로소(才) → 방금"},{"id":1131,"w":"干净","p":"gānjìng","k":"형","ko":"깨끗하다","g":"o","ex":[{"zh":"零件要先洗干净才能电镀。","py":"língjiàn yào xiān xǐ gānjìng cái néng diàndù.","ko":"부품은 먼저 깨끗이 씻어야 도금할 수 있어."},{"zh":"吃饭以前先把手洗干净。","py":"Chīfàn yǐqián xiān bǎ shǒu xǐ gānjìng.","ko":"밥 먹기 전에 먼저 손 깨끗이 씻어.","pat":"동사(洗·打扫) + 干净 = 깨끗이 ~하다"},{"zh":"{H}，你的车洗得真干净。","py":"{H}, nǐ de chē xǐ de zhēn gānjìng.","ko":"{H}, 네 차 진짜 깨끗하게 세차했다."}],"c":[["干","乾","마를 건"],["净","淨","깨끗할 정"]],"why":"말라(干) 깨끗함(净) → 깨끗하다"},{"id":1132,"w":"感冒","p":"gǎnmào","k":"명·동","ko":"감기, 감기에 걸리다","g":"o","ex":[{"zh":"{H}感冒了，我给她买了药。","py":"{H} gǎnmào le, wǒ gěi tā mǎi le yào.","ko":"{H}가 감기 걸려서 약 사 줬어."},{"zh":"妈，你的感冒好点儿了吗？","py":"Mā, nǐ de gǎnmào hǎo diǎnr le ma?","ko":"엄마, 감기는 좀 나았어?","pat":"感冒好(点儿)了 = 감기가 (좀) 나았다"},{"zh":"最近很多同事都感冒了，大家要注意。","py":"Zuìjìn hěn duō tóngshì dōu gǎnmào le, dàjiā yào zhùyì.","ko":"요즘 동료들이 많이 감기 걸렸으니 다들 조심하자."}],"c":[["感","感","느낄 감"],["冒","冒","무릅쓸 모"]],"why":"찬 기운에 감(感)해 무릅씀(冒) → 감기"},{"id":1133,"w":"感兴趣","p":"gǎnxìngqù","k":"동","ko":"관심이 있다, 흥미를 느끼다","g":"o","ex":[{"zh":"客户对我们的新技术很感兴趣。","py":"kèhù duì wǒmen de xīn jìshù hěn gǎn xìngqù.","ko":"고객이 우리 신기술에 관심이 많아."},{"zh":"{H}对韩国菜很感兴趣。","py":"{H} duì Hánguócài hěn gǎn xìngqù.","ko":"{H}는 한국 음식에 관심이 많아.","pat":"对 + 대상 + 感兴趣 = ~에 관심이 있다"},{"zh":"爸爸最近对手机游戏很感兴趣。","py":"Bàba zuìjìn duì shǒujī yóuxì hěn gǎn xìngqù.","ko":"아빠가 요즘 휴대폰 게임에 푹 빠지셨어."}],"c":[["感","感","느낄 감"],["兴","興","일 흥"],["趣","趣","뜻 취"]],"why":"흥취(兴趣)를 느낌(感) → 관심 있다"},{"id":1134,"w":"高","p":"gāo","k":"형","ko":"높다, (키가) 크다","g":"o","ex":[{"zh":"新加坡的楼都很高。","py":"Xīnjiāpō de lóu dōu hěn gāo.","ko":"싱가포르 건물들은 다 높아."},{"zh":"{H}的个子不高，但是很漂亮。","py":"{H} de gèzi bù gāo, dànshì hěn piàoliang.","ko":"{H}는 키는 안 크지만 정말 예뻐.","pat":"个子高 = 키가 크다"},{"zh":"车间的门不够高，新机器进不来。","py":"Chējiān de mén bú gòu gāo, xīn jīqì jìn bu lái.","ko":"작업장 문이 높이가 모자라서 새 기계가 안 들어와."}],"c":[["高","高","높을 고"]],"why":"고저(高低)의 고 → 높다"},{"id":1135,"w":"告诉","p":"gàosu","k":"동","ko":"알리다, 말해 주다","g":"o","ex":[{"zh":"别告诉我妈，她会担心的。","py":"bié gàosu wǒ mā, tā huì dānxīn de.","ko":"우리 엄마한테 말하지 마, 걱정하실 거야."},{"zh":"老板告诉我们，明天客户要来。","py":"Lǎobǎn gàosu wǒmen, míngtiān kèhù yào lái.","ko":"사장님이 내일 고객이 온다고 알려 주셨어.","pat":"告诉 + 사람 + 내용 = ~에게 ~을 알려 주다"},{"zh":"{H}告诉我，她下个月要换工作。","py":"{H} gàosu wǒ, tā xià ge yuè yào huàn gōngzuò.","ko":"{H}가 다음 달에 직장을 옮긴다고 말해 줬어."}],"c":[["告","告","고할 고"],["诉","訴","호소할 소"]],"why":"고하고(告) 호소함(诉) → 알리다"},{"id":1136,"w":"高兴","p":"gāoxìng","k":"형","ko":"기쁘다, 즐겁다","g":"o","ex":[{"zh":"{H}，听说你要来，我妈很高兴。","py":"{H}, tīngshuō nǐ yào lái, wǒ mā hěn gāoxìng.","ko":"{H}, 네가 온다니까 우리 엄마가 엄청 좋아하셔."},{"zh":"认识您很高兴，这是我的名片。","py":"Rènshi nín hěn gāoxìng, zhè shì wǒ de míngpiàn.","ko":"만나서 반갑습니다, 제 명함입니다.","pat":"认识你很高兴 = 만나서 반가워요"},{"zh":"爸，听说你身体好多了，我很高兴。","py":"Bà, tīngshuō nǐ shēntǐ hǎo duō le, wǒ hěn gāoxìng.","ko":"아빠, 몸이 많이 좋아지셨다니 나 정말 기뻐."}],"c":[["高","高","높을 고"],["兴","興","일 흥"]],"why":"흥(兴)이 높음(高) → 기쁘다"},{"id":1137,"w":"个","p":"gè","k":"양","ko":"개, 명(사람·사물을 세는 단위)","g":"o","ex":[{"zh":"我们公司有八十个员工。","py":"wǒmen gōngsī yǒu bāshí ge yuángōng.","ko":"우리 회사 직원은 80명이야."},{"zh":"妈，我想问你一个问题。","py":"Mā, wǒ xiǎng wèn nǐ yí ge wèntí.","ko":"엄마, 하나 물어볼 게 있어.","pat":"一个 + 명사 = 하나의 ~ (가장 일반적인 양사)"},{"zh":"{H}，你一个人在家别太晚睡。","py":"{H}, nǐ yí ge rén zài jiā bié tài wǎn shuì.","ko":"{H}, 혼자 집에 있을 때 너무 늦게 자지 마."}],"c":[["个","個","낱 개"]],"why":"개인(個人)의 개 → 개·명"},{"id":1138,"w":"哥哥","p":"gēge","k":"명","ko":"형, 오빠","g":"o","ex":[{"zh":"{H}的哥哥在中国工作。","py":"{H} de gēge zài Zhōngguó gōngzuò.","ko":"{H} 오빠는 중국에서 일해."},{"zh":"同事的哥哥在新加坡当医生。","py":"Tóngshì de gēge zài Xīnjiāpō dāng yīshēng.","ko":"동료 형이 싱가포르에서 의사로 일해.","pat":"사람 + 的哥哥 = ~의 형/오빠"},{"zh":"小时候我很想要一个哥哥。","py":"Xiǎoshíhou wǒ hěn xiǎng yào yí ge gēge.","ko":"어릴 때 나 형이 하나 있었으면 했어."}],"c":[["哥","哥","형 가"],["哥","哥","형 가"]],"why":"형(哥) 겹침 → 형·오빠"},{"id":1139,"w":"给","p":"gěi","k":"동·개","ko":"주다, ~에게","g":"o","ex":[{"zh":"{H}，这个礼物是给你的。","py":"{H}, zhège lǐwù shì gěi nǐ de.","ko":"{H}, 이 선물 너 주는 거야."},{"zh":"老板给了我们每个人一个红包。","py":"Lǎobǎn gěile wǒmen měi ge rén yí ge hóngbāo.","ko":"사장님이 우리 모두한테 세뱃돈 봉투를 하나씩 주셨어.","pat":"给 + 사람 + 물건 = ~에게 ~을 주다"},{"zh":"妈，你别给我钱了，我有。","py":"Mā, nǐ bié gěi wǒ qián le, wǒ yǒu.","ko":"엄마, 이제 나한테 돈 주지 마, 나 있어."}],"c":[["给","給","줄 급"]],"why":"공급(供給)의 급 → 주다"},{"id":1140,"w":"跟","p":"gēn","k":"개·동","ko":"~와, ~을 따라, 따라가다","g":"o","ex":[{"zh":"周末我跟{H}一起去逛街。","py":"zhōumò wǒ gēn {H} yīqǐ qù guàngjiē.","ko":"주말에 {H}랑 같이 쇼핑하러 가."},{"zh":"我跟同事一起去见客户。","py":"Wǒ gēn tóngshì yìqǐ qù jiàn kèhù.","ko":"나 동료랑 같이 고객 만나러 가.","pat":"跟 + 사람 + 一起 + 동사 = ~와 함께 ~하다"},{"zh":"妈，我想跟你说一件事。","py":"Mā, wǒ xiǎng gēn nǐ shuō yí jiàn shì.","ko":"엄마, 엄마한테 할 얘기가 하나 있어."}],"c":[["跟","跟","발꿈치 근"]],"why":"발꿈치(跟)처럼 뒤따름 → ~와"},{"id":1141,"w":"更","p":"gèng","k":"부","ko":"더, 더욱","g":"o","ex":[{"zh":"新的生产线比旧的更快。","py":"xīn de shēngchǎnxiàn bǐ jiù de gèng kuài.","ko":"새 생산라인이 옛날 거보다 더 빨라."},{"zh":"妈，我觉得你做的菜比饭店的更好吃。","py":"Mā, wǒ juéde nǐ zuò de cài bǐ fàndiàn de gèng hǎochī.","ko":"엄마, 엄마 음식이 식당 것보다 더 맛있는 것 같아.","pat":"A 比 B 更 + 형용사 = A가 B보다 더 ~하다"},{"zh":"{H}，你短头发更好看。","py":"{H}, nǐ duǎn tóufa gèng hǎokàn.","ko":"{H}, 너 짧은 머리가 더 예뻐."}],"c":[["更","更","다시 갱"]],"why":"갱신(更新)의 갱 → 더욱"},{"id":1142,"w":"根据","p":"gēnjù","k":"개·명","ko":"~에 근거하여, 근거","g":"o","ex":[{"zh":"根据客户的要求，我们改了颜色。","py":"gēnjù kèhù de yāoqiú, wǒmen gǎi le yánsè.","ko":"고객 요청에 따라 색상을 바꿨어."},{"zh":"根据妈妈的要求，我每天都给她发一张照片。","py":"Gēnjù māma de yāoqiú, wǒ měi tiān dōu gěi tā fā yì zhāng zhàopiàn.","ko":"엄마 요청대로 매일 엄마한테 사진을 한 장씩 보내.","pat":"根据 + 명사 + 的要求/情况 = ~에 따라"},{"zh":"根据地图，{H}家就在前面。","py":"Gēnjù dìtú, {H} jiā jiù zài qiánmiàn.","ko":"지도대로라면 {H}네 집이 바로 앞이야."}],"c":[["根","根","뿌리 근"],["据","據","의거할 거"]],"why":"뿌리(根)에 의거함(据) → 근거하여"},{"id":1143,"w":"个子","p":"gèzi","k":"명","ko":"키, 체격","g":"o","ex":[{"zh":"我的个子比{H}高一个头。","py":"wǒ de gèzi bǐ {H} gāo yī ge tóu.","ko":"내 키가 {H}보다 머리 하나만큼 커."},{"zh":"新同事个子很高，比老板高多了。","py":"Xīn tóngshì gèzi hěn gāo, bǐ lǎobǎn gāo duō le.","ko":"새 동료는 키가 커서 사장님보다 훨씬 커.","pat":"个子很高/不高 = 키가 크다/작다"},{"zh":"我的个子像爸爸，眼睛像妈妈。","py":"Wǒ de gèzi xiàng bàba, yǎnjing xiàng māma.","ko":"나는 키는 아빠 닮고 눈은 엄마 닮았어."}],"c":[["个","個","낱 개"],["子","子","아들 자"]],"why":"한 사람(个)의 몸집 → 키"},{"id":1144,"w":"公斤","p":"gōngjīn","k":"양","ko":"킬로그램(kg)","g":"o","ex":[{"zh":"妈，我最近瘦了两公斤。","py":"mā, wǒ zuìjìn shòu le liǎng gōngjīn.","ko":"엄마, 나 요즘 2킬로 빠졌어."},{"zh":"这些零件一共重五百公斤。","py":"Zhèxiē língjiàn yígòng zhòng wǔbǎi gōngjīn.","ko":"이 부품들 다 합쳐서 무게가 500킬로야.","pat":"重 + 숫자 + 公斤 = 무게가 ~kg"},{"zh":"{H}说她想再瘦三公斤。","py":"{H} shuō tā xiǎng zài shòu sān gōngjīn.","ko":"{H}가 3킬로 더 빼고 싶대."}],"c":[["公","公","공평할 공"],["斤","斤","근 근"]],"why":"공식(公) 근(斤) 단위 → 킬로그램"},{"id":1145,"w":"公司","p":"gōngsī","k":"명","ko":"회사","g":"o","ex":[{"zh":"我们公司是做电镀的。","py":"wǒmen gōngsī shì zuò diàndù de.","ko":"저희 회사는 도금 일을 해요."},{"zh":"爸，我们公司下个月要搬家了。","py":"Bà, wǒmen gōngsī xià ge yuè yào bānjiā le.","ko":"아빠, 우리 회사 다음 달에 이사 가.","pat":"我们公司 = 우리 회사"},{"zh":"{H}的公司在乌节路附近。","py":"{H} de gōngsī zài Wūjié Lù fùjìn.","ko":"{H} 회사는 오차드 로드 근처에 있어."}],"c":[["公","公","공평할 공"],["司","司","맡을 사"]],"why":"공적으로(公) 일을 맡음(司) → 회사"},{"id":1146,"w":"公园","p":"gōngyuán","k":"명","ko":"공원","g":"o","ex":[{"zh":"星期天我们去公园走走吧。","py":"xīngqītiān wǒmen qù gōngyuán zǒuzou ba.","ko":"일요일에 우리 공원 가서 좀 걷자."},{"zh":"妈，你每天去公园走路，身体会更好。","py":"Mā, nǐ měi tiān qù gōngyuán zǒulù, shēntǐ huì gèng hǎo.","ko":"엄마, 매일 공원 가서 걸으면 몸이 더 좋아질 거야.","pat":"去公园 + 走路/散步 = 공원에 가서 걷다"},{"zh":"工厂旁边有个小公园，中午我常去走走。","py":"Gōngchǎng pángbiān yǒu ge xiǎo gōngyuán, zhōngwǔ wǒ cháng qù zǒuzou.","ko":"공장 옆에 작은 공원이 있어서 점심때 자주 걸으러 가."}],"c":[["公","公","공평할 공"],["园","園","동산 원"]],"why":"공공(公)의 동산(园) → 공원"},{"id":1147,"w":"工作","p":"gōngzuò","k":"동·명","ko":"일하다, 일, 직업","g":"o","ex":[{"zh":"爸，我的工作很忙，但是很有意思。","py":"bà, wǒ de gōngzuò hěn máng, dànshì hěn yǒu yìsi.","ko":"아빠, 내 일 바쁘긴 한데 재밌어."},{"zh":"新同事刚找到这份工作，很努力。","py":"Xīn tóngshì gāng zhǎodào zhè fèn gōngzuò, hěn nǔlì.","ko":"새 동료는 이 일자리를 막 구해서 아주 열심히 해.","pat":"找工作·换工作 = 일자리를 구하다·이직하다"},{"zh":"{H}很喜欢她现在的工作。","py":"{H} hěn xǐhuan tā xiànzài de gōngzuò.","ko":"{H}는 지금 하는 일을 아주 좋아해."}],"c":[["工","工","장인 공"],["作","作","지을 작"]],"why":"공(工)들여 지음(作) → 일·직업"},{"id":1148,"w":"狗","p":"gǒu","k":"명","ko":"개(동물)","g":"o","ex":[{"zh":"{H}想养一只小狗。","py":"{H} xiǎng yǎng yī zhī xiǎo gǒu.","ko":"{H}가 강아지 한 마리 키우고 싶대."},{"zh":"客户工厂门口有一只大狗，我有点儿怕。","py":"Kèhù gōngchǎng ménkǒu yǒu yì zhī dà gǒu, wǒ yǒudiǎnr pà.","ko":"고객 공장 입구에 큰 개가 있어서 좀 무서워.","pat":"一只 + 狗 / 养狗 = 개 한 마리 / 개를 키우다"},{"zh":"妈，家里的小狗还好吗？","py":"Mā, jiā li de xiǎo gǒu hái hǎo ma?","ko":"엄마, 집에 강아지는 잘 있어?"}],"c":[["狗","狗","개 구"]],"why":"황구(黃狗)의 구 → 개"},{"id":1149,"w":"关","p":"guān","k":"동","ko":"닫다, 끄다","g":"o","ex":[{"zh":"下班前请把机器都关了。","py":"xiàbān qián qǐng bǎ jīqì dōu guān le.","ko":"퇴근 전에 기계 전부 꺼 주세요."},{"zh":"{H}，睡觉前把空调关了吧。","py":"{H}, shuìjiào qián bǎ kōngtiáo guān le ba.","ko":"{H}, 자기 전에 에어컨 끄자.","pat":"把 + 기기 + 关了 = ~을 끄다"},{"zh":"妈，你出门的时候记得关门。","py":"Mā, nǐ chūmén de shíhou jìde guān mén.","ko":"엄마, 나갈 때 문 닫는 거 잊지 마."}],"c":[["关","關","빗장 관"]],"why":"빗장(关)을 지름 → 닫다·끄다"},{"id":1150,"w":"关心","p":"guānxīn","k":"동","ko":"관심을 갖다, 신경 쓰다","g":"o","ex":[{"zh":"谢谢老板关心，我已经好多了。","py":"xièxie lǎobǎn guānxīn, wǒ yǐjīng hǎo duō le.","ko":"신경 써 주셔서 감사해요 사장님, 이제 많이 나았어요."},{"zh":"{H}很关心我的身体，总让我早点儿睡。","py":"{H} hěn guānxīn wǒ de shēntǐ, zǒng ràng wǒ zǎo diǎnr shuì.","ko":"{H}는 내 건강을 많이 챙겨서 늘 일찍 자래.","pat":"关心 + 사람/건강 = ~을 챙기다, 신경 쓰다"},{"zh":"爸妈最关心的就是我什么时候结婚。","py":"Bà mā zuì guānxīn de jiù shì wǒ shénme shíhou jiéhūn.","ko":"부모님이 제일 신경 쓰는 건 내가 언제 결혼하느냐야."}],"c":[["关","關","관계할 관"],["心","心","마음 심"]],"why":"마음(心)을 관계함(关) → 관심 갖다"},{"id":1151,"w":"关于","p":"guānyú","k":"개","ko":"~에 관하여","g":"o","ex":[{"zh":"关于价格的问题，我们明天再谈。","py":"guānyú jiàgé de wèntí, wǒmen míngtiān zài tán.","ko":"가격 문제에 관해서는 내일 다시 얘기하시죠."},{"zh":"妈，关于买房子的事，我们见面再说。","py":"Mā, guānyú mǎi fángzi de shì, wǒmen jiànmiàn zài shuō.","ko":"엄마, 집 사는 얘기는 만나서 하자.","pat":"关于 + 명사 + 的事/问题 = ~에 관한 일"},{"zh":"关于去韩国的事，{H}想再想想。","py":"Guānyú qù Hánguó de shì, {H} xiǎng zài xiǎngxiang.","ko":"한국 가는 일에 관해서는 {H}가 좀 더 생각해 보고 싶대."}],"c":[["关","關","관계할 관"],["于","於","어조사 어"]],"why":"~에(于) 관계됨(关) → ~에 관하여"},{"id":1152,"w":"贵","p":"guì","k":"형","ko":"비싸다, 귀하다","g":"o","ex":[{"zh":"新加坡的东西比新山贵多了。","py":"Xīnjiāpō de dōngxi bǐ Xīnshān guì duō le.","ko":"싱가포르 물건이 조호바루보다 훨씬 비싸."},{"zh":"{H}，这个包太贵了，我们再看看别的。","py":"{H}, zhège bāo tài guì le, wǒmen zài kànkan bié de.","ko":"{H}, 이 가방 너무 비싸다, 다른 것 좀 더 보자.","pat":"太贵了 = 너무 비싸다"},{"zh":"这台新机器很贵，老板还在考虑。","py":"Zhè tái xīn jīqì hěn guì, lǎobǎn hái zài kǎolǜ.","ko":"이 새 기계가 비싸서 사장님이 아직 고민 중이야."}],"c":[["贵","貴","귀할 귀"]],"why":"귀중(貴重)의 귀 → 비싸다"},{"id":1153,"w":"过","p":"guo","k":"조","ko":"~한 적이 있다(경험)","g":"o","ex":[{"zh":"{H}，你去过首尔吗？","py":"{H}, nǐ qù guo Shǒu'ěr ma?","ko":"{H}, 서울 가 본 적 있어?"},{"zh":"我们以前跟这个客户见过面。","py":"Wǒmen yǐqián gēn zhège kèhù jiànguo miàn.","ko":"우리 예전에 이 고객이랑 만난 적 있어.","pat":"동사 + 过 = ~해 본 적 있다"},{"zh":"我妈从来没坐过这么长时间的飞机。","py":"Wǒ mā cónglái méi zuòguo zhème cháng shíjiān de fēijī.","ko":"우리 엄마는 이렇게 오래 비행기 타 본 적이 없어."}],"c":[["过","過","지날 과"]],"why":"과거(過去)의 과 → 경험 조사 guo"},{"id":1154,"w":"国家","p":"guójiā","k":"명","ko":"국가, 나라","g":"o","ex":[{"zh":"我们公司的客户来自好几个国家。","py":"wǒmen gōngsī de kèhù láizì hǎo jǐ ge guójiā.","ko":"우리 회사 고객은 여러 나라에서 와."},{"zh":"{H}去过很多国家，最喜欢日本。","py":"{H} qùguo hěn duō guójiā, zuì xǐhuan Rìběn.","ko":"{H}는 여러 나라에 가 봤는데 일본을 제일 좋아해.","pat":"去过很多国家 = 여러 나라에 가 봤다"},{"zh":"爸，你最想去哪个国家玩？","py":"Bà, nǐ zuì xiǎng qù nǎge guójiā wán?","ko":"아빠, 제일 놀러 가고 싶은 나라가 어디야?"}],"c":[["国","國","나라 국"],["家","家","집 가"]],"why":"나라(国)와 집(家) → 국가"},{"id":1155,"w":"过去","p":"guòqù","k":"명·동","ko":"과거, 지나가다","g":"o","ex":[{"zh":"刚才过去的那辆车是老板的。","py":"gāngcái guòqù de nà liàng chē shì lǎobǎn de.","ko":"방금 지나간 그 차 사장님 거야."},{"zh":"{H}，你等一下，我马上过去接你。","py":"{H}, nǐ děng yíxià, wǒ mǎshàng guòqù jiē nǐ.","ko":"{H}, 잠깐만 기다려, 금방 데리러 갈게.","pat":"(马上)过去 = (그쪽으로) 건너가다"},{"zh":"妈，时间过得真快，一年又过去了。","py":"Mā, shíjiān guò de zhēn kuài, yì nián yòu guòqù le.","ko":"엄마, 시간 진짜 빠르다, 또 한 해가 지나갔어."}],"c":[["过","過","지날 과"],["去","去","갈 거"]],"why":"지나(过) 감(去) → 지나가다·과거"},{"id":1156,"w":"故事","p":"gùshi","k":"명","ko":"이야기, 옛날이야기","g":"o","ex":[{"zh":"我小时候爸爸经常给我讲故事。","py":"wǒ xiǎoshíhou bàba jīngcháng gěi wǒ jiǎng gùshi.","ko":"어릴 때 아빠가 자주 이야기를 들려줬어."},{"zh":"{H}给我讲了她小时候的故事。","py":"{H} gěi wǒ jiǎngle tā xiǎoshíhou de gùshi.","ko":"{H}가 자기 어릴 적 이야기를 해 줬어.","pat":"给 + 사람 + 讲故事 = ~에게 이야기를 해 주다"},{"zh":"老板跟我们讲了他刚开公司时候的故事。","py":"Lǎobǎn gēn wǒmen jiǎngle tā gāng kāi gōngsī shíhou de gùshi.","ko":"사장님이 회사 처음 차렸을 때 이야기를 해 주셨어."}],"c":[["故","故","옛 고"],["事","事","일 사"]],"why":"옛(故) 일(事) → 이야기"},{"id":1157,"w":"还","p":"hái","k":"부","ko":"아직, 여전히, 또, 더","g":"o","ex":[{"zh":"都十点了，你还在公司？","py":"dōu shí diǎn le, nǐ hái zài gōngsī?","ko":"벌써 10시인데 아직도 회사야?"},{"zh":"{H}还在生我的气，不回我消息。","py":"{H} hái zài shēng wǒ de qì, bù huí wǒ xiāoxi.","ko":"{H}가 아직도 나한테 화나서 메시지 답장을 안 해.","pat":"还在 + 동사 = 아직도 ~하고 있다"},{"zh":"我爸身体很好，现在还每天去爬山。","py":"Wǒ bà shēntǐ hěn hǎo, xiànzài hái měi tiān qù páshān.","ko":"우리 아빠는 건강하셔서 지금도 매일 등산 가셔."}],"c":[["还","還","돌아올 환"]],"why":"다시 돌아옴(还) → 여전히·아직"},{"id":1158,"w":"害怕","p":"hàipà","k":"동","ko":"무서워하다, 겁내다","g":"o","ex":[{"zh":"{H}很害怕打针。","py":"{H} hěn hàipà dǎzhēn.","ko":"{H}는 주사 맞는 걸 엄청 무서워해."},{"zh":"第一次跟客户开会的时候，我很害怕说错话。","py":"Dì-yī cì gēn kèhù kāihuì de shíhou, wǒ hěn hàipà shuōcuò huà.","ko":"처음 고객이랑 회의할 때 말실수할까 봐 엄청 겁났어.","pat":"害怕 + 동사구 = ~할까 봐 겁나다"},{"zh":"妈，你一个人在家害怕吗？","py":"Mā, nǐ yí ge rén zài jiā hàipà ma?","ko":"엄마, 혼자 집에 있으면 무서워?"}],"c":[["害","害","해할 해"],["怕","怕","두려워할 파"]],"why":"해(害)를 두려워함(怕) → 무서워하다"},{"id":1159,"w":"还是","p":"háishi","k":"연·부","ko":"아니면, 여전히, ~하는 편이 낫다","g":"o","ex":[{"zh":"您喝咖啡还是喝茶？","py":"nín hē kāfēi háishi hē chá?","ko":"커피 드실래요, 아니면 차 드실래요?"},{"zh":"{H}，这个周末你来新山还是我去新加坡？","py":"{H}, zhège zhōumò nǐ lái Xīnshān háishi wǒ qù Xīnjiāpō?","ko":"{H}, 이번 주말에 네가 조호르바루 올래, 아니면 내가 싱가포르 갈까?","pat":"A 还是 B? = A야, 아니면 B야?"},{"zh":"妈，我还是觉得韩国的冬天最舒服。","py":"Mā, wǒ háishi juéde Hánguó de dōngtiān zuì shūfu.","ko":"엄마, 나는 그래도 한국 겨울이 제일 좋은 것 같아."}],"c":[["还","還","돌아올 환"],["是","是","옳을 시"]],"why":"여전히(还) 이것(是) → 아직도·아니면"},{"id":1160,"w":"孩子","p":"háizi","k":"명","ko":"아이, 자녀","g":"o","ex":[{"zh":"同事的孩子今年上小学了。","py":"tóngshì de háizi jīnnián shàng xiǎoxué le.","ko":"동료 아이가 올해 초등학교 들어갔어."},{"zh":"{H}很喜欢孩子，以后想要两个。","py":"{H} hěn xǐhuan háizi, yǐhòu xiǎng yào liǎng ge.","ko":"{H}는 아이를 좋아해서 나중에 둘 낳고 싶대.","pat":"喜欢孩子 / 要孩子 = 아이를 좋아하다 / 아이를 갖다"},{"zh":"在妈妈眼里，我永远是个孩子。","py":"Zài māma yǎn li, wǒ yǒngyuǎn shì ge háizi.","ko":"엄마 눈에는 내가 영원히 애야."}],"c":[["孩","孩","어린아이 해"],["子","子","아들 자"]],"why":"어린아이(孩) → 아이"},{"id":1161,"w":"汉语","p":"Hànyǔ","k":"명","ko":"중국어","g":"o","ex":[{"zh":"{H}说我的汉语进步很大。","py":"{H} shuō wǒ de Hànyǔ jìnbù hěn dà.","ko":"{H}가 내 중국어 많이 늘었대."},{"zh":"妈，你要不要跟我学几句汉语？","py":"Mā, nǐ yào bu yào gēn wǒ xué jǐ jù Hànyǔ?","ko":"엄마, 나한테 중국어 몇 마디 배워 볼래?","pat":"学汉语·说汉语 = 중국어를 배우다·하다"},{"zh":"老板说，会汉语在马来西亚找工作很方便。","py":"Lǎobǎn shuō, huì Hànyǔ zài Mǎláixīyà zhǎo gōngzuò hěn fāngbiàn.","ko":"사장님이 중국어 할 줄 알면 말레이시아에서 일 구하기 편하대."}],"c":[["汉","漢","한수 한"],["语","語","말씀 어"]],"why":"한(汉)족의 말(语) → 중국어"},{"id":1162,"w":"号","p":"hào","k":"명·양","ko":"일(날짜), 번호, 사이즈","g":"o","ex":[{"zh":"请问您的订单号是多少？","py":"qǐngwèn nín de dìngdān hào shì duōshao?","ko":"실례지만 주문번호가 어떻게 되세요?"},{"zh":"妈，你的手机号换了吗？","py":"Mā, nǐ de shǒujī hào huàn le ma?","ko":"엄마, 휴대폰 번호 바꿨어?","pat":"手机号 / 房间号 = 휴대폰 번호 / 방 번호"},{"zh":"{H}，我们的座位是十二号和十三号。","py":"{H}, wǒmen de zuòwèi shì shí'èr hào hé shísān hào.","ko":"{H}, 우리 자리 12번이랑 13번이야."}],"c":[["号","號","이름 호"]],"why":"번호(番號)의 호 → 번호"},{"id":1163,"w":"好吃","p":"hǎochī","k":"형","ko":"맛있다","g":"o","ex":[{"zh":"这家的肉骨茶特别好吃。","py":"zhè jiā de ròugǔchá tèbié hǎochī.","ko":"이 집 바쿠테 진짜 맛있어."},{"zh":"{H}，你做的饺子比饭店的还好吃。","py":"{H}, nǐ zuò de jiǎozi bǐ fàndiàn de hái hǎochī.","ko":"{H}, 네가 만든 만두가 식당 것보다 더 맛있어.","pat":"A 比 B 还好吃 = A가 B보다 더 맛있다"},{"zh":"老板带我们去的那家马来饭馆不太好吃。","py":"Lǎobǎn dài wǒmen qù de nà jiā Mǎlái fànguǎn bú tài hǎochī.","ko":"사장님이 데려간 그 말레이 식당은 별로 맛없었어."}],"c":[["好","好","좋을 호"],["吃","喫","먹을 끽"]],"why":"먹기(吃) 좋음(好) → 맛있다"},{"id":1164,"w":"和","p":"hé","k":"연·개","ko":"~와, 그리고","g":"o","ex":[{"zh":"我和{H}认识两年了。","py":"wǒ hé {H} rènshi liǎng nián le.","ko":"나랑 {H}는 알고 지낸 지 2년 됐어."},{"zh":"爸爸和妈妈下个月来新山看我。","py":"Bàba hé māma xià ge yuè lái Xīnshān kàn wǒ.","ko":"아빠랑 엄마가 다음 달에 조호르바루로 나 보러 오셔.","pat":"A 和 B = A와 B"},{"zh":"我和同事明天一起去新加坡见客户。","py":"Wǒ hé tóngshì míngtiān yìqǐ qù Xīnjiāpō jiàn kèhù.","ko":"나랑 동료는 내일 같이 싱가포르에 고객 만나러 가."}],"c":[["和","和","화할 화"]],"why":"화합(和合)의 화 → ~와"},{"id":1165,"w":"喝","p":"hē","k":"동","ko":"마시다","g":"o","ex":[{"zh":"妈妈让我少喝酒，多喝水。","py":"māma ràng wǒ shǎo hē jiǔ, duō hē shuǐ.","ko":"엄마가 술은 적게, 물은 많이 마시래."},{"zh":"晚上跟客户吃饭，我只喝了一杯啤酒。","py":"Wǎnshang gēn kèhù chīfàn, wǒ zhǐ hēle yì bēi píjiǔ.","ko":"저녁에 고객이랑 밥 먹을 때 맥주 한 잔만 마셨어.","pat":"喝 + (一杯) + 음료 = ~을 (한 잔) 마시다"},{"zh":"{H}，你今天水喝得太少了。","py":"{H}, nǐ jīntiān shuǐ hē de tài shǎo le.","ko":"{H}, 너 오늘 물 너무 적게 마셨어."}],"c":[["喝","喝","꾸짖을 갈"]],"why":"갈(喝)은 중국어에서 '마시다'"},{"id":1166,"w":"黑板","p":"hēibǎn","k":"명","ko":"칠판","g":"o","ex":[{"zh":"老师在黑板上画了一张图。","py":"lǎoshī zài hēibǎn shang huà le yī zhāng tú.","ko":"교수님이 칠판에 그림을 하나 그렸어."},{"zh":"开会的时候，老板在黑板上写了这个月的计划。","py":"Kāihuì de shíhou, lǎobǎn zài hēibǎn shang xiěle zhège yuè de jìhuà.","ko":"회의할 때 사장님이 칠판에 이번 달 계획을 써 주셨어.","pat":"在黑板上 + 写/画 = 칠판에 쓰다/그리다"},{"zh":"爸，现在韩国的学校还用黑板吗？","py":"Bà, xiànzài Hánguó de xuéxiào hái yòng hēibǎn ma?","ko":"아빠, 요즘 한국 학교에서도 아직 칠판 써?"}],"c":[["黑","黑","검을 흑"],["板","板","널 판"]],"why":"검은(黑) 널빤지(板) → 칠판"},{"id":1167,"w":"很","p":"hěn","k":"부","ko":"매우, 아주","g":"o","ex":[{"zh":"今天车间很热。","py":"jīntiān chējiān hěn rè.","ko":"오늘 작업장 엄청 더워."},{"zh":"{H}今天很忙，晚上不能出来了。","py":"{H} jīntiān hěn máng, wǎnshang bù néng chūlai le.","ko":"{H}가 오늘 많이 바빠서 저녁에 못 나온대.","pat":"很 + 형용사 = (형용사 서술어 기본형) 매우 ~하다"},{"zh":"妈，你寄来的东西我很喜欢。","py":"Mā, nǐ jì lái de dōngxi wǒ hěn xǐhuan.","ko":"엄마, 보내 준 물건 너무 마음에 들어."}],"c":[["很","很","매우 흔"]],"why":"매우 흔 → 매우"},{"id":1168,"w":"后来","p":"hòulái","k":"명","ko":"그 후, 나중에","g":"o","ex":[{"zh":"我以前在新加坡工作，后来来了新山。","py":"wǒ yǐqián zài Xīnjiāpō gōngzuò, hòulái lái le Xīnshān.","ko":"예전엔 싱가포르에서 일했고, 그 뒤에 조호바루로 왔어."},{"zh":"我们一开始是同事，后来成了好朋友。","py":"Wǒmen yì kāishǐ shì tóngshì, hòulái chéngle hǎo péngyou.","ko":"우리는 처음엔 동료였는데 나중에 좋은 친구가 됐어.","pat":"一开始 A，后来 B = 처음엔 A, 나중엔 B"},{"zh":"我和{H}在朋友的生日会上认识，后来就在一起了。","py":"Wǒ hé {H} zài péngyou de shēngrìhuì shang rènshi, hòulái jiù zài yìqǐ le.","ko":"나랑 {H}는 친구 생일 파티에서 만났고, 그 뒤에 사귀게 됐어."}],"c":[["后","後","뒤 후"],["来","來","올 래"]],"why":"뒤에(后) 옴(来) → 그 후"},{"id":1169,"w":"后面","p":"hòumiàn","k":"명","ko":"뒤, 뒤쪽","g":"o","ex":[{"zh":"停车场在工厂后面。","py":"tíngchēchǎng zài gōngchǎng hòumiàn.","ko":"주차장은 공장 뒤에 있어요."},{"zh":"爸，我们家后面的那家店还开着吗？","py":"Bà, wǒmen jiā hòumiàn de nà jiā diàn hái kāizhe ma?","ko":"아빠, 우리 집 뒤에 있던 그 가게 아직 해?","pat":"장소 + 后面 = ~ 뒤에"},{"zh":"{H}，你看，后面那个人是不是你同学？","py":"{H}, nǐ kàn, hòumiàn nàge rén shì bu shì nǐ tóngxué?","ko":"{H}, 저기 봐, 뒤에 저 사람 네 동창 아니야?"}],"c":[["后","後","뒤 후"],["面","面","낯 면"]],"why":"뒤(后) 쪽 면(面) → 뒤쪽"},{"id":1170,"w":"画","p":"huà","k":"동·명","ko":"그리다, 그림","g":"o","ex":[{"zh":"客户让我画一张简单的图。","py":"kèhù ràng wǒ huà yī zhāng jiǎndān de tú.","ko":"고객이 간단한 그림 하나 그려 달래."},{"zh":"{H}给我画了一张画，我放在桌子上。","py":"{H} gěi wǒ huàle yì zhāng huà, wǒ fàng zài zhuōzi shang.","ko":"{H}가 그림을 한 장 그려 줘서 책상 위에 놔뒀어.","pat":"画 + 一张画 = 그림을 한 장 그리다"},{"zh":"妈，我小时候画的画你还留着吗？","py":"Mā, wǒ xiǎoshíhou huà de huà nǐ hái liúzhe ma?","ko":"엄마, 나 어릴 때 그린 그림 아직 갖고 있어?"}],"c":[["画","畫","그림 화"]],"why":"회화(繪畫)의 화 → 그리다"},{"id":1171,"w":"花","p":"huā","k":"명·동","ko":"꽃, (돈·시간을) 쓰다","g":"o","ex":[{"zh":"我送了{H}一束花。","py":"wǒ sòng le {H} yī shù huā.","ko":"{H}한테 꽃 한 다발 선물했어."},{"zh":"妈，家门口的花都开了吗？","py":"Mā, jiā ménkǒu de huā dōu kāi le ma?","ko":"엄마, 집 앞에 꽃 다 폈어?","pat":"花开了 = 꽃이 피다"},{"zh":"客户的办公室里放了很多花。","py":"Kèhù de bàngōngshì li fàngle hěn duō huā.","ko":"고객 사무실에 꽃이 많이 놓여 있었어."}],"c":[["花","花","꽃 화"]],"why":"화초(花草)의 화 → 꽃"},{"id":1172,"w":"坏","p":"huài","k":"형","ko":"나쁘다, 고장 나다","g":"o","ex":[{"zh":"老板今天心情很坏，说话小心点儿。","py":"lǎobǎn jīntiān xīnqíng hěn huài, shuōhuà xiǎoxīn diǎnr.","ko":"사장님 오늘 기분 엄청 안 좋으니까 말 조심해."},{"zh":"{H}的脾气一点儿也不坏，只是有点儿急。","py":"{H} de píqi yìdiǎnr yě bú huài, zhǐshì yǒudiǎnr jí.","ko":"{H}는 성격이 전혀 나쁘지 않아, 그냥 좀 급할 뿐이야.","pat":"脾气坏 = 성격이 나쁘다"},{"zh":"爸，这几天的天气坏极了，一直下雨。","py":"Bà, zhè jǐ tiān de tiānqì huài jí le, yìzhí xià yǔ.","ko":"아빠, 요 며칠 날씨가 최악이야, 계속 비 와."}],"c":[["坏","壞","무너질 괴"]],"why":"파괴(破壞)의 괴 → 나쁘다·고장나다"},{"id":1173,"w":"换","p":"huàn","k":"동","ko":"바꾸다, 교환하다","g":"o","ex":[{"zh":"这个零件得换一个新的。","py":"zhège língjiàn děi huàn yī ge xīn de.","ko":"이 부품은 새 걸로 바꿔야 돼."},{"zh":"{H}，你换件衣服，我们出去吃饭。","py":"{H}, nǐ huàn jiàn yīfu, wǒmen chūqu chīfàn.","ko":"{H}, 옷 갈아입어, 우리 나가서 밥 먹자.","pat":"换衣服·换钱 = 옷을 갈아입다·환전하다"},{"zh":"妈，我在机场换了一点儿韩币。","py":"Mā, wǒ zài jīchǎng huànle yìdiǎnr Hánbì.","ko":"엄마, 나 공항에서 원화 좀 환전했어."}],"c":[["换","換","바꿀 환"]],"why":"교환(交換)의 환 → 바꾸다"},{"id":1174,"w":"环境","p":"huánjìng","k":"명","ko":"환경","g":"o","ex":[{"zh":"我们工厂要注意保护环境。","py":"wǒmen gōngchǎng yào zhùyì bǎohù huánjìng.","ko":"우리 공장은 환경 보호에 신경 써야 돼."},{"zh":"爸，新山的生活环境比我想的好。","py":"Bà, Xīnshān de shēnghuó huánjìng bǐ wǒ xiǎng de hǎo.","ko":"아빠, 조호르바루 생활 환경이 생각보다 좋아.","pat":"生活/工作 + 环境 = 생활·근무 환경"},{"zh":"{H}说她们店里的环境很好。","py":"{H} shuō tāmen diàn li de huánjìng hěn hǎo.","ko":"{H}가 자기네 가게 환경이 아주 좋대."}],"c":[["环","環","고리 환"],["境","境","지경 경"]],"why":"둘러싼(环) 지경(境) → 환경"},{"id":1175,"w":"欢迎","p":"huānyíng","k":"동","ko":"환영하다","g":"o","ex":[{"zh":"欢迎您来我们工厂参观。","py":"huānyíng nín lái wǒmen gōngchǎng cānguān.","ko":"저희 공장 견학 오신 걸 환영합니다."},{"zh":"{H}，我爸妈说，非常欢迎你来韩国。","py":"{H}, wǒ bà mā shuō, fēicháng huānyíng nǐ lái Hánguó.","ko":"{H}, 우리 부모님이 네가 한국 오는 거 대환영이래.","pat":"欢迎 + 사람 + 来 + 장소 = ~에 오는 걸 환영하다"},{"zh":"大家欢迎一下新同事！","py":"Dàjiā huānyíng yíxià xīn tóngshì!","ko":"다들 새 동료 환영해 주세요!"}],"c":[["欢","歡","기쁠 환"],["迎","迎","맞을 영"]],"why":"기쁘게(欢) 맞이함(迎) → 환영하다"},{"id":1176,"w":"回","p":"huí","k":"동·양","ko":"돌아가다, 돌아오다, 번(횟수)","g":"o","ex":[{"zh":"我下个月回韩国看爸妈。","py":"wǒ xià ge yuè huí Hánguó kàn bà mā.","ko":"다음 달에 한국 돌아가서 부모님 뵐 거야."},{"zh":"{H}，你几点回家？我去接你。","py":"{H}, nǐ jǐ diǎn huí jiā? Wǒ qù jiē nǐ.","ko":"{H}, 몇 시에 집에 가? 내가 데리러 갈게.","pat":"回家 / 回 + 장소 = 집에 가다 / ~로 돌아가다"},{"zh":"老板还没回办公室，你等一下吧。","py":"Lǎobǎn hái méi huí bàngōngshì, nǐ děng yíxià ba.","ko":"사장님 아직 사무실에 안 돌아오셨어, 좀 기다려."}],"c":[["回","回","돌아올 회"]],"why":"회귀(回歸)의 회 → 돌아오다"},{"id":1177,"w":"会","p":"huì","k":"조동·명","ko":"~할 줄 알다, ~할 것이다, 회의","g":"o","ex":[{"zh":"{H}会做很好吃的中国菜。","py":"{H} huì zuò hěn hǎochī de Zhōngguó cài.","ko":"{H}는 맛있는 중국 요리를 할 줄 알아."},{"zh":"新同事会说马来语和英语。","py":"Xīn tóngshì huì shuō Mǎláiyǔ hé Yīngyǔ.","ko":"새 동료는 말레이어랑 영어를 할 줄 알아.","pat":"会说 + 언어 = ~어를 할 줄 알다"},{"zh":"我爸不会用手机发照片，每次都让我教他。","py":"Wǒ bà bú huì yòng shǒujī fā zhàopiàn, měi cì dōu ràng wǒ jiāo tā.","ko":"우리 아빠는 휴대폰으로 사진 보내는 법을 몰라서 매번 나한테 가르쳐 달래."}],"c":[["会","會","모일 회"]],"why":"모일 회 → 익혀서 '할 줄 알다'"},{"id":1178,"w":"回答","p":"huídá","k":"동·명","ko":"대답하다, 대답","g":"o","ex":[{"zh":"这个问题我得问问老板再回答您。","py":"zhège wèntí wǒ děi wènwen lǎobǎn zài huídá nín.","ko":"이 문제는 사장님께 여쭤보고 답변드릴게요."},{"zh":"这个问题我回答不了，我得问一下经理。","py":"Zhège wèntí wǒ huídá bu liǎo, wǒ děi wèn yíxià jīnglǐ.","ko":"이 질문은 제가 답할 수 없어서 매니저님께 여쭤봐야 해요.","pat":"回答问题 / 回答不了 = 질문에 답하다 / 답할 수 없다"},{"zh":"爸爸问我工作累不累，我回答说还好。","py":"Bàba wèn wǒ gōngzuò lèi bu lèi, wǒ huídá shuō hái hǎo.","ko":"아빠가 일 힘드냐고 물어서 괜찮다고 대답했어."}],"c":[["回","回","돌아올 회"],["答","答","대답 답"]],"why":"돌려(回) 대답함(答) → 대답하다"},{"id":1179,"w":"会议","p":"huìyì","k":"명","ko":"회의","g":"o","ex":[{"zh":"明天上午十点有一个会议。","py":"míngtiān shàngwǔ shí diǎn yǒu yī ge huìyì.","ko":"내일 오전 10시에 회의 하나 있어."},{"zh":"{H}，我在会议上，晚一点儿给你打。","py":"{H}, wǒ zài huìyì shang, wǎn yìdiǎnr gěi nǐ dǎ.","ko":"{H}, 나 회의 중이야, 조금 이따 전화할게.","pat":"在会议上 = 회의 중에, 회의에서"},{"zh":"这次会议，老板让我用英语介绍公司。","py":"Zhè cì huìyì, lǎobǎn ràng wǒ yòng Yīngyǔ jièshào gōngsī.","ko":"이번 회의에서 사장님이 나보고 영어로 회사 소개하래."}],"c":[["会","會","모일 회"],["议","議","의논할 의"]],"why":"모여서(会) 의논함(议) → 회의"},{"id":1180,"w":"或者","p":"huòzhě","k":"연","ko":"또는, 혹은","g":"o","ex":[{"zh":"他或者已经下班了，你打他手机吧。","py":"tā huòzhě yǐjīng xiàbān le, nǐ dǎ tā shǒujī ba.","ko":"그 사람 아마 벌써 퇴근했을 거야, 휴대폰으로 전화해 봐."},{"zh":"{H}没回消息，或者已经睡了。","py":"{H} méi huí xiāoxi, huòzhě yǐjīng shuì le.","ko":"{H}가 답장이 없네, 아마 벌써 잠들었나 봐.","pat":"或者 + 추측 = 아마 ~일지도 몰라"},{"zh":"妈不接电话，或者在外面买菜呢。","py":"Mā bù jiē diànhuà, huòzhě zài wàimiàn mǎi cài ne.","ko":"엄마가 전화를 안 받네, 아마 밖에서 장 보고 계신가 봐."}],"c":[["或","或","혹 혹"],["者","者","놈 자"]],"why":"혹(或)은 ~인 것(者) → 혹은·아마"},{"id":1181,"w":"护照","p":"hùzhào","k":"명","ko":"여권","g":"o","ex":[{"zh":"我的护照明年就到期了。","py":"wǒ de hùzhào míngnián jiù dàoqī le.","ko":"내 여권 내년이면 만료돼."},{"zh":"过关的时候，我把护照忘在车里了。","py":"Guòguān de shíhou, wǒ bǎ hùzhào wàng zài chē li le.","ko":"국경 넘을 때 여권을 차에 두고 내렸어.","pat":"把护照忘在 + 장소 = 여권을 ~에 두고 오다"},{"zh":"妈，你的护照还能用吗？","py":"Mā, nǐ de hùzhào hái néng yòng ma?","ko":"엄마, 엄마 여권 아직 쓸 수 있어?"}],"c":[["护","護","보호할 호"],["照","照","비칠 조"]],"why":"보호(护)해 주는 증빙(照) → 여권"},{"id":1182,"w":"极","p":"jí","k":"부","ko":"매우, 극히","g":"o","ex":[{"zh":"听到这个消息，妈妈高兴极了。","py":"tīngdào zhège xiāoxi, māma gāoxìng jí le.","ko":"이 소식 듣고 엄마가 너무너무 기뻐하셨어."},{"zh":"今天车间热极了，大家都没精神。","py":"Jīntiān chējiān rè jí le, dàjiā dōu méi jīngshen.","ko":"오늘 작업장이 엄청 더워서 다들 기운이 없어.","pat":"형용사 + 极了 = 엄청 ~하다"},{"zh":"{H}做的饭好吃极了。","py":"{H} zuò de fàn hǎochī jí le.","ko":"{H}가 한 밥은 진짜 끝내주게 맛있어."}],"c":[["极","極","다할 극"]],"why":"극한(極限)의 극 → 정점·극히"},{"id":1183,"w":"几","p":"jǐ","k":"수","ko":"몇, 얼마","g":"o","ex":[{"zh":"{H}，你今天几点下班？","py":"{H}, nǐ jīntiān jǐ diǎn xiàbān?","ko":"{H}, 오늘 몇 시에 퇴근해?"},{"zh":"老板，这次客户来几个人？","py":"Lǎobǎn, zhè cì kèhù lái jǐ ge rén?","ko":"사장님, 이번에 고객 몇 분 오세요?","pat":"几 + 양사 + 명사 = 몇 ~ (几个人)"},{"zh":"妈，你这几天身体怎么样？","py":"Mā, nǐ zhè jǐ tiān shēntǐ zěnmeyàng?","ko":"엄마, 요 며칠 몸은 어때?"}],"c":[["几","幾","몇 기"]],"why":"기하(幾何)의 기 → 몇"},{"id":1184,"w":"家","p":"jiā","k":"명·양","ko":"집, 가정, 가게를 세는 단위","g":"o","ex":[{"zh":"周末我去{H}家吃饭。","py":"zhōumò wǒ qù {H} jiā chī fàn.","ko":"주말에 {H} 집에 가서 밥 먹어."},{"zh":"今天加班，我十点才到家。","py":"Jīntiān jiābān, wǒ shí diǎn cái dào jiā.","ko":"오늘 야근해서 10시에야 집에 도착했어.","pat":"到家 = 집에 도착하다"},{"zh":"爸，过年我想带{H}回家。","py":"Bà, guònián wǒ xiǎng dài {H} huí jiā.","ko":"아빠, 설에 {H} 데리고 집에 가고 싶어."}],"c":[["家","家","집 가"]],"why":"가정(家庭)의 가 → 집"},{"id":1185,"w":"件","p":"jiàn","k":"양","ko":"건, 벌(일·옷 등을 세는 단위)","g":"o","ex":[{"zh":"我今天有好几件事要做。","py":"wǒ jīntiān yǒu hǎo jǐ jiàn shì yào zuò.","ko":"나 오늘 해야 할 일이 여러 건 있어."},{"zh":"{H}，这件事我们周末再说吧。","py":"{H}, zhè jiàn shì wǒmen zhōumò zài shuō ba.","ko":"{H}, 이 일은 주말에 다시 얘기하자.","pat":"这件事 / 一件衣服 = 이 일 / 옷 한 벌"},{"zh":"妈，那件事你别告诉爸。","py":"Mā, nà jiàn shì nǐ bié gàosu bà.","ko":"엄마, 그 일은 아빠한테 말하지 마."}],"c":[["件","件","물건 건"]],"why":"사건(事件)의 건 → 건·벌"},{"id":1186,"w":"检查","p":"jiǎnchá","k":"동","ko":"검사하다, 점검하다","g":"o","ex":[{"zh":"发货前一定要检查一遍。","py":"fā huò qián yīdìng yào jiǎnchá yī biàn.","ko":"출하 전에 꼭 한 번 검사해야 돼."},{"zh":"{H}，出门以前检查一下门关好了没有。","py":"{H}, chūmén yǐqián jiǎnchá yíxià mén guānhǎo le méiyǒu.","ko":"{H}, 나가기 전에 문 잘 잠겼는지 확인해 봐.","pat":"检查一下 + 내용 = ~을 좀 확인/점검하다"},{"zh":"妈，医生检查以后说什么了？","py":"Mā, yīshēng jiǎnchá yǐhòu shuō shénme le?","ko":"엄마, 의사가 검사하고 나서 뭐라고 했어?"}],"c":[["检","檢","검사할 검"],["查","査","조사할 사"]],"why":"검사하고(检) 조사함(查) → 검사하다"},{"id":1187,"w":"简单","p":"jiǎndān","k":"형","ko":"간단하다, 쉽다","g":"o","ex":[{"zh":"这个问题很简单，我来解决。","py":"zhège wèntí hěn jiǎndān, wǒ lái jiějué.","ko":"이 문제 간단해, 내가 해결할게."},{"zh":"妈，这个手机很简单，我教你用。","py":"Mā, zhège shǒujī hěn jiǎndān, wǒ jiāo nǐ yòng.","ko":"엄마, 이 휴대폰 쉬워, 내가 쓰는 법 가르쳐 줄게.","pat":"很简单 = 아주 쉽다/간단하다"},{"zh":"{H}，晚上我们吃点儿简单的吧。","py":"{H}, wǎnshang wǒmen chī diǎnr jiǎndān de ba.","ko":"{H}, 저녁은 간단하게 먹자."}],"c":[["简","簡","간략할 간"],["单","單","홑 단"]],"why":"간략하고(简) 홑짐(单) → 간단하다"},{"id":1188,"w":"讲","p":"jiǎng","k":"동","ko":"말하다, 설명하다, 강의하다","g":"o","ex":[{"zh":"老板在会上讲了今年的计划。","py":"lǎobǎn zài huì shang jiǎng le jīnnián de jìhuà.","ko":"사장님이 회의에서 올해 계획을 설명했어."},{"zh":"{H}，你给我讲讲你们店里的事吧。","py":"{H}, nǐ gěi wǒ jiǎngjiang nǐmen diàn li de shì ba.","ko":"{H}, 너네 가게 얘기 좀 해 줘.","pat":"给 + 사람 + 讲讲 + 내용 = ~에게 ~를 이야기해 주다"},{"zh":"爸，你别跟妈讲我生病的事。","py":"Bà, nǐ bié gēn mā jiǎng wǒ shēngbìng de shì.","ko":"아빠, 나 아팠던 거 엄마한테 말하지 마."}],"c":[["讲","講","강론할 강"]],"why":"강의(講義)의 강 → 말하다"},{"id":1189,"w":"健康","p":"jiànkāng","k":"형·명","ko":"건강하다, 건강","g":"o","ex":[{"zh":"祝爸爸妈妈身体健康！","py":"zhù bàba māma shēntǐ jiànkāng!","ko":"엄마 아빠 건강하세요!"},{"zh":"{H}，晚上少吃一点儿，健康最重要。","py":"{H}, wǎnshang shǎo chī yìdiǎnr, jiànkāng zuì zhòngyào.","ko":"{H}, 밤에는 좀 적게 먹어, 건강이 제일 중요해.","pat":"健康最重要 = 건강이 제일 중요하다"},{"zh":"公司每年都让员工去做健康检查。","py":"Gōngsī měi nián dōu ràng yuángōng qù zuò jiànkāng jiǎnchá.","ko":"회사에서 매년 직원들 건강검진을 받게 해."}],"c":[["健","健","굳셀 건"],["康","康","편안 강"]],"why":"굳세고(健) 편안함(康) → 건강하다"},{"id":1190,"w":"见面","p":"jiànmiàn","k":"동","ko":"만나다","g":"o","ex":[{"zh":"我们周六在地铁站见面吧。","py":"wǒmen zhōuliù zài dìtiě zhàn jiànmiàn ba.","ko":"우리 토요일에 지하철역에서 만나자."},{"zh":"我跟客户约好了明天上午见面。","py":"Wǒ gēn kèhù yuēhǎo le míngtiān shàngwǔ jiànmiàn.","ko":"고객이랑 내일 오전에 만나기로 약속했어.","pat":"跟 + 사람 + 见面 = ~와 만나다 (见面은 목적어를 못 가짐)"},{"zh":"妈，我们已经一年没见面了。","py":"Mā, wǒmen yǐjīng yì nián méi jiànmiàn le.","ko":"엄마, 우리 벌써 1년이나 못 만났어."}],"c":[["见","見","볼 견"],["面","面","낯 면"]],"why":"얼굴(面)을 봄(见) → 만나다"},{"id":1191,"w":"角","p":"jiǎo","k":"명·양","ko":"모서리, 뿔, 자오(화폐 단위)","g":"o","ex":[{"zh":"那头牛的角又长又尖。","py":"nà tóu niú de jiǎo yòu cháng yòu jiān.","ko":"저 소 뿔 길고 뾰족하다."},{"zh":"{H}，你看那只羊头上有两个角。","py":"{H}, nǐ kàn nà zhī yáng tóu shang yǒu liǎng ge jiǎo.","ko":"{H}, 저 양 머리에 뿔 두 개 있는 거 봐.","pat":"头上有角 / 牛角 = 머리에 뿔이 있다 / 소뿔"},{"zh":"这个杯子是用牛角做的，是同事送我的。","py":"Zhège bēizi shì yòng niújiǎo zuò de, shì tóngshì sòng wǒ de.","ko":"이 컵은 소뿔로 만든 건데 동료가 선물해 줬어."}],"c":[["角","角","뿔 각"]],"why":"각(角) → 뿔·모서리"},{"id":1192,"w":"脚","p":"jiǎo","k":"명","ko":"발","g":"o","ex":[{"zh":"走了一天，我的脚好疼。","py":"zǒu le yī tiān, wǒ de jiǎo hǎo téng.","ko":"하루 종일 걸었더니 발이 너무 아파."},{"zh":"{H}的脚很小，只穿三十五号的鞋。","py":"{H} de jiǎo hěn xiǎo, zhǐ chuān sānshíwǔ hào de xié.","ko":"{H}는 발이 작아서 35 사이즈 신발만 신어.","pat":"脚很小/很大 = 발이 작다/크다"},{"zh":"在车间里一定要穿安全鞋，保护好脚。","py":"Zài chējiān li yídìng yào chuān ānquánxié, bǎohù hǎo jiǎo.","ko":"작업장에서는 꼭 안전화를 신어서 발을 보호해야 해."}],"c":[["脚","脚","다리 각"]],"why":"각선미(脚線美)의 각 → 발"},{"id":1193,"w":"教","p":"jiāo","k":"동","ko":"가르치다","g":"o","ex":[{"zh":"{H}教我说广东话。","py":"{H} jiāo wǒ shuō Guǎngdōng huà.","ko":"{H}가 나한테 광둥어를 가르쳐 줘."},{"zh":"我教新同事怎么用这台机器。","py":"Wǒ jiāo xīn tóngshì zěnme yòng zhè tái jīqì.","ko":"내가 새 동료한테 이 기계 쓰는 법을 가르쳐 줘.","pat":"教 + 사람 + 怎么 + 동사 = ~에게 ~하는 법을 가르치다"},{"zh":"小时候爸爸教我骑自行车。","py":"Xiǎoshíhou bàba jiāo wǒ qí zìxíngchē.","ko":"어릴 때 아빠가 자전거 타는 법을 가르쳐 주셨어."}],"c":[["教","敎","가르칠 교"]],"why":"교육(敎育)의 교 → 가르치다"},{"id":1194,"w":"教室","p":"jiàoshì","k":"명","ko":"교실","g":"o","ex":[{"zh":"MBA的教室在三楼。","py":"MBA de jiàoshì zài sān lóu.","ko":"MBA 강의실은 3층에 있어."},{"zh":"{H}，我在教室里上课，不能接电话。","py":"{H}, wǒ zài jiàoshì li shàngkè, bù néng jiē diànhuà.","ko":"{H}, 나 강의실에서 수업 중이라 전화 못 받아.","pat":"在教室(里)上课 = 교실에서 수업하다"},{"zh":"妈，我小学的教室现在还在吗？","py":"Mā, wǒ xiǎoxué de jiàoshì xiànzài hái zài ma?","ko":"엄마, 내 초등학교 교실 지금도 그대로 있어?"}],"c":[["教","敎","가르칠 교"],["室","室","집 실"]],"why":"가르치는(教) 방(室) → 교실"},{"id":1195,"w":"机场","p":"jīchǎng","k":"명","ko":"공항","g":"o","ex":[{"zh":"我下午去机场接客户。","py":"wǒ xiàwǔ qù jīchǎng jiē kèhù.","ko":"나 오후에 공항 가서 고객 마중해."},{"zh":"{H}，周五我去机场送你。","py":"{H}, zhōuwǔ wǒ qù jīchǎng sòng nǐ.","ko":"{H}, 금요일에 내가 공항까지 바래다줄게.","pat":"去机场送/接 + 사람 = 공항에 배웅/마중 가다"},{"zh":"妈，你别来机场接我了，太远了。","py":"Mā, nǐ bié lái jīchǎng jiē wǒ le, tài yuǎn le.","ko":"엄마, 공항까지 데리러 오지 마, 너무 멀어."}],"c":[["机","機","틀 기"],["场","場","마당 장"]],"why":"비행기(机) 마당(场) → 공항"},{"id":1196,"w":"鸡蛋","p":"jīdàn","k":"명","ko":"달걀, 계란","g":"o","ex":[{"zh":"早饭我一般吃两个鸡蛋。","py":"zǎofàn wǒ yībān chī liǎng ge jīdàn.","ko":"아침으로 나는 보통 계란 두 개 먹어."},{"zh":"{H}教我做西红柿炒鸡蛋。","py":"{H} jiāo wǒ zuò xīhóngshì chǎo jīdàn.","ko":"{H}가 토마토 달걀 볶음 만드는 법을 가르쳐 줬어.","pat":"西红柿炒鸡蛋 = 토마토 달걀 볶음 (대표 가정식)"},{"zh":"爸，你每天早上吃一个鸡蛋，对身体好。","py":"Bà, nǐ měi tiān zǎoshang chī yí ge jīdàn, duì shēntǐ hǎo.","ko":"아빠, 매일 아침 달걀 하나씩 드세요, 몸에 좋아."}],"c":[["鸡","鷄","닭 계"],["蛋","蛋","새알 단"]],"why":"닭(鸡)의 알(蛋) → 달걀"},{"id":1197,"w":"记得","p":"jìde","k":"동","ko":"기억하다","g":"o","ex":[{"zh":"你还记得我们第一次见面吗？","py":"nǐ hái jìde wǒmen dì yī cì jiànmiàn ma?","ko":"우리 처음 만났던 거 아직 기억나?"},{"zh":"你记得明天上午把报告给老板。","py":"Nǐ jìde míngtiān shàngwǔ bǎ bàogào gěi lǎobǎn.","ko":"내일 오전에 사장님께 보고서 드리는 거 잊지 마.","pat":"(你)记得 + 동사 = 잊지 말고 ~해"},{"zh":"爸，我记得小时候你常带我去海边。","py":"Bà, wǒ jìde xiǎoshíhou nǐ cháng dài wǒ qù hǎibiān.","ko":"아빠, 어릴 때 아빠가 나 바닷가에 자주 데려간 거 기억나."}],"c":[["记","記","기록할 기"],["得","得","얻을 득"]],"why":"기억(记)해 얻어 둠(得) → 기억하다"},{"id":1198,"w":"借","p":"jiè","k":"동","ko":"빌리다, 빌려주다","g":"o","ex":[{"zh":"能借我一支笔吗？","py":"néng jiè wǒ yī zhī bǐ ma?","ko":"펜 하나 빌려줄 수 있어?"},{"zh":"同事的车坏了，我把车借给他了。","py":"Tóngshì de chē huài le, wǒ bǎ chē jiè gěi tā le.","ko":"동료 차가 고장 나서 내 차를 빌려줬어.","pat":"把 A 借给 B = A를 B에게 빌려주다"},{"zh":"{H}，这本书你借我看看吧。","py":"{H}, zhè běn shū nǐ jiè wǒ kànkan ba.","ko":"{H}, 이 책 나 좀 빌려줘."}],"c":[["借","借","빌릴 차"]],"why":"차용(借用)의 차 → 빌리다"},{"id":1199,"w":"接","p":"jiē","k":"동","ko":"마중하다, 받다, 잇다","g":"o","ex":[{"zh":"这两根线要接好，不然会出问题。","py":"zhè liǎng gēn xiàn yào jiē hǎo, bùrán huì chū wèntí.","ko":"이 두 선 잘 연결해야 돼, 안 그러면 문제 생겨."},{"zh":"新生产线要接到旧的机器上。","py":"Xīn shēngchǎnxiàn yào jiē dào jiù de jīqì shang.","ko":"새 생산 라인은 기존 기계에 연결해야 해.","pat":"接到 + 대상 + 上 = ~에 연결하다"},{"zh":"妈，我帮你把电视接到网上了。","py":"Mā, wǒ bāng nǐ bǎ diànshì jiē dào wǎng shang le.","ko":"엄마, TV 인터넷에 연결해 놨어."}],"c":[["接","接","이을 접"]],"why":"접속(接續)의 접 → 잇다·받다"},{"id":1200,"w":"结婚","p":"jiéhūn","k":"동","ko":"결혼하다","g":"o","ex":[{"zh":"妈妈问我什么时候结婚。","py":"māma wèn wǒ shénme shíhou jiéhūn.","ko":"엄마가 나 언제 결혼하냐고 물어봤어."},{"zh":"{H}，我们结婚以后住在哪儿？","py":"{H}, wǒmen jiéhūn yǐhòu zhù zài nǎr?","ko":"{H}, 우리 결혼하면 어디서 살까?","pat":"结婚以后 / 跟 + 사람 + 结婚 = 결혼 후 / ~와 결혼하다"},{"zh":"同事下个月结婚，老板给他放了一个星期假。","py":"Tóngshì xià ge yuè jiéhūn, lǎobǎn gěi tā fàngle yí ge xīngqī jià.","ko":"동료가 다음 달에 결혼해서 사장님이 일주일 휴가를 주셨어."}],"c":[["结","結","맺을 결"],["婚","婚","혼인할 혼"]],"why":"혼인(婚)을 맺음(结) → 결혼하다"},{"id":1201,"w":"姐姐","p":"jiějie","k":"명","ko":"누나, 언니","g":"o","ex":[{"zh":"{H}的姐姐也在新加坡。","py":"{H} de jiějie yě zài Xīnjiāpō.","ko":"{H} 언니도 싱가포르에 있어."},{"zh":"我的同事有三个姐姐，在家里最小。","py":"Wǒ de tóngshì yǒu sān ge jiějie, zài jiā li zuì xiǎo.","ko":"내 동료는 누나가 셋이라 집에서 막내야.","pat":"有 + 숫자 + 个姐姐 = 누나/언니가 ~명 있다"},{"zh":"妈，邻居家的姐姐结婚了吗？","py":"Mā, línjū jiā de jiějie jiéhūn le ma?","ko":"엄마, 이웃집 누나 결혼했어?"}],"c":[["姐","姐","누이 저"],["姐","姐","누이 저"]],"why":"누이(姐) 겹침 → 언니·누나"},{"id":1202,"w":"解决","p":"jiějué","k":"동","ko":"해결하다","g":"o","ex":[{"zh":"您放心，这个问题我们会尽快解决。","py":"nín fàngxīn, zhège wèntí wǒmen huì jǐnkuài jiějué.","ko":"걱정 마세요, 이 문제는 최대한 빨리 해결하겠습니다."},{"zh":"{H}，有什么问题我们一起解决。","py":"{H}, yǒu shénme wèntí wǒmen yìqǐ jiějué.","ko":"{H}, 무슨 문제든 우리 같이 해결하자.","pat":"解决问题 = 문제를 해결하다"},{"zh":"爸，你电脑的问题我已经帮你解决了。","py":"Bà, nǐ diànnǎo de wèntí wǒ yǐjīng bāng nǐ jiějué le.","ko":"아빠, 컴퓨터 문제는 내가 벌써 해결해 놨어."}],"c":[["解","解","풀 해"],["决","決","결단할 결"]],"why":"풀어서(解) 결단함(决) → 해결하다"},{"id":1203,"w":"节目","p":"jiémù","k":"명","ko":"프로그램, 공연 종목","g":"o","ex":[{"zh":"这个电视节目{H}每个星期都看。","py":"zhège diànshì jiémù {H} měi ge xīngqī dōu kàn.","ko":"이 TV 프로그램 {H}는 매주 봐."},{"zh":"爸爸最喜欢看体育节目。","py":"Bàba zuì xǐhuan ,{"zh":"妈，我们家离医院近，你有事就马上去。","py":"Mā, wǒmen jiā lí yīyuàn jìn, nǐ yǒu shì jiù mǎshàng qù.","ko":"엄마, 우리 집이 병원이랑 가까우니까 무슨 일 있으면 바로 가."}],"c":[["近","近","가까울 근"]],"why":"근처(近處)의 근 → 가깝다"},{"id":1212,"w":"经常","p":"jīngcháng","k":"부·명","ko":"자주, 늘, 평소","g":"o","ex":[{"zh":"{H}经常给我发照片。","py":"{H} jīngcháng gěi wǒ fā zhàopiàn.","ko":"{H}는 나한테 자주 사진을 보내."},{"zh":"爸妈经常问我什么时候回国。","py":"Bà mā jīngcháng wèn wǒ shénme shíhou huí guó.","ko":"부모님이 자주 나한테 언제 귀국하냐고 물어.","pat":"经常 + 동사 = 자주 ~하다"},{"zh":"老板经常让我帮他翻译中文邮件。","py":"Lǎobǎn jīngcháng ràng wǒ bāng tā fānyì Zhōngwén yóujiàn.","ko":"사장님이 자주 중국어 메일 번역을 나한테 맡기셔."}],"c":[["经","經","지날 경"],["常","常","항상 상"]],"why":"늘(常) 거치는(经) 일 → 늘·평소"},{"id":1213,"w":"经过","p":"jīngguò","k":"동·명","ko":"지나다, 거치다, 과정","g":"o","ex":[{"zh":"去{H}家要经过一个公园。","py":"qù {H} jiā yào jīngguò yī ge gōngyuán.","ko":"{H} 집에 가려면 공원 하나를 지나가야 돼."},{"zh":"去客户的工厂要经过新山市中心。","py":"Qù kèhù de gōngchǎng yào jīngguò Xīnshān shì zhōngxīn.","ko":"고객 공장에 가려면 조호르바루 시내를 지나가야 해.","pat":"经过 + 장소 = ~을 지나가다"},{"zh":"经过这么多年，爸爸还是那么爱喝茶。","py":"Jīngguò zhème duō nián, bàba háishi nàme ài hē chá.","ko":"이렇게 오랜 세월이 지나도 아빠는 여전히 차를 좋아하셔."}],"c":[["经","經","지날 경"],["过","過","지날 과"]],"why":"거쳐(经) 지나감(过) → 경과하다"},{"id":1214,"w":"经理","p":"jīnglǐ","k":"명","ko":"매니저, 지배인","g":"o","ex":[{"zh":"我们的销售经理下午去见客户。","py":"wǒmen de xiāoshòu jīnglǐ xiàwǔ qù jiàn kèhù.","ko":"우리 영업 매니저가 오후에 고객 만나러 가."},{"zh":"王经理，客户已经到会议室了。","py":"Wáng jīnglǐ, kèhù yǐjīng dào huìyìshì le.","ko":"왕 매니저님, 고객분 벌써 회의실에 오셨어요.","pat":"성 + 经理 = ~ 매니저님 (호칭)"},{"zh":"{H}现在是她们店里的经理了。","py":"{H} xiànzài shì tāmen diàn li de jīnglǐ le.","ko":"{H}는 이제 자기네 가게 매니저가 됐어."}],"c":[["经","經","다스릴 경"],["理","理","다스릴 리"]],"why":"경영(经)하고 관리(理)함 → 매니저"},{"id":1215,"w":"今天","p":"jīntiān","k":"명","ko":"오늘","g":"o","ex":[{"zh":"今天是{H}的生日。","py":"jīntiān shì {H} de shēngrì.","ko":"오늘은 {H} 생일이야."},{"zh":"今天客户来公司，大家早点儿到。","py":"Jīntiān kèhù lái gōngsī, dàjiā zǎo diǎnr dào.","ko":"오늘 고객이 회사에 오니까 다들 일찍 와.","pat":"今天 + 사건 = 오늘 ~ (시간명사는 주어 앞/뒤 모두 가능)"},{"zh":"妈，今天首尔下雪了吗？","py":"Mā, jīntiān Shǒu'ěr xià xuě le ma?","ko":"엄마, 오늘 서울에 눈 왔어?"}],"c":[["今","今","이제 금"],["天","天","하늘 천"]],"why":"지금(今)의 날(天) → 오늘"},{"id":1216,"w":"旧","p":"jiù","k":"형","ko":"낡다, 오래되다","g":"o","ex":[{"zh":"这台电脑太旧了，该换了。","py":"zhè tái diànnǎo tài jiù le, gāi huàn le.","ko":"이 컴퓨터 너무 낡았어, 바꿀 때 됐어."},{"zh":"{H}，这件旧衣服别扔了，我还要穿。","py":"{H}, zhè jiàn jiù yīfu bié rēng le, wǒ hái yào chuān.","ko":"{H}, 이 헌 옷 버리지 마, 나 아직 입을 거야.","pat":"旧 + 명사 (旧衣服·旧车) = 헌 ~, 낡은 ~"},{"zh":"爸，咱们家的旧冰箱还能用吗？","py":"Bà, zánmen jiā de jiù bīngxiāng hái néng yòng ma?","ko":"아빠, 우리 집 낡은 냉장고 아직 쓸 만해?"}],"c":[["旧","舊","예 구"]],"why":"구식(舊式)의 구 → 낡다"},{"id":1217,"w":"就","p":"jiù","k":"부","ko":"곧, 바로, 이미","g":"o","ex":[{"zh":"你等一下，我马上就到。","py":"nǐ děng yīxià, wǒ mǎshàng jiù dào.","ko":"잠깐만 기다려, 곧 도착해."},{"zh":"老板，报告我写完就发给您。","py":"Lǎobǎn, bàogào wǒ xiěwán jiù fā gěi nín.","ko":"사장님, 보고서 다 쓰면 바로 보내 드릴게요.","pat":"동사 + 完就 + 동사 = ~하자마자 바로 ~하다"},{"zh":"妈，我下个月就回家了。","py":"Mā, wǒ xià ge yuè jiù huí jiā le.","ko":"엄마, 나 다음 달이면 바로 집에 가."}],"c":[["就","就","나아갈 취"]],"why":"취임(就任)의 취 → 곧·바로"},{"id":1218,"w":"久","p":"jiǔ","k":"형","ko":"오래되다, 오래","g":"o","ex":[{"zh":"好久没见爸妈了，很想他们。","py":"hǎo jiǔ méi jiàn bà mā le, hěn xiǎng tāmen.","ko":"부모님 못 뵌 지 오래돼서 너무 보고 싶어."},{"zh":"{H}，让你等了这么久，对不起。","py":"{H}, ràng nǐ děngle zhème jiǔ, duìbuqǐ.","ko":"{H}, 이렇게 오래 기다리게 해서 미안해.","pat":"等了这么久 / 很久没 = 이렇게 오래 기다리다 / 오랫동안 ~ 안 하다"},{"zh":"这台机器用了很久了，该修一下了。","py":"Zhè tái jīqì yòngle hěn jiǔ le, gāi xiū yíxià le.","ko":"이 기계 오래 썼으니까 한번 수리해야겠어."}],"c":[["久","久","오랠 구"]],"why":"영구(永久)의 구 → 오래다"},{"id":1219,"w":"九","p":"jiǔ","k":"수","ko":"아홉, 9","g":"o","ex":[{"zh":"我们每天早上九点开会。","py":"wǒmen měi tiān zǎoshang jiǔ diǎn kāihuì.","ko":"우리는 매일 아침 9시에 회의해."},{"zh":"{H}，我们晚上九点见。","py":"{H}, wǒmen wǎnshang jiǔ diǎn jiàn.","ko":"{H}, 우리 저녁 9시에 만나.","pat":"九点 + 见 = 9시에 보자"},{"zh":"妈，我九岁的时候是不是很不听话？","py":"Mā, wǒ jiǔ suì de shíhou shì bu shì hěn bù tīnghuà?","ko":"엄마, 나 아홉 살 때 말 엄청 안 들었지?"}],"c":[["九","九","아홉 구"]],"why":"구(九) → 아홉"},{"id":1220,"w":"觉得","p":"juéde","k":"동","ko":"~라고 생각하다, 느끼다","g":"o","ex":[{"zh":"{H}，你觉得这件衬衫好看吗？","py":"{H}, nǐ juéde zhè jiàn chènshān hǎokàn ma?","ko":"{H}, 이 셔츠 괜찮은 것 같아?"},{"zh":"老板，我觉得这个价格还可以再低一点儿。","py":"Lǎobǎn, wǒ juéde zhège jiàgé hái kěyǐ zài dī yìdiǎnr.","ko":"사장님, 제 생각엔 이 가격 좀 더 낮출 수 있을 것 같아요.","pat":"我觉得 + 의견 = 내 생각엔 ~인 것 같다"},{"zh":"妈，你觉得{H}怎么样？","py":"Mā, nǐ juéde {H} zěnmeyàng?","ko":"엄마, {H} 어떤 것 같아?"}],"c":[["觉","覺","깨달을 각"],["得","得","얻을 득"]],"why":"깨달아(觉) 얻음(得) → ~라고 여기다"},{"id":1221,"w":"决定","p":"juédìng","k":"동·명","ko":"결정하다, 결정","g":"o","ex":[{"zh":"老板决定下个月买新机器。","py":"lǎobǎn juédìng xià ge yuè mǎi xīn jīqì.","ko":"사장님이 다음 달에 새 기계 사기로 결정했어."},{"zh":"我和{H}决定明年一起去韩国。","py":"Wǒ hé {H} juédìng míngnián yìqǐ qù Hánguó.","ko":"나랑 {H}는 내년에 같이 한국 가기로 했어.","pat":"决定 + 동사 = ~하기로 하다"},{"zh":"爸，换不换工作，我还没决定。","py":"Bà, huàn bu huàn gōngzuò, wǒ hái méi juédìng.","ko":"아빠, 이직할지 말지 아직 결정 못 했어."}],"c":[["决","決","결단할 결"],["定","定","정할 정"]],"why":"결단하여(决) 정함(定) → 결정하다"},{"id":1222,"w":"句子","p":"jùzi","k":"명","ko":"문장","g":"o","ex":[{"zh":"这个句子我不太懂，你帮我看看。","py":"zhège jùzi wǒ bù tài dǒng, nǐ bāng wǒ kànkan.","ko":"이 문장 잘 모르겠어, 좀 봐 줘."},{"zh":"客户邮件里的这个句子是什么意思？","py":"Kèhù yóujiàn li de zhège jùzi shì shénme yìsi?","ko":"고객 메일에 있는 이 문장 무슨 뜻이야?","pat":"这个句子是什么意思? = 이 문장 무슨 뜻이야?"},{"zh":"{H}每天教我一个新句子。","py":"{H} měi tiān jiāo wǒ yí ge xīn jùzi.","ko":"{H}가 매일 새 문장을 하나씩 가르쳐 줘."}],"c":[["句","句","글귀 구"],["子","子","아들 자"]],"why":"글귀(句) → 문장"},{"id":1223,"w":"咖啡","p":"kāfēi","k":"명","ko":"커피","g":"o","ex":[{"zh":"早上不喝咖啡，我就没精神。","py":"zǎoshang bù hē kāfēi, wǒ jiù méi jīngshen.","ko":"아침에 커피 안 마시면 정신이 없어."},{"zh":"{H}，我们找个地方喝杯咖啡吧。","py":"{H}, wǒmen zhǎo ge dìfang hē bēi kāfēi ba.","ko":"{H}, 어디 들어가서 커피 한잔하자.","pat":"喝(杯)咖啡 = 커피 한잔하다"},{"zh":"妈，你晚上别喝咖啡，会睡不着。","py":"Mā, nǐ wǎnshang bié hē kāfēi, huì shuì bu zháo.","ko":"엄마, 밤에 커피 마시지 마, 잠 못 자."}],"c":[["咖","咖","커피 가"],["啡","啡","커피 배"]],"why":"음역(kāfēi) 글자 → 커피"},{"id":1224,"w":"开","p":"kāi","k":"동","ko":"열다, 켜다, 운전하다","g":"o","ex":[{"zh":"请帮我开一下门。","py":"qǐng bāng wǒ kāi yīxià mén.","ko":"문 좀 열어 줘."},{"zh":"早上一到工厂，我先开电脑看邮件。","py":"Zǎoshang yí dào gōngchǎng, wǒ xiān kāi diànnǎo kàn yóujiàn.","ko":"아침에 공장 도착하면 먼저 컴퓨터 켜고 메일 봐.","pat":"开 + 기기 (电脑·空调·灯) = ~을 켜다"},{"zh":"妈，晚上睡觉别开着空调。","py":"Mā, wǎnshang shuìjiào bié kāizhe kōngtiáo.","ko":"엄마, 밤에 잘 때 에어컨 켜 놓지 마."}],"c":[["开","開","열 개"]],"why":"개방(開放)의 개 → 열다·켜다"},{"id":1225,"w":"开始","p":"kāishǐ","k":"동·명","ko":"시작하다, 시작","g":"o","ex":[{"zh":"新生产线下个月开始安装。","py":"xīn shēngchǎnxiàn xià ge yuè kāishǐ ānzhuāng.","ko":"새 생산라인은 다음 달에 설치 시작해."},{"zh":"爸，我从下个月开始每个月给你们寄钱。","py":"Bà, wǒ cóng xià ge yuè kāishǐ měi ge yuè gěi nǐmen jì qián.","ko":"아빠, 다음 달부터 매달 용돈 보내 드릴게.","pat":"从 + 시점 + 开始 = ~부터"},{"zh":"{H}，电影快开始了，我们进去吧。","py":"{H}, diànyǐng kuài kāishǐ le, wǒmen jìnqu ba.","ko":"{H}, 영화 곧 시작하니까 들어가자."}],"c":[["开","開","열 개"],["始","始","비로소 시"]],"why":"열어(开) 비롯함(始) → 시작하다"},{"id":1226,"w":"看","p":"kàn","k":"동","ko":"보다, 생각하다, 진찰하다","g":"o","ex":[{"zh":"周末我去新加坡看{H}。","py":"zhōumò wǒ qù Xīnjiāpō kàn {H}.","ko":"주말에 싱가포르 가서 {H} 봐."},{"zh":"老板，您看一下这份报价单。","py":"Lǎobǎn, nín kàn yíxià zhè fèn bàojiàdān.","ko":"사장님, 이 견적서 한번 봐 주세요.","pat":"看一下 = 한번 보다"},{"zh":"爸妈每天晚上都看韩国电视剧。","py":"Bà mā měi tiān wǎnshang dōu kàn Hánguó diànshìjù.","ko":"부모님은 매일 저녁 한국 드라마를 보셔."}],"c":[["看","看","볼 간"]],"why":"간과(看過)의 간 → 보다"},{"id":1227,"w":"看见","p":"kànjiàn","k":"동","ko":"보다, 보이다","g":"o","ex":[{"zh":"你看见我的手机了吗？","py":"nǐ kànjiàn wǒ de shǒujī le ma?","ko":"내 휴대폰 봤어?"},{"zh":"我看见{H}站在门口等我。","py":"Wǒ kànjiàn {H} zhàn zài ménkǒu děng wǒ.","ko":"{H}가 문 앞에 서서 날 기다리는 게 보였어.","pat":"看见 + 사람 + 동작 = ~가 ~하는 걸 보다"},{"zh":"刚才我看见老板跟客户在会议室说话。","py":"Gāngcái wǒ kànjiàn lǎobǎn gēn kèhù zài huìyìshì shuōhuà.","ko":"방금 사장님이 회의실에서 고객이랑 얘기하는 거 봤어."}],"c":[["看","看","볼 간"],["见","見","볼 견"]],"why":"보아서(看) 눈에 들어옴(见) → 보이다"},{"id":1228,"w":"考试","p":"kǎoshì","k":"명·동","ko":"시험, 시험을 보다","g":"o","ex":[{"zh":"妈，十二月我要考试，最近很忙。","py":"mā, shí'èr yuè wǒ yào kǎoshì, zuìjìn hěn máng.","ko":"엄마, 12월에 시험 봐서 요즘 바빠."},{"zh":"{H}问我：“考试考得怎么样？”","py":"{H} wèn wǒ: “Kǎoshì kǎo de zěnmeyàng?”","ko":"{H}가 \"시험 어떻게 봤어?\"라고 물었어.","pat":"考试考得怎么样? = 시험 어떻게 봤어?"},{"zh":"新同事要先参加安全考试，才能进车间。","py":"Xīn tóngshì yào xiān cānjiā ānquán kǎoshì, cái néng jìn chējiān.","ko":"새 동료는 안전 시험부터 봐야 작업장에 들어갈 수 있어."}],"c":[["考","考","상고할 고"],["试","試","시험 시"]],"why":"헤아려(考) 시험함(试) → 시험 치다"},{"id":1229,"w":"刻","p":"kè","k":"양·동","ko":"15분, 새기다","g":"o","ex":[{"zh":"我想在戒指上刻我们的名字。","py":"wǒ xiǎng zài jièzhi shang kè wǒmen de míngzi.","ko":"반지에 우리 이름을 새기고 싶어."},{"zh":"爸爸送我的手表后面刻着我的名字。","py":"Bàba sòng wǒ de shǒubiǎo hòumiàn kèzhe wǒ de míngzi.","ko":"아빠가 준 손목시계 뒤에 내 이름이 새겨져 있어.","pat":"上面刻着 + 글자 = ~가 새겨져 있다"},{"zh":"这个零件上要刻客户公司的名字。","py":"Zhège língjiàn shang yào kè kèhù gōngsī de míngzi.","ko":"이 부품에는 고객 회사 이름을 새겨야 해."}],"c":[["刻","刻","새길 각"]],"why":"조각(彫刻)의 각 → 새기다·15분"},{"id":1230,"w":"课","p":"kè","k":"명","ko":"수업, 과목","g":"o","ex":[{"zh":"我今天晚上有MBA的课。","py":"wǒ jīntiān wǎnshang yǒu MBA de kè.","ko":"나 오늘 저녁에 MBA 수업 있어."},{"zh":"{H}，我下了课就去找你。","py":"{H}, wǒ xiàle kè jiù qù zhǎo nǐ.","ko":"{H}, 수업 끝나면 바로 너한테 갈게.","pat":"上课·下课 = 수업하다·수업이 끝나다"},{"zh":"妈，这个学期我只有三门课。","py":"Mā, zhège xuéqī wǒ zhǐ yǒu sān mén kè.","ko":"엄마, 이번 학기엔 수업이 세 과목뿐이야."}],"c":[["课","課","공부할 과"]],"why":"과목(課目)의 과 → 수업"},{"id":1231,"w":"渴","p":"kě","k":"형","ko":"목마르다","g":"o","ex":[{"zh":"天太热了，我渴死了。","py":"tiān tài rè le, wǒ kě sǐ le.","ko":"날씨 너무 더워서 목말라 죽겠어."},{"zh":"{H}，你渴不渴？我去买水。","py":"{H}, nǐ kě bu kě? Wǒ qù mǎi shuǐ.","ko":"{H}, 목 안 말라? 내가 물 사 올게.","pat":"渴不渴? / 渴了 = 목말라? / 목마르다"},{"zh":"车间里太热了，工人们一会儿就渴了。","py":"Chējiān li tài rè le, gōngrénmen yíhuìr jiù kě le.","ko":"작업장이 너무 더워서 직원들이 금방 목말라해."}],"c":[["渴","渴","목마를 갈"]],"why":"갈증(渴症)의 갈 → 목마르다"},{"id":1232,"w":"可爱","p":"kě'ài","k":"형","ko":"귀엽다, 사랑스럽다","g":"o","ex":[{"zh":"{H}笑起来特别可爱。","py":"{H} xiào qǐlai tèbié kě'ài.","ko":"{H}는 웃을 때 진짜 귀여워."},{"zh":"妈，你看这只小狗，是不是很可爱？","py":"Mā, nǐ kàn zhè zhī xiǎo gǒu, shì bu shì hěn kě'ài?","ko":"엄마, 이 강아지 봐, 진짜 귀엽지?","pat":"很可爱 / 特别可爱 = 아주 귀엽다"},{"zh":"同事的女儿特别可爱，见人就笑。","py":"Tóngshì de nǚ'ér tèbié kě'ài, jiàn rén jiù xiào.","ko":"동료 딸이 엄청 귀여워, 사람만 보면 웃어."}],"c":[["可","可","옳을 가"],["爱","愛","사랑 애"]],"why":"사랑할(爱) 만함(可) → 귀엽다"},{"id":1233,"w":"可能","p":"kěnéng","k":"부·형·명","ko":"아마, 가능하다, 가능성","g":"o","ex":[{"zh":"这批货可能要下周才能到。","py":"zhè pī huò kěnéng yào xià zhōu cái néng dào.","ko":"이번 물건은 아마 다음 주에야 도착할 것 같아요."},{"zh":"{H}，我周五可能要加班，晚一点儿到。","py":"{H}, wǒ zhōuwǔ kěnéng yào jiābān, wǎn yìdiǎnr dào.","ko":"{H}, 나 금요일에 야근할 수도 있어서 좀 늦게 도착할 거야.","pat":"可能 + 要/会 + 동사 = ~할 수도 있다"},{"zh":"爸，你可能太累了，早点儿休息吧。","py":"Bà, nǐ kěnéng tài lèi le, zǎo diǎnr xiūxi ba.","ko":"아빠, 너무 피곤하신가 봐, 일찍 쉬세요."}],"c":[["可","可","옳을 가"],["能","能","능할 능"]],"why":"할 수 있음(能)이 가함(可) → 가능하다"},{"id":1234,"w":"客人","p":"kèrén","k":"명","ko":"손님","g":"o","ex":[{"zh":"今天有客人来，大家把桌子整理一下。","py":"jīntiān yǒu kèrén lái, dàjiā bǎ zhuōzi zhěnglǐ yīxià.","ko":"오늘 손님 오시니까 다들 책상 좀 정리해 주세요."},{"zh":"过年的时候，家里来了很多客人。","py":"Guònián de shíhou, jiā li láile hěn duō kèrén.","ko":"설 때 집에 손님이 많이 왔어.","pat":"家里来了客人 = 집에 손님이 오다"},{"zh":"周末{H}家有客人，我们改天再见吧。","py":"Zhōumò {H} jiā yǒu kèrén, wǒmen gǎitiān zài jiàn ba.","ko":"주말에 {H}네 집에 손님이 오셔서 우리 다음에 보자."}],"c":[["客","客","손 객"],["人","人","사람 인"]],"why":"손님(客)인 사람(人) → 손님"},{"id":1235,"w":"可以","p":"kěyǐ","k":"조동·형","ko":"~해도 된다, ~할 수 있다, 괜찮다","g":"o","ex":[{"zh":"我可以周五把样品送过去。","py":"wǒ kěyǐ zhōuwǔ bǎ yàngpǐn sòng guòqu.","ko":"금요일에 샘플 가져다드릴 수 있어요."},{"zh":"{H}，你的车我可以开吗？","py":"{H}, nǐ de chē wǒ kěyǐ kāi ma?","ko":"{H}, 네 차 내가 운전해도 돼?","pat":"我可以 + 동사 + 吗? = ~해도 돼?"},{"zh":"妈，现在你可以在手机上看到我了。","py":"Mā, xiànzài nǐ kěyǐ zài shǒujī shang kàndào wǒ le.","ko":"엄마, 이제 휴대폰으로 내 얼굴 볼 수 있어."}],"c":[["可","可","옳을 가"],["以","以","써 이"]],"why":"~로써(以) 가함(可) → ~할 수 있다"},{"id":1236,"w":"空调","p":"kōngtiáo","k":"명","ko":"에어컨","g":"o","ex":[{"zh":"办公室的空调坏了，热死了。","py":"bàngōngshì de kōngtiáo huài le, rè sǐ le.","ko":"사무실 에어컨 고장 나서 더워 죽겠어."},{"zh":"爸，夏天热的话就开空调，别怕花钱。","py":"Bà, xiàtiān rè de huà jiù kāi kōngtiáo, bié pà huā qián.","ko":"아빠, 여름에 더우면 돈 아까워하지 말고 에어컨 켜.","pat":"开空调·关空调 = 에어컨을 켜다·끄다"},{"zh":"{H}，空调太冷了，你穿件衣服吧。","py":"{H}, kōngtiáo tài lěng le, nǐ chuān jiàn yīfu ba.","ko":"{H}, 에어컨 너무 추우니까 옷 하나 걸쳐."}],"c":[["空","空","빌 공"],["调","調","고를 조"]],"why":"공기(空)를 고름(调) → 에어컨"},{"id":1237,"w":"口","p":"kǒu","k":"명·양","ko":"입, 식구를 세는 단위","g":"o","ex":[{"zh":"张开口，让医生看看。","py":"zhāng kāi kǒu, ràng yīshēng kànkan.","ko":"입 벌리고 의사 선생님한테 보여 줘."},{"zh":"{H}说我睡觉的时候张着口。","py":"{H} shuō wǒ shuìjiào de shíhou zhāngzhe kǒu.","ko":"{H}가 나 잘 때 입 벌리고 잔대.","pat":"张口 / 张着口 = 입을 벌리다"},{"zh":"爸，你口里有什么不舒服就去看医生。","py":"Bà, nǐ kǒu li yǒu shénme bù shūfu jiù qù kàn yīshēng.","ko":"아빠, 입안이 좀 불편하면 바로 병원 가 봐."}],"c":[["口","口","입 구"]],"why":"입구(入口)의 구 → 입"},{"id":1238,"w":"哭","p":"kū","k":"동","ko":"울다","g":"o","ex":[{"zh":"{H}看电影的时候哭了。","py":"{H} kàn diànyǐng de shíhou kū le.","ko":"{H}가 영화 보다가 울었어."},{"zh":"{H}，别哭了，我下个星期就来看你。","py":"{H}, bié kū le, wǒ xià ge xīngqī jiù lái kàn nǐ.","ko":"{H}, 울지 마, 다음 주에 바로 보러 올게.","pat":"别哭了 = 울지 마"},{"zh":"妈妈送我去机场的时候哭了。","py":"Māma sòng wǒ qù jīchǎng de shíhou kū le.","ko":"엄마가 나 공항에 바래다줄 때 우셨어."}],"c":[["哭","哭","울 곡"]],"why":"통곡(痛哭)의 곡 → 울다"},{"id":1239,"w":"块","p":"kuài","k":"양","ko":"위안(돈), 덩어리, 조각","g":"o","ex":[{"zh":"我给你留了一块蛋糕。","py":"wǒ gěi nǐ liú le yī kuài dàngāo.","ko":"너 주려고 케이크 한 조각 남겨 놨어."},{"zh":"这块铁太重了，我们两个人一起搬。","py":"Zhè kuài tiě tài zhòng le, wǒmen liǎng ge rén yìqǐ bān.","ko":"이 쇳덩이 너무 무거우니까 우리 둘이 같이 옮기자.","pat":"一块/这块 + 덩어리 물건 (铁·蛋糕·手表) = 한 덩이/개"},{"zh":"妈，我给爸买了一块新手表。","py":"Mā, wǒ gěi bà mǎile yí kuài xīn shǒubiǎo.","ko":"엄마, 아빠한테 새 손목시계 하나 사 드렸어."}],"c":[["块","塊","흙덩이 괴"]],"why":"금괴(金塊)의 괴 → 덩어리"},{"id":1240,"w":"快","p":"kuài","k":"형·부","ko":"빠르다, 곧","g":"o","ex":[{"zh":"客户问我们能不能快一点儿交货。","py":"kèhù wèn wǒmen néng bù néng kuài yīdiǎnr jiāo huò.","ko":"고객이 좀 더 빨리 납품할 수 있냐고 물어봤어."},{"zh":"{H}，你走得太快了，等等我。","py":"{H}, nǐ zǒu de tài kuài le, děngdeng wǒ.","ko":"{H}, 너무 빨리 걷는다, 나 좀 기다려.","pat":"동사 + 得 + 太快 = 너무 빨리 ~하다"},{"zh":"爸，你开车别开那么快。","py":"Bà, nǐ kāichē bié kāi nàme kuài.","ko":"아빠, 운전할 때 그렇게 빨리 달리지  량 → 대"},{"id":1254,"w":"练习","p":"liànxí","k":"동·명","ko":"연습하다, 연습","g":"o","ex":[{"zh":"我每天跟{H}练习说中文。","py":"wǒ měi tiān gēn {H} liànxí shuō Zhōngwén.","ko":"나 매일 {H}랑 중국어 말하기 연습해."},{"zh":"开会以前，我练习了好几遍英语介绍。","py":"Kāihuì yǐqián, wǒ liànxíle hǎo jǐ biàn Yīngyǔ jièshào.","ko":"회의 전에 영어 소개를 몇 번이나 연습했어.","pat":"练习 + 내용 + 好几遍 = ~을 여러 번 연습하다"},{"zh":"爸，你每天练习一下用手机发消息。","py":"Bà, nǐ měi tiān liànxí yíxià yòng shǒujī fā xiāoxi.","ko":"아빠, 매일 휴대폰으로 메시지 보내는 거 연습 좀 해 봐."}],"c":[["练","練","익힐 련"],["习","習","익힐 습"]],"why":"익히고(练) 익힘(习) → 연습하다"},{"id":1255,"w":"了解","p":"liǎojiě","k":"동","ko":"이해하다, 잘 알다","g":"o","ex":[{"zh":"我们想多了解一下您的要求。","py":"wǒmen xiǎng duō liǎojiě yīxià nín de yāoqiú.","ko":"요구 사항을 좀 더 자세히 알고 싶습니다."},{"zh":"{H}很了解我，我不说她也知道。","py":"{H} hěn liǎojiě wǒ, wǒ bù shuō tā yě zhīdao.","ko":"{H}는 나를 잘 알아서 내가 말 안 해도 다 알아.","pat":"很了解 + 사람 = ~를 잘 알다"},{"zh":"妈，你不了解这里的情况，别担心。","py":"Mā, nǐ bù liǎojiě zhèlǐ de qíngkuàng, bié dānxīn.","ko":"엄마, 여기 사정 잘 모르잖아, 걱정하지 마."}],"c":[["了","了","깨달을 료"],["解","解","풀 해"]],"why":"깨달아(了) 풀어 앎(解) → 이해하다"},{"id":1256,"w":"离开","p":"líkāi","k":"동","ko":"떠나다, 벗어나다","g":"o","ex":[{"zh":"每个星期天晚上离开新加坡，我都很难过。","py":"měi ge xīngqītiān wǎnshang líkāi Xīnjiāpō, wǒ dōu hěn nánguò.","ko":"일요일 밤마다 싱가포르를 떠날 때면 늘 마음이 안 좋아."},{"zh":"老板刚离开办公室，你下午再来吧。","py":"Lǎobǎn gāng líkāi bàngōngshì, nǐ xiàwǔ zài lái ba.","ko":"사장님 방금 사무실에서 나가셨어, 오후에 다시 와.","pat":"离开 + 장소 = ~을 떠나다"},{"zh":"我二十多岁就离开韩国了。","py":"Wǒ èrshí duō suì jiù líkāi Hánguó le.","ko":"나는 스무 살 남짓에 벌써 한국을 떠났어."}],"c":[["离","離","떠날 리"],["开","開","열 개"]],"why":"떠나(离) 벌어짐(开) → 떠나다"},{"id":1257,"w":"零","p":"líng","k":"수","ko":"영, 0","g":"o","ex":[{"zh":"这个月工厂的事故是零。","py":"zhège yuè gōngchǎng de shìgù shì líng.","ko":"이번 달 공장 사고는 제로야."},{"zh":"妈，首尔现在零下五度吗？","py":"Mā, Shǒu'ěr xiànzài língxià wǔ dù ma?","ko":"엄마, 서울 지금 영하 5도야?","pat":"零下 + 숫자 + 度 = 영하 ~도"},{"zh":"{H}的电话号码里有三个零。","py":"{H} de diànhuà hàomǎ li yǒu sān ge líng.","ko":"{H} 전화번호에는 0이 세 개 있어."}],"c":[["零","零","영 령"]],"why":"영(零) → 0"},{"id":1258,"w":"邻 "c":[["妈","媽","어미 마"],["妈","媽","어미 마"]],"why":"女+马(음) → 어머니(媽媽)"},{"id":1271,"w":"慢","p":"màn","k":"형","ko":"느리다","g":"o","ex":[{"zh":"这台机器今天怎么这么慢？","py":"Zhè tái jīqì jīntiān zěnme zhème màn?","ko":"이 기계 오늘 왜 이렇게 느려?"},{"zh":"{H}，你开慢点儿，我们不着急。","py":"{H}, nǐ kāi màn diǎnr, wǒmen bù zháojí.","ko":"{H}, 천천히 운전해, 우리 안 급해.","pat":"동사 + 慢点儿 = 좀 천천히 ~해 (开慢点儿·说慢点儿)"},{"zh":"妈妈，你说慢一点儿，我没听清楚。","py":"Māma, nǐ shuō màn yīdiǎnr, wǒ méi tīng qīngchu.","ko":"엄마, 천천히 말해 줘, 잘 못 들었어."}],"c":[["慢","慢","느릴 만"]],"why":"마음(忄)이 늘어짐 → 느리다"},{"id":1272,"w":"忙","p":"máng","k":"형","ko":"바쁘다","g":"o","ex":[{"zh":"{H}，这周我很忙，周六见吧。","py":"{H}, zhè zhōu wǒ hěn máng, zhōuliù jiàn ba.","ko":"{H}, 이번 주엔 내가 좀 바빠서 토요일에 보자."},{"zh":"老板，您先忙，我下午再来找您。","py":"Lǎobǎn, nín xiān máng, wǒ xiàwǔ zài lái zhǎo nín.","ko":"사장님, 일 보세요, 오후에 다시 찾아뵐게요.","pat":"您先忙 = 일 보세요 (대화 끝낼 때 인사)"},{"zh":"妈，最近工厂太忙了，下个月再回家。","py":"Mā, zuìjìn gōngchǎng tài máng le, xià ge yuè zài huí jiā.","ko":"엄마, 요즘 공장이 너무 바빠서 다음 달에 집에 갈게."}],"c":[["忙","忙","바쁠 망"]],"why":"마음(忄)을 잃을(亡) 만큼 → 바쁘다"},{"id":1273,"w":"满意","p":"mǎnyì","k":"형","ko":"만족하다","g":"o","ex":[{"zh":"客户对这批产品很满意。","py":"Kèhù duì zhè pī chǎnpǐn hěn mǎnyì.","ko":"고객이 이번 제품에 아주 만족해."},{"zh":"老板对我这个月的工作很满意。","py":"Lǎobǎn duì wǒ zhège yuè de gōngzuò hěn mǎnyì.","ko":"사장님이 이번 달 내 업무에 아주 만족하셔.","pat":"对 + 대상 + 很满意 = ~에 만족하다"},{"zh":"{H}，你对这家饭店满意吗？","py":"{H}, nǐ duì zhè jiā fàndiàn mǎnyì ma?","ko":"{H}, 이 식당 마음에 들어?"}],"c":[["满","滿","찰 만"],["意","意","뜻 의"]],"why":"뜻(意)이 가득 참(滿) → 만족하다"},{"id":1274,"w":"猫","p":"māo","k":"명","ko":"고양이","g":"o","ex":[{"zh":"{H}家的猫特别喜欢我。","py":"{H} jiā de māo tèbié xǐhuan wǒ.","ko":"{H}네 고양이가 나를 엄청 좋아해."},{"zh":"我妹妹在家养了两只猫。","py":"Wǒ mèimei zài jiā yǎng le liǎng zhī māo.","ko":"내 여동생이 집에서 고양이 두 마리 키워.","pat":"养 + 숫자 + 只 + 猫 = 고양이 ~마리를 키우다"},{"zh":"工厂门口常常有一只黑猫。","py":"Gōngchǎng ménkǒu chángcháng yǒu yī zhī hēi māo.","ko":"공장 입구에 검은 고양이가 자주 와."}],"c":[["猫","貓","고양이 묘"]],"why":"짐승(犭)+苗(음 묘) → 고양이"},{"id":1275,"w":"马上","p":"mǎshàng","k":"부","ko":"곧, 바로","g":"o","ex":[{"zh":"老板，我马上把报告发给您。","py":"Lǎobǎn, wǒ mǎshàng bǎ bàogào fā gěi nín.","ko":"사장님, 보고서 바로 보내드릴게요."},{"zh":"妈，我马上就到机场了，你别着急。","py":"Mā, wǒ mǎshàng jiù dào jīchǎng le, nǐ bié zháojí.","ko":"엄마, 나 곧 공항 도착해, 걱정 마.","pat":"马上就 + 동사 + 了 = 곧 ~해 (马上就到·马上就好)"},{"zh":"{H}，你等我一下，我马上下楼。","py":"{H}, nǐ děng wǒ yīxià, wǒ mǎshàng xià lóu.","ko":"{H}, 잠깐만 기다려, 금방 내려갈게."}],"c":[["马","馬","말 마"],["上","上","윗 상"]],"why":"말(馬) 위(上)에 올라 바로 출발 → 곧"},{"id":1276,"w":"没关系","p":"méiguānxi","k":"형","ko":"괜찮다, 상관없다","g":"o","ex":[{"zh":"没关系，你慢慢来，我在楼下等你。","py":"Méi guānxi, nǐ mànmàn lái, wǒ zài lóu xià děng nǐ.","ko":"괜찮아, 천천히 와. 나 밑에서 기다릴게."},{"zh":"“对不起，我来晚了。”“没关系。”","py":"“Duìbuqǐ, wǒ lái wǎn le.” “Méiguānxi.”","ko":"\"미안, 늦었어.\" \"괜찮아.\"","pat":"对不起 — 没关系 = 미안해 — 괜찮아 (사과에 대한 대답)"},{"zh":"妈，没关系，我一个人在这边过得很好。","py":"Mā, méiguānxi, wǒ yī gè rén zài zhèbiān guò de hěn hǎo.","ko":"엄마, 괜찮아, 나 혼자서도 여기서 잘 지내."}],"c":[["没","沒","없을 몰"],["关","關","관계할 관"],["系","係","맬 계"]],"why":"관계(關係)가 없음(沒) → 괜찮다"},{"id":1277,"w":"妹妹","p":"mèimei","k":"명","ko":"여동생","g":"o","ex":[{"zh":"我妹妹下个月结婚。","py":"Wǒ mèimei xià gè yuè jiéhūn.","ko":"내 여동생 다음 달에 결혼해."},{"zh":"{H}，我妹妹很想跟你一起逛街。","py":"{H}, wǒ mèimei hěn xiǎng gēn nǐ yīqǐ guàngjiē.","ko":"{H}, 내 여동생이 너랑 같이 쇼핑하고 싶어 해.","pat":"我妹妹 = 내 여동생 (我 + 가족, 的 생략)"},{"zh":"同事的妹妹也在我们工厂上班。","py":"Tóngshì de mèimei yě zài wǒmen gōngchǎng shàngbān.","ko":"동료 여동생도 우리 공장에서 일해."}],"c":[["妹","妹","누이 매"],["妹","妹","누이 매"]],"why":"손아래 누이(妹) 반복 → 여동생"},{"id":1278,"w":"没有","p":"méiyǒu","k":"동·부","ko":"없다, ~하지 않았다","g":"o","ex":[{"zh":"工厂里已经没有手套了。","py":"Gōngchǎng li yǐjīng méiyǒu shǒutào le.","ko":"공장에 장갑이 이제 하나도 없어."},{"zh":"{H}，冰箱里没有牛奶了，我去买吧。","py":"{H}, bīngxiāng li méiyǒu niúnǎi le, wǒ qù mǎi ba.","ko":"{H}, 냉장고에 우유 없네, 내가 사 올게.","pat":"没有 + 명사 + 了 = ~가 다 떨어졌다/없어졌다"},{"zh":"对不起，我们现在没有这么多货。","py":"Duìbuqǐ, wǒmen xiànzài méiyǒu zhème duō huò.","ko":"죄송해요, 지금은 그렇게 많은 물량이 없어요."}],"c":[["没","沒","없을 몰"],["有","有","있을 유"]],"why":"있음(有)이 없음(沒) → 없다"},{"id":1279,"w":"门","p":"mén","k":"명·양","ko":"문, 출입구, 과목을 세는 단위","g":"o","ex":[{"zh":"客户来了，你去门口接一下。","py":"Kèhù lái le, nǐ qù ménkǒu jiē yīxià.","ko":"고객 왔어, 문 앞에 가서 좀 맞아 줘."},{"zh":"这家店晚上十点关门。","py":"Zhè jiā diàn wǎnshang shí diǎn guānmén.","ko":"이 가게는 밤 10시에 문 닫아.","pat":"开门 / 关门 = 문을 열다·닫다, 영업 시작·종료"},{"zh":"{H}，出门的时候别忘了带钥匙。","py":"{H}, chūmén de shíhou bié wàng le dài yàoshi.","ko":"{H}, 나갈 때 열쇠 챙기는 거 잊지 마."}],"c":[["门","門","문 문"]],"why":"두 짝 문을 본뜬 글자(門)"},{"id":1280,"w":"米","p":"mǐ","k":"명·양","ko":"쌀, 미터(m)","g":"o","ex":[{"zh":"妈妈说韩国的米比这里的好吃。","py":"Māma shuō Hánguó de mǐ bǐ zhèlǐ de hǎochī.","ko":"엄마가 한국 쌀이 여기 쌀보다 맛있대."},{"zh":"妈妈每次都给我寄韩国的大米。","py":"Māma měi cì dōu gěi wǒ jì Hánguó de dàmǐ.","ko":"엄마는 매번 나한테 한국 쌀을 보내 줘.","pat":"大米 = 쌀 (米의 일상 표현)"},{"zh":"同事说马来西亚的米和韩国的不一样。","py":"Tóngshì shuō Mǎláixīyà de mǐ hé Hánguó de bù yīyàng.","ko":"동료가 말레이시아 쌀은 한국 쌀이랑 다르대."}],"c":[["米","米","쌀 미"]],"why":"낟알이 흩어진 모양 → 쌀(米)"},{"id":1281,"w":"面包","p":"miànbāo","k":"명","ko":"빵","g":"o","ex":[{"zh":"我早上没时间，就吃了一个面包。","py":"Wǒ zǎoshang méi shíjiān, jiù chī le yī gè miànbāo.","ko":"아침에 시간이 없어서 빵 하나만 먹었어."},{"zh":"我早饭常常喝牛奶、吃面包。","py":"Wǒ zǎofàn chángcháng hē niúnǎi, chī miànbāo.","ko":"나 아침엔 보통 우유 마시고 빵 먹어.","pat":"吃面包 / 牛奶和面包 = 빵을 먹다 (아침 식사 표현)"},{"zh":"{H}，这家店的面包特别好吃。","py":"{H}, zhè jiā diàn de miànbāo tèbié hǎochī.","ko":"{H}, 이 가게 빵 진짜 맛있어."}],"c":[["面","麵","밀가루 면"],["包","包","쌀 포"]],"why":"밀가루(麵)를 싸서(包) 구움 → 빵"},{"id":1282,"w":"米饭","p":"mǐfàn","k":"명","ko":"쌀밥, 밥","g":"o","ex":[{"zh":"{H}，你要米饭还是面条？","py":"{H}, nǐ yào mǐfàn háishi miàntiáo?","ko":"{H}, 밥 먹을래 아니면 면 먹을래?"},{"zh":"老板，再来一碗米饭。","py":"Lǎobǎn, zài lái yī wǎn mǐfàn.","ko":"사장님, 밥 한 공기 더 주세요.","pat":"一碗米饭 / 再来一碗 = 밥 한 공기 (더 주세요)"},{"zh":"妈，我在这边每天都吃米饭。","py":"Mā, wǒ zài zhèbiān měi tiān dōu chī mǐfàn.","ko":"엄마, 나 여기서 매일 밥 먹어."}],"c":[["米","米","쌀 미"],["饭","飯","밥 반"]],"why":"쌀(米)로 지은 밥(飯)"},{"id":1283,"w":"明白","p":"míngbai","k":"동·형","ko":"알다, 이해하다, 분명하다","g":"o","ex":[{"zh":"老板，您的意思我明白了。","py":"Lǎobǎn, nín de yìsi wǒ míngbai le.","ko":"사장님, 무슨 말씀인지 알겠습니다."},{"zh":"这个问题我讲了两遍，你明白了吗？","py":"Zhège wèntí wǒ jiǎng le liǎng biàn, nǐ míngbai le ma?","ko":"이 문제 두 번 설명했는데, 이해했어?","pat":"明白了吗？/ 我明白了 = 이해했어? / 알겠어"},{"zh":"{H}，你说的我都明白，我们慢慢来。","py":"{H}, nǐ shuō de wǒ dōu míngbai, wǒmen mànmàn lái.","ko":"{H}, 네 말 다 이해해, 우리 천천히 하자."}],"c":[["明","明","밝을 명"],["白","白","흰 백"]],"why":"밝고(明) 희게(白) 드러남 → 이해하다"},{"id":1284,"w":"明天","p":"míngtiān","k":"명","ko":"내일","g":"o","ex":[{"zh":"明天上午客户要来工厂参观。","py":"Míngtiān shàngwǔ kèhù yào lái gōngchǎng cānguān.","ko":"내일 오전에 고객이 공장 견학하러 와."},{"zh":"好，那我们明天见！","py":"Hǎo, nà wǒmen míngtiān jiàn!","ko":"좋아, 그럼 내일 보자!","pat":"明天见 = 내일 봐 (헤어질 때 인사)"},{"zh":"妈，明天是爸爸的生日，我给他打电话。","py":"Mā, míngtiān shì bàba de shēngrì, wǒ gěi tā dǎ diànhuà.","ko":"엄마, 내일 아빠 생신이니까 내가 전화드릴게."}],"c":[["明","明","밝을 명"],["天","天","하늘 천"]],"why":"밝아 오는(明) 날(天) → 내일"},{"id":1285,"w":"名字","p":"míngzi","k":"명","ko":"이름","g":"o","ex":[{"zh":"不好意思，请问您叫什么名字？","py":"Bù hǎoyìsi, qǐngwèn nín jiào shénme míngzi?","ko":"실례지만 성함이 어떻게 되세요?"},{"zh":"我的中文名字是{H}帮我起的。","py":"Wǒ de Zhōngwén míngzi shì {H} bāng wǒ qǐ de.","ko":"내 중국어 이름은 {H}가 지어 준 거야.","pat":"起名字 = 이름을 짓다"},{"zh":"新同事太多了，我还记不住他们的名字。","py":"Xīn tóngshì tài duō le, wǒ hái jì bu zhù tāmen de míngzi.","ko":"신입 동료가 너무 많아서 아직 이름을 다 못 외웠어."}],"c":[["名","名","이름 명"],["字","字","글자 자"]],"why":"이름(名)과 자(字) → 이름"},{"id":1286,"w":"拿","p":"ná","k":"동","ko":"들다, 잡다, 가지다","g":"o","ex":[{"zh":"你帮我拿一下那个文件。","py":"Nǐ bāng wǒ ná yīxià nàge wénjiàn.","ko":"그 서류 좀 집어 줘."},{"zh":"这些东西你都拿走吧，我用不了。","py":"Zhèxiē dōngxi nǐ dōu ná zǒu ba, wǒ yòng bu liǎo.","ko":"이 물건들 다 가져가, 나는 못 써.","pat":"拿走 / 拿过来 = 가져가다 / 가져오다"},{"zh":"妈，行李太重了，我来拿吧。","py":"Mā, xíngli tài zhòng le, wǒ lái ná ba.","ko":"엄마, 짐 너무 무거워, 내가 들게."}],"c":[["拿","拿","잡을 나"]],"why":"合+手 → 손(手)을 모아(合) 쥠"},{"id":1287,"w":"那","p":"nà","k":"대·연","ko":"그, 저, 그러면","g":"o","ex":[{"zh":"那家咖啡店是{H}最喜欢的。","py":"Nà jiā kāfēidiàn shì {H} zuì xǐhuan de.","ko":"저 카페는 {H}가 제일 좋아하는 데야."},{"zh":"老板，那个客户下午三点到。","py":"Lǎobǎn, nàge kèhù xiàwǔ sān diǎn dào.","ko":"사장님, 그 고객 오후 세 시에 도착해요.","pat":"那个 + 명사 = 그/저 ~ (那个人·那个客户)"},{"zh":"妈，那件衣服你穿很好看。","py":"Mā, nà jiàn yīfu nǐ chuān hěn hǎokàn.","ko":"엄마, 그 옷 엄마가 입으니까 예뻐."}],"c":[["那","那","어찌 나"]],"why":"'저·그'를 가리키는 지시사(那)"},{"id":1288,"w":"哪","p":"nǎ","k":"대","ko":"어느, 어떤","g":"o","ex":[{"zh":"你喜欢哪一件？我买给你。","py":"Nǐ xǐhuan nǎ yī jiàn? Wǒ mǎi gěi nǐ.","ko":"어느 게 마음에 들어? 내가 사 줄게."},{"zh":"李先生，您是哪国人？","py":"Lǐ xiānsheng, nín shì nǎ guó rén?","ko":"리 선생님, 어느 나라 분이세요?","pat":"哪国人 = 어느 나라 사람"},{"zh":"妈，你哪天到机场？我去接你。","py":"Mā, nǐ nǎ tiān dào jīchǎng? Wǒ qù jiē nǐ.","ko":"엄마, 며칠에 공항 도착해? 내가 데리러 갈게."}],"c":[["哪","哪","어찌 나"]],"why":"口+那 → 입으로 묻는 '어느'"},{"id":1289,"w":"奶奶","p":"nǎinai","k":"명","ko":"할머니(친할머니)","g":"o","ex":[{"zh":"奶奶今年八十岁了，身体还很好。","py":"Nǎinai jīnnián bāshí suì le, shēntǐ hái hěn hǎo.","ko":"할머니는 올해 여든이신데 아직 정정하셔."},{"zh":"过年的时候我要回家看爷爷奶奶。","py":"Guònián de shíhou wǒ yào huí jiā kàn yéye nǎinai.","ko":"설에 집에 가서 할아버지 할머니 뵐 거야.","pat":"爷爷奶奶 = 할아버지 할머니 (짝으로 함께 씀)"},{"zh":"{H}，我奶奶做的饭特别好吃。","py":"{H}, wǒ nǎinai zuò de fàn tèbié hǎochī.","ko":"{H}, 우리 할머니 밥 진짜 맛있어."}],"c":[["奶","嬭","젖 내"],["奶","嬭","젖 내"]],"why":"젖(奶) 먹여 준 분 반복 → 할머니"},{"id":1290,"w":"南","p":"nán","k":"명","ko":"남쪽","g":"o","ex":[{"zh":"新山在马来西亚的最南边。","py":"Xīnshān zài Mǎláixīyà de zuì nánbian.","ko":"조호바루는 말레이시아 맨 남쪽에 있어."},{"zh":"从这儿往南开半个小时就到新加坡了。","py":"Cóng zhèr wǎng nán kāi bàn gè xiǎoshí jiù dào Xīnjiāpō le.","ko":"여기서 남쪽으로 30분 달리면 싱가포르야.","pat":"往南 + 동사 = 남쪽으로 ~ (往南开·往南走)"},{"zh":"爸爸下个月要去韩国南边出差。","py":"Bàba xià ge yuè yào qù Hánguó nánbian chūchāi.","ko":"아빠가 다음 달에 한국 남쪽으로 출장 가셔."}],"c":[["南","南","남녘 남"]],"why":"해가 드는 남쪽(南)"},{"id":1291,"w":"难","p":"nán","k":"형","ko":"어렵다, 힘들다","g":"o","ex":[{"zh":"这次HSK四级的听力有点儿难。","py":"Zhè cì HSK sì jí de tīnglì yǒudiǎnr nán.","ko":"이번 HSK 4급 듣기는 좀 어려웠어."},{"zh":"老板，这个问题很难解决，我需要时间。","py":"Lǎobǎn, zhège wèntí hěn nán jiějué, wǒ xūyào shíjiān.","ko":"사장님, 이 문제는 해결하기 어려워서 시간이 필요해요.","pat":"很难 + 동사 = ~하기 어렵다 (很难解决·很难说)"},{"zh":"妈，在国外工作不难，你放心。","py":"Mā, zài guówài gōngzuò bù nán, nǐ fàngxīn.","ko":"엄마, 외국에서 일하는 거 안 어려워, 걱정 마."}],"c":[["难","難","어려울 난"]],"why":"어려울 난(難) 그대로 → 어렵다"},{"id":1292,"w":"男","p":"nán","k":"명","ko":"남자, 남성","g":"o","ex":[{"zh":"我们工厂的工人大部分是男的。","py":"Wǒmen gōngchǎng de gōngrén dà bùfen shì nán de.","ko":"우리 공장 작업자들은 대부분 남자야."},{"zh":"我妹妹终于有男朋友了。","py":"Wǒ mèimei zhōngyú yǒu nán péngyou le.","ko":"내 여동생 드디어 남자친구 생겼어.","pat":"男朋友 / 女朋友 = 남자친구 / 여자친구"},{"zh":"妈，我们办公室新来了一个男同事。","py":"Mā, wǒmen bàngōngshì xīn lái le yī gè nán tóngshì.","ko":"엄마, 우리 사무실에 남자 동료가 새로 왔어."}],"c":[["男","男","사내 남"]],"why":"밭(田)에서 힘(力)쓰는 사람 → 남자"},{"id":1293,"w":"难过","p":"nánguò","k":"형","ko":"슬프다, 괴롭다","g":"o","ex":[{"zh":"{H}的猫生病了，她很难过。","py":"{H} de māo shēngbìng le, tā hěn nánguò.","ko":"{H}네 고양이가 아파서 {H}가 많이 속상해해."},{"zh":"同事没通过面试，他心里很难过。","py":"Tóngshì méi tōngguò miànshì, tā xīn li hěn nánguò.","ko":"동료가 면접에서 떨어져서 많이 속상해해.","pat":"心里很难过 = 마음이 많이 괴롭다"},{"zh":"妈，你别难过，我过年一定回家。","py":"Mā, nǐ bié nánguò, wǒ guònián yīdìng huí jiā.","ko":"엄마, 속상해하지 마, 설에는 꼭 집에 갈게."}],"c":[["难","難","어려울 난"],["过","過","지날 과"]],"why":"지나기(過) 어려움(難) → 괴롭다"},{"id":1294,"w":"哪儿","p":"nǎr","k":"대","ko":"어디","g":"o","ex":[{"zh":"妈，你把我的旧手表放哪儿了？","py":"Mā, nǐ bǎ wǒ de jiù shǒubiǎo fàng nǎr le?","ko":"엄마, 내 옛날 손목시계 어디다 뒀어?"},{"zh":"{H}，我们晚上去哪儿吃饭？","py":"{H}, wǒmen wǎnshang qù nǎr chīfàn?","ko":"{H}, 우리 저녁 어디서 먹을까?","pat":"去哪儿 + 동사 = 어디 가서 ~하다"},{"zh":"老板，新机器放在哪儿比较好？","py":"Lǎobǎn, xīn jīqì fàng zài nǎr bǐjiào hǎo?","ko":"사장님, 새 기계는 어디에 두는 게 좋을까요?"}],"c":[["哪","哪","어찌 나"],["儿","兒","아이 아"]],"why":"어느(哪)+접미사 儿 → 어디"},{"id":1295,"w":"呢","p":"ne","k":"조","ko":"~는?(되묻기), ~하고 있다(지속)","g":"o","ex":[{"zh":"我还在开会呢，一会儿给你打电话。","py":"Wǒ hái zài kāihuì ne, yīhuìr gěi nǐ dǎ diànhuà.","ko":"나 아직 회의 중이야, 좀 이따 전화할게."},{"zh":"{H}，我在路上呢，十分钟就到。","py":"{H}, wǒ zài lù shang ne, shí fēnzhōng jiù dào.","ko":"{H}, 나 가는 중이야, 10분이면 도착해.","pat":"(正)在 + 동사/장소 + 呢 = ~하는 중이야"},{"zh":"老板，客户还在会议室等您呢。","py":"Lǎobǎn, kèhù hái zài huìyìshì děng nín ne.","ko":"사장님, 고객분이 아직 회의실에서 기다리고 계세요."}],"c":[["呢","呢","(어조사) 니"]],"why":"口+尼
